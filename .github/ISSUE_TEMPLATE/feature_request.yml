name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today, or what is hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Describe the change. A sketch or example helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this.
