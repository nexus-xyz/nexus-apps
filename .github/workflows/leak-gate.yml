# The leak gate: scans every tracked file for secrets (gitleaks, the semgrep rules, trufflehog's verified findings)
# and internal references (the blocklist), and a pull request's commits with gitleaks and the blocklist. Any finding
# fails. Read .github/oss-leak-gate/README.md. No secrets.
# Each tool is pinned, and each download is checked against its release's checksums file.
name: leak-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leak-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The commit scan reads every commit between the pull request's base and head.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the scanners
        env:
          GITLEAKS_VERSION: 8.30.1
          TRUFFLEHOG_VERSION: 3.100.0
          SEMGREP_VERSION: 1.186.0
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/leak-bin"
          mkdir "$bin"
          install_tool() {
            url=$1 archive=$2 sums=$3 name=$4
            dir="$RUNNER_TEMP/download-$name"
            mkdir "$dir" "$dir/out"
            curl -fsSL --retry 3 --max-time 120 -o "$dir/$archive" "$url/$archive"
            curl -fsSL --retry 3 --max-time 120 -o "$dir/$sums" "$url/$sums"
            (cd "$dir" && awk -v f="$archive" '$2 == f' "$sums" | sha256sum -c -)
            tar -xzf "$dir/$archive" -C "$dir/out"
            install -m 0755 "$dir/out/$name" "$bin/$name"
          }
          install_tool "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION" \
            "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks
          install_tool "https://github.com/trufflesecurity/trufflehog/releases/download/v$TRUFFLEHOG_VERSION" \
            "trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" "trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" trufflehog
          echo "$bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet "semgrep==$SEMGREP_VERSION"
      # A rule that stops flagging its own marked cases would let a leak through as a clean run.
      - name: Semgrep rule tests
        run: (cd .github/oss-leak-gate && semgrep --test --metrics=off --disable-version-check .)
      # Secrets and internal references fail the job.
      - name: Scan the tree
        run: python3 .github/scripts/leak_gate.py tree --summary "$GITHUB_STEP_SUMMARY"
      # The tree scan sees only the last commit: a secret one commit adds and a later one removes stays in the history.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/leak_gate.py commits "$BASE_SHA" "$HEAD_SHA" --summary "$GITHUB_STEP_SUMMARY"
