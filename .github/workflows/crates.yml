# The shared crates in crates/: format, clippy, tests and cargo-deny. No secrets: every job here runs on forks too.
name: crates

on:
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/crates.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/crates.yml"]

permissions:
  contents: read

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debuginfo: with it, the test binaries filled the runner's disk and the linker died with SIGBUS (signal 7).
  CARGO_PROFILE_DEV_DEBUG: 0
  # Every crate in crates/: the workspace minus the two apps, which have their own workflows.
  CRATES: --workspace --exclude nexus-desktop-gpui --exclude nexus-cli

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.97
      - name: Linux packages GPUI needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libasound2-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      # Caches ~/.cargo and target/. Saves on main only, so pull requests from forks only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # --all-features turns on each crate's test fakes. crates/clippy.toml bans Command::new where it matters.
      - name: cargo clippy
        run: cargo clippy --locked $CRATES --all-targets --all-features -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --locked $CRATES --all-features
      - name: cargo deny (licenses and sources)
        run: cargo deny --locked check licenses sources
