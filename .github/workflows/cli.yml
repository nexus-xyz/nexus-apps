# The command line (apps/cli). Unsigned, no secrets. Built and tested with `-p nexus-cli` on its own, never with
# --workspace: the desktop app turns on nexus-workbench features the CLI leaves off, and `nexus help` (checked against
# commands.json) would list them.
name: cli

on:
  pull_request:
    paths: ["apps/cli/**", "crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/cli.yml"]
  push:
    branches: [main]
    paths: ["apps/cli/**", "crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/cli.yml"]

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debuginfo: with it, the test binaries filled the runner's disk and the linker died with SIGBUS (signal 7).
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.97
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo clippy
        run: cargo clippy --locked -p nexus-cli --no-default-features --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --locked -p nexus-cli --no-default-features
