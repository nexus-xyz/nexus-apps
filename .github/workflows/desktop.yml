# The desktop app (apps/desktop): clippy and tests on Linux, macOS and Windows. Unsigned, no secrets.
# The logos pending clearance are not in this repository: build.rs builds a generic stand-in for each, and the
# tests that check a real logo's drawing skip.
name: desktop

on:
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debuginfo: with it, the test binaries filled the runner's disk and the linker died with SIGBUS (signal 7).
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.97
      - name: Linux packages GPUI needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libasound2-dev libgtk-3-dev libayatana-appindicator3-dev
      # CEF's distribution (about 320 MB) goes outside target/ and is fetched on each run. Before it saves, rust-cache
      # deletes every file in a target/ folder that is not a Cargo profile, so a saved target/cef had its folders and no
      # files. cef-dll-sys then found the folder without its archive.json and every later build failed.
      - name: CEF outside target
        shell: bash
        run: echo "CEF_PATH=${{ runner.temp }}/cef" >> "$GITHUB_ENV"
      # Caches ~/.cargo and target/. Saves on main only, so pull requests from forks only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146
      # Reports warnings without failing: the app still has dead-code warnings, and only the shared crates are held to
      # -D warnings. Tighten to -D warnings once they are gone.
      - name: cargo clippy
        run: cargo clippy --locked -p nexus-desktop-gpui --all-targets
      - name: cargo nextest
        run: cargo nextest run --locked -p nexus-desktop-gpui
      # The one-line installers, against a local fake feed. Each runner tests the script for its own system.
      - name: installer tests
        run: node --test apps/desktop/packaging/install/install.test.mjs
