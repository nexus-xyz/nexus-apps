# The desktop app (apps/desktop): clippy and tests on Linux, macOS and Windows. Unsigned, no secrets.
# The logos Legal has not cleared are not in this repository: build.rs builds a generic stand-in for each, and the
# tests that check a real logo's drawing skip.
name: desktop

on:
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "deny.toml", ".cargo/**", "build/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.94 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.94
      - name: Linux packages GPUI needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan1 libasound2-dev libgtk-3-dev libayatana-appindicator3-dev
      # Caches ~/.cargo and target/. Saves on main only, so pull requests from forks only read it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
      # Reports warnings without failing: the app still has dead-code warnings, as in the monorepo, where only the
      # shared crates are held to -D warnings. Tighten to -D warnings once they are gone.
      - name: cargo clippy
        run: cargo clippy --locked -p nexus-desktop-gpui --all-targets
      - name: cargo nextest
        run: cargo nextest run --locked -p nexus-desktop-gpui
