[package]
name = "nexus-desktop-updates"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT"

[features]
# The network side for Nexus GPUI: the employee check (`access`) and the feed client (`http`). TLS is the apps' pin:
# reqwest's `rustls-no-provider`, with ring installed as rustls' provider before the first client is built
# (`http::install_tls`, as nexus-client's and nexus-cloud's).
net = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
semver = "=1.0.28"
# The same pins as Nexus GPUI.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio = { version = "=1.53.3", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "net", "io-util"] }
