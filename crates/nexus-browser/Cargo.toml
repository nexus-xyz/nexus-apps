# The session browser's logic that needs no UI toolkit: which addresses it opens, the dev-server check, the popup rule
# and reading sign-in cookies from the person's browser (src/cookies/). It takes no UI crate. Every dependency pinned
# exactly, at the app's versions.
[package]
name = "nexus-browser"
description = "Nexus for desktop's session browser: its address policy, dev-server checks and cookie import, shared by every desktop shell."
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[dependencies]
# `install_tls` before the dev-server check builds its client: the apps' TLS provider.
nexus-client = { path = "../nexus-client" }
serde = { version = "=1.0.229", features = ["derive"] }
url = "=2.5.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# Cookie import (src/cookies/): the browser's database read through a private copy (SQLite compiled in), and
# Chromium's AES-128-CBC values under its PBKDF2-SHA1 key, at the app's versions (`aes` and `cbc` through
# `secret-service`, `ring` through `rustls`). The copy's folder has a random name.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
aes = "=0.9.3"
cbc = { version = "=0.2.1", features = ["block-padding", "alloc"] }
ring = "=0.17.14"
uuid = { version = "=1.28.0", features = ["v4"] }
# A website profile's id (src/profile.rs): the app's pin.
sha2 = "=0.11.1"

# Chromium's cookie key: the Secret Service on Linux, the Keychain on macOS. The app's versions.
[target.'cfg(target_os = "linux")'.dependencies]
# Its blocking API runs zbus on async-io.
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "=4.2.0"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
