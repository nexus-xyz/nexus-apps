# Entry point of the Nexus public API contract. See README.md.
openapi: 3.1.0
info:
  title: Nexus public API
  version: 1.0.0-draft
  summary: Gateway endpoints for public clients.
  description: >
    The Nexus Gateway endpoints for public clients, including sign-in and self-service OAuth clients.


    Read `README.md` next to this file for the rules in plain words. In short:


    - Every state-changing `POST` needs an `Idempotency-Key` header. Without one the Gateway answers 428
    `idempotency_key_required`. Each operation states its rule in `x-idempotency` (`required`, `optional` or `ignored`).

    - A write to an editable resource needs `If-Match` with the `ETag` from your last read (`x-if-match: required`). A
    stale value gets 412 `version_mismatch`.

    - Every error has the shape of the `Error` schema. Its `code` field lists every documented code in `x-error-codes`,
    with its HTTP status and whether a retry is safe. Codes tagged `legacy` belong to older routes.

    - Operations marked `x-internal-stability: beta` (the `Billing` and `Cloud machines` tags) are public, but the
    deprecation windows in `DEPRECATION.md` do not cover them. They can change with a changelog entry and at least 30
    days' notice.


    Sign-in uses the OAuth 2.0 device grant, or the authorization code with PKCE. The Gateway issues no refresh token.
    See "Sign-in (OAuth 2.0)" in `README.md` for the sign-in flows, OAuth client tiers, and user IDs.
servers:
  - url: "{gateway}"
    description: A Nexus Gateway. The hosted one is the default.
    variables:
      gateway:
        default: https://api.nexus.inc
        description: The Gateway's base URL, without a trailing slash.
security:
  - bearer: []
tags:
  - name: Auth
    description: Sign-in (OAuth 2.0 device grant, and authorization code with PKCE), tokens, agent links.
  - name: Developer clients
    description: List, register, and revoke OAuth clients for your forks.
  - name: Devices
    description: Trusted devices and their approval.
  - name: Account
    description: >-
      Who you are, the organization you act in, the API description, feature switches, search, feedback and update
      access.
  - name: Models
    description: The model catalog and model calls, including the provider-compatible routes coding agents use.
  - name: Chat
    description: >-
      Chat sessions: messages, attachments, rewind, suggestions, voice, web search, and guest chat for signed-out
      visitors.
  - name: Threads
    description: >-
      Synced agent threads: list, read, follow, presence, the live stream, sealed events, content keys, and control of a
      Code session from another device.
  - name: Computers
    description: "Your computers: the list, signed presence, encrypted requests between your devices and their live states."
  - name: Agents
    description: Coding agent access, sessions and usage reports.
  - name: Cloud machines
    description: >-
      Cloud machines for agent sessions, including the calls the machine's host makes. Beta: not covered by the
      deprecation windows; see DEPRECATION.md.
    x-internal-stability: beta
  - name: Artifacts and pages
    description: Shared artifacts and their public links, pages, page frames and design systems.
  - name: Skills
    description: Skills, the skill library and skill promotions.
  - name: Connectors
    description: Connectors and the person's connections to them.
  - name: Slack
    description: "The Slack app: installs, the organization's workspace bindings and the channels bound to its teams."
  - name: GitHub
    description: The GitHub App and linked repositories.
  - name: Notifications and presence
    description: Notifications, push devices and member presence.
  - name: Organization
    description: The organization, its members, domains, invitations, settings, provider keys and service accounts.
  - name: Teams
    description: Teams and their members.
  - name: Policies
    description: Model, agent, connector and chat-write policies, traffic controls, and approvals of one connector call.
  - name: Billing
    description: >-
      The subscription, payment method, credits and receipts. Beta: not covered by the deprecation windows; see
      DEPRECATION.md.
    x-internal-stability: beta
  - name: Usage and budgets
    description: Spend, analytics, audit and budgets.
  - name: Sessions
    description: >-
      Headless cloud sessions: start one on a cloud machine, read it, send it messages, stop it, take and renew its
      runner. Beta: not covered by the deprecation windows; see DEPRECATION.md.
    x-internal-stability: beta
  - name: Your agent
    description: >-
      Your own agent, the one in Slack: asks (streamed as server-sent events), conversations, memory, approvals,
      errands, projects, watches, the morning brief, the vault and chat writes. Gateway forwards each call to the agent
      service with your token. Off unless the server turns it on. Beta: not covered by the deprecation windows; see
      DEPRECATION.md.
    x-internal-stability: beta
  - name: Apps
    description: >-
      Apps: deploy a folder as an app hosted on Vercel, follow its deployment and cost, cap its monthly hosting, claim
      it to your own Vercel account, delete it. Off unless the server turns it on. Beta: not covered by the deprecation
      windows; see DEPRECATION.md.
    x-internal-stability: beta
  - name: Routines and jobs
    description: >-
      Jobs, a module's verb run in the background: submit one, read its state and result, cancel it. Routines: your own
      scheduled jobs. Beta: not covered by the deprecation windows; see DEPRECATION.md.
    x-internal-stability: beta
