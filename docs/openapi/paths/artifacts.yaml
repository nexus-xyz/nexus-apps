/v1/page-frames/{pageId}/{version}:
  get:
    tags:
      - Artifacts and pages
    operationId: getPageFrameContent
    summary: >-
      The bytes a signed frame URL names (a version, or `live`: the page's preview, else its latest version), for the
      sandbox host (which checks the same signature and serves them with the page's CSP). No credential but the
      signature: 403 page_frame_invalid when it is wrong or expired. Plain text here: Gateway's origin never runs a
      page.
    security: []
    parameters:
      - name: sitePath
        in: query
        required: false
        description: The canonical path covered by a saved Site route signature.
        schema:
          type: string
          maxLength: 128
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,18}|live)$
        description: The version number, or `live`
      - name: exp
        in: query
        required: true
        schema:
          type: integer
        description: When the URL stops opening (unix seconds)
      - name: sig
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
        description: HMAC-SHA256 of the page, version and exp, hex
    responses:
      "200":
        description: >-
          The source, `text/plain`; `x-nexus-page-format` (html, md, jsx or sheet) and `x-nexus-page-version` name it;
          `x-nexus-design-system` names the design system it links, when it links one
        content:
          text/plain:
            schema:
              type: string
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
