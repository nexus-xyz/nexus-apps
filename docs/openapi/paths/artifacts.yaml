/v1/pages/{id}/doc:
  get:
    tags:
      - Artifacts and pages
    operationId: getPageDoc
    summary: >-
      The page's shared draft: the Yjs updates its editors posted, oldest first, for an editor that joins late. Its
      owner and the editors of an edit share.
    description: >-
      Gateway stores the updates as opaque bytes and never parses them. Apply `updates` on top of the draft's seed, the
      source of version `seed`, to get the draft. Empty when nobody has edited since the draft last started over. A
      snapshot posted with `upTo` set to `last` replaces every update here.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageDoc
      "403":
        description: A reader who may only view the page (`page_read_only`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not a page you may edit (`page_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
  post:
    tags:
      - Artifacts and pages
    operationId: postPageDoc
    summary: >-
      Post to the page's shared draft: a Yjs update, a compacted snapshot, an editor's awareness (cursor and name), or
      their presence.
    description: >-
      An update is stored and relayed to the page's live readers as a `doc` event. A snapshot (`snapshot: true`)
      replaces the updates up to `upTo` when set, and is not relayed; an editor also posts a change too large for one
      update this way. An awareness update is relayed as an `awareness` event, and a `presence` object as a `presence`
      event; neither is stored, and each names its poster as Gateway knows them (`from`). A viewer of the page's latest
      version may post presence; only an editor posts awareness, updates and snapshots. An update is at most 256 KiB, a
      snapshot 20 MiB, an awareness update or a presence object 4 KiB. At most 1200 updates, snapshots and awareness
      posts a minute per person, and 1800 presence posts. Send it without an `Idempotency-Key`: a repeated update
      changes nothing.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PostPageDocRequest
    responses:
      "200":
        description: Stored (its id) or relayed
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageDocPosted
      "400":
        description: A malformed body, or a `seed` that is not one of the page's versions
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: A reader who may only view the page posted an update or a snapshot (`page_read_only`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not a page you may edit, or for presence, open at its latest version (`page_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: "The draft started over from a newer version (`page_doc_stale`, `details.seed`): read it again"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "413":
        description: Over its size limit (`page_doc_too_large`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: required
/v1/pages/{id}/events:
  get:
    tags:
      - Artifacts and pages
    operationId: streamPageEvents
    summary: >-
      A page's live events, as server-sent events: a version event when a version is written, a preview event when an
      editor posts unsaved text, and its shared draft's updates, to whoever may open the page. A query event
      (PageQueryEvent) says one of the page's queries has a new result (Nexus Data).
    description: >-
      Each event is `event: <type>` and one line of JSON `data`: `version` (`PageVersionEvent`), `preview`
      (`PagePreviewEvent`), the shared draft's `doc` (`PageDocEvent`), and `awareness` (`PageAwarenessEvent`) and
      `presence` (`PagePresenceEvent`, page presence). Only its owner and editors get `doc` and `awareness`; other
      readers get `version`, `preview` and `presence`. The first is the page's latest version when the stream opens,
      then its preview when it has one. A `: keep-alive` comment goes out every 15 s, and the caller's access is checked
      again then: the stream ends when it is lost (or an editor may now only view the page), or when the Gateway copy is
      draining. A reader that falls behind is dropped. Reconnect, or poll `getPageVersion`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
    responses:
      "200":
        description: The event stream
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/PageVersionEvent
      "404":
        description: Not a page you may open, or a pinned share (`page_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: "Too many live readers on this Gateway copy (`page_events_full`): poll instead"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/pages/{id}/export:
  get:
    tags:
      - Artifacts and pages
    operationId: exportPage
    summary: >-
      A page version as a file: PNG (one board, at 1x or 2x), SVG (one board, as shapes and text: its box shadows and
      filters are dropped, and it names its fonts without embedding them), PDF (one page per board, at its size), PPTX
      (one slide per board), standalone HTML (the page with the canvas, its scripts and fonts inlined) or zip (the PNGs,
      the HTML and the source). A Nexus Design page's boards are its top-level data-artboard elements. A Nexus Slides
      deck's boards are its top-level section[data-slide] elements, each at its own size, and its PPTX carries each
      slide's data-notes as speaker notes by default. Hidden slides are excluded. Any other html or jsx page is one
      board. Markdown exports as a printable PDF. It renders in the page checker's Chrome; without one, 503
      export_not_configured. A board that did not render is named in x-nexus-export-failed (percent-encoded JSON, [{
      board, error }]) and the others still export. To whoever may open the version: its owner, or a reader of one of
      its active shares; anyone else gets 404 page_not_found. A person only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
            - png
            - svg
            - pdf
            - pptx
            - html
            - zip
        description: The file's format
      - name: board
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: >-
          One board or slide, by its data-id, its name or its number from 1. Required for a PNG or SVG of a design or a
          deck with several (400 board_required); one that matches none is 404 board_not_found.
      - name: scale
        in: query
        required: false
        schema:
          type: string
          enum:
            - "1"
            - "2"
        description: "The pixel ratio the boards render at. Default: 2 for pdf and pptx, 1 otherwise."
      - name: notes
        in: query
        required: false
        schema:
          type: boolean
        description: Include speaker notes in deck exports. Defaults to true in PowerPoint and false in PDF.
      - name: version
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]*|latest)$
        description: "The version to export: one the caller may open. Default: the newest they may open."
    responses:
      "200":
        description: The file, as an attachment; x-nexus-export-failed names the boards that did not render
        content:
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema:
              type: string
              format: binary
          text/html:
            schema:
              type: string
          application/zip:
            schema:
              type: string
              format: binary
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/pages/{id}/files:
  get:
    tags:
      - Artifacts and pages
    operationId: listPageFiles
    summary: >-
      A page version's data files, by name, without their bytes: read-only copies of the files its source names,
      attached in the chat that wrote it. To whoever may open the page: its owner, or a reader of one of its active
      shares; anyone else gets 404 page_not_found. A person only: a public link's reader with no Nexus identity is
      refused.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: version
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]*|latest)$
        description: >-
          The version whose files to read: one the caller may open. Default: the newest they may open (a pinned share's
          version). Another is 404 page_not_found.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageFiles
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/pages/{id}/files/{name}:
  get:
    tags:
      - Artifacts and pages
    operationId: getPageFile
    summary: >-
      One of a page version's data files with its bytes, for the page's window.fs.readFile. 404 page_file_not_found when
      it has none by that name. To whoever may open the page: its owner, or a reader of one of its active shares; anyone
      else gets 404 page_not_found. A person only: a public link's reader with no Nexus identity is refused.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[^/]+$
        description: The file's name
      - name: version
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]*|latest)$
        description: >-
          The version whose files to read: one the caller may open. Default: the newest they may open (a pinned share's
          version). Another is 404 page_not_found.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageFile
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/pages/{id}/preview:
  put:
    tags:
      - Artifacts and pages
    operationId: putPagePreview
    summary: Post the shared draft's text as the page's live preview, so every reader sees an edit before it is saved.
    description: >-
      An editor posts the whole text it holds, built on the page's latest version (`baseVersion`). It replaces the
      page's one preview, is checked as a version is, and is announced to the page's live readers as a `preview` event.
      Every reader of a share that follows the latest version, people outside the organization and public links too,
      then sees it in the page's live frame (`frameArtifact`, `framePublicArtifact`, `framePageVersion` with `live`).
      Writing a version deletes the preview. It is not a version: it has no history and is not audited. Draft posts and
      previews share the limit of 1200 a minute per person. Send it without an `Idempotency-Key`: a repeated post
      changes nothing.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PutPagePreviewRequest
    responses:
      "200":
        description: Stored and announced
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PagePreviewEvent
      "400":
        description: >-
          A malformed body, content a page may not hold (`page_content_blocked`), a `sheet` that breaks its schema
          (`page_sheet_invalid`, with the first problem at `error.nexus.path`), or a board that does not parse
          (`page_board_invalid`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: A reader who may only view the page (`page_read_only`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not a page you may edit (`page_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          A version was written since `baseVersion` (`page_preview_stale`, `details.latestVersion`): post the draft
          built on it
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "413":
        description: Over a page's 16 MiB (`page_too_large`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
/v1/pages/{id}/queries:
  get:
    tags:
      - Artifacts and pages
    operationId: listPageQueries
    summary: >-
      A page's queries (Nexus Data), by name. Its owner reads every field, pending ones included. A reader who is not
      the owner reads only the approved ones' names, parameters and refresh intervals, never a statement or a
      connection. To whoever may open the page: its owner, or a reader of one of its active shares; anyone else gets 404
      page_not_found. 403 page_queries_off while the organization's artifacts.pages.queries is off (the default). A
      person only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageQueryList
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/pages/{id}/queries/{name}:
  put:
    tags:
      - Artifacts and pages
    operationId: savePageQuery
    summary: >-
      Save and approve one of your page's queries (Nexus Data): a new one, or a change to one, a pending one included.
      One SELECT or WITH statement on a connection of postgres or snowflake that you may use, as a call of yours would
      pick it (403 connection_required, connector_disabled or not_granted otherwise). 503 page_query_unconfigured when
      this Gateway does not offer the connector. Parameters are declared with a type and bound as $1, $2… when it runs,
      never spliced into the text; a Snowflake query declares none. 400 page_query_statement_invalid for anything but
      one SELECT or WITH of at most 100,000 bytes, page_query_connector_unsupported, page_query_params_invalid,
      page_query_refresh_invalid, page_query_limit past 20 per page. Only the page's owner: 403 page_query_owner_only
      for a reader, 404 page_not_found for anyone else; 403 page_queries_off while artifacts.pages.queries is off.
      Audited as page_query.saved, with the statement's SHA-256, never its text. 201 when new, 200 when changed.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
        description: "The query's name: what the page's code passes to `window.nexus.query`"
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SavePageQueryRequest
    responses:
      "200":
        description: Changed
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageQuerySaved
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageQuerySaved
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
  delete:
    tags:
      - Artifacts and pages
    operationId: deletePageQuery
    summary: >-
      Remove one of your page's queries, approved or pending. The page's code gets 404 page_query_not_found for it from
      then on. Only the page's owner: 403 page_query_owner_only for a reader, 404 page_not_found for anyone else; 403
      page_queries_off while artifacts.pages.queries is off. Audited as page_query.deleted.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
        description: "The query's name: what the page's code passes to `window.nexus.query`"
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageQueryDeleted
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
/v1/pages/{id}/queries/{name}/run:
  post:
    tags:
      - Artifacts and pages
    operationId: runPageQuery
    summary: >-
      A page query's result (Nexus Data): the snapshot every reader of the page shares for these parameter values. A run
      inside the query's refresh interval answers it; past it, Gateway reads it again as the query's approver, one
      refresh at a time, and announces the new result on the page's events (`query`). The body names parameter values,
      and `refresh` for the owner's Refresh now: 400 page_query_run_invalid for any other field,
      page_query_params_invalid for an undeclared name, a missing value or a value of another type. 409
      page_query_pending until the owner approves it, 404 page_query_not_found once removed. When the approver left the
      organization or their access to the connection ended, every snapshot of the query is deleted and the run is
      refused with the connector call's code (connection_required, connector_disabled, not_granted) or 409
      page_query_approver_gone. 503 page_query_unconfigured when this Gateway does not offer the connector. A refresh
      that fails answers the last rows with `error`, or 502 page_query_failed with none; its message never quotes the
      database. 429 past 240 runs a minute per person or 2,400 per page. To whoever may open the page: its owner, or a
      reader of one of its active shares; anyone else gets 404 page_not_found. 403 page_queries_off while
      artifacts.pages.queries is off. A person only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
        description: "The query's name: what the page's code passes to `window.nexus.query`"
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RunPageQueryRequest
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageQueryResult
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
    x-idempotency: required
/v1/pages/{id}/restore:
  post:
    tags:
      - Artifacts and pages
    operationId: restorePage
    summary: "Restore an old version: the next version gets its title and content. Audited as page.restored."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RestorePageRequest
    responses:
      "201":
        description: Restored
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageWritten
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: required
/v1/pages/{id}/share:
  post:
    tags:
      - Artifacts and pages
    operationId: sharePage
    summary: >-
      Share one of your pages as an artifact, with the same audiences as a chat: the organization, chosen teams or
      people, or outside it (named people by email, or anyone with the link) as its settings allow. Pin a version, or
      follow the latest. Sharing again makes a new version of the artifact. Audited as artifact.shared.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SharePageRequest
    responses:
      "201":
        description: Shared
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Artifact
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.share
    x-idempotency: required
/v1/pages/{id}/storage/{scope}:
  get:
    tags:
      - Artifacts and pages
    operationId: listPageStorage
    summary: >-
      A page's storage: the keys of one scope, in order. To whoever may open the page: its owner, or a reader of one of
      its active shares; anyone else gets 404 page_not_found. A person only: a public link's reader with no Nexus
      identity is refused.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: scope
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:personal|shared)$
        description: >-
          `personal`: the caller's own copy, which no other reader sees. `shared`: one copy for everyone who may open
          the page
      - name: prefix
        in: query
        schema:
          type: string
          maxLength: 200
        description: Only the keys that start with it
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: At most this many (default 1000)
      - name: cursor
        in: query
        schema:
          type: string
        description: "`nextCursor` from the previous list"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageStorageKeys
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/pages/{id}/storage/{scope}/{key}:
  get:
    tags:
      - Artifacts and pages
    operationId: getPageStorageValue
    summary: >-
      One value of a page's storage. 404 page_storage_key_not_found when the key has none. To whoever may open the page:
      its owner, or a reader of one of its active shares; anyone else gets 404 page_not_found. A person only: a public
      link's reader with no Nexus identity is refused.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: scope
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:personal|shared)$
        description: >-
          `personal`: the caller's own copy, which no other reader sees. `shared`: one copy for everyone who may open
          the page
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[^/]+$
        description: >-
          1 to 200 characters, with no whitespace, control character, slash, backslash or quote, and not . or .. (400
          page_storage_key_invalid)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageStorageValue
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
  put:
    tags:
      - Artifacts and pages
    operationId: setPageStorageValue
    summary: >-
      Write one value of a page's storage, replacing the key's. Text only: 400 page_storage_value_invalid for anything
      else; 413 page_storage_value_too_large over 5 MiB; 413 page_storage_full when the caller would reach over 20 MiB
      of keys and values on the page: the shared scope and their own personal one. Other readers' personal values do not
      count. Not audited. To whoever may open the page: its owner, or a reader of one of its active shares; anyone else
      gets 404 page_not_found. A person only: a public link's reader with no Nexus identity is refused.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: scope
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:personal|shared)$
        description: >-
          `personal`: the caller's own copy, which no other reader sees. `shared`: one copy for everyone who may open
          the page
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[^/]+$
        description: >-
          1 to 200 characters, with no whitespace, control character, slash, backslash or quote, and not . or .. (400
          page_storage_key_invalid)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetPageStorageValueRequest
    responses:
      "200":
        description: Written
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageStorageWritten
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
    x-idempotency: optional
  delete:
    tags:
      - Artifacts and pages
    operationId: deletePageStorageValue
    summary: >-
      Delete one value of a page's storage. A missing key is no error (`deleted: false`). Deleting the page deletes all
      of its storage. To whoever may open the page: its owner, or a reader of one of its active shares; anyone else gets
      404 page_not_found. A person only: a public link's reader with no Nexus identity is refused.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: scope
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:personal|shared)$
        description: >-
          `personal`: the caller's own copy, which no other reader sees. `shared`: one copy for everyone who may open
          the page
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[^/]+$
        description: >-
          1 to 200 characters, with no whitespace, control character, slash, backslash or quote, and not . or .. (400
          page_storage_key_invalid)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageStorageDeleted
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
    x-idempotency: optional
/v1/pages/{id}/versions:
  post:
    tags:
      - Artifacts and pages
    operationId: writePageVersion
    summary: >-
      Write the next version of one of your pages, or of a page shared with you with edit access (a viewer gets 403
      page_read_only). With `baseVersion`, refused with 409 `page_version_conflict` when that is no longer the latest.
      Audited as page.version_written.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WritePageVersionRequest
    responses:
      "201":
        description: Written
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageWritten
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: required
/v1/pages/{id}/versions/{version}:
  get:
    tags:
      - Artifacts and pages
    operationId: getPageVersion
    summary: One version of one of your pages, or of a page shared with you with edit access.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,18}|latest)$
        description: A version number, or `latest`
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageVersion
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/pages/{id}/versions/{version}/frame:
  get:
    tags:
      - Artifacts and pages
    operationId: framePageVersion
    summary: >-
      Your own preview of a version, or of the page's live state (`live`: its unsaved preview, else its latest version):
      a signed URL on the sandbox origin, valid five minutes. 503 pages_viewer_unconfigured when this Gateway has no
      sandbox origin.
    parameters:
      - name: siteVersion
        in: query
        required: false
        description: Request signed routes for this exact authorized saved Site version.
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,18}|latest|live)$
        description: A version number, `latest`, or `live`
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageFrame
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/pages/{id}/versions/{version}/poster:
  get:
    tags:
      - Artifacts and pages
    operationId: getPagePoster
    summary: >-
      A small WebP picture of a page version (640 by 400), for the Artifacts library's cards. Only html, jsx and md
      pages have one; any other format is 404 poster_unavailable. The page checker renders it on the first request, and
      Gateway stores it; later requests serve the stored bytes. Without a checker, 503 poster_not_configured; a busy
      checker is 503 poster_busy; a checker that cannot render the page is 404 poster_unavailable; any other failure is
      502 poster_failed. To whoever may open the version: its owner, or a reader of one of its active shares; anyone
      else gets 404 page_not_found. A person only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,18}|latest)$
        description: "A version number, or `latest`: the newest version the caller may open"
    responses:
      "200":
        description: "The poster (image/webp, 640 by 400). Like every credentialed answer, it is cache-control: no-store."
        content:
          image/webp:
            schema:
              type: string
              format: binary
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/pages/{id}/versions/{version}/source:
  get:
    tags:
      - Artifacts and pages
    operationId: getPageSource
    summary: >-
      A version's source as written, as plain text: the HTML, Markdown or JSX to edit and write back with
      writePageVersion. Use version `latest` for the newest. It is never rendered on the API's origin.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The page's id (`pag_…`)
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[1-9][0-9]{0,18}|latest)$
        description: A version number, or `latest`
    responses:
      "200":
        description: The source, `text/plain`; the `x-nexus-page-version` header names the version
        content:
          text/plain:
            schema:
              type: string
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/public/artifacts/{token}:
  get:
    tags:
      - Artifacts and pages
    operationId: getPublicArtifact
    summary: >-
      A public artifact through its link, as anyone holding it reads it (the external variant). No credential; never
      indexed (X-Robots-Tag). Revoked, expired or unknown: 404.
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,64}$
        description: A public link's token (the last part of `/a/<token>`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactDetail
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
/v1/public/artifacts/{token}/attachments/{attachmentId}:
  get:
    tags:
      - Artifacts and pages
    operationId: getPublicArtifactAttachment
    summary: >-
      An image of a public artifact through its link, with its bytes as base64. No credential; never indexed
      (X-Robots-Tag). Revoked, expired or unknown link: 404 artifact_not_found; not one of its images: 404
      artifact_attachment_not_found.
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,64}$
        description: A public link's token (the last part of `/a/<token>`)
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The image's id (`cha_…`), from the message's `attachments`
    responses:
      "200":
        description: The image
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactAttachment
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
/v1/public/artifacts/{token}/events:
  get:
    tags:
      - Artifacts and pages
    operationId: streamPublicArtifactEvents
    summary: >-
      A public page link's live events, as server-sent events. No credential. Each stream open counts against the
      address's public reads, and an address holds at most 32 open on each Gateway copy. A query event (PageQueryEvent)
      says one of the page's queries has a new result (Nexus Data).
    security: []
    description: >-
      Each event is `event: <type>` and one line of JSON `data`, as on `streamPageEvents`: `version`
      (`PageVersionEvent`) and `preview` (`PagePreviewEvent`), never the draft's `doc` or `awareness`. The first is the
      page's latest version, then its preview when it has one. Reload the share's live frame at each one. The frame URL
      lasts five minutes, so mint a new one when it is about to expire. The share is checked again every 15 s with a `:
      keep-alive` comment, and before an event when the last check is a second old: the stream ends once the share is
      revoked or expires, or the Gateway copy is draining. Do not reconnect after a stream that ends at once. A link
      that is revoked, expired or unknown, or whose organization turned pages or public page links off, is a 404.
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,64}$
        description: A public link's token (the last part of `/a/<token>`)
    responses:
      "200":
        description: The event stream
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/PageVersionEvent
      "404":
        description: No link opens here (`artifact_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: "A pinned link: it shows one version, so it has nothing to follow (`page_share_pinned`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        description: Over the address's public reads a minute, or 32 streams open from it (`page_events_per_address`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "503":
        description: Too many live readers on this Gateway copy (`page_events_full`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
/v1/public/artifacts/{token}/frame:
  get:
    tags:
      - Artifacts and pages
    operationId: framePublicArtifact
    summary: >-
      A public page link's frame URL, valid five minutes. An unpinned link's frame shows the page's live state, unsaved
      edits included; a pinned link's frame shows its version. No credential; rate limited per address. Revoked,
      expired, unknown, or its organization turned pages or public page links off: 404.
    security: []
    parameters:
      - name: siteVersion
        in: query
        required: false
        description: Request signed routes for this exact authorized saved Site version.
        schema:
          type: integer
          minimum: 1
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,64}$
        description: A public link's token (the last part of `/a/<token>`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageFrame
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
/v1/public/artifacts/{token}/report:
  post:
    tags:
      - Artifacts and pages
    operationId: reportPublicArtifact
    summary: >-
      Report a public artifact ("Report" on its page) for Trust and Safety: recorded and audited in its organization as
      artifact.reported, and members with artifacts.manage_external get a requests.artifact_reported notification. No
      credential; limited per address.
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,64}$
        description: A public link's token (the last part of `/a/<token>`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                enum:
                  - spam
                  - phishing
                  - malware
                  - illegal
                  - other
              details:
                type: string
                maxLength: 1000
    responses:
      "202":
        description: Reported
        content:
          application/json:
            schema:
              type: object
              required:
                - reported
                - id
              properties:
                reported:
                  type: boolean
                id:
                  type: string
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
    x-idempotency: optional
    description: "Exempt: a public route. It takes no credential, so the Gateway has no caller to tie a key to."
