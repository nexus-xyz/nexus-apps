        description: When the URL stops opening (unix seconds)
      - name: sig
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
        description: HMAC-SHA256 of the page, version and exp, hex
    responses:
      "200":
        description: "`text/css`: only `selector { --name: value; }` blocks"
        content:
          text/css:
            schema:
              type: string
      "204":
        description: The page links no design system
