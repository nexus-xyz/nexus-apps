      page's own styles, under the same signature as the page's bytes. The page's frame answer names the link in
      `x-nexus-design-system`. 204 when the page links none, or one its organization does not have.
    security: []
    parameters:
      - name: sitePath
        in: query
        required: false
        description: The canonical path covered by a saved Site route signature.
        schema:
          type: string
          maxLength: 128
      - name: pageId
        in: path
        required: true
        schema:
