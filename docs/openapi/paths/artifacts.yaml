# Path items. The root openapi.yaml references each one.
/v1/artifacts:
  get:
    tags:
      - Artifacts and pages
    operationId: listArtifacts
    summary: >-
      Artifacts shared with you and by you, newest first; shared_with_me includes what other organizations shared with
      your verified email. Nexus UI's server may call it for a person with no organization.
    parameters:
      - name: order
        in: query
        schema:
          type: string
          enum:
            - recent
            - name
            - kind
            - created
        description: The order for this list. Keep the same filter and order when sending its cursor.
      - name: scope
        in: query
        schema:
          type: string
          enum:
            - all
            - shared_with_me
            - shared_by_me
          default: all
      - name: status
        in: query
        schema:
          type: string
          enum:
            - active
            - revoked
            - all
          default: active
        description: >-
          active, revoked or all (default: all you may read: every active artifact shared with or by you, and your own
          revoked ones, marked revoked; nobody else sees a revoked artifact)
      - name: session
        in: query
        schema:
          type: string
        description: Only the versions shared from this session of yours
      - name: q
        in: query
        schema:
          type: string
        description: Words in the title
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        schema:
          type: string
        description: nextCursor of the previous page
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactPage
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/artifacts/external:
  get:
    tags:
      - Artifacts and pages
    operationId: listExternalArtifacts
    summary: >-
      Everything the organization shared outside it, newest first, with open counts, readers, requests and reports
      (owners and admins).
    parameters:
      - name: audience
        in: query
        schema:
          type: string
          enum:
            - external
            - public
      - name: author
        in: query
        schema:
          type: string
        description: An author's email or user id
      - name: team
        in: query
        schema:
          type: string
        description: "A team (slug or id) and the teams under it: the team of the session it was shared from"
      - name: status
        in: query
        schema:
          type: string
          enum:
            - active
            - revoked
            - all
          default: active
      - name: q
        in: query
        schema:
          type: string
        description: Words in the title
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ExternalArtifactPage
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.manage_external
/v1/artifacts/revoke:
  post:
    tags:
      - Artifacts and pages
    operationId: revokeArtifacts
    summary: >-
      Revoke several of the organization's artifacts at once (at most 100; owners and admins). Each is audited as
      artifact.revoked.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - ids
            properties:
              ids:
                type: array
                items:
                  type: string
                maxItems: 100
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - revoked
                - skipped
              properties:
                revoked:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - version
                    properties:
                      id:
                        type: string
                      version:
                        type: integer
                skipped:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - reason
                    properties:
                      id:
                        type: string
                      reason:
                        type: string
                        enum:
                          - not_found
                          - already_revoked
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.manage_external
    x-idempotency: required
/v1/artifacts/sessions:
  post:
    tags:
      - Artifacts and pages
    operationId: shareAgentSession
    summary: >-
      Share a coding-agent session (a Code session in Nexus for desktop, or a nexus claude session) as an artifact, from
      a snapshot your app builds: with the same audiences as a chat, as the organization's settings allow. Sharing the
      same session again makes a new version. Readers cannot continue it. Thinking stays out unless included. Common key
      and token formats are hidden, and home folders become ~; images are not checked. Audited as artifact.shared.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ShareAgentSessionRequest
    responses:
      "200":
        description: Updated in place (update)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Artifact
      "201":
        description: Shared
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Artifact
      "413":
        description: The timeline is over 4 MB, or the images over their limits (session_too_large, image_too_large)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.share
    x-idempotency: required
/v1/artifacts/sessions/{id}:
  delete:
    tags:
      - Artifacts and pages
    operationId: unshareAgentSession
    summary: >-
      Stop sharing one of your coding sessions: every active version of its artifact is revoked at once, as a chat's
      unshare. Your own session with nothing active left changes nothing. A key you never shared under is 404
      artifact_not_found. Each version is audited as artifact.revoked.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: "The session's key (`cds_…`): the `sessionId` its share answered"
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - visibility
                - revoked
              properties:
                sessionId:
                  type: string
                visibility:
                  type: string
                  enum:
                    - private
                revoked:
                  type: array
                  description: The versions revoked now, oldest first; empty when nothing was shared.
                  items:
                    type: object
                    required:
                      - id
                      - version
                    properties:
                      id:
                        type: string
                      version:
                        type: integer
      "404":
        description: You shared no coding session under this key (artifact_not_found)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.share
    x-idempotency: optional
/v1/artifacts/{id}:
  delete:
    tags:
      - Artifacts and pages
    operationId: revokeArtifact
    summary: >-
      Revoke an artifact at once: its author, or an owner or admin of its organization. Nexus UI's cached page goes with
      it (the signed hook). Audited as artifact.revoked.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - revoked
                - id
                - version
              properties:
                revoked:
                  type: boolean
                id:
                  type: string
                version:
                  type: integer
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.share
    x-idempotency: optional
  get:
    tags:
      - Artifacts and pages
    operationId: getArtifact
    summary: >-
      An artifact shared with you (or by you), with its messages: as members see it, or (outside the organization) the
      external variant. Outside its audience: 404; a signed-in person with a verified email outside an external
      artifact's audience: 403 artifact_access_required (they may ask). A named outsider's open is counted.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactDetail
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/artifacts/{id}.md:
  get:
    tags:
      - Artifacts and pages
    operationId: exportArtifact
    summary: >-
      An artifact as Markdown: YAML front matter, a link back to it, the conversation, sources as links, the cost per
      answer and in total.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
    responses:
      "200":
        description: Markdown with YAML front matter
        content:
          text/markdown:
            schema:
              type: string
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/artifacts/{id}/access:
  get:
    tags:
      - Artifacts and pages
    operationId: getArtifactAccess
    summary: "Who has an artifact shared outside, who asked for access, opens and reports: its author, owners and admins."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactAccess
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.share
  post:
    tags:
      - Artifacts and pages
    operationId: changeArtifactAccess
    summary: >-
      Grant (approve a request, or add someone), deny a request, or remove someone's access to an artifact shared with
      named people outside: its author, owners and admins. Audited as artifact.access_changed (counts and domains).
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              grant:
                type: array
                items:
                  type: string
              deny:
                type: array
                items:
                  type: string
              remove:
                type: array
                items:
                  type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactAccess
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.share
    x-idempotency: required
/v1/artifacts/{id}/access-requests:
  post:
    tags:
      - Artifacts and pages
    operationId: requestArtifactAccess
    summary: >-
      Ask an artifact's author for access (someone outside its audience, signed in with a verified email). Nexus UI's
      server may call it for a person with no organization. Audited as artifact.access_requested (the domain).
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                maxLength: 500
    responses:
      "200":
        description: Already answered
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - requested
              properties:
                status:
                  type: string
                  enum:
                    - granted
                    - requested
                    - denied
                requested:
                  type: boolean
      "202":
        description: Requested
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - requested
              properties:
                status:
                  type: string
                  enum:
                    - requested
                requested:
                  type: boolean
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
    x-idempotency: required
/v1/artifacts/{id}/attachments/{attachmentId}:
  get:
    tags:
      - Artifacts and pages
    operationId: getArtifactAttachment
    summary: >-
      An image attached to one of an artifact's questions, with its bytes as base64 (`data:<mediaType>;base64,<data>`
      shows it), to everyone who may read the artifact (getArtifact's rules: its audience inside the organization, named
      people outside it by verified email; its author always). The snapshot keeps its own copy, so it outlives the
      session. Not one of its images: 404 artifact_attachment_not_found. Reading it is not counted as an open.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The image's id (`cha_…`), from the message's `attachments`
    responses:
      "200":
        description: The image
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ArtifactAttachment
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/artifacts/{id}/continue:
  post:
    tags:
      - Artifacts and pages
    operationId: continueArtifact
    summary: >-
      Continue an artifact (its id, or a public link's token) in a new private session of your own, in one of your
      organizations and at its expense (when its author allows, and from outside when artifacts.external.continue is
      on). Shared inside one of your organizations: in that organization (another `org`: 403 stays_in_organization).
      From outside the sharer's organization: in `org` when given (one of yours, else 404 not_a_member), else in the
      sharer's organization when you belong to it, else in your personal organization, made then if you have none.
      Someone Nexus does not know yet: 409 organization_required. Audited as artifact.continued in the organization the
      copy is made in.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                maxLength: 120
              team:
                type: string
              org:
                type: string
                description: >-
                  Where the copy goes: one of your organizations (a slug, an id, or `personal`). Default: see the
                  summary.
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ContinuedChatSession
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
    x-idempotency: required
/v1/artifacts/{id}/events:
  get:
    tags:
      - Artifacts and pages
    operationId: streamArtifactEvents
    summary: >-
      A shared page's live events, as server-sent events, by the share's id: for readers without the page's own stream
      (the /a/ viewer, the phone app). Anyone who may frame the share reads it, and it counts no open. A query event
      (PageQueryEvent) says one of the page's queries has a new result (Nexus Data).
    description: >-
      Each event is `event: <type>` and one line of JSON `data`, as on `streamPageEvents`: `version`
      (`PageVersionEvent`) and `preview` (`PagePreviewEvent`), never the draft's `doc` or `awareness`. The first is the
      page's latest version, then its preview when it has one. Reload the share's live frame at each one. The frame URL
      lasts five minutes, so mint a new one when it is about to expire. The share is checked again every 15 s with a `:
      keep-alive` comment, and before an event when the last check is a second old: the stream ends once the share is
      revoked or expires, or the Gateway copy is draining. Do not reconnect after a stream that ends at once.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
    responses:
      "200":
        description: The event stream
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/PageVersionEvent
      "404":
        description: >-
          A shared chat id, missing share, or inaccessible share (`artifact_not_found`). Revoked shares may return
          `artifact_revoked`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: "A pinned share: it shows one version, so it has nothing to follow (`page_share_pinned`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: Too many live readers on this Gateway copy (`page_events_full`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/artifacts/{id}/frame:
  get:
    tags:
      - Artifacts and pages
    operationId: frameArtifact
    summary: >-
      A shared page's frame URL on the sandbox origin, valid five minutes, to anyone who may read the artifact. An
      unpinned page share's frame shows the page's live state, unsaved edits included; a pinned share's frame shows its
      version. Frame it with sandbox="allow-scripts" only. 404 artifact_not_found for a shared chat id; 404
      artifact_revoked once revoked; 403 pages_off; 503 pages_viewer_unconfigured.
    parameters:
      - name: siteVersion
        in: query
        required: false
        description: Request signed routes for this exact authorized saved Site version.
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageFrame
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
/v1/artifacts/{id}/remix:
  post:
    tags:
      - Artifacts and pages
    operationId: remixArtifact
    summary: >-
      Remix a shared page (its artifact's id, or a public link's token): copy the version it shows into a new page of
      your own, in the organization you call with, and open a new chat on the copy, so the chat's next write_page writes
      its version 2. The original page and its shares do not change. Needs your organization's pages on (403 pages_off).
      A page shared in one of your organizations is remixed there (403 stays_in_organization). From outside the sharer's
      organization, its artifacts.external.continue must be on (403 external_remix_off). A shared chat id returns 404
      artifact_not_found. A shared chat's public token returns 400 not_a_page. Audited as page.created (via remix) and
      chat.session_created.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The artifact's id (`art_…`), or a public link's token
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PageRemixed
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: artifacts.read
    x-idempotency: required
/v1/design-systems:
  get:
    tags:
      - Artifacts and pages
    operationId: listDesignSystems
    summary: >-
      The organization's design systems for Nexus Design: the built-in @nexus/brand (brand v5.0) first, then its own by
      name, and the default new designs use.
    responses:
      "200":
        description: The design systems
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/DesignSystemList
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
  post:
    tags:
      - Artifacts and pages
    operationId: saveDesignSystem
    summary: >-
      Create the named design system, or replace its tokens, notes, components and source (what `nexus design-system
      sync` sends). Tokens come from `css` and from `files`: CSS custom properties (`:root`, `@theme`, `[data-theme]`,
      `.dark`, `.light`), a Tailwind config's literal theme, and `tokens.json`. Only custom properties are stored. 400
      design_system_empty when none are found, 400 design_system_limit past 50 per organization. Audited as
      design_system.saved, with counts and never the tokens.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SaveDesignSystemRequest
    responses:
      "200":
        description: Replaced
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/DesignSystemSaved
