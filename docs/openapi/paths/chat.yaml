/v1/chat/voice-token:
  post:
    tags:
      - Chat
    operationId: createVoiceToken
    summary: >-
      A short-lived token for dictation: the app's microphone button streams audio to AssemblyAI's speech to text with
      it, and Nexus's own key stays on the Gateway.
    description: >-
      Open the WebSocket in `url` (the token is already in it) within `expiresInSeconds`, then send the microphone's
      audio as binary frames: 16 kHz, 16-bit little-endian mono PCM, about 50 ms each (1,600 bytes). AssemblyAI answers
      with JSON messages: `Begin`, then a `Turn` for each stretch of speech (`transcript`, `end_of_turn`,
      `turn_is_formatted`), then `Termination`. Send `{"type":"Terminate"}` to end a session. One session runs at most
      `maxSessionSeconds`; a longer dictation asks for a new token. The token opens one session.


      Errors: 503 `voice_not_configured` when the Gateway has no AssemblyAI key (the endpoint still mounts); 502
      `voice_upstream_failed` when AssemblyAI refused or did not answer.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/VoiceToken
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
/v1/chat/web:
  post:
    tags:
      - Chat
    operationId: askWeb
    summary: >-
      Web search alone: a text question answered with your organization's web search, as sendChatMessage answers in a
      chat with webSearch on. Without `session` it starts a chat session of yours with webSearch on; with one it
      continues it. The turn offers the web_search tool and no other: no page, skill or connector tool. The
      organization's webSearch.* settings apply, maxPerTurn included. While search is off it is a 403 web_search_off,
      and while webSearch.requireZdr or a domain rule is set a 403 web_search_unenforced; both name the setting in
      error.nexus.setting, and no session is made. It needs `chat.web`, not `chat.use`, so an agent link that holds it
      reaches no other chat route. An agent link holds `chat.web` only when its sign-in asked for it, and it searches as
      its person, on its person's budget. An agent link continues only a session it started; any other session is a 404
      chat_session_not_found, as someone else's is. Text only: no images and no team. When no model the policy allows
      can search, the answer comes without a search and `sources` is absent.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                minLength: 1
                maxLength: 32000
                description: The question
              session:
                type: string
                pattern: ^[A-Za-z0-9_-]+$
                description: >-
                  The web session to continue (`chs_…`): a chat session with webSearch on. An agent link continues only
                  a session it started. Omit it to start one.
              model:
                type: string
                description: For this question and the next ones in the session
              stream:
                type: boolean
                default: true
    responses:
      "200":
        description: "The answer: an event stream, or with stream false the stored question and answer, with the answer's sources"
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/ChatStreamChunk
          application/json:
            schema:
              type: object
              required:
                - session
                - messages
              properties:
                session:
                  $ref: ../components/schemas.yaml#/ChatSession
                messages:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ChatSessionMessage
                  minItems: 2
                  maxItems: 2
                citations:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ChatCitation
                sources:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ChatWebSource
                  description: The web pages the answer read, as on the answer's own `sources`
      "402":
        description: >-
          The call's maximum cost is more than the budget left (`budget_exceeded`), or the organization has an unpaid
          Nexus invoice past its grace (`payment_past_due`). The refusal is stored in the session. A `budget_exceeded`
          refusal carries `notified: true` in its details once Gateway has told the refused person and the
          organization's owners and admins.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.web
    x-idempotency: required
/v1/guest/chat:
  get:
    tags:
      - Chat
    operationId: getGuestChat
    summary: >-
      Guest chat for a signed-out visitor: whether this guest may send a round now, its rounds, and the model that
      answers.
    description: >-
      No key: a signed-out visitor calls it. `enabled` is true when this guest id has rounds and output tokens left and
      its client address has not used today's rounds. A spent guest organization budget or an empty spend bucket shows
      only on the next round (429 `guest_chat_paused`). `rounds_limit` is a server setting (5 by default). `model` is
      the display name of the model every guest round runs on.


      Errors: 400 `guest_request_invalid` when `X-Nexus-Guest` is missing or not a UUID; 429 `rate_limited` past 30
      guest requests a minute from one address; 503 `guest_chat_not_configured` when the Gateway has no guest
      organization or no Turnstile secret. The endpoint still mounts.
    security: []
    parameters:
      - name: X-Nexus-Guest
        in: header
        required: true
        description: "The browser's guest id: a random UUID it keeps (in localStorage). Its rounds count under it."
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/GuestChatStatus
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
/v1/guest/chat/messages:
  post:
    tags:
      - Chat
    operationId: sendGuestChatMessage
    summary: >-
      One guest chat round: the answer streams as server-sent events, as sendChatMessage streams it, on the guest model,
      billed to the guest organization. Nothing of the chat is stored.
    description: >-
      No key: a signed-out visitor calls it. The body is the whole conversation the browser holds, its last message the
      guest's (`user`): at most 20 messages and 32,000 characters in all, none empty. `turnstile` is a Cloudflare
      Turnstile token, checked at Cloudflare before anything counts. The model is always the guest model (a server
      setting, `deepseek/deepseek-v4-flash-0731` by default); a request names none. A round is one accepted request: it
      counts once the model call starts, against a server setting per guest id (5) and a server setting per client
      address and UTC day (30). A guest id also gets a server setting output tokens in all (38,000): a round's
      `max_tokens` is 2,048 or what the guest has left, and the round's settled output tokens count. All guests share
      one spend bucket of a server setting (10), which refills that much per 24 hours: a round is admitted when the
      bucket holds the most the call can cost, and the bucket keeps what the call settled at. The stream is
      sendChatMessage's (`ChatStreamChunk`): a first chunk with the role and `nexus.mode` and `nexus.requested`, a chunk
      per piece of text, a last chunk with `finish_reason` and `usage`, or an `{error}` event, then `data: [DONE]`. It
      carries no `nexus.session`, `nexus.question` or `nexus.message`.


      Errors: 400 `guest_request_invalid` (a missing or bad `X-Nexus-Guest`, or a body outside the bounds above); 400
      `turnstile_failed` (Cloudflare refused the token); 429 `guest_rounds_used` (this guest id used its rounds or its
      output tokens); 429 `guest_address_limit` (this address used today's rounds); 429 `guest_chat_paused` (the spend
      bucket cannot hold this round, or the guest organization's budget is spent); 429 `rate_limited` (over 30 guest
      requests a minute from one address); 502 `turnstile_unavailable` (Cloudflare did not answer in 5 s); 503
      `guest_chat_not_configured`. A refusal counts no round.


      Exempt: a public route. It takes no credential, so the Gateway has no caller to tie a key to.
    security: []
    parameters:
      - name: X-Nexus-Guest
        in: header
        required: true
        description: "The browser's guest id: a random UUID it keeps (in localStorage). Its rounds count under it."
        schema:
          type: string
          format: uuid
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/GuestChatRequest
    responses:
      "200":
        description: The answer, as an event stream
        headers:
          X-Nexus-Guest-Rounds-Used:
            description: The rounds this guest id has used, this one included
            schema:
              type: integer
              minimum: 0
          X-Nexus-Guest-Rounds-Limit:
            description: The rounds a guest id gets
            schema:
              type: integer
              minimum: 0
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/ChatStreamChunk
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: public
    x-idempotency: optional
