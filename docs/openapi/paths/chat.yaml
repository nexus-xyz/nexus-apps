# Path items. The root openapi.yaml references each one.
/v1/chat/sessions:
  get:
    tags:
      - Chat
    operationId: listChatSessions
    summary: >-
      Your own chat sessions, most recently active first, a page at a time. Private: nobody else's are listed, for
      owners and admins too.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        schema:
          type: string
        description: nextCursor of the previous page
      - name: q
        in: query
        schema:
          type: string
        description: Words in the title or the messages
      - name: archived
        in: query
        schema:
          type: string
          enum:
            - exclude
            - include
            - only
          default: exclude
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - sessions
              properties:
                sessions:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ChatSession
                nextCursor:
                  type: string
            example:
              sessions:
                - id: chs_Q2h4dE9pUmV0
                  title: Why did the deploy fail?
                  mode: chat
                  model: nexus/auto
                  lastModel: claude-sonnet-4-6
                  team: platform
                  archived: false
                  webSearch: false
                  messageCount: 4
                  costUsd: 0.0123
                  createdAt: "2026-10-30T14:02:11.000Z"
                  updatedAt: "2026-10-30T14:05:40.000Z"
                  visibility: private
                  author:
                    email: ana@example.com
                    name: Ana Lima
      "400":
        description: >-
          A query parameter is not valid: `limit` is not 1 to the page maximum, `cursor` is not one this API returned,
          or `archived` is not exclude, include or only.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: cursor is not one this API returned
                type: invalid_request_error
                code: invalid_request
      "401":
        description: No credential (`missing_credential`), or a credential Gateway does not accept (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the credential is not valid
                type: authentication_error
                code: invalid_credential
      "403":
        description: >-
          The key does not hold `chat.use` (`role_required`: a service account, a sandbox, or an agent not granted it),
          or the caller is not a person, such as a module key (`person_required`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: chat sessions belong to a person; sign in as one
                type: permission_error
                code: person_required
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
  post:
    tags:
      - Chat
    operationId: createChatSession
    summary: >-
      Start a chat session. It is yours alone; its spend goes to you, the team (named, else your default) and the
      product chat. Audited as chat.session_created (never the title).
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                maxLength: 120
                description: "Default: the first question"
              mode:
                $ref: ../components/schemas.yaml#/ChatMode
              model:
                type: string
                description: nexus/auto (default), nexus/default or a catalog id; whether you may use it is decided on each message
              team:
                type: string
                description: A team slug you are in
              webSearch:
                type: boolean
                default: false
                description: >-
                  Whether the model may search the web in this chat. It takes effect only while the organization's
                  webSearch.engine is on
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChatSession
            example:
              id: chs_Q2h4dE9pUmV0
              mode: chat
              model: nexus/auto
              team: platform
              archived: false
              webSearch: false
              createdAt: "2026-10-30T14:02:11.000Z"
              title: New chat
              messageCount: 0
              costUsd: 0
              updatedAt: "2026-10-30T14:02:11.000Z"
      "400":
        description: >-
          The body is not valid: `title` over 120 characters, `mode` not chat or ask, a `model` that is not a string,
          `webSearch` not a boolean, `team` not a slug, or a bad `Idempotency-Key`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: mode must be chat or ask
                type: invalid_request_error
                code: invalid_request
      "401":
        description: No credential (`missing_credential`), or a credential Gateway does not accept (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the credential is not valid
                type: authentication_error
                code: invalid_credential
      "403":
        description: >-
          The key does not hold `chat.use` (`role_required`: a service account, a sandbox, or an agent not granted it),
          the caller is not a person (`person_required`), or the team named is not the caller's (`not_in_team`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: you are not in team platform; spend can only go to a team you belong to
                type: permission_error
                code: not_in_team
      "404":
        description: The team named does not exist in this organization (`unknown_team`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no team platfrom in this organization; see `nexus team list`
                type: not_found
                code: unknown_team
      "409":
        description: >-
          The `Idempotency-Key`'s first request still runs (`idempotency_in_progress`) or was interrupted
          (`idempotency_interrupted`). The request does not run again.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: a request with this Idempotency-Key is still running
                type: invalid_request_error
                code: idempotency_in_progress
      "422":
        description: The `Idempotency-Key` was used for a different request (`idempotency_key_reused`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: this Idempotency-Key was used for a different request
                type: invalid_request_error
                code: idempotency_key_reused
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: required
/v1/chat/sessions/{id}:
  delete:
    tags:
      - Chat
    operationId: deleteChatSession
    summary: Delete a session and its messages. Audited as chat.session_deleted (never the content).
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
      - $ref: ../components/common.yaml#/parameters/IfMatch
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
                id:
                  type: string
                messages:
                  type: integer
            example:
              deleted: true
              id: chs_Q2h4dE9pUmV0
              messages: 2
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "404":
        description: "No such session among yours (`chat_session_not_found`): someone else's session answers the same."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no chat session chs_Q2h4dE9pUmV0
                type: not_found
                code: chat_session_not_found
      "412":
        $ref: ../components/common.yaml#/responses/VersionMismatch
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
    x-if-match: required
  get:
    tags:
      - Chat
    operationId: getChatSession
    summary: One of your sessions with its messages, oldest first. Anyone else's session is 404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChatSessionDetail
            example:
              id: chs_Q2h4dE9pUmV0
              title: How do we deploy the gateway?
              mode: chat
              model: nexus/auto
              lastModel: anthropic/claude-sonnet-5.5
              team: platform
              archived: false
              webSearch: false
              messageCount: 2
              costUsd: 0.004215
              createdAt: "2026-10-30T14:02:11.000Z"
              updatedAt: "2026-10-30T14:02:47.000Z"
              visibility: private
              messages:
                - id: chm_Vb7dK2pQx9Lm
                  sessionId: chs_Q2h4dE9pUmV0
                  role: user
                  content: How do we deploy the gateway?
                  status: complete
                  mode: chat
                  createdAt: "2026-10-30T14:02:40.000Z"
                - id: chm_Hn4sR8tYw2Jc
                  sessionId: chs_Q2h4dE9pUmV0
                  role: assistant
                  content: Tag a release with `factory-v*`; the release workflow builds the image and promotes it.
                  status: complete
                  mode: chat
                  requestedModel: nexus/auto
                  model: anthropic/claude-sonnet-5.5
                  costUsd: 0.004215
                  usage:
                    promptTokens: 1120
                    completionTokens: 57
                  createdAt: "2026-10-30T14:02:47.000Z"
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "404":
        description: "No such session among yours (`chat_session_not_found`): someone else's session answers the same."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no chat session chs_Q2h4dE9pUmV0
                type: not_found
                code: chat_session_not_found
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
  patch:
    tags:
      - Chat
    operationId: updateChatSession
    summary: Rename, archive or restore a session, or change the model, mode, web search switch or team its next messages use.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
      - $ref: ../components/common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                maxLength: 120
              archived:
                type: boolean
              model:
                type: string
              mode:
                $ref: ../components/schemas.yaml#/ChatMode
              team:
                type:
                  - string
                  - "null"
              webSearch:
                type: boolean
                description: >-
                  Whether the model may search the web in this chat. It takes effect only while the organization's
                  webSearch.engine is on
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChatSession
            example:
              id: chs_Q2h4dE9pUmV0
              title: Gateway deploys
              mode: chat
              model: nexus/auto
              lastModel: anthropic/claude-sonnet-5.5
              team: platform
              archived: false
              webSearch: false
              messageCount: 2
              costUsd: 0.004215
              createdAt: "2026-10-30T14:02:11.000Z"
              updatedAt: "2026-10-30T15:10:00.000Z"
              visibility: private
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "404":
        description: "No such session among yours (`chat_session_not_found`): someone else's session answers the same."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no chat session chs_Q2h4dE9pUmV0
                type: not_found
                code: chat_session_not_found
      "412":
        $ref: ../components/common.yaml#/responses/VersionMismatch
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
    x-if-match: required
/v1/chat/sessions/{id}/attachments/{attachmentId}:
  get:
    tags:
      - Chat
    operationId: getChatAttachment
    summary: >-
      An image attached to a question in one of your sessions, with its bytes as base64
      (`data:<mediaType>;base64,<data>` shows it). Someone else's session, or an image not in it, is a 404
      (chat_session_not_found, chat_attachment_not_found).
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The image's id (`cha_…`), from the message's `attachments`
    responses:
      "200":
        description: The image
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChatAttachment
            example:
              id: cha_P6wd1Nf3Zr8T
              sessionId: chs_Q2h4dE9pUmV0
              messageId: chm_Vb7dK2pQx9Lm
              mediaType: image/png
              bytes: 68
              width: 1
              height: 1
              name: pixel.png
              data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
              createdAt: "2026-10-30T14:02:40.000Z"
      "404":
        description: No such session among yours (`chat_session_not_found`), or no such image in it (`chat_attachment_not_found`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no attachment cha_P6wd1Nf3Zr8T in chat session chs_Q2h4dE9pUmV0
                type: not_found
                code: chat_attachment_not_found
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/chat/sessions/{id}/export.md:
  get:
    tags:
      - Chat
    operationId: exportChatSession
    summary: >-
      One of your sessions as Markdown: YAML front matter, the conversation, sources as links, the cost per answer and
      in total.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
    responses:
      "200":
        description: Markdown with YAML front matter
        content:
          text/markdown:
            schema:
              type: string
            example: |
              ---
              title: "How do we deploy the gateway?"
              session: "https://nexus.inc/app/acme/sessions/chs_Q2h4dE9pUmV0"
              organization: "Acme"
              author: "Ada <ada@acme.test>"
              created: "2026-10-30T14:02:11.000Z"
              models:
               - "anthropic/claude-sonnet-5.5"
              mode: "chat"
              visibility: "private"
              cost_usd: 0.004215
              ---

              # How do we deploy the gateway?

              > Exported from Nexus: [open the session](https://nexus.inc/app/acme/sessions/chs_Q2h4dE9pUmV0)

              ## You

              How do we deploy the gateway?

              ## Nexus · anthropic/claude-sonnet-5.5

              Tag a release with `factory-v*`; the release workflow builds the image and promotes it.

              *Cost: $0.004215 · 1120 prompt + 57 completion tokens*

              ---

              **Total cost:** $0.004215 for 1 answer.
      "404":
        description: "No such session among yours (`chat_session_not_found`): someone else's session answers the same."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no chat session chs_Q2h4dE9pUmV0
                type: not_found
                code: chat_session_not_found
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/chat/sessions/{id}/messages:
  post:
    tags:
      - Chat
    operationId: sendChatMessage
    summary: >-
      Send a message; the answer streams as server-sent events (OpenAI chat.completion.chunk; `stream: false` answers
      with JSON). The call takes the same path as /v1/chat/completions: the model policy decision (nexus/auto by
      default), the ledger's reserve and settle, attribution to you, your team and chat. Ask your code ranks your
      organization's Nexus Wiki sections (BM25) and cites them. A refusal is stored in the session and answered before
      any stream: 403 model_not_allowed (naming the level and rule), 402 budget_exceeded or payment_past_due;
      error.nexus names the session and the stored message. With an Idempotency-Key a message runs at most once; a
      finished stream is not replayed (409 idempotency_stream_replay). With `images` a question carries up to 8 images,
      PNG, JPEG, GIF or WebP by their bytes, at most 5 MB each and 20 MB in all; `content` may then be empty. They go to
      the model with the question (and with the next ones while they are among the last two questions that had any) and
      are stored beside it: the message lists them in `attachments`, and getChatAttachment returns their bytes. 400
      invalid_image, 413 image_too_large, 400 model_no_image_input for a model that does not read images.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
      - name: x-nexus-team
        in: header
        required: false
        description: "The team (slug) this message's spend goes to; you must be in it. Default: the session's team."
        schema:
          type: string
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                maxLength: 32000
                description: The question; may be empty when `images` or `files` has at least one
              images:
                type: array
                maxItems: 8
                description: Images that go with the question.
                items:
                  $ref: ../components/schemas.yaml#/ChatImageInput
              files:
                type: array
                maxItems: 8
                description: >-
                  Data files that go with the question: the model reads a text file's text, and a page written in this
                  chat keeps a copy. With the images, at most 20 MB.
                items:
                  $ref: ../components/schemas.yaml#/ChatFileInput
              model:
                type: string
                description: For this message and the next ones
              mode:
                $ref: ../components/schemas.yaml#/ChatMode
              team:
                type: string
              stream:
                type: boolean
                default: true
    responses:
      "200":
        description: "The answer: an event stream, or with stream false the stored question and answer"
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/ChatStreamChunk
          application/json:
            schema:
              type: object
              properties:
                session:
                  $ref: ../components/schemas.yaml#/ChatSession
                messages:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ChatSessionMessage
                  minItems: 2
                  maxItems: 2
                citations:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ChatCitation
            example:
              session:
                id: chs_Q2h4dE9pUmV0
                title: How do we deploy the gateway?
                mode: chat
                model: nexus/auto
                lastModel: anthropic/claude-sonnet-5.5
                team: platform
                archived: false
                webSearch: false
                messageCount: 2
                costUsd: 0.004215
                createdAt: "2026-10-30T14:02:11.000Z"
                updatedAt: "2026-10-30T14:02:47.000Z"
                visibility: private
              messages:
                - id: chm_Vb7dK2pQx9Lm
                  sessionId: chs_Q2h4dE9pUmV0
                  role: user
                  content: How do we deploy the gateway?
                  status: complete
                  mode: chat
                  createdAt: "2026-10-30T14:02:40.000Z"
                - id: chm_Hn4sR8tYw2Jc
                  sessionId: chs_Q2h4dE9pUmV0
                  role: assistant
                  content: Tag a release with `factory-v*`; the release workflow builds the image and promotes it.
                  status: complete
                  mode: chat
                  requestedModel: nexus/auto
                  model: anthropic/claude-sonnet-5.5
                  costUsd: 0.004215
                  usage:
                    promptTokens: 1120
                    completionTokens: 57
                  createdAt: "2026-10-30T14:02:47.000Z"
              citations: []
      "402":
        description: >-
          The call's maximum cost is more than the budget left (`budget_exceeded`), or the organization has an unpaid
          Nexus invoice past its grace (`payment_past_due`). The refusal is stored in the session. A `budget_exceeded`
          refusal carries `notified: true` in its details once Gateway has told the refused person and the
          organization's owners and admins. The details are a BudgetRefusal: each money figure with its exact decimal
          twin.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas.yaml#/Error
                - properties:
                    error:
                      properties:
                        nexus:
                          $ref: ../components/schemas.yaml#/BudgetRefusal
      "404":
        description: "No such session among yours (`chat_session_not_found`): someone else's session answers the same."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no chat session chs_Q2h4dE9pUmV0
                type: not_found
                code: chat_session_not_found
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: required
/v1/chat/sessions/{id}/rewind:
  post:
    tags:
      - Chat
    operationId: rewindChatSession
    summary: Rewind before one active user message. Original messages remain saved. Running replies return 409.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The session's id (`chs_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
