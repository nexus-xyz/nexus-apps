/v1/cloud/machines/{id}/wake:
  post:
    tags:
      - Cloud machines
    operationId: wakeCloudMachine
    summary: >-
      Wake your machine from its saved disk. Its address and host key change: ask for access again. Its running time is
      charged from now. When Gateway runs its most machines, the person woke 20 machines and gets one more wake a
      minute, or the provider is at its limits, the wake waits in the queue (202, state `queued`); the meter starts it
      in turn. A wake counts toward the day's starts: past them it answers 429 `cloud_daily_starts`. An organization
      with only the free start is on the trial: it runs one machine at a time, and all trial organizations together a
      few. A trial machine never waits in the queue: one more answers 429 `cloud_trial_limit` or `cloud_trial_busy`
      (`Retry-After`), which name Billing. Credits, a card or a contract lift the trial. A trial machine sleeps 2 hours
      after its wake (`max_run`). A run that stops in its first minute is charged a minute.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The machine's id (`cm_…`), as POST /v1/cloud/machines answered it
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CloudMachine
      "202":
        description: "Accepted: the wake waits in the queue (`queued`, with `queuedUntil`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CloudMachine
      "402":
        description: >-
          Nothing covers 15 minutes of this machine's cloud compute (`budget_exceeded`), so no new compute starts. Nexus
          pays for cloud compute: it is held on the organization's Nexus balance (its subsidy, then its credits, then
          its contract), and on its budget. An organization past due gets `payment_past_due`. The refusal is recorded.
          When a running machine's next 15 minutes are refused, Gateway puts it to sleep, with `stopReason` `budget`.
      "403":
        description: >-
          Cloud machines are not turned on for this organization (`cloud_not_enabled`). Only the organizations Nexus
          lists may start or use a machine; anyone may still list, sleep and delete their own.
      "404":
        description: >-
          No such machine of yours: another person's machine, another organization's and a deleted one are as absent as
          a missing one.
      "409":
        description: "The machine slept 14 days and the provider deleted its disk (`snapshot_data_expired`): it is now `gone`."
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "502":
        description: The cloud provider failed or did not answer (`cloud_provider_error`); try again.
      "503":
        description: >-
          No provider account on this Gateway (`cloud_unavailable`), or the machine is not ready yet (the provider's
          code, such as `sandbox_restoring`); try again later.
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: cloud.machines.use
    x-internal-stability: beta
    x-idempotency: required
