              $ref: ../components/schemas.yaml#/CloudSetupToken
      "400":
        description: The body is not `{ grant }`.
      "403":
        description: >-
          The caller's token is not this machine's own (`not_machine_token`), or the grant is not this machine's, ran
          out, or the setup is off (`setup_grant_refused`). The app clones the repository instead.
      "404":
        description: >-
