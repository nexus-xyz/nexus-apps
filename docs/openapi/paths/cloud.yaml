      The machine's own setup at boot (on with a server setting). The machine's host sends the sealed grant from its
      `cloud.json` with the machine's own Nexus token. Gateway answers the repository and a GitHub App token that may
      only read it, for an hour at most. Gateway seals a grant only when GitHub lets the session's person read the
      repository and the organization's GitHub App reaches it. The grant works for one hour after the create, and ends
      sooner when the machine's setup is ready (`setup-done`). Gateway never logs the token.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
