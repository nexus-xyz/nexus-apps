# Path items. The root openapi.yaml references each one.
/v1/approvals:
  post:
    tags:
      - Policies
    operationId: createApproval
    summary: >-
      Ask Policy for an approval record bound to one exact connector call: the person, this agent link, the connector,
      the operation and a SHA-256 of the arguments' canonical JSON (keys sorted at every depth, no spaces). It keeps the
      arguments, so the person sees them. It is pending, expires in 30 minutes and allows the call once, after the
      person confirms it in Nexus (`confirmUrl`). A chat agent's link only (`connectors.use`): any other caller gets 403
      `agent_only`. Refused while chat writes are off (`chat_writes_off`) and for an operation the organization's
      allowlist does not name (`operation_not_allowed`). Audited as policy.approval.requested, with the hash and never
      the arguments.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CreateApproval
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Approval
      "400":
        description: Not a body (`invalid_approval`), or the operation only reads (`not_a_write`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a chat agent's link (`agent_only`), chat writes are off (`chat_writes_off`), or the operation is not on
          the allowlist (`operation_not_allowed`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such connector operation
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: connectors.use
    x-idempotency: required
/v1/approvals/{id}:
  get:
    tags:
      - Policies
    operationId: getApproval
    summary: >-
      One approval record, with its arguments. The agent link that asked (`connectors.use`), or its person from their
      own session or key: any other caller of the organization gets 404 `approval_not_found`, and a caller that is
      neither a link nor a person 403 `agent_only`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The approval's id (`apr_…`)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Approval
      "403":
        description: Neither an agent link nor a person (`agent_only`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such approval of this link's or this person's (`approval_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: connectors.use
/v1/approvals/{id}/cancel:
  post:
    tags:
      - Policies
    operationId: cancelApproval
    summary: >-
      The agent link that asked cancels its own pending record (`connectors.use`): it moves to denied, once. Cancelling
      never confirms, so it needs no person. Any other caller gets 403 `agent_only`, and another link's record is 404
      `approval_not_found`. Cancelled again, it answers the stored record; a confirmed or used one is 409
      `approval_settled`. Audited as policy.approval.cancelled.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The approval's id (`apr_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Approval
      "403":
        description: Not a chat agent's link (`agent_only`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such approval of this link's (`approval_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: Already confirmed or used (`approval_settled`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: connectors.use
    x-idempotency: required
/v1/approvals/{id}/confirm:
  post:
    tags:
      - Policies
    operationId: confirmApproval
    summary: >-
      The record's person confirms it, once, before it expires, from their own session in Nexus UI or their own key
      (`approvals.decide`). An agent link never confirms: it gets 403 `person_only`, so a link cannot approve its own
      write. Another person's record is 404 `approval_not_found`. Confirmed again, it answers the stored record. Refused
      while chat writes are off, and for an operation the allowlist does not name. Audited as policy.approval.confirmed,
      with the person as its actor.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The approval's id (`apr_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Approval
      "403":
        description: >-
          An agent link or another credential that is no person (`person_only`), chat writes are off
          (`chat_writes_off`), or the operation is not on the allowlist (`operation_not_allowed`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such approval of this person's (`approval_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: Expired (`approval_expired`), or already decided another way or used (`approval_settled`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: approvals.decide
    x-idempotency: required
/v1/approvals/{id}/deny:
  post:
    tags:
      - Policies
    operationId: denyApproval
    summary: >-
      The record's person denies it, once, from their own session in Nexus UI or their own key (`approvals.decide`). An
      agent link gets 403 `person_only` and cancels instead. Another person's record is 404 `approval_not_found`. Denied
      again, it answers the stored record. Audited as policy.approval.denied.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The approval's id (`apr_…`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Approval
      "403":
        description: An agent link or another credential that is no person (`person_only`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such approval of this person's (`approval_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: Expired (`approval_expired`), or already decided another way or used (`approval_settled`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: approvals.decide
    x-idempotency: required
/v1/policies/agent-writes:
  get:
    tags:
      - Policies
    operationId: getAgentWrites
    summary: >-
      Whether your agents may write in this organization: with it on, your agent links make the connector writes the
      organization allows its agents (`/v1/policies/chat-writes`) with no approval record per call. On by default; a
      saved OFF choice restores approval records per call. Your own session or key only (`approvals.decide`): an agent
      link gets 403 `person_only`.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AgentWriteSetting
      "403":
        description: "Not your own session or key: an agent link or any other credential (`person_only`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: approvals.decide
  put:
    tags:
      - Policies
    operationId: setAgentWrites
    summary: >-
      Turn your agents' writes on or off in this organization. On, your agent links make the connector writes the
      organization allows its agents, while it has them on, with no approval record per call; the agent's own mode
      decides whether it asks first. A `github` write runs as your own GitHub account (POST
      /v1/connections/github/oauth), never as the Nexus GitHub App: without one connected it is refused (403
      `connection_required`). Off, a write needs a record you confirmed. Your own session or key only
      (`approvals.decide`): no agent link and no operator grant holds it. Audited as agent_write_setting.changed with
      the setting before and after.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AgentWriteSetting
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AgentWriteSetting
      "400":
        description: Not a setting (`invalid_setting`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: "Not your own session or key: an agent link or any other credential (`person_only`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: approvals.decide
    x-idempotency: optional
/v1/policies/agents/{agent}:
  get:
    tags:
      - Policies
    operationId: getAgentPolicy
    summary: A coding agent's model policy (was the old agent policy, migrated as its allow list and default).
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModelPolicy
            example:
              level: agent
              subject: claude
              rule:
                allow:
                  - anthropic/claude-opus-*
                  - anthropic/claude-haiku-*
                defaults:
                  claude: anthropic/claude-opus-5.5
              custom: true
              updatedAt: "2026-10-29T16:05:42.000Z"
              inherited:
                - level: organization
                  subject: organization
                  rule:
                    deny:
                      - anthropic/claude-fable-*
              effective:
                allowed:
                  - anthropic/claude-opus-5.5
                  - anthropic/claude-haiku-5.5
                defaults:
                  chat:
                    from:
                      level: catalog
                  claude:
                    model: anthropic/claude-opus-5.5
                    from:
                      level: agent
                      subject: claude
                      list: defaults
                  codex:
                    from:
                      level: catalog
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "400":
        description: >-
          The path names no coding agent: `agent` must be `claude`, `codex`, `antigravity` or `cursor`
          (`invalid_request`); or it names one without a Gateway route, which has no model policy (`route_unsupported`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "agent must be one of: claude, codex, antigravity, cursor"
                type: invalid_request_error
                code: invalid_request
      "403":
        description: >-
          The credential does not hold `policy.read`. Every person in the organization holds it; a service account or
          sandbox key does not (`role_required`), nor a scoped module key (`module_key`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  only the org's owner or admins can read the model policies (organization, teams, coding agents) and
                  test them for yourself (policy.read)
                type: permission_error
                code: role_required
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.read
    parameters:
      - name: agent
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/AgentId
          pattern: ^[a-z][a-z0-9-]*$
  put:
    tags:
      - Policies
    operationId: setAgentPolicy
    summary: Replace a coding agent's model policy (owners and admins). Audited.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModelPolicy
            example:
              level: agent
              subject: claude
              rule:
                allow:
                  - anthropic/claude-opus-*
                  - anthropic/claude-haiku-*
                defaults:
                  claude: anthropic/claude-opus-5.5
              custom: true
              updatedAt: "2026-10-29T16:05:42.000Z"
              inherited:
                - level: organization
                  subject: organization
                  rule:
                    deny:
                      - anthropic/claude-fable-*
              effective:
                allowed:
                  - anthropic/claude-opus-5.5
                  - anthropic/claude-haiku-5.5
                defaults:
                  chat:
                    from:
                      level: catalog
                  claude:
                    model: anthropic/claude-opus-5.5
                    from:
                      level: agent
                      subject: claude
                      list: defaults
                  codex:
                    from:
                      level: catalog
              notes: []
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "400":
        description: >-
          Not a valid rule (`invalid_policy`), including `providers`, which is set on the organization's policy only; or
          the path names no coding agent (`invalid_request`); or it names one without a Gateway route, which has no
          model policy (`route_unsupported`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "unknown field models: a rule has allow, deny, defaults, maxPrice, denyCountries and providers"
                type: invalid_request_error
                code: invalid_policy
      "403":
        description: >-
          The caller does not hold `policy.manage`: only owners and admins set the coding agents' policies
          (`role_required`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can set the coding agents' model policies (policy.manage)
                type: permission_error
                code: role_required
      "412":
        $ref: ../components/common.yaml#/responses/VersionMismatch
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage
    parameters:
      - name: agent
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/AgentId
          pattern: ^[a-z][a-z0-9-]*$
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
      - $ref: ../components/common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModelRule
          example:
            allow:
              - anthropic/claude-opus-*
              - anthropic/claude-haiku-*
            defaults:
              claude: anthropic/claude-opus-5.5
    x-idempotency: optional
    x-if-match: required
/v1/policies/chat-writes:
  get:
    tags:
      - Policies
    operationId: getChatWrites
    summary: >-
      Whether this organization lets a person's confirmed write from chat run, and which connector operations it may run
      (owners, admins, leads and members: `policy.read`). On with every registered connector write by default. Saved
      organization choices, including empty operation lists, take precedence. `default` is true while the organization
      never chose.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChatWriteSetting
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.read
  put:
    tags:
      - Policies
    operationId: setChatWrites
    summary: >-
      Turn writes from chat on or off for this organization and, with `operations`, replace its allowlist of connector
      operations; left out, the list is kept (owners and admins: `policy.manage`; an operator may only turn them off,
      and never sets the list). Each entry must be a connector write Core has. A write of an operation the list does not
      name is refused (403 `operation_not_allowed`), even with a confirmed record. Off, a chat agent's approval record
      is not made, confirmed or used, so a record confirmed before stops working too. What an allowed write lets a
      member's agent do: a `github` write runs as that member's own GitHub account, connected with POST
      /v1/connections/github/oauth, so GitHub allows it only what it allows the member, and it is refused (403
      `connection_required`) while they have none connected; a module's write runs as the Nexus GitHub App. Audited as
      chat_write_setting.changed with the setting before and after.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
      - $ref: ../components/common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetChatWrites
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChatWriteSetting
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "400":
        description: Not a setting, or an entry that is no connector write (`invalid_setting`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "412":
        $ref: ../components/common.yaml#/responses/VersionMismatch
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage
    x-idempotency: optional
    x-if-match: required
/v1/policies/connectors:
  get:
    tags:
      - Policies
    operationId: listConnectorAvailability
    summary: >-
      Every connector Gateway offers, with its availability in this organization (owners, admins, leads and members:
      `policy.read`): disabled, available (members opt in) or enabled_for_all, the teams it is limited to, and whether
      it is the connector's default (the organization never chose: enabled_for_all for github, disabled for every other
      connector).
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ConnectorAvailabilityList
            example:
              connectors:
                - name: asana
                  availability: available
                  teams:
                    - platform
                  default: false
                  offered: true
                  changedBy: usr_3Kd9TqW2bNxe
                  changedAt: "2026-10-24T15:20:11.000Z"
                - name: github
                  availability: enabled_for_all
                  teams: null
                  default: true
                  offered: true
                - name: slack
                  availability: disabled
                  teams: null
                  default: true
                  offered: false
      "403":
        description: >-
          The credential does not hold `policy.read`. Every person in the organization holds it; a service account or
          sandbox key does not (`role_required`), nor a scoped module key (`module_key`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  only the org's owner or admins can read the model policies (organization, teams, coding agents) and
                  test them for yourself (policy.read)
                type: permission_error
                code: role_required
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.read
/v1/policies/connectors/{name}:
  put:
    tags:
      - Policies
    operationId: setConnectorAvailability
    summary: >-
      Set one connector's availability in this organization, in full (owners and admins: `policy.manage`; an operator
      may only turn it off). With teams, only their members and the members of the teams under them may use it, and a
      module acting for no person may not. Every connector call reads it first: a person, or a module acting for one, it
      does not reach is refused with 403 connector_disabled. Audited as connector_availability.changed with the
      availability before and after.
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        description: The connector (`github`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetConnectorAvailability
          example:
            availability: available
            teams:
              - platform
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ConnectorAvailability
            example:
              name: asana
              availability: available
              teams:
                - platform
              default: false
              offered: true
              changedBy: usr_3Kd9TqW2bNxe
              changedAt: "2026-10-24T15:20:11.000Z"
      "400":
        description: >-
          Not an availability: an empty or unknown team, or a state the connector cannot hold (`available` for one only
          the organization connects, `enabled_for_all` for one only a person connects) (`invalid_availability`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no team design in this organization
                type: invalid_request_error
                code: invalid_availability
      "403":
        description: >-
          The caller does not hold `policy.manage`: only owners and admins choose which connectors members may use
          (`role_required`). Under an operator grant, only `disabled` is allowed (`operator_scope`). A connector this
          Gateway does not offer may only be set to `disabled` (`connector_not_offered`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can choose which connectors members may use (policy.manage)
                type: permission_error
                code: role_required
      "404":
        description: No such connector
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no connector trello
                type: not_found
                code: not_found
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage
    x-idempotency: optional
/v1/policies/controls:
  get:
    tags:
      - Policies
    operationId: listOperatorControls
    summary: >-
      The operator controls in force (`policy.read`). Owners and admins see every unexpired control of the organization.
      A lead or member sees only the controls that apply to them: the organization's, those on every team they are in
      and the teams above them, their own and their key's. An expired control is not listed.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
