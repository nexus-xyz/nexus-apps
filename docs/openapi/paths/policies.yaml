                  at: "2026-10-21T11:02:37.000Z"
              grantable:
                github:
                  - pull_review
                  - check_run
                  - issue_comment
                  - reaction
                  - resolve_thread
                  - pull_create
                  - pull_ready
                  - pull_merge
