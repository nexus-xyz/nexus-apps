/v1/policies/grants/{product}/{capability}:
  put:
    tags:
      - Policies
    operationId: setWriteGrants
    summary: >-
      Set the write operations of one connector a module may run in this organization (owners and admins:
      `policy.manage`), in full: the operations not listed are revoked, and an empty list revokes them all. Each grant
      and each revocation is audited (connector_grant.granted, connector_grant.revoked); a revocation applies from the
      module's next call. Policy's decide_call reads these grants before every scoped connector call. Each write attempt
      is audited as connector.write: outcome written; denied with the refusal's code (no grant, a review event other
      than COMMENT, a thread of another repository); or failed with the error's code and status when an allowed write
      failed (a rate limit, a timeout). A grant is per organization, module, connector and operation, not per
      repository: the module scopes repositories itself.
    parameters:
      - name: product
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        description: The module's product slug (`robustness`)
      - name: capability
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        description: The module's capability slug (`review`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
      - $ref: ../components/common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetWriteGrants
          example:
            connector: github
            actions:
              - pull_review
              - check_run
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WriteGrantsSet
            example:
              module: robustness/review
              connector: github
              actions:
                - check_run
                - pull_review
              granted:
                - check_run
              revoked: []
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "400":
        description: Not a connector with writes, or not one of its write operations (`invalid_grant`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  github/merge is not a write operation; the writes are: pull_review, check_run, issue_comment,
                  reaction, resolve_thread, pull_create, pull_ready, pull_merge, pull_edit, pull_state, pull_reviewers,
                  pull_labels
                type: invalid_request_error
                code: invalid_grant
      "403":
        description: >-
          The caller does not hold `policy.manage`: only owners and admins grant connector writes (`role_required`).
          Under an operator grant, only a revoke (an empty `actions` list) is allowed (`operator_scope`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can grant modules connector writes (policy.manage)
                type: permission_error
                code: role_required
      "412":
        $ref: ../components/common.yaml#/responses/VersionMismatch
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage
    x-idempotency: optional
    x-if-match: required
