/v1/policies/teams/{slug}/controls:
  get:
    tags:
      - Policies
    operationId: listTeamOperatorControls
    summary: >-
      The operator controls in force on a team, on the teams under it, and on the people and keys in them (owners and
      admins; a team lead for a team they lead). Controls on the organization and on the teams above it are not listed.
      An expired control is not listed.
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[a-z0-9][a-z0-9-]{0,126}|team_[A-Za-z0-9]+)$
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OperatorControls
            example:
              controls:
                - id: ctl_9Rf2KpL7mQxA
                  tenantId: ten_8Hq2LmP4xRtK
                  kind: limit
                  subjectLevel: team
                  subject: team_x7Ka2LmPq9Rd
                  models:
                    - anthropic/claude-haiku-5.5
                  reason: "Opus latency incident: keep the platform team on Haiku until it is resolved"
                  createdBy: usr_3Kd9TqW2bNxe
                  createdAt: "2026-10-30T09:15:00.000Z"
                  expiresAt: "2026-10-31T09:15:00.000Z"
      "403":
        description: >-
          The caller is not an owner, an admin or a team lead (`role_required`), or the team is not one they lead
          (`outside_led_teams`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: team platform is not one you lead
                type: permission_error
                code: outside_led_teams
      "404":
        description: No such team in this organization (`unknown_team`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no team design in this organization
                type: not_found
                code: unknown_team
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage_team
  post:
    tags:
      - Policies
    operationId: setTeamOperatorControl
    summary: >-
      Put an operator control in force on a team, or on a person or key in it or in a team under it (owners and admins;
      a team lead for a team they lead, who may pause or limit but not override). It works as `setOperatorControl`
      otherwise. It is audited (policy.control_set).
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[a-z0-9][a-z0-9-]{0,126}|team_[A-Za-z0-9]+)$
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetOperatorControl
          example:
            kind: pause
            level: person
            subject: usr_7Jm4RwX9cTqa
            reason: "Runaway script: pause until it is fixed"
            expiresAt: "2026-10-30T18:00:00.000Z"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OperatorControl
            example:
              id: ctl_2Hc6VsM8pLnB
              tenantId: ten_8Hq2LmP4xRtK
              kind: pause
              subjectLevel: person
              subject: usr_7Jm4RwX9cTqa
              reason: "Runaway script: pause until it is fixed"
              createdBy: usr_3Kd9TqW2bNxe
              createdAt: "2026-10-30T14:02:51.000Z"
              expiresAt: "2026-10-30T18:00:00.000Z"
      "400":
        description: >-
          Not a valid control (`invalid_control`): an unknown kind, level or model, no reason, an expiry in the past,
          models on a pause, or none on a limit or an override. Also when the organization already holds 200 live
          controls.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: a control must expire in the future
                type: invalid_request_error
                code: invalid_control
      "403":
        description: >-
          The caller is not an owner, an admin or a team lead (`role_required`), the team is not one they lead
          (`outside_led_teams`), the subject is outside the team and the teams under it (`outside_team`), or a lead
          asked for an override (`override_needs_admin`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "team leads may pause or limit, not override: ask an owner or admin"
                type: permission_error
                code: override_needs_admin
      "404":
        description: >-
          No such team in this organization (`unknown_team` for the team in the path), or no such team, person or key as
          the subject
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no person usr_9Pq3XkT6wRmZ in this organization
                type: not_found
                code: not_found
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage_team
    x-idempotency: required
/v1/policies/teams/{slug}/controls/{id}:
  delete:
    tags:
      - Policies
    operationId: clearTeamOperatorControl
    summary: >-
      Take an operator control on a team, or on a person or key in it or in a team under it, out of force (owners and
      admins; a team lead for a team they lead, only a control that lead set and never an override). It answers with the
      cleared control. It is audited (policy.control_cleared).
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[a-z0-9][a-z0-9-]{0,126}|team_[A-Za-z0-9]+)$
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The control's id
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OperatorControl
            example:
              id: ctl_2Hc6VsM8pLnB
              tenantId: ten_8Hq2LmP4xRtK
              kind: pause
              subjectLevel: person
              subject: usr_7Jm4RwX9cTqa
              reason: "Runaway script: pause until it is fixed"
              createdBy: usr_3Kd9TqW2bNxe
              createdAt: "2026-10-30T14:02:51.000Z"
              expiresAt: "2026-10-30T18:00:00.000Z"
      "403":
        description: >-
          The caller is not an owner, an admin or a team lead (`role_required`), the team is not one they lead
          (`outside_led_teams`), the control's subject is outside the team and the teams under it (`outside_team`), a
          lead tried to clear an override (`override_needs_admin`), or a lead tried to clear a control someone else set
          (`control_needs_admin`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: this person is outside team platform and the teams under it
                type: permission_error
                code: outside_team
      "404":
        description: No such team (`unknown_team`), or no such control in this organization
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no operator control ctl_4Wd7NbQ1zYcE in this organization
                type: not_found
                code: not_found
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.manage_team
    x-idempotency: optional
/v1/policies/test:
  post:
    tags:
      - Policies
    operationId: testPolicy
    summary: >-
      Would this person (or key) be allowed this model, in this team, with this agent, and by which rule? The same
      decision enforcement makes, plus warnings (e.g. a rule that blocks Claude Code's small background Haiku model).
      Testing for someone else needs owner or admin.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              as:
                type: string
                description: "An email, a user id or a key id; default: you"
              team:
                type: string
              agent:
                $ref: ../components/schemas.yaml#/AgentId
              model:
                type: string
                description: "Default: nexus/default"
              surface:
                type: string
                enum:
                  - chat
                  - anthropic_messages
                  - openai_responses
                  - decisions
          example:
            agent: claude
            model: claude-haiku-5-5
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas.yaml#/ModelDecision
                - type: object
                  properties:
                    as:
                      type: object
                    team:
                      type: string
                    agent:
                      $ref: ../components/schemas.yaml#/AgentId
                    allowedModels:
                      type: array
                      items:
                        type: string
                    warnings:
                      type: array
                      items:
                        type: string
            example:
              allowed: true
              requested: claude-haiku-5-5
              model: anthropic/claude-haiku-5.5
              providerModel: claude-haiku-5-5
              surface: anthropic_messages
              reason: allowed by "anthropic/claude-haiku-*" on the allow list of the agent claude policy
              rule:
                level: agent
                subject: claude
                list: allow
                pattern: anthropic/claude-haiku-*
              notes: []
              as:
                userId: usr_3Kd9TqW2bNxe
                email: ana@acme.com
                keyId: key_5Tn8WqR2xLmD
              team: platform
              agent: claude
              allowedModels:
                - anthropic/claude-opus-5.5
                - anthropic/claude-haiku-5.5
              warnings: []
      "400":
        description: >-
          A field has the wrong type or value: `agent` is not `claude`, `codex`, `antigravity` or `cursor`, `surface` is
          not one of its values, or `as`, `team` or `model` is not a string (`invalid_request`); or `agent` has no
          Gateway route (`route_unsupported`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "surface must be one of: chat, anthropic_messages, openai_responses, decisions"
                type: invalid_request_error
                code: invalid_request
      "403":
        description: >-
          `as` names someone else and the caller does not hold `policy.manage`: only owners and admins test the policy
          for others (`role_required`). A credential without `policy.read` (a service account or sandbox key) gets the
          same code; a scoped module key gets `module_key`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can test the policy for someone else
                type: permission_error
                code: role_required
      "404":
        description: >-
          `team` names no team in this organization (`unknown_team`), or `as` names no member or key in it
          (`not_found`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no member bruno@acme.com in this organization
                type: not_found
                code: not_found
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: policy.read
    x-idempotency: optional
    description: "Exempt: this POST only reads. It changes no state."
