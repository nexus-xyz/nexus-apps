/v1/auth/whoami:
  get:
    tags:
      - Auth
    operationId: whoami
    summary: >-
      Who the calling credential is, and nothing else: its kind, its organization's id, its person's id, an agent link's
      grant, and the email only for a person's own credential. Any valid credential may call it (`authenticated`): an
      agent link and an operator whatever their grant. No organization details, no other member and no role. A person's
      id is set for a person's own credential, for an agent link (the person it acts for) and for an operator (the
      operator); a service account, a module key and a sandbox have none. Not audited, as `GET /v1/tenants/me` is not;
      an operator's request is logged as `operator.request`.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Whoami
            examples:
              person:
                summary: A person's own API key or CLI token
                value:
                  kind: person
                  tenantId: ten_8Hq2LmP4xRtK
                  userId: usr_3Kd9TqW2bNxe
                  email: ana@acme.com
              agentLink:
                summary: An agent link that holds only models.use
                value:
                  kind: agent_link
                  tenantId: ten_8Hq2LmP4xRtK
                  userId: usr_3Kd9TqW2bNxe
                  grant:
                    - models.use
              serviceAccount:
                summary: A service account's key
                value:
                  kind: service_account
                  tenantId: ten_8Hq2LmP4xRtK
      "401":
        description: >-
          No credential (`missing_credential`), or one Gateway does not accept: unknown, expired or revoked
          (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: An operator grant that is unknown, expired, revoked or another person's (`operator_grant_invalid`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: authenticated
