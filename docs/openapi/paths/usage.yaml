        description: "Only owners and admins export the organization's calls (`role_required`): a member without `spend.export`"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can export spend calls (spend.export)
                type: permission_error
                code: role_required
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: spend.export
/v1/spend/calls/{id}:
  get:
    tags:
      - Usage and budgets
    operationId: getSpendCall
    summary: >-
      One of the organization's model calls, as its row in the files: what was reserved, what was charged and why it was
      refused (owners and admins). Another organization's call reads as missing: 404 `unknown_call`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The call's record id
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SpendCall
            example:
              id: spd_2Lw6Hy9RtB3c
              at: "2026-10-28T14:29:51.102Z"
              status: refused
              model: anthropic/claude-opus-5.5
              provider: null
              product: agents
              capability: null
              userId: usr_7Pq4XcV8mLza
              teamId: team_x7Ka2LmPq9Rd
              agentSessionId: ags_8Mx3Pd5VeQ1n
              chatSessionId: null
              inputTokens: 0
              outputTokens: 0
              costUsd: "0.000000"
              reservedUsd: null
              reason: "person limit: this call may cost up to $0.600000, and $0.140000 is left this month"
              overspendLevel: person
              overspendLimitUsd: "50.000000"
              overspendAmountUsd: "0.600000"
              overspendOverUsd: "0.460000"
              overspendPeriod: 2026-10
              fundedBy: null
      "403":
        description: "Only owners and admins read the organization's calls (`role_required`): a member without `spend.read_all`"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can read the organization's spend calls (spend.read_all)
                type: permission_error
                code: role_required
      "404":
        description: >-
          No call with this id in the caller's organization (`unknown_call`); another organization's call reads as
          missing
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no call spd_7Qm4Zr1XcV8b in this organization
                type: not_found
                code: unknown_call
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: spend.read_all
