    operationId: spend
    summary: >-
      Budget, spend and reservations, by product and capability, with recent calls. Owners and admins (`spend.read_all`)
      get the organization's figures. Everyone else gets their own calls and, in place of the organization's budget,
      spent and reserved, only what is left for them (`remainingUsd`): the least room of the organization, the caps on
      the team their call is charged to (`x-nexus-team`, else their default team) and their monthly limit, the figure
      the next 402 gives, with the `period` and `resetsAt` of the cap that binds it.
