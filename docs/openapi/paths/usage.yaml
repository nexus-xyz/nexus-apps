              budgetPeriod: month
              periodSpentUsd: 2210.85
              remainingUsd: 2785.75
              resetsAt: "2026-11-01T00:00:00.000Z"
              scope: org
              byProduct:
                - product: agents
                  calls: 4120
                  costUsd: 1874.12
                - product: robustness
                  capability: review
                  calls: 316
                  costUsd: 336.73
              recent:
                - id: spd_9fK2mQ7xLp4T
                  at: "2026-10-28T14:32:07.418Z"
                  status: settled
                  model: anthropic/claude-opus-5.5
                  provider: anthropic
                  product: agents
                  userId: usr_3Kd9TqW2bNxe
                  teamId: team_x7Ka2LmPq9Rd
                  promptTokens: 18240
                  completionTokens: 1312
                  costUsd: 0.3726
                  fundedBy: nexus_credit
                  inferenceGeo: us
                  keyId: key_6Tb3Rz9LmQ2x
                  keyKind: cli
              credits:
                purchasedUsd: "1000.000000"
                spentUsd: "412.584300"
                reservedUsd: "0.600000"
                remainingUsd: "586.815700"
                markupBps: 500
      "403":
        description: A member who names a team they are not in with `x-nexus-team` (`not_in_team`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: you are not in team platform; spend can only go to a team you belong to
                type: permission_error
                code: not_in_team
      "404":
        description: A member names, with `x-nexus-team`, a team that does not exist in the organization (`unknown_team`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
