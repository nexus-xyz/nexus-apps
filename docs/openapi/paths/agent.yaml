/v1/agent/ask:
  post:
    tags:
      - Your agent
    operationId: agentAsk
    summary: >-
      Ask your agent, the one `@nexus` is in Slack. `stream: true`, or `Accept: text/event-stream`, streams the answer
      as server-sent events: `started`, `model`, `text` (each `delta`), `step`, then `done` or `error`. Gateway forwards
      it to the agent API with your own token, after its own authentication and rate limit; only a person's credential
      or their agent link may call it. Off unless the Gateway turns the agent proxy on.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AgentAskRequest
    responses:
      "200":
        description: "The answer: whole as JSON, or streamed as server-sent events"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AgentApiBody
          text/event-stream:
            schema:
              type: string
              description: Events `started`, `model`, `text`, `step`, then `done` or `error`, each with a JSON `data` line
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: >-
          Error: Gateway's own (401, 403 `not_a_person`, 429, 502 `agents_api_unreachable`, 503 `not_configured`, 504
          `upstream_timeout`), or the agent API's, passed through
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas.yaml#/Error
                - $ref: ../components/schemas.yaml#/AgentApiError
    x-nexus-permission: models.use
    x-internal-stability: beta
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
