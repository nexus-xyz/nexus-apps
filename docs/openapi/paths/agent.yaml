# Path items. The root openapi.yaml references each one.
/v1/agent/approvals/rules:
  delete:
    tags:
      - Your agent
    operationId: agentRevokeRules
    summary: >-
      Revoke every "Always allow" rule. Gateway forwards it to the agent API with your own token, after its own
      authentication and rate limit; only a person's credential or their agent link may call it. Off unless the Gateway
      turns the agent proxy on.
    responses:
      "200":
        description: The agent API's answer, as it sent it
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AgentApiBody
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: >-
          Error: Gateway's own (401, 403 `not_a_person`, 429, 502 `agents_api_unreachable`, 503 `not_configured`, 504
          `upstream_timeout`), or the agent API's, passed through
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas.yaml#/Error
                - $ref: ../components/schemas.yaml#/AgentApiError
    x-nexus-permission: models.use
    x-internal-stability: beta
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    x-idempotency: optional
