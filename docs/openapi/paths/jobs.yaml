  patch:
    tags:
      - Routines and jobs
    operationId: updateRoutine
    summary: >-
      Pause (`state: paused`) or resume (`state: active`) a routine. A pause stops its schedule first, so no slot after
      it starts a job. A resume runs from the next slot after now and replays nothing. The owner does both. An owner or
      admin of the organization may pause someone else's routine, and may not resume it. Pausing twice is the same as
      once.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The routine's id (`rtn_…`), as POST /v1/routines answered it
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/UpdateRoutineRequest
          example:
            state: paused
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Routine
            example:
              id: rtn_3f1c2a9b8e7d4c6f9a0b1c2d3e4f5a6b
              title: Morning brief
              ownerId: usr_Q2x8LmPq9RdK
              teamId: team_x7Ka2LmPq9Rd
              executor: gateway
              trigger:
                kind: schedule
                at: "08:00"
                days:
                  - mon
                  - tue
                  - wed
                  - thu
                  - fri
                timezone: America/Costa_Rica
                catchUp: latest
              action:
                kind: brief
              proactivity:
                notify: always
                writes: never
              caps:
                maxRunsPerDay: 1
              reportTo: slack
              state: paused
              scheduleId: sch_8e7d4c6f9a0b1c2d3e4f5a6b3f1c2a9b
              delivery:
                available: false
                code: routine_brief_unavailable
                reason: >-
                  The morning brief is not available yet. A routine runs when its owner is not present, and the
                  credential such a run uses is not decided (Accounts, schedules-design.md open question 2). Until it
                  is, each slot's job ends without reading or sending anything.
              createdVia: cli
              version: 3
              createdAt: "2026-11-03T15:02:11.204Z"
              updatedAt: "2026-11-03T16:10:42.019Z"
              pausedReason: owner
      "400":
