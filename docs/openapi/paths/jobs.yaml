# Path items. The root openapi.yaml references each one.
/v1/jobs:
  post:
    tags:
      - Routines and jobs
    operationId: submitJob
    summary: >-
      Submit a job: the verb of a module to run, with its input. `module` is `<product>/<capability>`
      (`intelligence/wiki`), the path of the verb's own route, and the caller needs the action the module declares for
      the verb (`wiki.run` for Nexus Wiki's `run`), as on that route. Needs an `Idempotency-Key`: the job's id is
      derived from it, with the organization and the credential, so a resend names the job the first send made. For 24
      hours a resend replays the first answer (202, with `Idempotent-Replayed: true`), even after the job has moved on.
      After that it answers 200 with the job as it is now. A resend with a different `module`, `verb` or `input` is a
      422 `idempotency_key_reused`. `team` (or `x-nexus-team`) names the team the job's model calls go to; the caller's
      default team when absent. A job stays `accepted` until a worker takes it.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SubmitJobRequest
    responses:
      "200":
        description: The job a send with this key made, found after its replay window
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Job
            example:
              id: job_FiyTNoWq2Szr92Uk7rVGtldqjXCy_vWUgt81xwC4WpQ
              module: intelligence/wiki
              verb: run
              state: done
              teamId: team_x7Ka2LmPq9Rd
              createdAt: "2026-11-01T09:14:03.512Z"
              updatedAt: "2026-11-01T09:16:41.930Z"
              deadlineAt: "2026-11-01T10:14:03.512Z"
              startedAt: "2026-11-01T09:14:04.087Z"
              finishedAt: "2026-11-01T09:16:41.930Z"
      "202":
        description: "Accepted: the job is recorded"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Job
            example:
              id: job_FiyTNoWq2Szr92Uk7rVGtldqjXCy_vWUgt81xwC4WpQ
              module: intelligence/wiki
              verb: run
              state: accepted
              teamId: team_x7Ka2LmPq9Rd
              createdAt: "2026-11-01T09:14:03.512Z"
              updatedAt: "2026-11-01T09:14:03.512Z"
              deadlineAt: "2026-11-01T10:14:03.512Z"
      "400":
        description: >-
          No `Idempotency-Key`, or `module`, `verb`, `input` or `team` is not valid. `module` is not
          `<product>/<capability>` (`invalid_request`). A malformed `Idempotency-Key` is `invalid_idempotency_key`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: a job needs an Idempotency-Key header
                type: invalid_request_error
                code: invalid_request
      "401":
        description: No credential (`missing_credential`), or a credential Gateway does not accept (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: invalid API key
                type: authentication_error
                code: invalid_credential
      "403":
        description: >-
          The caller does not hold the action the module declares for the verb (`role_required`), or the team named is
          not the caller's (`not_in_team`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner can run Nexus Wiki (wiki.run)
                type: permission_error
                code: role_required
      "404":
        description: >-
          No registered module is `module`, or it does not declare `verb` (`not_found`). The team named does not exist
          in this organization (`unknown_team`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no capability intelligence/wikis is registered
                type: not_found
                code: not_found
      "409":
        description: >-
          The `Idempotency-Key`'s first request still runs (`idempotency_in_progress`) or was interrupted
          (`idempotency_interrupted`). The request does not run again.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: a request with this Idempotency-Key is still running; retry in a moment
                type: invalid_request_error
                code: idempotency_in_progress
      "422":
        description: >-
          The `Idempotency-Key` named a different job (`idempotency_key_reused`): a resend with another `module`, `verb`
          or `input`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: this Idempotency-Key named a different job; use a new key for a new job
                type: invalid_request_error
                code: idempotency_key_reused
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "502":
        description: >-
          No registered module is `module` and a module did not answer, so it may be that one (`module_unavailable`);
          try again.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "intelligence/wiki is not available: a module did not answer; try again"
                type: module_unavailable
                code: module_unavailable
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: products.use
    x-internal-stability: beta
    x-idempotency: required
/v1/jobs/{id}:
  get:
    tags:
      - Routines and jobs
    operationId: getJob
    summary: "A job's state: `accepted`, `running`, `done`, `failed` or `cancelled`."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The job's id (`job_…`), as POST /v1/jobs answered it
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Job
            example:
              id: job_FiyTNoWq2Szr92Uk7rVGtldqjXCy_vWUgt81xwC4WpQ
              module: intelligence/wiki
              verb: run
              state: running
              teamId: team_x7Ka2LmPq9Rd
              createdAt: "2026-11-01T09:14:03.512Z"
              updatedAt: "2026-11-01T09:14:04.087Z"
              deadlineAt: "2026-11-01T10:14:03.512Z"
              startedAt: "2026-11-01T09:14:04.087Z"
      "401":
        description: No credential (`missing_credential`), or a credential Gateway does not accept (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: invalid API key
                type: authentication_error
                code: invalid_credential
      "403":
        description: >-
          The key does not hold `products.use` (`role_required`: a service account, a sandbox, or an agent not granted
          it).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  this agent was not granted this (products.use): Run modules and read their reports; open and end agent
                  sessions
                type: permission_error
                code: role_required
      "404":
        description: >-
          No such job of yours (`not_found`): a job is its creator's and its organization's owners' and admins'. Another
          member's job, and another organization's, is as absent as a missing one.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no such job
                type: not_found
                code: not_found
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: products.use
    x-internal-stability: beta
/v1/jobs/{id}/cancel:
  post:
    tags:
      - Routines and jobs
    operationId: cancelJob
    summary: >-
      Cancel a job that no worker has taken (`accepted` becomes `cancelled`). A job in any other state comes back as it
      is: a running one is its backend's to stop, and a finished one is never left. Cancelling twice is the same as
      once.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The job's id (`job_…`), as POST /v1/jobs answered it
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Job
            example:
              id: job_8TsepcjuJheK6fnb-pPCjdEc0tm-BnRMRuA_HCHtsN4
              module: intelligence/wiki
              verb: run
              state: cancelled
              teamId: team_x7Ka2LmPq9Rd
              createdAt: "2026-11-02T08:30:12.204Z"
              updatedAt: "2026-11-02T08:30:19.641Z"
              deadlineAt: "2026-11-02T09:30:12.204Z"
              finishedAt: "2026-11-02T08:30:19.641Z"
      "400":
        description: A malformed `Idempotency-Key` (`invalid_idempotency_key`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: Idempotency-Key must be 1 to 255 printable ASCII characters
                type: invalid_request_error
                code: invalid_idempotency_key
      "401":
        description: No credential (`missing_credential`), or a credential Gateway does not accept (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: invalid API key
                type: authentication_error
                code: invalid_credential
      "403":
        description: >-
          The key does not hold `products.use` (`role_required`: a service account, a sandbox, or an agent not granted
          it).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  this agent was not granted this (products.use): Run modules and read their reports; open and end agent
                  sessions
                type: permission_error
                code: role_required
      "404":
        description: >-
          No such job of yours (`not_found`): a job is its creator's and its organization's owners' and admins'. Another
          member's job, and another organization's, is as absent as a missing one.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no such job
                type: not_found
                code: not_found
      "409":
        description: >-
          The `Idempotency-Key`'s first request still runs (`idempotency_in_progress`) or was interrupted
          (`idempotency_interrupted`). The request does not run again.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: a request with this Idempotency-Key is still running; retry in a moment
                type: invalid_request_error
                code: idempotency_in_progress
      "422":
        description: The `Idempotency-Key` was used for a different request (`idempotency_key_reused`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  this Idempotency-Key was used for a different request (POST
                  /v1/jobs/job_FiyTNoWq2Szr92Uk7rVGtldqjXCy_vWUgt81xwC4WpQ/cancel); use a new key for a new request
                type: invalid_request_error
                code: idempotency_key_reused
      "428":
