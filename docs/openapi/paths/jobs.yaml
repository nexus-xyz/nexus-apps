/v1/routines:
  post:
    tags:
      - Routines and jobs
    operationId: createRoutine
    summary: >-
      Create a routine for yourself: a `schedule` trigger and the `brief` action. It runs as you and no one else, reads
      and notifies only (`writes: never`), and reports to your Slack direct messages. Gateway records it and its Runtime
      schedule (`source: routine:<id>`), whose slots each start one job. The brief is not available yet:
      `delivery.available` is `false` with `routine_brief_unavailable`, and each slot's job ends without reading or
      sending anything. A person owns at most 50 routines in an organization. `team` (or `x-nexus-team`) names the team
      its model calls go to.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CreateRoutineRequest
          example:
            title: Morning brief
            trigger:
              kind: schedule
              at: "08:00"
              days:
                - mon
                - tue
                - wed
                - thu
                - fri
              timezone: America/Costa_Rica
            action:
              kind: brief
            caps:
              maxRunsPerDay: 1
    responses:
      "201":
        description: "Created: the routine and its schedule"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Routine
            example:
              id: rtn_3f1c2a9b8e7d4c6f9a0b1c2d3e4f5a6b
              title: Morning brief
              ownerId: usr_Q2x8LmPq9RdK
              teamId: team_x7Ka2LmPq9Rd
              executor: gateway
              trigger:
                kind: schedule
                at: "08:00"
                days:
                  - mon
                  - tue
                  - wed
                  - thu
                  - fri
                timezone: America/Costa_Rica
                catchUp: latest
              action:
                kind: brief
              proactivity:
                notify: always
                writes: never
              caps:
                maxRunsPerDay: 1
              reportTo: slack
              state: active
              scheduleId: sch_8e7d4c6f9a0b1c2d3e4f5a6b3f1c2a9b
              nextRunAt: "2026-11-04T14:00:00.000Z"
              delivery:
                available: false
                code: routine_brief_unavailable
                reason: >-
                  The morning brief is not available yet. A routine runs when its owner is not present, and the
                  credential such a run uses is not decided (Accounts, schedules-design.md open question 2). Until it
                  is, each slot's job ends without reading or sending anything.
              createdVia: cli
              version: 2
              createdAt: "2026-11-03T15:02:11.204Z"
              updatedAt: "2026-11-03T15:02:11.388Z"
      "400":
        description: A body that is not a routine, or a malformed `Idempotency-Key`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "a routine is { title?, trigger, action, proactivity?, caps?, reportTo? }: missing field `trigger`"
                type: invalid_request_error
      "401":
        description: No credential (`missing_credential`), or a credential Gateway does not accept (`invalid_credential`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: invalid API key
                type: authentication_error
                code: invalid_credential
      "403":
        description: >-
          The key does not hold `routines.use` (`role_required`), or it is not a person's own key, Nexus UI or an agent
          link its person granted `routines.use` (`routine_agent_refused`). A module's scoped key, a service account and
          a sandbox are refused the same way. An agent link's routine writes nothing: any `proactivity.writes` but
          `never` is `routine_agent_writes_refused`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  only a person manages routines, with their own key or Nexus UI; an agent creates one after the
                  person's confirm card, which is not built yet
                type: permission_error
                code: routine_agent_refused
      "409":
        description: >-
          You own 50 routines in this organization (`routine_limit`), or the `Idempotency-Key`'s first request still
          runs.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: you have 50 routines in this organization, the most one person has; delete one first
                type: invalid_request_error
                code: routine_limit
      "422":
        description: >-
          A routine Gateway does not build yet or cannot run (`invalid_routine`): a trigger other than `schedule`, both
          or neither of `everySeconds` and `at`, an interval under 600 s, an unknown time zone or day, an action other
          than `brief`, a `reportTo` other than `slack`. `writes: ask_first` is `routine_writes_unavailable`: it waits
          for Policy's approval records (PO1).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: trigger.everySeconds is 600 to 604800
                type: invalid_request_error
                code: invalid_routine
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          Routines are off on this Gateway (`routines_disabled`): they need a server setting and a server setting. The
          route still mounts.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "routines are off on this Gateway: they need a server setting and a server setting"
                type: not_configured
                code: routines_disabled
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: routines.use
    x-internal-stability: beta
    x-idempotency: required
