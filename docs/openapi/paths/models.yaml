          never pays a pass-through call); or the team in `x-nexus-team` is not the caller's (`not_in_team`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderError
      "404":
        description: "`model_not_found`: not in the model catalog; or the team in `x-nexus-team` does not exist (`unknown_team`)."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderError
      "408":
        $ref: ../components/common.yaml#/responses/ProviderRequestTimeout
      "409":
        $ref: ../components/common.yaml#/responses/ProviderIdempotencyConflict
      "413":
        $ref: ../components/common.yaml#/responses/ProviderPayloadTooLarge
      "422":
        $ref: ../components/common.yaml#/responses/ProviderIdempotencyKeyReused
      "426":
        $ref: ../components/common.yaml#/responses/ProviderUpgradeRequired
      "429":
        $ref: ../components/common.yaml#/responses/ProviderRateLimited
