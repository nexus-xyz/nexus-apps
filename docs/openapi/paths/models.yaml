# Path items. The root openapi.yaml references each one.
/v1/anthropic/v1/messages:
  post:
    tags:
      - Models
    operationId: anthropicMessages
    summary: "Anthropic Messages API (Claude Code: ANTHROPIC_BASE_URL=<core>/v1/anthropic). Metered."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: The provider's own request body (https://docs.anthropic.com/en/api/messages).
            additionalProperties: true
    responses:
      "200":
        description: "The provider's response: JSON, or server-sent events when the request streams."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/event-stream:
            schema:
              type: string
      "400":
        $ref: ../components/common.yaml#/responses/ProviderBadRequest
      "401":
        $ref: ../components/common.yaml#/responses/ProviderUnauthorized
      "402":
        description: >-
          The call's maximum cost is more than the budget left (`budget_exceeded`), or the organization has an unpaid
          Nexus invoice past its grace (`payment_past_due`). A `budget_exceeded` refusal carries `notified: true` in its
          details once Gateway has told the refused person and the organization's owners and admins. Its `error.nexus`
          is a BudgetRefusal: each money figure with its exact decimal twin.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderError
      "403":
        description: >-
          `model_not_allowed`: the model is refused by a model policy (the message names the level and rule;
          `error.nexus` carries them), or the organization has no provider key (`provider_key_required`: Nexus credit
          never pays a pass-through call); or the team in `x-nexus-team` is not the caller's (`not_in_team`).
          `provider_disabled`: the organization has turned off every provider that serves the model.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderError
      "404":
        description: "`model_not_found`: not in the model catalog; or the team in `x-nexus-team` does not exist (`unknown_team`)."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderError
      "408":
        $ref: ../components/common.yaml#/responses/ProviderRequestTimeout
      "409":
        $ref: ../components/common.yaml#/responses/ProviderIdempotencyConflict
      "413":
        $ref: ../components/common.yaml#/responses/ProviderPayloadTooLarge
      "422":
        $ref: ../components/common.yaml#/responses/ProviderIdempotencyKeyReused
      "426":
        $ref: ../components/common.yaml#/responses/ProviderUpgradeRequired
      "429":
        $ref: ../components/common.yaml#/responses/ProviderRateLimited
      "502":
        $ref: ../components/common.yaml#/responses/ProviderUpstreamFailed
      "503":
        $ref: ../components/common.yaml#/responses/ProviderCallUnavailable
      "504":
        $ref: ../components/common.yaml#/responses/ProviderUpstreamTimeout
      default:
        description: Error, in the provider's error shape.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderError
    parameters:
      - name: x-nexus-team
        in: header
        required: false
        description: >-
          The team (slug) this call's spend goes to; you must be in it (`nexus claude --team`). Default: your default
          team.
        schema:
          type: string
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    x-nexus-permission: agents.use
    x-idempotency: optional
    description: "Exempt: a provider-compatible route. Provider SDKs do not send the header. A key is honored when sent."
