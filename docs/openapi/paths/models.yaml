/v1/providers:
  get:
    tags:
      - Models
    operationId: listProviders
    summary: >-
      The providers the Gateway calls, from the catalog: each one's id, name, country, whether an organization may bring
      its own key (`byok`), whether the Gateway calls it (`status`), how many listed models it hosts, its `rates` (what
      a model on it costs beyond its input and output prices), the host of its API (`apiHost`) and what the Gateway
      calls it for (`serving`). Send the key as `Authorization: Bearer <key>` or `x-api-key: <key>`. **With a key**:
      each BYOK provider also carries `key`, the state of the organization's own key: `none` (none stored, or disabled),
      `valid` or `rejected`. It never returns the key or any part of it; `listProviderKeys` shows the last four
      characters. **Without a key**: the same list for everyone, with no `key` field; limited per address with the
      public model catalog, and cacheable (`Cache-Control: public`, `Vary: Authorization, X-Api-Key,
      X-Nexus-Ui-Secret`). A wrong key is a 401, as on every route.
    security:
      - bearer: []
      - apiKeyHeader: []
      - {}
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - object
                - data
              properties:
                object:
                  const: list
                data:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/Provider
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "403":
        $ref: ../components/common.yaml#/responses/Forbidden
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
    x-nexus-key-optional: true
