                        description: The person who invited them, when a person did.
                      createdAt:
                        type: string
                        format: date-time
                      expiresAt:
                        type: string
                        format: date-time
                      sentAt:
                        type:
                          - string
                          - "null"
                        description: The last send.
                        format: date-time
                      expired:
                        type: boolean
                        description: "Past expiresAt: its link no longer works; resend it."
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
