/v1/orgs/invitations/accept:
  post:
    tags:
      - Organization
    operationId: acceptInvitation
    summary: >-
      Accept an invitation: you join its organization with its role. Name the `token` in its link or the `id` from `GET
      /v1/orgs/invitations/mine`: exactly one. A body with neither or both is 400 `invalid_request`. For a token, Nexus
      UI's server must vouch that you verified the invited email (403 `email_mismatch`). For an id, one of your sign-ins
      must have verified the invited email; any other id is a 404. A used, revoked or replaced link is a 404; an expired
      invitation is 409 `invitation_expired`. Only once the Gateway holds organizations; before that, 409
      `use_nexus_ui`. Audited as member.joined with `via: invitation`.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: Exactly one of `token` and `id`.
            oneOf:
              - type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    description: The token from the invitation's link.
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    description: The invitation's id, from `GET /v1/orgs/invitations/mine`.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSummary
            example:
              id: ten_8Hq2LmP4xRtK
              name: Acme
              slug: acme
              kind: company
              role: member
              current: false
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          `cutover_paused`: only while the operator pauses sign-in for the auth cutover; nothing changed. Retry after
          `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: authenticated
    x-idempotency: required
/v1/orgs/invitations/mine:
  get:
    tags:
      - Organization
    operationId: listMyInvitations
    summary: >-
      Your own pending invitations, across organizations, oldest first: those sent to an email one of your sign-ins
      verified. An unverified email matches none. Expired invitations and organizations you are already in are left out.
      Accept one with `POST /v1/orgs/invitations/accept` and its `id`. Only once the Gateway holds organizations; before
      that, 409 `use_nexus_ui`. A person only (403 `person_required`).
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - invitations
              properties:
                invitations:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - email
                      - orgName
                      - role
                      - expiresAt
                    properties:
                      id:
                        type: string
                        description: Accept it with this id.
                      email:
                        type: string
                        description: Your email it was sent to.
                      orgName:
                        type: string
                      orgSlug:
                        type:
                          - string
                          - "null"
                      role:
                        type: string
                        enum:
                          - member
                          - admin
                      invitedBy:
                        type:
                          - string
                          - "null"
