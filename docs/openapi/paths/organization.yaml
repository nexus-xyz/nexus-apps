# Path items. The root openapi.yaml references each one.
/v1/keys/providers:
  get:
    tags:
      - Organization
    operationId: listProviderKeys
    summary: List the tenant's own provider keys (last four characters only).
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                providers:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ProviderKey
                  description: The organization's own keys.
                scopedKeys:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/ProviderKey
                  description: >-
                    The keys the organization's teams and people hold. An owner or admin reads every one; anyone else
                    reads the teams' keys and their own. Absent when there is none. A call takes the caller's own key,
                    then its team's, then each parent team's, then the organization's: the first one that is not
                    disabled.
            example:
              providers:
                - provider: anthropic
                  last4: x7Qa
                  createdAt: "2026-10-28T09:15:00.000Z"
                  state: valid
                  checkedAt: "2026-10-28T09:15:00.000Z"
                  lastUsedOn: "2026-10-30"
              scopedKeys:
                - provider: openai
                  scope: team
                  scopeId: team_x7Ka2LmPq9Rd
                  last4: c2Vn
                  createdAt: "2026-10-29T11:00:00.000Z"
                  state: valid
                  checkedAt: "2026-10-29T11:00:00.000Z"
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
  post:
    tags:
      - Organization
    operationId: addProviderKey
    summary: Store a provider key (BYOK), encrypted at rest. Used for this tenant's calls only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - provider
              - key
            properties:
              provider:
                type: string
                enum:
                  - anthropic
                  - openai
              key:
                type: string
              team:
                type: string
                description: "A team's key: the team's slug or id. Leave out `team` and `user` for the organization's own key."
              user:
                type: string
                description: >-
                  A person's key: `me` or a member's id. Name a team or a user, not both: both are a 400, and one the
                  organization lacks is a 404.
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderKey
            example:
              provider: anthropic
              last4: x7Qa
              createdAt: "2026-10-28T09:15:00.000Z"
              state: valid
              checkedAt: "2026-10-28T09:15:00.000Z"
      "400":
        description: >-
          Not valid: a provider not in the list (`provider_retired` for a retired one), a key not 8 to 512 characters
          once surrounding whitespace is trimmed, or both `team` and `user`. `provider_key_invalid_character`: the
          trimmed key holds a character outside visible ASCII, such as a space, a line break, a terminal's paste marker
          or an invisible mark, so it is never sent or stored. A NUL is refused before that as `nul_in_string`.
          `provider_key_rejected`: the provider refused the key when it was checked, and nothing is stored.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: anthropic rejected this key, so nothing was stored; check the key and add it again
                type: invalid_request_error
                code: provider_key_rejected
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: provider_keys.manage
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
/v1/keys/providers/{provider}:
  get:
    tags:
      - Organization
    operationId: getProviderKey
    summary: >-
      One provider key, in any state, with its versions: who added each, when, and its last four characters, never the
      value. 404 `provider_key_not_found` when none was ever stored.
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z]+$
        description: The key's provider (`anthropic`, `openai`)
      - name: team
        in: query
        required: false
        schema:
          type: string
        description: "A team's key: the team's slug or id. Leave out `team` and `user` for the organization's own key."
      - name: user
        in: query
        required: false
        schema:
          type: string
        description: >-
          A person's key: `me` or a member's id. Another person's key is an owner's or admin's to read: anyone else gets
          a 403.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderKey
            example:
              provider: anthropic
              last4: m4Rt
              createdAt: "2026-10-28T09:15:00.000Z"
              state: valid
              checkedAt: "2026-10-30T14:00:00.000Z"
              lastUsedOn: "2026-10-31"
              versions:
                - version: 1
                  last4: x7Qa
                  addedAt: "2026-10-28T09:15:00.000Z"
                  addedBy: usr_3Kd9TqW2bNxe
                - version: 2
                  last4: m4Rt
                  addedAt: "2026-10-30T14:00:00.000Z"
                  addedBy: usr_3Kd9TqW2bNxe
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
/v1/keys/providers/{provider}/disable:
  post:
    tags:
      - Organization
    operationId: disableProviderKey
    summary: >-
      Disable the stored provider key: it stays sealed, and no call opens it until it is enabled. Disabling a disabled
      key answers `changed: false`. 404 `provider_key_not_found` when none is stored. With `dryRun: true`, nothing
      changes. Audited as `provider_key.disabled`.
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z]+$
        description: The key's provider (`anthropic`, `openai`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              dryRun:
                type: boolean
                default: false
                description: Check and change nothing.
              team:
                type: string
                description: "A team's key: the team's slug or id. Leave out `team` and `user` for the organization's own key."
              user:
                type: string
                description: >-
                  A person's key: `me` or a member's id. Name a team or a user, not both: both are a 400, and one the
                  organization lacks is a 404.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderKeyChange
            example:
              dryRun: false
              changed: true
              providerKey:
                provider: anthropic
                last4: m4Rt
                createdAt: "2026-10-28T09:15:00.000Z"
                state: disabled
                checkedAt: "2026-10-30T14:00:00.000Z"
                lastUsedOn: "2026-10-30"
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: provider_keys.manage
    x-idempotency: required
/v1/keys/providers/{provider}/enable:
  post:
    tags:
      - Organization
    operationId: enableProviderKey
    summary: >-
      Enable a disabled provider key, or check a rejected one again, after checking it against its provider: its state
      is what the provider answers. 400 `provider_key_rejected` when the provider still refuses it, and it stays as it
      was. 400 `provider_key_invalid_character` when the stored key holds a character outside visible ASCII: it is not
      sent, and only a replacement mends it. Enabling a key that is neither disabled nor rejected answers `changed:
      false`. 409 `provider_key_changed` when the key was replaced while it was checked. With `dryRun: true`, the key is
      checked and nothing changes. Audited as `provider_key.enabled`.
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z]+$
        description: The key's provider (`anthropic`, `openai`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              dryRun:
                type: boolean
                default: false
                description: Check and change nothing.
              team:
                type: string
                description: "A team's key: the team's slug or id. Leave out `team` and `user` for the organization's own key."
              user:
                type: string
                description: >-
                  A person's key: `me` or a member's id. Name a team or a user, not both: both are a 400, and one the
                  organization lacks is a 404.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderKeyChange
            example:
              dryRun: false
              changed: true
              providerKey:
                provider: anthropic
                last4: m4Rt
                createdAt: "2026-10-28T09:15:00.000Z"
                state: valid
                checkedAt: "2026-10-31T10:00:00.000Z"
                lastUsedOn: "2026-10-30"
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: provider_keys.manage
    x-idempotency: required
/v1/keys/providers/{provider}/remove:
  post:
    tags:
      - Organization
    operationId: removeProviderKey
    summary: >-
      Remove the stored provider key: its sealed value is deleted, its state is `removed`, and its versions stay. 404
      `provider_key_not_found` when none is stored. With `dryRun: true`, nothing changes. Audited as
      `provider_key.removed`.
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z]+$
        description: The key's provider (`anthropic`, `openai`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              dryRun:
                type: boolean
                default: false
                description: Check and change nothing.
              team:
                type: string
                description: "A team's key: the team's slug or id. Leave out `team` and `user` for the organization's own key."
              user:
                type: string
                description: >-
                  A person's key: `me` or a member's id. Name a team or a user, not both: both are a 400, and one the
                  organization lacks is a 404.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderKeyChange
            example:
              dryRun: false
              changed: true
              providerKey:
                provider: anthropic
                last4: m4Rt
                createdAt: "2026-10-28T09:15:00.000Z"
                state: removed
                checkedAt: "2026-10-31T10:00:00.000Z"
                lastUsedOn: "2026-10-31"
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: provider_keys.manage
    x-idempotency: required
/v1/keys/providers/{provider}/replace:
  post:
    tags:
      - Organization
    operationId: replaceProviderKey
    summary: >-
      Replace the stored provider key with `key`, checked against its provider first, as its next version. A disabled
      key stays disabled. 404 `provider_key_not_found` when none is stored, before the key is sent anywhere; 400
      `provider_key_invalid_character` when the trimmed key holds a character outside visible ASCII, and nothing is
      sent; 400 `provider_key_rejected` when the provider refuses it, and the stored key stays. With `dryRun: true`, the
      key is checked and nothing is stored. Audited as `provider_key.replaced`.
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z]+$
        description: The key's provider (`anthropic`, `openai`)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - key
            properties:
              key:
                type: string
              dryRun:
                type: boolean
                default: false
                description: Check and change nothing.
              team:
                type: string
                description: "A team's key: the team's slug or id. Leave out `team` and `user` for the organization's own key."
              user:
                type: string
                description: >-
                  A person's key: `me` or a member's id. Name a team or a user, not both: both are a 400, and one the
                  organization lacks is a 404.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProviderKeyChange
            example:
              dryRun: false
              changed: true
              providerKey:
                provider: anthropic
                last4: m4Rt
                createdAt: "2026-10-28T09:15:00.000Z"
                state: valid
                checkedAt: "2026-10-30T14:00:00.000Z"
                lastUsedOn: "2026-10-30"
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: provider_keys.manage
    x-idempotency: required
/v1/orgs:
  get:
    tags:
      - Organization
    operationId: listOrgs
    summary: >-
      Your organizations: your personal organization first, then each company organization, with your role in each and
      which one this request is in.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgList
            example:
              orgs:
                - id: ten_Pv3nW7kQ2sYb
                  name: Personal
                  kind: personal
                  role: owner
                  current: false
                - id: ten_8Hq2LmP4xRtK
                  name: Acme
                  slug: acme
                  clerkOrgId: org_2pXk7RmQ9wLsT4vN8bYc3dFh1aZ
                  kind: company
                  role: owner
                  current: true
                  imageUrl: https://img.clerk.com/EXAMPLEacmeLogo
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
  post:
    tags:
      - Organization
    operationId: createOrg
    summary: >-
      Create a company organization that Nexus Gateway alone holds. You become its owner. Without a slug, the first free
      one made from the name is used. Only once the Gateway holds organizations; before that, 409 `use_nexus_ui`.
      Audited as org.created and member.joined.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                description: 1 to 120 characters after trimming
              slug:
                type: string
                pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                description: A lowercase DNS label that is not a Nexus UI page (`settings`, `invite`, ...)
          example:
            name: Acme
            slug: acme
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSummary
            example:
              id: ten_8Hq2LmP4xRtK
              name: Acme
              slug: acme
              kind: company
              role: owner
              current: false
      "400":
        $ref: ../components/common.yaml#/responses/BadRequest
      "409":
        description: >-
          Another company organization has the slug (`slug_taken`), or the Gateway does not hold organizations yet
          (`use_nexus_ui`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: another organization has this slug
                type: invalid_request_error
                code: slug_taken
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          `cutover_paused`: only while the operator pauses sign-in for the auth cutover; nothing changed. Retry after
          `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.create
    x-idempotency: required
/v1/orgs/budget:
  post:
    tags:
      - Organization
    operationId: setBudget
    summary: >-
      Set the organization's budget in USD, a cap per UTC day, ISO week or calendar month (owners and admins); never
      below what the period spent and what is reserved.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              budgetUsd:
                type:
                  - number
                  - string
                description: >-
                  The organization's budget per period in US dollars: a JSON number (deprecated) or a decimal string
                  with at most 6 decimals (`"12.245"`), read exactly. Send `budgetUsdDecimal` instead to send only a
                  string.
              budgetUsdDecimal:
                type: string
                pattern: ^[0-9]+(\.[0-9]{1,6})?$
                examples:
                  - "12.245"
                description: >-
                  The organization's budget per period as a decimal string in US dollars, at most 6 decimals, never
                  below 0; read exactly into micro-dollars, never through a float. With `budgetUsd` too, both must name
                  the same amount (400 `amount_mismatch`).
              period:
                type: string
                enum:
                  - day
                  - week
                  - month
                description: The cap's period. Absent keeps the current one, a month unless set
              dryRun:
                type: boolean
                description: >-
                  Make the same checks and write nothing; the answer is { dryRun, before, after }, each { budgetUsd,
                  budgetUsdDecimal, period }
            anyOf:
              - required:
                  - budgetUsd
              - required:
                  - budgetUsdDecimal
          example:
            budgetUsdDecimal: "5000.00"
            period: month
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              description: "The budget after the change; with `dryRun: true`, `{ dryRun, before, after }`, each a budget."
              oneOf:
                - type: object
                  properties:
                    budgetUsd:
                      type: number
                      deprecated: true
                      description: "Deprecated: read `budgetUsdDecimal`, the exact decimal string (root rule 9)."
                    budgetUsdDecimal:
                      type: string
                      description: >-
                        `budgetUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                        micro-dollars. Prefer it to `budgetUsd`.
                    period:
                      type: string
                      enum:
                        - day
                        - week
                        - month
                  required:
                    - budgetUsd
                    - period
                - type: object
                  properties:
                    dryRun:
                      type: boolean
                    before:
                      type: object
                      properties:
                        budgetUsd:
                          type: number
                          deprecated: true
                          description: "Deprecated: read `budgetUsdDecimal`, the exact decimal string (root rule 9)."
                        budgetUsdDecimal:
                          type: string
                          description: >-
                            `budgetUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from
                            the micro-dollars. Prefer it to `budgetUsd`.
                        period:
                          type: string
                          enum:
                            - day
                            - week
                            - month
                      required:
                        - budgetUsd
                        - period
                    after:
                      type: object
                      properties:
                        budgetUsd:
                          type: number
                          deprecated: true
                          description: "Deprecated: read `budgetUsdDecimal`, the exact decimal string (root rule 9)."
                        budgetUsdDecimal:
                          type: string
                          description: >-
                            `budgetUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from
                            the micro-dollars. Prefer it to `budgetUsd`.
                        period:
                          type: string
                          enum:
                            - day
                            - week
                            - month
                      required:
                        - budgetUsd
                        - period
                  required:
                    - dryRun
                    - before
                    - after
            example:
              budgetUsd: 5000
              budgetUsdDecimal: "5000.000000"
              period: month
      "400":
        description: >-
          `budgetUsd` and `budgetUsdDecimal` both missing, `dryRun` not true or false (`invalid_request`), a decimal
          string with more than 6 decimals (`too_many_decimals`), an amount that is not one or is below 0
          (`invalid_amount`), or a number and its `Decimal` twin that name different amounts (`amount_mismatch`), or a
          period other than day, week or month (`invalid_period`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: period must be day, week or month
                type: invalid_request_error
                code: invalid_period
      "403":
        description: "Only owners and admins set the organization's budget (`role_required`): a member without `budgets.manage`"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: only the org's owner or admins can set the budget (budgets.manage)
                type: permission_error
                code: role_required
      "409":
        description: The new budget is below what the period has already spent and reserved (`conflict`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the budget may not drop below what is spent and reserved ($2214.250000)
                type: invalid_request_error
                code: conflict
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: budgets.manage
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
/v1/orgs/directory/export.csv:
  get:
    tags:
      - Organization
    operationId: exportDirectoryCsv
    summary: >-
      Every person and team of the organization with its name: the one file that maps ids to names, as CSV (owners and
      admins). The people are its members and the people its calls and kept agent sessions name (former members too),
      then its teams and the teams those name, each by id. Names are read when the file is asked for. An erased person
      reads `erased: true` with no name; a person with no record reads with no name, and a deleted team with its id
      alone. It takes no parameter and has no row limit, range or cursor. The data files name people and teams by id
      only. Each request is an audit event (`observability.directory_exported`) with the file's manifest, never its
      rows, and counts toward the 60 exports an hour.
    responses:
      "200":
        description: "CSV with a header row: one column per field of `DirectoryEntry`, in its order."
        headers:
          x-nexus-export-id:
            $ref: ../components/common.yaml#/headers/x-nexus-export-id
        content:
          text/csv:
            schema:
              type: string
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: spend.export
/v1/orgs/directory/export.jsonl:
  get:
    tags:
      - Organization
    operationId: exportDirectoryJsonl
    summary: >-
      Every person and team of the organization with its name: the one file that maps ids to names, as JSON Lines
      (owners and admins). The people are its members and the people its calls and kept agent sessions name (former
      members too), then its teams and the teams those name, each by id. Names are read when the file is asked for. An
      erased person reads `erased: true` with no name; a person with no record reads with no name, and a deleted team
      with its id alone. It takes no parameter and has no row limit, range or cursor. The data files name people and
      teams by id only. Each request is an audit event (`observability.directory_exported`) with the file's manifest,
      never its rows, and counts toward the 60 exports an hour.
    responses:
      "200":
        description: "JSON Lines: one `DirectoryEntry` per line, then one line `{\"manifest\": ExportManifest}`."
        headers:
          x-nexus-export-id:
            $ref: ../components/common.yaml#/headers/x-nexus-export-id
        content:
          application/jsonl:
            schema:
              type: string
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: spend.export
/v1/orgs/domain-suggestions:
  get:
    tags:
      - Organization
    operationId: listDomainSuggestions
    summary: >-
      The company organizations you may join by domain, with the domain of each. A suggestion needs your own Google
      sign-in: its `hd` is a domain a Nexus operator assigned to the organization, and Google verified your email on
      that domain. An email-code sign-in, an unverified email or the email on your account never counts. An organization
      you belong to, or were removed from, is left out. Only once Core holds organizations; before that, 409
      `use_nexus_ui`.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/DomainSuggestionList
            example:
              suggestions:
                - domain: acme.com
                  org:
                    id: ten_8Hq2LmP4xRtK
                    name: Acme
                    slug: acme
                    kind: company
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: authenticated
/v1/orgs/domain-suggestions/join:
  post:
    tags:
      - Organization
    operationId: joinByDomain
    summary: >-
      Join an organization of listDomainSuggestions: you become a member, never an admin. 404 `no_domain_match` when
      none of your Google sign-ins is on a domain of that organization; the answer does not say whether it exists. 409
      `member_removed` while an admin's removal of you can still be undone. A member already keeps their role. Only once
      Core holds organizations; before that, 409 `use_nexus_ui`. Audited as `member.joined` with `via: domain`.
