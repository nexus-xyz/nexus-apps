/v1/orgs/logo:
  post:
    tags:
      - Organization
    operationId: setOrgLogo
    summary: >-
      Upload your company organization's logo (owners and admins): the body is the image's bytes, a PNG, JPEG or WebP of
      1 MB at most, typed by its first bytes. The Gateway stores it in Nexus's bucket and sets the organization's
      imageUrl to it. Only once the Gateway holds organizations; before that, 409 `use_nexus_ui`. Audited as
      org.settings_changed.
    requestBody:
      required: true
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSummary
            example:
              id: ten_8Hq2LmP4xRtK
              name: Acme Inc
              slug: acme-inc
              kind: company
              role: owner
              current: true
              imageUrl: https://storage.googleapis.com/nexus-org-logos/org-logos/ten_8Hq2LmP4xRtK/3f2a9c1d8e7b6a50
      "400":
        $ref: ../components/common.yaml#/responses/BadRequest
      "409":
        description: >-
          A personal organization has no logo to change (`personal_org`), or the Gateway does not hold organizations yet
          (`use_nexus_ui`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the Gateway does not hold organizations yet; change the logo in Nexus UI
                type: invalid_request_error
                code: use_nexus_ui
      "413":
        description: The image is over 1 MB (`request_too_large`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the logo must be 1 MB or smaller
                type: invalid_request_error
                code: request_too_large
      "415":
        description: The image is not a PNG, JPEG or WebP by its first bytes (`unsupported_logo_type`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the logo must be a PNG, JPEG or WebP image
                type: invalid_request_error
                code: unsupported_logo_type
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "502":
        description: The bucket refused the image (`logo_storage_failed`); nothing changed
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the logo could not be stored; try again
                type: api_error
                code: logo_storage_failed
      "503":
        description: >-
          `logo_storage_unconfigured`: the Gateway has no bucket for logos. `cutover_paused`: only while the operator
          pauses sign-in for the auth cutover; retry after `Retry-After` seconds. Nothing changed.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.settings
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
/v1/orgs/members:
  get:
    tags:
      - Organization
    operationId: listMembers
    summary: >-
      The organization's members and roles; spend per person for owners and admins (and each person's own). `limit` and
      `cursor` page it.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/Member
                nextCursor:
                  type: string
                  description: The next page's cursor, while more items follow. Only when limit or cursor was sent.
            example:
              members:
                - userId: usr_3Kd9TqW2bNxe
                  email: ana@acme.com
                  name: Ana Souza
                  role: owner
                  joinedAt: "2026-10-01T09:00:00.000Z"
                  spentUsd: 42.18
                  calls: 1310
                - userId: usr_7Lm2RxV9cQta
                  email: bruno@acme.com
                  name: Bruno Lima
                  role: admin
                  joinedAt: "2026-10-03T15:20:00.000Z"
                  spentUsd: 7.5
                  calls: 214
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.read
    parameters:
      - name: limit
        in: query
        required: false
        description: Items per page, 1 to 500 (default 100). Without limit or cursor the answer holds the whole list.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: cursor
        in: query
        required: false
        description: nextCursor from the previous page. A cursor whose item left the list answers 400 `invalid_cursor`.
        schema:
          type: string
/v1/orgs/members/removed:
  get:
    tags:
      - Organization
    operationId: listRemovedMembers
    summary: Removed members (owners and admins), newest removal first, each with the end of its 30-day recovery window.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RemovedMemberList
            example:
              members:
                - userId: usr_9Wc4Hn2Tq7Lp
                  email: eva@acme.com
                  name: Eva Costa
                  role: member
                  removedAt: "2026-10-29T16:00:00.000Z"
                  removedBy: usr_3Kd9TqW2bNxe
                  recoverableUntil: "2026-11-28T16:00:00.000Z"
                  recoverable: true
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.manage
/v1/orgs/members/{userId}:
  delete:
    tags:
      - Organization
    operationId: removeMember
    summary: >-
      Remove a member (owners and admins). The membership is flagged, not deleted, so an owner or admin can recover them
      for 30 days; their tokens and keys are revoked at once. The owner must transfer ownership first.
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              removed: true
      "404":
        description: No such member (`not_found`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no such member
                type: not_found
                code: not_found
      "409":
        description: >-
          They are the owner (`owner_role`): transfer ownership first. Or a token removes its own person
          (`self_removal`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: the owner cannot be removed; transfer ownership first
                type: invalid_request_error
                code: owner_role
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "502":
        description: >-
          A token's removal: the identity provider did not take them out of its organization (`clerk_unavailable`);
          nothing changed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "Clerk did not take them out of the organization: service unavailable"
                type: clerk_unavailable
                code: clerk_unavailable
      "503":
        description: >-
          A token's removal: the organization signs in with the sign-in provider and this Gateway has no secret key for
          it (`not_configured`); nothing changed. Also `cutover_paused`, only while the operator pauses sign-in for the
          auth cutover; nothing changed. Retry after `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait on `cutover_paused`: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  Nexus Gateway has no CLERK_SECRET_KEY, so it cannot take them out of the Clerk organization; remove
                  them in Nexus UI (Members)
                type: not_configured
                code: not_configured
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.manage
    x-idempotency: optional
/v1/orgs/members/{userId}/holders:
  get:
    tags:
      - Organization
    operationId: listMemberKeyHolders
    summary: A member's trusted and revoked holders, with public keys and approvals. Clients remember revocations.
    description: >-
      A member's device that holds the team key reads this to hand it over. Trusted and revoked holders are listed.
      Remember revocations and verify each trusted holder's approval chain from the member's pinned root. Seal a copy
      only to a trusted, unrevoked holder with `hasCurrentTeamKey` false. With no current epoch, every holder has it
      false.
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TeamKeyHolderList
      "403":
        description: Not a person (`person_required`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not a member of this organization (`member_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.read
/v1/orgs/members/{userId}/recover:
  post:
    tags:
      - Organization
    operationId: recoverMember
    summary: >-
      Recover a removed member inside the 30-day window (owners and admins): their role, teams, default team and person
      spend limit come back; their tokens and keys do not. In an org that signs in with the identity provider, Gateway
      adds them back to the identity provider's organization. dryRun checks and changes nothing. A 409 removal_final
      after the window; 503 `not_configured` without the identity provider's secret key on Gateway, in an org that signs
      in with the identity provider.
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              dryRun:
                type: boolean
            additionalProperties: false
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/MemberRecovered
            example:
              userId: usr_bo
              email: bo@acme.test
              role: member
              teams:
                - eng
              dryRun: false
              recovered: true
      "404":
        description: No such member (`not_found`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: no such member
                type: not_found
                code: not_found
      "409":
        description: They are a member (`not_removed`), or the 30-day window ended (`removal_final`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: they are a member; there is nothing to recover
                type: invalid_request_error
                code: not_removed
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "502":
        description: The identity provider did not add them back to its organization (`clerk_unavailable`); nothing changed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: "Clerk did not add them back to the organization: service unavailable"
                type: clerk_unavailable
                code: clerk_unavailable
      "503":
        description: >-
          The organization signs in with the sign-in provider and this Gateway has no secret key for it
          (`not_configured`); nothing changed. Also `cutover_paused`, only while the operator pauses sign-in for the
          auth cutover; nothing changed. Retry after `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait on `cutover_paused`: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: Nexus Gateway has no CLERK_SECRET_KEY, so it cannot add them back to the Clerk organization
                type: not_configured
                code: not_configured
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.manage
    x-idempotency: required
