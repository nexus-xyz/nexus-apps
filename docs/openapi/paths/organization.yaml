/v1/orgs/profile:
  patch:
    tags:
      - Organization
    operationId: setOrgProfile
    summary: >-
      Rename your company organization, change its slug, or remove its logo (owners and admins). A personal organization
      that holds the slug moves to a free one. An organization made in the old sign-in service changes here only once
      the Gateway holds organizations; before that, 409 `use_nexus_ui`. Audited as org.settings_changed.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: 1 to 120 characters after trimming
              slug:
                type: string
                pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                description: A lowercase DNS label that is not a Nexus UI page
              imageUrl:
                type: "null"
                description: null removes the logo. A new logo is uploaded with setOrgLogo (POST /v1/orgs/logo)
          example:
            name: Acme Inc
            slug: acme-inc
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSummary
            example:
              id: ten_8Hq2LmP4xRtK
              name: Acme Inc
              slug: acme-inc
              kind: company
              role: owner
              current: true
      "400":
        $ref: ../components/common.yaml#/responses/BadRequest
      "409":
        description: >-
          Another company organization has the slug (`slug_taken`), a personal organization's name and slug are its
          person's (`personal_org`), or the Gateway does not hold this organization yet (`use_nexus_ui`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: another organization has this slug
                type: invalid_request_error
                code: slug_taken
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          `cutover_paused`: only while the operator pauses sign-in for the auth cutover; nothing changed. Retry after
          `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.settings
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    x-idempotency: optional
/v1/orgs/recovery-key:
  get:
    tags:
      - Organization
    operationId: getOrgRecoveryKey
    summary: >-
      The organization's current recovery key: the public half runners lock thread content keys to under the
      user_and_org content policy, with its fingerprint. key is null until one is registered.
    description: >-
      Every member reads it, so runners fetch it here. Gateway's copy is not the source of trust: before a member's
      clients lock for this key, the member confirms its fingerprint once against one the organization publishes from
      its vault (an admin's screen, its wiki or chat), and again after each replacement.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgRecoveryKeyState
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
/v1/orgs/settings:
  get:
    tags:
      - Organization
    operationId: getOrgSettings
    summary: "The organization's settings: how many days chat messages are kept (90 by default)."
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSettings
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
  put:
    tags:
      - Organization
    operationId: setOrgSettings
    summary: >-
      Change the organization's settings (owners and admins). chatRetentionDays: 1 to 3650, or null for the default; a
      shorter window deletes expired messages at once. Audited as org.settings_changed.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
      - $ref: ../components/common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              hiddenMobilePlaces:
                type:
                  - array
                  - "null"
                items:
                  type: string
                  enum:
                    - assistant
                    - artifacts
                    - customize
                uniqueItems: true
                description: >-
                  Places an owner hides from members in the mobile drawer. Only an owner can change this setting. Null
                  makes all places visible.
              chatRetentionDays:
                type:
                  - integer
                  - "null"
                minimum: 1
                maximum: 3650
              agentSubscriptions:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether `nexus claude --subscription` may run (people's own Claude logins, outside Gateway's checks);
                  null for the default, true
              growthEvents:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether the Gateway records the organization's growth events in its own store; null for the default,
                  true. No safety control depends on it
              chatSuggestions:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether chat sessions suggest the person's next message after an answer, a call the organization pays
                  for; null for the default, true
              webSearch.engine:
                type:
                  - string
                  - "null"
                enum:
                  - "off"
                  - borrowed
                  - null
                description: >-
                  Gates hosted web search in chat and in Code (`nexus claude --api`, `nexus codex --api`): off or
                  borrowed; null for the default, borrowed. An unknown engine is a 400 that names the allowed values
              webSearch.model:
                type:
                  - string
                  - "null"
                description: >-
                  The model that runs a chat's search, whatever the chat's model is: cheapest, or the catalog id of a
                  model that can search (`GET /v1/models` lists it with `web_search_usd`); null or default for the
                  default, the chat's own model (the cheapest on nexus/auto). It is stored as the model's catalog id.
                  Chat only: in Code an agent searches on its own model. Anything else is a 400 that lists the models
              webSearch.domains:
                type:
                  - object
                  - "null"
                properties:
                  allow:
                    type: array
                    items:
                      type: string
                  deny:
                    type: array
                    items:
                      type: string
                description: >-
                  Domains a search result may (allow, when set) or may not (deny) come from; null for the default, both
                  empty. While any is set, no web search runs, in chat or in Code, until the engine applies them
              webSearch.maxPerTurn:
                type:
                  - integer
                  - "null"
                minimum: 1
                maximum: 10
                description: Most searches in one chat turn; null for the default, 3. Applies to Gateway-run engines (chat) only
              webSearch.requireZdr:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether only engines with zero data retention may run; null for the default, false. While set, no web
                  search runs, in chat or in Code, until the engine applies it
              artifacts.external:
                type:
                  - string
                  - "null"
                enum:
                  - "off"
                  - named
                  - public
                  - null
                description: >-
                  Sharing an artifact outside the organization: off, named (named people by verified email) or public
                  (also anyone with an unguessable link); null for the default, public. Another value is a 400
              artifacts.external.code:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether an artifact shared outside the organization may include Ask your code's sources; null for the
                  default, false
              artifacts.external.domains:
                type:
                  - object
                  - "null"
                properties:
                  allow:
                    type: array
                    items:
                      type: string
                  deny:
                    type: array
                    items:
                      type: string
                description: >-
                  Email domains a named share outside the organization may (allow, when set) or may not (deny) go to;
                  null for the default, both empty
              artifacts.external.expiry:
                type:
                  - object
                  - "null"
                properties:
                  maxDays:
                    type:
                      - integer
                      - "null"
                    minimum: 1
                    maximum: 3650
                  required:
                    type: boolean
                description: >-
                  Limits on how long a public link stays open: maxDays (1-3650, or null for no limit) and whether an
                  expiry is required; null for the default, no limit and not required
              artifacts.external.continue:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether people outside the organization may continue or remix what it shares; null for the default,
                  true
              artifacts.external.who:
                type:
                  - string
                  - "null"
                enum:
                  - everyone
                  - admins
                  - null
                description: "Who may share outside the organization: everyone or admins; null for the default, everyone"
              artifacts.pages:
                type:
                  - boolean
                  - "null"
                description: Pages on or off; null for the default, true
              artifacts.pages.public:
                type:
                  - boolean
                  - "null"
                description: Public links to pages; null for the default (false in a company organization, true in a personal one)
              artifacts.pages.queries:
                type:
                  - boolean
                  - "null"
                description: >-
                  Page queries (Nexus Data): a page's owner may approve read-only queries on a connection for its
                  readers; null for the default, false
              sessionContent:
                type:
                  - string
                  - "null"
                enum:
                  - never
                  - user
                  - user_and_org
                  - null
                description: >-
                  What leaves a person's machine when coding sessions sync, end-to-end encrypted: never (only usage
                  numbers), user (only the person's own devices can read it) or user_and_org (also the organization's
                  recovery key); null for the default. Needs synced_sessions.manage_policy. user_and_org answers 409
                  org_recovery_key_required until the organization registers a recovery key (putOrgRecoveryKey)
              multiplayerSessions:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether members read each other's team-visible synced sessions; null for the default, false. A
                  personal organization answers 403 personal_organization
              cloudHistory:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether Gateway stores the organization's cloud session history, readable by Nexus's systems and
                  encrypted at rest; null for the default, true. Off, Gateway stores none and deletes what it holds
              webSessionViewer:
                type:
                  - boolean
                  - "null"
                description: >-
                  Whether Nexus UI in a browser opens the organization's synced sessions; null for the default, true.
                  Needs synced_sessions.manage_policy. Off, Nexus UI's credential gets 403 web_session_viewer_off for
                  sealed events, key copies and a new device; the desktop, the phone and the CLI read as before
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSettings
        headers:
          ETag:
            $ref: ../components/common.yaml#/headers/ETag
      "412":
        $ref: ../components/common.yaml#/responses/VersionMismatch
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.settings
    x-idempotency: optional
    x-if-match: required
/v1/orgs/subscription:
  get:
    tags:
      - Organization
    operationId: getOrgSubscription
    summary: >-
      The organization's subscription (anyone in it): the plan, the member who pays, the member who receives billing
      mail, the paid term, the status and the seats (one per human member). An organization nobody changed yet reads as
      `active` since it was created, with everything else `null` and `updatedAt: null`.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSubscription
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
  patch:
    tags:
      - Organization
    operationId: changeOrgSubscription
    summary: >-
      Name the payer and the billing contact (owners only). A field changes when present and clears when `null`; an
      absent field stays. Both must be members (400 `not_a_member`). `plan`, `periodStart`, `periodEnd` and `status` are
      refused (400 `written_by_billing`): Billing writes them from what the organization pays for. `effectiveAt`
      (default now) is when the change took effect: never in the future and never before the newest change (400
      `invalid_effective_at`). `dryRun: true` answers with the result and writes nothing. Audited as
      `subscription.changed`, with the changed fields before and after and `metadata.effectiveAt`; a body that changes
      nothing writes nothing.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              payerUserId:
                type:
                  - string
                  - "null"
                description: "The member who pays: a user id from `GET /v1/orgs/members`."
              billingContactUserId:
                type:
                  - string
                  - "null"
                description: The member who receives billing mail.
              effectiveAt:
                type: string
                format: date-time
                description: When the change took effect; default now.
              dryRun:
                type: boolean
                default: false
                description: Check the change and answer with the result; write nothing.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgSubscriptionChange
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.billing
    x-idempotency: optional
/v1/orgs/switch:
  post:
    tags:
      - Organization
    operationId: switchOrg
    summary: >-
      A new token for another of your organizations (by slug, id, or `personal`), of your credential's kind (`cli` or
      `ui`; an API key gets a `cli` token that is still an API key to the Gateway), and who you are there. Your current
      credential stays valid.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - org
            properties:
              org:
                type: string
                description: A slug, an id, or personal
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SwitchedOrg
            example:
              tenant:
                id: ten_8Hq2LmP4xRtK
                name: Acme
                createdAt: "2026-10-01T09:00:00.000Z"
                slug: acme
                kind: company
              user:
                id: usr_3Kd9TqW2bNxe
                email: ana@acme.com
                name: Ana Souza
              teams:
                - id: team_x7Ka2LmPq9Rd
                  slug: platform
                  name: Platform
                  role: lead
              team:
                id: team_x7Ka2LmPq9Rd
                slug: platform
                name: Platform
              token: nx_EXAMPLEdoNotUseThisTokenValue000
              tokenKind: cli
              expiresAt: "2027-01-28T13:00:00.000Z"
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: keys.manage_own
    x-idempotency: required
/v1/orgs/team-key:
  get:
    tags:
      - Organization
    operationId: getTeamKey
    summary: The team key's newest epoch, current or retired, and your holder's copies of every epoch when `holder` names one.
    description: >-
      The team key is the X25519 pair every member's trusted holders hold, so a teammate's device opens a team-visible
      session. It is not the organization's recovery key. Gateway holds its public half and copies sealed to each
      holder, and opens neither. `retiredAt` set means a removal or a revoke retired the epoch: make the next one (`POST
      /v1/orgs/team-key`).
    parameters:
      - name: holder
        in: query
        required: false
        schema:
          type: string
        description: "One of your trusted holders: its copies come back"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TeamKeyState
      "403":
        description: >-
          `holder` named and not a person (`person_required`), or named by Nexus UI while the organization's
          `webSessionViewer` is off (`web_session_viewer_off`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: "`holder` is not your device (`device_not_found`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: "`holder` is pending or revoked (`device_not_trusted`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: org.read
  post:
    tags:
      - Organization
    operationId: createTeamKey
    summary: >-
      Make the team key's next epoch, with its first copies for members' trusted holders. One epoch at a time; audited
      as org.team_key_rotated.
    description: >-
      Your trusted device makes the X25519 pair and sends its public half and copies of its private half, each sealed to
      a member's trusted holder and signed. Gateway takes one new epoch at a time, under a lock on the organization: of
      two devices that race, one makes the epoch and the other gets 409 `team_key_epoch_taken`. A new epoch follows a
      removal or a revoke: while the newest is current, 409 `team_key_current`. A removed member's holder gets no copy.
      The audit event names the reason the previous epoch retired, or `first`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CreateTeamKeyRequest
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TeamKey
      "400":
        description: A malformed key, copy or signature, or an epoch after a gap (`team_key_epoch_gap`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`), or the signature does not verify with the sender's signing key
          (`invalid_signature`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: The sender is not your device (`device_not_found`), or a holder is no member's (`holder_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          The epoch is taken (`team_key_epoch_taken`); the newest epoch is current (`team_key_current`); or the sender
          or a holder is pending or revoked (`device_not_trusted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
/v1/orgs/team-key/copies:
  put:
    tags:
      - Organization
    operationId: putTeamKeyCopies
    summary: Hand team-key epochs your device holds to members' trusted holders. A copy already stored is kept.
    description: >-
      A member's trusted device that holds the key reads each member's holders (`GET
      /v1/orgs/members/{userId}/holders`), verifies their chain, and seals every epoch it holds to each. Each holder
      must be trusted and belong to a member of this organization now: a removed member gets no copy. Any refusal stores
      nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PutTeamKeyCopiesRequest
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TeamKeyCopiesStored
      "400":
        description: A malformed copy or signature
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`), or the signature does not verify with the sender's signing key
          (`invalid_signature`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: >-
          No such epoch (`team_key_not_found`), the sender is not your device (`device_not_found`), or a holder is no
          member's (`holder_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          The sender holds no copy of an epoch it hands over (`team_key_not_held`), or the sender or a holder is pending
          or revoked (`device_not_trusted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    x-idempotency: optional
/v1/service-accounts:
  get:
    tags:
      - Organization
    operationId: listServiceAccounts
    summary: >-
      The organization's service accounts (owners and admins: `service_accounts.manage`), newest first. Each has every
      key it held, live or not, newest first. Never a token or its hash. `limit` and `cursor` page it.
    parameters:
      - name: limit
        in: query
        required: false
        description: Items per page, 1 to 500 (default 100). Without limit or cursor the answer holds the whole list.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: cursor
        in: query
        required: false
        description: nextCursor from the previous page. A cursor whose item left the list answers 400 `invalid_cursor`.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ServiceAccountList
            example:
              serviceAccounts:
                - id: sva_Q4mT8wLx2Rkz
                  name: ci-deploy
                  ownerUserId: usr_7Lm2RxV9cQta
                  teamId: team_x7Ka2LmPq9Rd
                  createdBy: usr_3Kd9TqW2bNxe
                  createdAt: "2026-10-30T13:00:00.000Z"
                  expiresAt: "2027-10-30T13:00:00.000Z"
                  keys:
                    - id: sak_N6pR3tW8yLqa
                      serviceAccountId: sva_Q4mT8wLx2Rkz
                      ownerUserId: usr_7Lm2RxV9cQta
                      scope:
                        teamId: team_x7Ka2LmPq9Rd
                      prefix: nxsa_r7Tq
                      label: github-actions
                      createdBy: usr_3Kd9TqW2bNxe
                      createdAt: "2026-10-30T13:01:00.000Z"
                      expiresAt: "2027-10-30T13:00:00.000Z"
                      lastUsedAt: "2026-10-31T08:00:00.000Z"
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: service_accounts.manage
  post:
    tags:
      - Organization
    operationId: createServiceAccount
    summary: >-
      Make a service account, a caller for CI and scripts (owners and admins: `service_accounts.manage`). A member
      answers for it (`ownerUserId`, the caller by default) and a team owns it (`team`, its slug or id). It expires at
      `expiresAt`, at most 365 days from now. An organization holds at most 100 live accounts: the 101st is a 409
      `service_account_limit`. It is no member and holds no seat. Its keys (`nxsa_…`) reach the public endpoints only,
      until a Policy Engine statement admits them to more: every other route answers 403. It has no key until one is
      issued. Audited as `service_account.created`. With `dryRun: true` everything is checked and nothing is written:
      the answer is a 200 with the account as it would be made, and its id is never used.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CreateServiceAccount
    responses:
      "200":
        description: "A dry run: the account as it would be made"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CreatedServiceAccount
            example:
              id: sva_Q4mT8wLx2Rkz
              name: ci-deploy
              ownerUserId: usr_7Lm2RxV9cQta
              teamId: team_x7Ka2LmPq9Rd
              createdBy: usr_3Kd9TqW2bNxe
              createdAt: "2026-10-30T13:00:00.000Z"
              expiresAt: "2027-10-30T13:00:00.000Z"
              keys: []
              dryRun: true
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CreatedServiceAccount
            example:
              id: sva_Q4mT8wLx2Rkz
              name: ci-deploy
              ownerUserId: usr_7Lm2RxV9cQta
              teamId: team_x7Ka2LmPq9Rd
              createdBy: usr_3Kd9TqW2bNxe
              createdAt: "2026-10-30T13:00:00.000Z"
              expiresAt: "2027-10-30T13:00:00.000Z"
              keys: []
              dryRun: false
      "400":
        description: >-
          Not valid: no name (1 to 64 characters), an `expiresAt` that is not a future time within 365 days
          (`invalid_expiry`), an owner who is not a member (`owner_not_a_member`) or a team that is not the
          organization's (`unknown_team`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: service_accounts.manage
    x-idempotency: required
/v1/service-accounts/{id}:
  delete:
    tags:
      - Organization
    operationId: revokeServiceAccount
    summary: >-
      Revoke a service account and every live key it holds, in one change (owners and admins:
      `service_accounts.manage`). Its keys answer as an unknown token from then on. Revoking a revoked account answers
      `already: true` and changes nothing. With `?dryRun=1` nothing changes: the answer counts the keys it would stop.
      Audited as `service_account.revoked`, with the ids of the keys it stopped. Another organization's account is a
      404.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        description: The service account's id (`sva_…`)
      - name: dryRun
        in: query
        required: false
        description: >-
          `1` or `true`: check and change nothing. `0` or `false`: the same as none. Any other value is a 400, so a
          mistyped flag never revokes.
        schema:
          type: string
          enum:
            - "1"
            - "true"
            - "0"
            - "false"
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ServiceAccountRevoked
            example:
              id: sva_Q4mT8wLx2Rkz
              already: false
              dryRun: false
              revokedAt: "2026-11-15T10:00:00.000Z"
              keysRevoked: 1
      "400":
        description: "`dryRun` is not `1`, `true`, `0` or `false`"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such service account in this organization (`unknown_service_account`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: service_accounts.manage
    x-idempotency: optional
