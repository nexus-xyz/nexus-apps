          organizations.
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - removed
              properties:
                removed:
                  type: boolean
            example:
              removed: true
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          `cutover_paused`: only while the operator pauses sign-in for the auth cutover; nothing changed. Retry after
          `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.invite
    x-idempotency: optional
/v1/orgs/invitations:
  post:
    tags:
      - Organization
    operationId: inviteMembers
    summary: >-
      Invite people to the organization (owners and admins); the identity provider emails each invitation. Name
      `emails`, or `pending: true` for everyone in a team by email who has not joined. Emails already in the
      organization or already invited are skipped. `dryRun` sends nothing. Sending more than one needs `expect`, the
      number you confirmed (409 `count_changed` if it differs). 501 without the identity provider's secret key on
      Gateway (dry runs still work, checking Gateway only). Once the Gateway holds organizations, it writes each
      invitation and emails its one-time link itself; an expired invitation of the email is sent again.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              emails:
                type: array
                items:
                  type: string
                  format: email
                maxItems: 500
              pending:
                type: boolean
                description: Everyone with a pending team membership.
              role:
                type: string
                enum:
                  - member
                  - admin
                default: member
              dryRun:
                type: boolean
                default: false
              expect:
                type: integer
                description: "Required to send more than one invitation: how many you confirmed."
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InvitationsResponse
            example:
              dryRun: false
              role: member
              checkedClerk: true
              toSend: 1
              results:
                - email: carla@acme.com
                  status: sent
                  invitationId: orginv_2pYk8SnR4wMtU6vB9cXd1eGh3bQ
                - email: bruno@acme.com
                  status: already_member
              counts:
                sent: 1
                already_member: 1
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          `cutover_paused`: only while the operator pauses sign-in for the auth cutover; nothing changed. Retry after
          `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.invite
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    x-idempotency: required
  get:
    tags:
      - Organization
    operationId: listInvitations
    summary: >-
      The organization's pending invitations, oldest first, expired ones included (owners and admins). Only once the
      Gateway holds organizations; before that, 409 `use_nexus_ui`.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
                - invitations
              properties:
                invitations:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - email
                      - role
                      - createdAt
                      - expiresAt
                      - expired
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum:
                          - member
                          - admin
                      invitedBy:
