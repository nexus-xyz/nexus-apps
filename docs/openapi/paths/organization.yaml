    x-idempotency: required
/v1/orgs/domains:
  get:
    tags:
      - Organization
    operationId: listOrgDomains
    summary: >-
      The organization's verified email domains (owners and admins). While the identity provider holds organizations
      (the default), they are the identity provider's: people with a verified email on a domain join through the
      identity provider as its `enrollmentMode` says; 409 `not_a_clerk_org` for an organization that does not sign in
      with the identity provider; 503 `not_configured` without the identity provider's secret key on Gateway. Once Core
      holds organizations, they are the domains a Nexus operator assigned: each one's `id` is the domain, its
      `enrollmentMode` is `automatic_suggestion`, and a person whose Google sign-in is on it sees the organization in
      listDomainSuggestions. 409 `personal_org` for a personal organization.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/DomainList
            example:
              domains:
                - id: orgdmn_2pZm3TqW8xLkN5vC7bYd4fGj1aR
                  domain: acme.com
                  enrollmentMode: automatic_invitation
                  verified: true
                  pendingInvitations: 2
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.invite
  post:
    tags:
      - Organization
    operationId: addOrgDomain
    summary: >-
      Add a verified email domain (owners and admins). While the identity provider holds organizations: you must have a
      verified email on it in the identity provider (403 `domain_not_yours`), so an admin cannot add another company's
      domain and pull its people into their organization; a public mail provider such as gmail.com is refused (400
      `public_mail_domain`), and so is a personal organization (409 `personal_org`). The identity provider's refusal,
      such as a domain another organization has, is a 409 `clerk_refused` with the identity provider's message. Audited
      as `domain.added`. Once Core holds organizations, a Nexus operator assigns domains after a review, so this is 409
      `operator_assigns_domains` (400 `public_mail_domain` for a public mail provider's).
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - domain
            properties:
              domain:
                type: string
                description: A host name, as acme.com.
              enrollmentMode:
                type: string
                enum:
                  - automatic_invitation
                  - automatic_suggestion
                  - manual_invitation
                default: automatic_invitation
                description: >-
                  automatic_invitation: the sign-in provider invites everyone with a verified email on the domain.
                  automatic_suggestion: the provider suggests the organization and an admin accepts each request.
                  manual_invitation: nobody joins without an invitation.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgDomain
            example:
              id: orgdmn_2pZm3TqW8xLkN5vC7bYd4fGj1aR
              domain: acme.com
              enrollmentMode: automatic_invitation
              verified: true
              pendingInvitations: 0
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      "503":
        description: >-
          `cutover_paused`: only while the operator pauses sign-in for the auth cutover; nothing changed. Retry after
          `Retry-After` seconds.
        headers:
          Retry-After:
            description: "Whole seconds to wait: 600."
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              error:
                message: >-
                  sign-in, account deletion and organization changes are paused while Nexus moves to its new sign-in;
                  try again after the maintenance window
                type: server_error
                code: cutover_paused
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: members.invite
    x-idempotency: required
/v1/orgs/domains/{id}:
  delete:
    tags:
      - Organization
    operationId: removeOrgDomain
    summary: >-
      Remove a verified email domain by its id from listOrgDomains (owners and admins). New people stop joining by it;
      who already joined stays. Another organization's domain is a 404. Audited as `domain.removed`.
