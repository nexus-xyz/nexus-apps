                  orgSlug: acme
                  role: member
                  invitedBy: Ada Lovelace
                  expiresAt: "2026-11-28T12:00:00.000Z"
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: authenticated
/v1/orgs/invitations/{id}:
