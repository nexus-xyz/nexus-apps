# Path items. The root openapi.yaml references each one.
/v1/threads:
  get:
    tags:
      - Threads
    operationId: listSyncedThreads
    summary: >-
      Your synced threads in this organization, newest first, with their readable summaries; for an auditor, one
      member's or every member's; for a teammate, the team-visible ones.
    description: >-
      A deleted thread is not listed. Page with `before`, as `nextBefore` gives it. With `person` naming another member,
      or `scope=org`, the caller needs `synced_sessions.audit`, reads only this organization's threads, and each page is
      recorded in the audit log as `synced_session.audit_read` before it is served. This read applies under every
      content policy: the summary is usage metadata, and the sealed events open only with a copy for the organization's
      recovery key. With order=activity, use the scoped nextCursor tuple instead of before; nextBefore is null. The
      indexed query orders by server updated_at, not the client event timestamp. Titles and project paths remain
      encrypted. With `scope=team`, any member lists the organization's team-visible threads (not private), or one
      member's with `person`, unaudited; the list is empty while `multiplayerSessions` is off.
    parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
            - org
            - team
            - following
        description: >-
          `org`: every member's threads (`synced_sessions.audit`). `team`: the team-visible threads, to any member while
          `multiplayerSessions` is on; with `person`, one member's. `following`: the team-visible threads you follow
          (creation order only)
      - name: person
        in: query
        required: false
        schema:
          type: string
        description: >-
          One member's threads (`users.id`): yours without a permission, another's with `synced_sessions.audit`, or with
          `scope=team` another's team-visible ones
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: The `nextBefore` of the previous page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
        description: At most this many threads, 1 to 200; 50 when absent
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
            - creation
            - activity
        description: Creation order by default. Activity order uses server updated_at DESC and thread_id DESC.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: >-
          Opaque precise nextCursor; only with order=activity and the same verified read scope. Cannot combine with
          before.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas.yaml#/SyncedThreadList
                - $ref: ../components/schemas.yaml#/SyncedThreadActivityList
      "400":
        description: A malformed `before`, `limit` or `scope`, or both `scope=org` and `person`
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`), or another member's threads without `synced_sessions.audit`
          (`role_required`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/threads/{threadId}:
  delete:
    tags:
      - Threads
    operationId: deleteSyncedThread
    summary: "Delete one of your synced threads: its events and every locked copy of its content key."
    description: >-
      Without the keys, a copy of an event left in a backup cannot be opened. It works on a thread that has key copies
      and no event yet, and again on a deleted one. The thread's id then takes no event and no key again. Removing a
      member from an organization deletes their synced threads there the same way.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: Deleted
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SyncedThreadDeleted
      "403":
        description: "Not a person: an agent link, a module or a service account (`person_required`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread, or not yours in this organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
  get:
    tags:
      - Threads
    operationId: getSyncedThread
    summary: "One of your synced threads: its readable summary and the last event number stored."
    description: >-
      A runner reads `lastSeq` to resume an upload after the last event Gateway confirmed. An owner or admin with
      `synced_sessions.audit` reads any thread of this organization, not deleted; each read is recorded in the audit log
      as `synced_session.audit_read` before it is served. A member reads a team-visible thread of this organization
      while `multiplayerSessions` is on, unaudited.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SyncedThread
      "403":
        description: "Not a person: an agent link, a module or a service account (`person_required`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread, or not yours in this organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: The thread was deleted (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/threads/{threadId}/commands:
  post:
    operationId: sendCodeCommand
    tags:
      - Threads
    summary: Queue an encrypted command for your own Code session
    description: >-
      Only the session owner may use this operation. Organization auditors cannot control another person's sessions.
      Sender and runner must be trusted signing devices of that person. Commands are sealed on the phone; Gateway never
      reads action content. Leases and commands expire within 60 seconds, with 30 more seconds allowed for clock skew;
      seal by `serverTime` from `getCodeControl`. A command with `waits` needs no live lease and may expire up to 24
      hours ahead: Gateway queues it while the computer sleeps, unless Phone control is off or another computer holds
      the session. The runner decides by action how long it may wait: a message up to 24 hours, Stop and approval
      answers only the normal window. Commands reach a runner in the order Gateway queued them. A claimed command reads
      as expired 2 minutes after its expiry, and a late result still finishes it. A repeated identical command id
      returns its original delivery state; a changed body is a 409. A cancelled command id returns `cancelled` and is
      never queued again. Claims are atomic and never replay an action. Local computer opt-in is required.
    x-nexus-permission: sessions.control
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: Current control or delivery state.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CodeCommand
      "400":
        description: Malformed fields, ciphertext or expiry.
      "403":
        description: Invalid signature or a caller that is not a person.
      "404":
        description: The session, command or device does not belong to the caller.
      "409":
        description: >-
          A device is untrusted, control is disabled or offline, the organization forbids synced content, or a command
          state conflicts.
      "410":
        description: The session was deleted.
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        description: The bounded command mailbox is full.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CodeCommandEnvelope
    x-idempotency: required
  get:
    operationId: listCodeCommands
    tags:
      - Threads
    summary: Read up to 20 queued commands for your trusted runner
    description: >-
      Only the session owner may use this operation. Organization auditors cannot control another person's sessions.
      Sender and runner must be trusted signing devices of that person. Commands are sealed on the phone; Gateway never
      reads action content. Leases and commands expire within 60 seconds, with 30 more seconds allowed for clock skew;
      seal by `serverTime` from `getCodeControl`. A claimed command reads as expired 2 minutes after its expiry, and a
      late result still finishes it. A repeated identical command id returns its original delivery state; a changed body
      is a 409. Claims are atomic and never replay an action. Local computer opt-in is required.
    x-nexus-permission: sessions.control
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
      - name: runnerDeviceId
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Current control or delivery state.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CodeCommands
      "400":
        description: Malformed fields, ciphertext or expiry.
      "403":
        description: Invalid signature or a caller that is not a person.
      "404":
        description: The session, command or device does not belong to the caller.
      "409":
        description: >-
          A device is untrusted, control is disabled or offline, the organization forbids synced content, or a command
          state conflicts.
      "410":
        description: The session was deleted.
      "429":
        description: The bounded command mailbox is full.
