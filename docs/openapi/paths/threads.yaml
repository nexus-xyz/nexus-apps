/v1/threads/{threadId}/commands/{commandId}/cancel:
  post:
    operationId: cancelCodeCommand
    tags:
      - Threads
    summary: Cancel your own Code command before a computer receives it
    description: >-
      Takes back a command that no computer has claimed. Only the session owner may use this operation, from the trusted
      device that sent the command. That device signs `nexus-code-command-cancel-v1`, the thread id, the command id and
      its own device id, each on its own line. Gateway marks a queued command `cancelled` and keeps it until the command
      is pruned, a day after it expires. A later read, a repeated cancel and a resend of the same command all answer
      `cancelled`, and no computer receives it. A claimed command cannot be cancelled: the computer may already be
      running it (409 `code_command_not_queued`).
    x-nexus-permission: sessions.control
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
      - name: commandId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f-]{36}$
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    responses:
      "200":
        description: The cancelled command, also when it was already cancelled.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CodeCommand
      "400":
        description: A malformed body.
      "403":
        description: >-
          An invalid signature, a caller that is not a person, or a device that did not send the command
          (`code_command_not_sender`).
      "404":
        description: >-
          The session or command does not belong to the caller, or Gateway has no such command
          (`code_command_not_found`).
      "409":
        description: A computer already claimed the command (`code_command_not_queued`), or the device is untrusted.
      "410":
        description: The session was deleted.
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CancelCodeCommand
    x-idempotency: required
