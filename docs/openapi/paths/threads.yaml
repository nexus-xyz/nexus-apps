/v1/threads/{threadId}/events:
  get:
    tags:
      - Threads
    operationId: listSyncedEvents
    summary: A page of one of your threads' sealed events, after an event number or just before one.
    description: >-
      Without `after` or `before`, the page starts at the first event. With `before`, it ends just before that event, to
      open a long thread from its end. Either way the events are in number order, and a page holds at most 4 MiB of
      sealed bodies after its first event. An owner or admin with `synced_sessions.audit` reads any thread of this
      organization, not deleted; each read is recorded in the audit log as `synced_session.audit_read` before it is
      served. A member reads a team-visible thread's events while `multiplayerSessions` is on, unaudited. Nexus UI's
      credential gets 403 `web_session_viewer_off` while the organization's `webSessionViewer` is off.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: -1
        description: Events numbered after this one; -1 for every event
      - name: before
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Events numbered before this one
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
        description: At most this many events, 1 to 500; 100 when absent
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SyncedEventPage
      "400":
        description: Both `after` and `before`, or a malformed number
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person: an agent link, a module or a service account (`person_required`); or Nexus UI while the
          organization's `webSessionViewer` is off (`web_session_viewer_off`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread, or not yours in this organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: The thread was deleted (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
  post:
    tags:
      - Threads
    operationId: appendSyncedEvents
    summary: >-
      Upload a thread's next sealed events. A retried upload changes nothing, and the answer names the last event
      stored.
    description: >-
      Events are numbered from 0, with no gap. The request's events are consecutive, and the first is at most one past
      the last stored. An event already stored must be sent unchanged; the rest are added. All or nothing. The first
      upload makes the thread yours, in this organization. A new sealed event names the thread's latest content key
      version, which must already have locked copies (`PUT /v1/threads/{threadId}/keys`): after a rotation, re-seal
      unconfirmed events with the new key. Your synced threads in one organization hold at most 1 GiB. Usage numbers are
      stored, not billed. While the organization's effective `sessionContent` is `never`, a new event with a sealed body
      is refused with 409 `content_policy_never`; usage-only events pass, and events already stored, sent again
      unchanged, still confirm.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKeyRequired
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AppendSyncedEventsRequest
    responses:
      "200":
        description: Stored
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SyncedEventsAppended
      "400":
        description: No events or more than 64, events not consecutive, or a malformed event
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: "Not a person: an agent link, a module or a service account (`person_required`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Another person's thread, or yours in another organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          The first event is past the next number (`seq_gap`), an event already stored differs (`event_conflict`), the
          thread has no locked keys yet (`thread_keys_missing`), a key version has no copies (`key_version_not_stored`),
          or a new event is not sealed with the thread's latest key version (`key_version_behind`): re-seal it with the
          new key; or a new event carries a sealed body while the organization's content policy is `never`
          (`content_policy_never`): send usage only
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: The thread was deleted (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "413":
        description: "Your synced threads in this organization would pass 1 GiB (`session_store_full`): delete some"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "428":
        $ref: ../components/common.yaml#/responses/PreconditionRequired
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: required
