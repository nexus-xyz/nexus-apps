/v1/threads/{threadId}/keys:
  get:
    tags:
      - Threads
    operationId: getThreadKey
    summary: >-
      The locked copy of a thread's content key for one of your trusted devices, at the newest version it holds unless
      you name one.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's id, as its client names it
      - name: device
        in: query
        required: true
        schema:
          type: string
        description: Your trusted device's id (`dev_…`)
      - name: version
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The key version; the newest one the device holds when absent
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ThreadKey
      "400":
        description: No `device`
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person: an agent link, a module or a service account (`person_required`); or Nexus UI while the
          organization's `webSessionViewer` is off (`web_session_viewer_off`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not your device, or no copy for it (`device_not_found`, `thread_key_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: The device is pending or revoked (`device_not_trusted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
  put:
    tags:
      - Threads
    operationId: putThreadKeys
    summary: >-
      Store a thread's locked copies at one key version for your trusted devices, each signed by one of them. A copy
      already stored is kept, and the answer says which.
    description: >-
      Each copy is the thread's content key, HPKE-sealed by your client to the device's `encryptionKey`; Gateway cannot
      open it. Each copy carries the Ed25519 signature of your trusted device `senderDeviceId`, so a session without a
      device key stores nothing. `keyVersion` is a version one of your devices still holds, or one more than the latest
      to rotate the content key, for instance after you revoke a device: the new version has copies only for the devices
      you name, which must be trusted. The latest version only goes up, and a revocation never lowers it. Every device
      must be yours and trusted, and every signature must verify, or nothing is stored. A thread belongs to the first
      person who stored a copy for it, also after every copy is deleted. Repeating a request changes nothing.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's id, as its client names it
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PutThreadKeysRequest
    responses:
      "200":
        description: Stored
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ThreadKeysStored
      "400":
        description: >-
          No keys, more than 100, a device named twice, a malformed copy or signature, or a key version that skips one
          (`key_version_gap`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`), a signature that does not verify with the sender's signing key
          (`invalid_signature`), or a sender that is a recovery key (`recovery_key_cannot_sign`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not your device or sender, or another person's thread (`device_not_found`, `thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          A device or the sender is pending or revoked (`device_not_trusted`), or no device holds the key version any
          more (`key_version_not_held`): rotate to the next one
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: The thread was deleted in the session store (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
/v1/threads/{threadId}/org-key:
  put:
    tags:
      - Threads
    operationId: putOrgThreadKey
    summary: >-
      Store your thread's content key locked for the organization's current recovery key, signed by one of your trusted
      devices. A copy already stored is kept, and the answer says so.
    description: >-
      Under the `user_and_org` content policy, your client seals the thread's content key at `keyVersion` to the
      organization's recovery key (HPKE) once you have confirmed the key's fingerprint, and one of your trusted devices
      signs `nexus-org-thread-key:v1:{threadId}:{keyVersion}:{orgKeyId}:{lockedKey}` with Ed25519. Gateway cannot open
      the copy. The copy keeps the thread's person and organization from your credential. `orgKeyId` must be the
      organization's current key: a copy for a replaced key is refused, and the copies already stored for it stay.
      `keyVersion` must be a version your devices hold a copy of. A thread with no upload yet joins this organization,
      as its first upload would. Owners and admins with `synced_sessions.audit` read the copy (`GET
      /v1/threads/{threadId}/org-keys`); other members never do. Deleting the thread, or your removal from the
      organization, deletes it.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's id, as its client names it
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PutOrgThreadKeyRequest
    responses:
      "200":
        description: Stored, or already stored
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OrgThreadKeyStored
      "400":
        description: A malformed thread id, key version, copy or signature
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`), or the signature does not verify with the sender's signing key
          (`invalid_signature`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not your thread in this organization, or not your device (`thread_not_found`, `device_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          The sender is pending or revoked (`device_not_trusted`); none of your devices holds `keyVersion`
          (`key_version_not_held`); the organization has no recovery key (`org_recovery_key_required`); or `orgKeyId` is
          not its current key (`org_key_replaced`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: You deleted the thread (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
/v1/threads/{threadId}/presence:
  post:
    tags:
      - Threads
    operationId: postSyncedThreadPresence
    summary: "Tell a thread's watchers where you are on it: the event number on screen, or that you left."
    description: >-
      Gateway relays it as a `presence` event (`SyncedThreadPresence`) on the thread's stream, to its owner's runner and
      every watcher, you included, and never stores it. Gateway names you; the body names only your window (`client`)
      and the event number on screen. Post it when you open the thread, every few seconds while it shows, and with
      `leave` when you close it. A watcher not heard from for a few posts is gone. You may post on a thread you may
      stream: your own, or a team-visible one while the organization's `multiplayerSessions` is on. Your posts share the
      pages' presence limit, 1,800 a minute per person on each Gateway copy.


      Exempt: a heartbeat. A repeat only renews the same state.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "204":
        description: Relayed
      "400":
        description: >-
          The body is not `{"client", "seq", "leave"}`: `client` is 1 to 64 letters, digits, `-` or `_`, and `seq` 0 or
          more
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: "Not a person: an agent link, a module or a service account (`person_required`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread, or not one you may stream (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - client
            additionalProperties: false
            properties:
              client:
                type: string
                pattern: ^[A-Za-z0-9_-]{1,64}$
                description: "Your window or device: a random id, the same while it shows the thread"
              seq:
                type:
                  - integer
                  - "null"
                minimum: 0
                description: The event number on screen; unset before any shows
              leave:
                type: boolean
                default: false
                description: true when you stop watching
    x-idempotency: optional
/v1/threads/{threadId}/private:
  put:
    tags:
      - Threads
    operationId: setSyncedThreadPrivate
    summary: Keep one of your synced threads from your teammates, or share it with them again.
    description: >-
      A private thread is its person's own; a team-visible one is read by any member while the organization's
      `multiplayerSessions` is on. To create privacy metadata before the first event, first store your owned thread
      keys. An unknown id returns the same 404 as another person's thread. During a run, only the thread's person
      changes its privacy. Each change is recorded in the audit log as `synced_session.made_private` or
      `synced_session.made_team_visible`, by thread id. Rotating the thread's content key away from the team key is the
      runner's.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SyncedThread
      "400":
        description: "The body is not `{\"private\": true|false}`"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: "Not a person: an agent link, a module or a service account (`person_required`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread, or not yours in this organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: The thread was deleted (`thread_deleted`)
        content:
          application/json:
