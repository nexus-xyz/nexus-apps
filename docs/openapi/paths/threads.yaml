          schema:
            type: object
            required:
              - private
            additionalProperties: false
            properties:
              private:
                type: boolean
                description: true keeps the thread from your teammates; false shares it again
    x-idempotency: optional
/v1/threads/{threadId}/stream:
  get:
    tags:
      - Threads
    operationId: streamSyncedThread
    summary: "One of your threads, live: its new event numbers and its deletion, as server-sent events."
    description: >-
      Each event is `event: <type>` and one line of JSON `data`. `thread` (`SyncedThreadAdvanced`) says the thread now
      holds every event up to `lastSeq`: read the ones after your last with `listSyncedEvents`. `presence`
      (`SyncedThreadPresence`) is one watcher's place on the thread, yours included: post yours with
      `postSyncedThreadPresence`. `deleted` (`SyncedThreadGone`) is the last event. With `commands=true`, the thread's
      person, with `sessions.control`, also gets `commands` (`CodeCommandsLive`) first, then `command`
      (`CodeCommandChanged`) when one of the thread's Code commands is queued, claimed, completed or rejected: read its
      receipt with `getCodeCommand`. A teammate gets neither. No event carries a body. Open the stream with `after`, the
      last event number you hold: when the thread holds more, `thread` comes at once, so a reconnect misses nothing. A
      `: keep-alive` comment goes out every 15 s, and your token and the thread are checked again then: the stream ends
      when either is lost, when you fall behind, or when the Gateway copy is draining. Reconnect with `after`. The
      thread's person opens it, and so does any member on a team-visible thread while the organization's
      `multiplayerSessions` is on; an auditor alone does not. A thread made private, or a teammate removed, ends a
      teammate's stream at the next keep-alive.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's sync id, as its runner names it (a UUIDv7)
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: -1
        description: The last event number you hold; -1 (the default) when you hold none
      - name: commands
        in: query
        required: false
        schema:
          type: boolean
        description: >-
          Also send phone control's `commands` and `command` events, when you are the thread's person with
          `sessions.control`. False by default.
    responses:
      "200":
        description: The event stream
        content:
          text/event-stream:
            schema:
              $ref: ../components/schemas.yaml#/SyncedThreadAdvanced
      "400":
        description: A malformed `after` or `commands`, or an `after` below -1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: "Not a person: an agent link, a module or a service account (`person_required`)"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread, or not yours or your team's in this organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: The thread was deleted (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        description: More than 16 live thread streams of yours on this Gateway copy (`thread_events_per_person`), or the rate limit
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "503":
        description: >-
          Too many live thread streams on this Gateway copy (`thread_events_full`), or 64 on this thread
          (`thread_watchers_full`): read the events after your last instead
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
/v1/threads/{threadId}/team-key:
  put:
    tags:
      - Threads
    operationId: putTeamThreadKey
    summary: >-
      Store your team-visible thread's content key locked to the team key's current epoch, signed by one of your trusted
      devices. A copy already stored is kept, and the answer says so.
    description: >-
      Your runner seals the thread's content key at `keyVersion` to the team key's current epoch (HPKE), and one of your
      trusted devices signs `nexus-team-thread-key:v1:{threadId}:{keyVersion}:{teamKeyId}:{lockedKey}` with Ed25519. One
      copy a key version, whatever the team's size. Gateway cannot open it. A private thread has no team copy. A thread
      with no upload yet joins this organization, as its first upload would. Deleting the thread, or your removal from
      the organization, deletes the copy.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's id, as its client names it
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PutTeamThreadKeyRequest
    responses:
      "200":
        description: Stored, or already stored
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TeamThreadKeyStored
      "400":
        description: A malformed thread id, key version, copy or signature
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`), or the signature does not verify with the sender's signing key
          (`invalid_signature`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: Not your thread in this organization, or not your device (`thread_not_found`, `device_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "409":
        description: >-
          The sender is pending or revoked (`device_not_trusted`); none of your devices holds `keyVersion`
          (`key_version_not_held`); the thread is private (`thread_private`); or `teamKeyId` is not the current epoch
          (`team_key_retired`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "410":
        description: You deleted the thread (`thread_deleted`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
    x-idempotency: optional
/v1/threads/{threadId}/team-keys:
  get:
    tags:
      - Threads
    operationId: listTeamThreadKeys
    summary: A thread's content key copies locked to the team key's epochs, for its person and for teammates who read it.
    description: >-
      Who reads the thread's live stream reads these: its person, and a member of its organization while the thread is
      team-visible and `multiplayerSessions` is on. Open the team key's epoch with your holder's copy (`GET
      /v1/orgs/team-key?holder=`), then the thread key. Check each signature against the thread's person's trusted
      device before you use the copy.
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description: The thread's id, as its client names it
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TeamThreadKeyList
      "400":
        description: A malformed thread id
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "403":
        description: >-
          Not a person (`person_required`); or Nexus UI while the organization's `webSessionViewer` is off
          (`web_session_viewer_off`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "404":
        description: No such thread you read in this organization (`thread_not_found`)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      "429":
        $ref: ../components/common.yaml#/responses/RateLimited
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
    x-nexus-permission: chat.use
