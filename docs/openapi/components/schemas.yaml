            - amountUsd
            - byLevel
    groups:
      type: array
      items:
        type: object
        properties:
          key:
            type: string
            description: >-
              Team id, user id, model, provider, product/capability, key id or day; `ui:<user id>` for a person's Nexus
              UI sessions; `unassigned` for no team (or person, or key); `others` for a member's teammates (or their
