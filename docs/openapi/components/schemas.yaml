  required:
    - dryRun
    - prune
    - created
    - moved
    - renamed
    - relevelled
    - membershipsAdded
    - rolesChanged
    - membershipsRemoved
    - pending
    - pendingRemoved
    - defaults
    - deleted
    - warnings
    - totals
    - plan
TeamKey:
