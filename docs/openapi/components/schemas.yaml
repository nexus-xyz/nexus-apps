              retryable: false
              meaning: A model policy refuses this model.
            - code: model_not_found
              status: 404
              retryable: false
              meaning: No such model in the catalog.
            - code: model_not_supported
              status: 400
              retryable: false
              meaning: The model does not take this kind of call.
            - code: model_no_image_input
              status: 400
              retryable: false
              meaning: The model does not read images.
            - code: model_no_tools
              status: 400
              retryable: false
              meaning: The model does not take tool calls.
            - code: output_over_limit
              status: 400
              retryable: false
              meaning: "`max_tokens` is above the limit for this call."
            - code: reasoning_effort_not_offered
              status: 400
              retryable: false
              meaning: The model does not offer this reasoning effort.
            - code: response_format_not_offered
              status: 400
              retryable: false
              meaning: The model does not offer this response format.
            - code: tool_choice_not_offered
              status: 400
              retryable: false
              meaning: The model does not offer a forced tool choice.
            - code: hosted_tool_not_priced
              status: 400
              retryable: false
