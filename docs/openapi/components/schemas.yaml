      type: string
      description: The member who made the epoch.
    createdAt:
      type: string
      format: date-time
    retiredAt:
      type:
        - string
        - "null"
      format: date-time
      description: "Set when a member's removal or a device revoke retired the epoch: the next epoch is due."
    retiredReason:
      type:
        - string
        - "null"
