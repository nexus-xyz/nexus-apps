                      deprecated: true
                      description: "Deprecated: read `amountUsdDecimal`, the exact decimal string (root rule 9)."
                    amountUsdDecimal:
                      type: string
                      description: >-
                        `amountUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                        micro-dollars. Prefer it to `amountUsd`.
                  required:
                    - calls
                    - amountUsd
