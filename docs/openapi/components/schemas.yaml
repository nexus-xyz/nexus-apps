    rule:
      $ref: "#/PolicyRuleRef"
    code:
      type: string
      enum:
        - model_not_allowed
        - model_not_found
        - model_not_supported
        - provider_disabled
    resolvedFrom:
      type: string
      enum:
        - nexus/auto
        - nexus/default
    defaultFrom:
      $ref: "#/PolicyRuleRef"
    notes:
      type: array
      items:
        type: string
ModelPolicy:
  type: object
