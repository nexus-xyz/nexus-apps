NexusCredits:
  type: object
  description: >-
    The organization's prepaid Nexus credits, its own money, never expiring. A Nexus feature's call spends them after
    the free start, at its provider cost plus `markupBps`. Decimal dollar strings.
  required:
    - purchasedUsd
    - spentUsd
    - reservedUsd
    - remainingUsd
    - markupBps
  properties:
    purchasedUsd:
      type: string
      description: Bought, over all time.
    spentUsd:
      type: string
      description: "What settled calls cost the credits: each call's provider cost plus `markupBps`."
    reservedUsd:
      type: string
      description: Held by calls in progress.
    remainingUsd:
      type: string
      description: >-
        Bought, less spent, held and reversed. Below zero after a refund or a lost dispute took back credit that was
        already spent: then Nexus pays for no call (the free start, credits or the card after the fact) until a purchase
        pays it back.
    reversedUsd:
      type: string
      description: >-
        What refunds, lost disputes and operators took back, and what an open dispute holds of its purchase until it
        closes. A refund that fails gives its credit back. Only while something is taken back.
    markupBps:
      type: integer
      description: Nexus's rate on AI in basis points (500 is 5%).
