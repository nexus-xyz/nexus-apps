    level:
      type: string
      enum:
        - organization
        - team
        - agent
    subject:
      type: string
    team:
      type: object
    rule:
      $ref: "#/ModelRule"
    custom:
      type: boolean
      description: "False: no rule at this level"
    migrated:
      type: boolean
      description: Read from the old agent policy, not saved since
    updatedAt:
      type: string
      format: date-time
    inherited:
      type: array
      items:
        type: object
    effective:
      type: object
      description: What the levels down to this one allow, and the defaults they resolve to
    notes:
      type: array
      items:
        type: string
ModelRule:
  type: object
  description: >-
    A model access rule. Patterns: an exact model (`anthropic/claude-opus-5.5`, any spelling), a provider
    (`anthropic/*`) or a family (`openai/gpt-6-*`). No allow list (or an empty one): every model the levels above allow.
    A deny wins at any level. Coming-soon models may be named (accepted with a note; no effect until supported).
  properties:
    allow:
      type: array
      items:
        type: string
      maxItems: 100
    deny:
      type: array
      items:
        type: string
      maxItems: 100
    defaults:
      type: object
      description: >-
        What `nexus/auto` and `nexus/default` resolve to, per kind; the most specific level that names one wins. Must be
        supported and allowed by this rule's own lists.
      properties:
        chat:
          type: string
        claude:
          type: string
        codex:
          type: string
    maxPrice:
      type: object
      description: >-
        Refuses a model priced above either limit, in USD per million tokens. A price equal to the limit passes. A side
        left out has no limit. A model with no price is refused. Applies at every level, and a lower level only narrows.
      properties:
        input:
          type: number
          minimum: 0
        output:
          type: number
          minimum: 0
      additionalProperties: false
    denyCountries:
      type: object
      description: >-
        Refuses a model whose maker country or provider country is listed. Countries are ISO 3166-1 alpha-2 codes,
        listed one by one. A model with no catalog entry is refused when a side is listed. Applies at every level, and a
        lower level only narrows.
      properties:
        maker:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
          minItems: 1
        provider:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
          minItems: 1
      additionalProperties: false
    providers:
      type: object
      description: >-
        Which providers calls may use, by catalog provider id (`GET /v1/providers`). A provider in `deny` is off. With
        `allow`, only the providers it lists are on, so a provider added to the catalog later stays off until it is
        listed. Without either, every provider is on. A provider in both lists is off: `deny` wins. An empty `allow` is
        refused with 400 `providers_allow_empty`: omit `allow` to allow every provider. A model whose providers are all
        off is refused with 403 `provider_disabled`, and is not `allowed` in `GET /v1/models`. Set on the organization's
        policy only. An unknown id is refused with 400 `unknown_provider`.
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
      additionalProperties: false
  additionalProperties: false
ModuleManifest:
