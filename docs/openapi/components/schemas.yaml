            - code: provider_retired
              status: 400
              retryable: false
              meaning: The provider is retired. Add a key for a supported provider.
            - code: provider_disabled
              status: 403
              retryable: false
              meaning: The organization turned off every provider for this model.
            - code: unknown_provider
              status: 400
              retryable: false
              meaning: The policy names an unknown provider.
            - code: providers_allow_empty
