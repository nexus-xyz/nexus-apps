          - path
          - data
        properties:
          path:
            type: string
            maxLength: 512
            description: The file's path in the app, relative, with `/` between folders.
          data:
            type: string
            contentEncoding: base64
            description: The file's bytes, standard base64.
DesignSourceFile:
  type: object
  required:
    - path
    - text
  properties:
    path:
      type: string
      description: Relative to the synced folder; the name says how it is read
    text:
      type: string
  additionalProperties: false
  description: "A file a sync read: a tokens.json, a Tailwind config, or CSS."
DesignSystem:
  type: object
  required:
    - id
    - name
    - builtIn
    - isDefault
    - source
    - variableCount
    - componentCount
  properties:
    id:
      type: string
      description: "`ds_…`; the built-in is `ds_nexus_brand`"
    name:
      type: string
      description: "`@nexus/brand`, or the organization's own name (`acme`, `@acme/web`)"
    builtIn:
      type: boolean
      description: "Compiled into Gateway: it cannot be changed or deleted"
    isDefault:
      type: boolean
      description: "The organization's default: new designs use it"
    source:
      type: string
      description: Where it came from, in words
    variableCount:
      type: integer
    componentCount:
      type: integer
    updatedAt:
      type: string
      format: date-time
      description: Unset for the built-in
  description: A design system for Nexus Design, as the organization lists it.
DesignSystemDeleted:
  type: object
  required:
    - id
    - deleted
    - defaultId
  properties:
    id:
      type: string
    deleted:
      type: boolean
    defaultId:
      type: string
      description: The default now
  description: A deleted design system.
DesignSystemDetail:
  allOf:
    - $ref: "#/DesignSystem"
    - type: object
      required:
        - css
        - variables
        - notes
        - components
      properties:
        css:
          type: string
          description: "The tokens as CSS: `selector { --name: value; }` blocks and nothing else"
        variables:
          type: array
          items:
            $ref: "#/DesignVariable"
        notes:
          type: string
          description: Markdown for the model
        components:
          type: array
          items:
            type: string
  description: A design system with its tokens, notes and components.
DesignSystemList:
  type: object
  required:
    - designSystems
    - defaultId
  properties:
    designSystems:
      type: array
      items:
        $ref: "#/DesignSystem"
    defaultId:
      type: string
  description: The organization's design systems and its default.
DesignSystemSaved:
  type: object
  required:
    - designSystem
    - created
    - read
  properties:
    designSystem:
      $ref: "#/DesignSystem"
    created:
      type: boolean
      description: False when it replaced one of the same name
    read:
      type: array
      items:
        type: string
      description: What each file gave, in words
  description: What a save wrote.
DesignVariable:
  type: object
  required:
    - name
    - value
    - selector
    - kind
  properties:
    name:
      type: string
      description: "`--nx-page`"
    value:
      type: string
    selector:
      type: string
      description: "`:root`, or a theme such as `[data-theme=\"light\"]`"
    kind:
      type: string
      enum:
        - color
        - length
        - font
        - other
  description: One CSS custom property of a design system.
DeveloperClient:
  type: object
  description: An OAuth client as its author sees it.
  required:
    - id
    - name
    - tier
    - allowedScopes
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      description: "`nxc_…`"
    name:
      type: string
    tier:
      type: string
      enum:
        - official
        - registered_fork
        - unregistered
    allowedScopes:
      type: array
      items:
        type: string
      description: "The actions a token of this client may hold: the client's own list, or every third-party scope when it has none."
    rateLimitPerMinute:
      type: integer
      description: "Omitted: the tier's default limit."
    maxConcurrentPerUser:
      type: integer
      description: "Omitted: the tier's default limit."
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
    revokedReason:
      type: string
DeveloperClientList:
  type: object
  required:
    - clients
    - grantableScopes
  properties:
    clients:
      type: array
      items:
        $ref: "#/DeveloperClient"
    grantableScopes:
      type: array
      items:
        type: string
      description: The scopes a fork may ask for, in their canonical order.
Device:
  type: object
  required:
    - id
    - name
    - kind
    - encryptionKey
    - signingKey
    - state
    - approvedBy
    - approvalSignature
    - createdAt
    - approvedAt
    - revokedAt
    - handover
  properties:
    id:
      type: string
    name:
      type: string
    kind:
      type: string
      enum:
        - device
        - passkey
        - recovery_code
      description: >-
        `device`, or one of your recovery keys: a `passkey` (WebAuthn PRF) or a printable `recovery_code`. A recovery
        key has an X25519 key and no Ed25519 key: it receives locked copies and never signs.
    encryptionKey:
      type: string
      description: X25519 public key, base64url.
    signingKey:
      type:
        - string
        - "null"
      description: Ed25519 public key, base64url. Null for a recovery key, which never signs.
    state:
      type: string
      enum:
        - pending
        - trusted
        - revoked
    approvedBy:
      type:
        - string
        - "null"
      description: >-
        The device that approved it; null for a device trusted without an approval (your first device, or a recovered
        one) and for one never approved.
    approvalSignature:
      type:
        - string
        - "null"
      description: >-
        The approver's signature over `nexus-device-approval:v1:{id}:{encryptionKey}:{signingKey}` for a device, or
        `nexus-device-approval:v2:{id}:{kind}:{encryptionKey}:` for a recovery key.
    createdAt:
      type: string
      format: date-time
    approvedAt:
      type:
        - string
        - "null"
      format: date-time
      description: When it became trusted.
    revokedAt:
      type:
        - string
        - "null"
      format: date-time
    handover:
      type:
        - string
        - "null"
      description: >-
        The approver's trusted list, signed and sealed to this device (`approveDevice`'s `handover`). Null for a root, a
        recovery key and an approval sent without one. Only this device opens it.
  description: One of your devices or recovery keys for end-to-end encrypted session sync. Gateway holds its public keys only.
DeviceList:
  type: object
  required:
    - devices
    - trust
  properties:
    devices:
      type: array
      items:
        $ref: "#/Device"
    trust:
      type: string
      enum:
        - approvals
        - gateway
      description: >-
        How this Gateway trusts a person's later devices. `approvals`: a trusted device signs each one's approval.
        `gateway`: Gateway trusts each device a signed-in person registers at once, with no approver. An older Gateway
        leaves it out: read that as `approvals`.
  description: "`listDevices`'s answer, oldest first."
DeviceThreadKey:
  type: object
  required:
    - threadId
    - keyVersion
    - lockedKey
    - signature
  additionalProperties: false
  properties:
    threadId:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,128}$
    keyVersion:
      type: integer
      minimum: 1
      description: "The content key's version: 1 first, one more at each rotation."
    lockedKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,512}$
      description: The thread's content key, HPKE-sealed to the device's `encryptionKey`, base64url.
    signature:
      type: string
      pattern: ^[A-Za-z0-9_-]{86}$
      description: >-
        The approver's Ed25519 signature over `nexus-thread-key:v1:{threadId}:{keyVersion}:{deviceId}:{lockedKey}`,
        where deviceId is the device being approved: 64 bytes, base64url without padding.
  description: One thread's locked copy, at a key version you hold, for the device being approved.
DiagnosticReport:
  type: object
  required:
    - kind
    - fatal
    - name
    - occurredAt
    - appVersion
    - platform
    - osVersion
  additionalProperties: false
  properties:
    kind:
      type: string
      enum:
        - error
        - crash
      description: >-
        `error`: an error in the app's JavaScript; `crash`: a native crash (the OS's, or a desktop panic) seen at the
        next start
    fatal:
      type: boolean
      description: Whether it ended the app
    name:
      type: string
      minLength: 1
      maxLength: 120
      description: The error's name (`TypeError`), or the crash's exception and signal
    message:
      type: string
      maxLength: 500
      description: The error's message, already redacted by the app; may be empty
    stack:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 300
      description: "The top frames: a function and its place in the bundle, or a binary and its offset"
    occurredAt:
      type: string
      format: date-time
      description: When it happened
    appVersion:
      type: string
      minLength: 1
      maxLength: 40
      description: The app's version
    appBuild:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 40
      description: The store build number, when the app knows it
    platform:
      type: string
      enum:
        - ios
        - android
        - macos
        - windows
        - linux
        - web
    osVersion:
      type: string
      minLength: 1
      maxLength: 40
      description: The OS version the report came from
DiagnosticReports:
  type: object
  required:
    - reports
  additionalProperties: false
  properties:
    reports:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: "#/DiagnosticReport"
DiagnosticReportsAccepted:
  type: object
  required:
    - accepted
  properties:
    accepted:
      type: integer
      description: How many reports went to the log
DomainList:
  type: object
  required:
    - domains
  properties:
    domains:
      type: array
      items:
        $ref: "#/OrgDomain"
DomainSuggestion:
  type: object
  required:
    - domain
    - org
  description: >-
    An organization the signed-in person may join by domain: a Nexus operator assigned `domain` to it, and the person's
    Google sign-in has it as its `hd`, with a verified email on it.
  properties:
    domain:
      type: string
      description: The domain, lower-case.
    org:
      $ref: "#/OrgSummary"
      description: The organization; no `role` or `current`, since the person is not a member yet.
DomainSuggestionList:
  type: object
  required:
    - suggestions
  properties:
    suggestions:
      type: array
      items:
        $ref: "#/DomainSuggestion"
EmbeddedCardSetup:
  type: object
  required:
    - checkoutSessionId
    - clientSecret
    - publishableKey
    - expiresAt
  properties:
    checkoutSessionId:
      type: string
      description: Exact Checkout session to confirm.
    clientSecret:
      type: string
      description: >-
        The session's client secret: Stripe.js mounts the form with it (`createEmbeddedCheckoutPage`). It opens only
        this session's form.
    publishableKey:
      type: string
      description: Gateway's a server setting (`pk_test_…` or `pk_live_…`, the same mode as its secret key), for `loadStripe`.
    expiresAt:
      type: string
      format: date-time
      description: When Stripe stops accepting the form.
Error:
  type: object
  properties:
    error:
      type: object
      required:
        - message
        - type
      properties:
        message:
          type: string
        type:
          type: string
          description: >-
            The class of the error: invalid_request_error (400, 405, 408, 409, 412, 413, 422, 426, 428),
            authentication_error (401), billing_error (402), permission_error (403), not_found (404), rate_limit_error
            (429), or a 5xx type such as server_error.
        code:
          type: string
          description: >-
            Stable. Branch on it, not on `message`. The table in `x-error-codes` lists every documented code. A client
            must treat an unknown code by its HTTP status. The provider-compatible routes answer in the provider's error
            shape.
          x-error-codes:
            - code: invalid_request
              status: 400
              retryable: false
              meaning: The request is malformed. The message says what to fix.
            - code: unauthenticated
              status: 401
              retryable: false
              meaning: No valid credential. Sign in again.
            - code: payment_required
              status: 402
              retryable: false
              meaning: The organization must pay before this call runs.
            - code: forbidden
              status: 403
              retryable: false
              meaning: The caller's role does not allow this action.
            - code: not_found
              status: 404
              retryable: false
              meaning: The resource does not exist or the caller cannot see it.
            - code: method_not_allowed
              status: 405
              retryable: false
              meaning: The path does not take this HTTP method.
            - code: request_timeout
              status: 408
              retryable: true
              meaning: The request body arrived too slowly.
            - code: conflict
              status: 409
              retryable: false
              meaning: The request conflicts with the current state.
            - code: unprocessable
              status: 422
              retryable: false
              meaning: The request is well formed but cannot be applied.
            - code: rate_limited
              status: 429
              retryable: true
              meaning: The caller or its OAuth client exceeded a rate limit. Wait for `Retry-After`, then retry.
            - code: idempotency_key_required
              status: 428
              retryable: false
              meaning: A state-changing POST has no `Idempotency-Key` header. Add one and send again.
            - code: if_match_required
              status: 428
              retryable: false
              meaning: >-
                A write to a resource that serves an `ETag` has no `If-Match` header. Read the resource, then send its
                `ETag`.
            - code: version_mismatch
              status: 412
              retryable: false
              meaning: >-
                The `If-Match` value is not the current version. The `ETag` header (and `nexus.etag` on the Gateway)
                holds the current one. Read the resource again, merge, and retry.
            - code: invalid_idempotency_key
              status: 400
              retryable: false
              meaning: The `Idempotency-Key` is not 1 to 255 printable ASCII characters.
            - code: idempotency_key_reused
              status: 422
              retryable: false
              meaning: The key was used before for a different request. Use a new key for a new request.
            - code: idempotency_in_progress
              status: 409
              retryable: true
              meaning: The first request with this key still runs. Retry with the same key in a moment.
            - code: idempotency_interrupted
              status: 409
              retryable: false
              meaning: >-
                The first request with this key was cut off and may have run in part. Check the state, then use a new
                key.
            - code: idempotency_response_not_stored
              status: 409
              retryable: false
              meaning: The first answer was too large to keep. The request is not run again.
            - code: idempotency_stream_replay
              status: 409
              retryable: false
              meaning: The key belongs to a finished streamed model call. A stream is not replayed or charged again.
            - code: idempotency_already_charged
              status: 409
              retryable: false
              meaning: A model call with this key was already charged. It is not run again.
            - code: idempotency_already_sent
              status: 409
              retryable: false
              meaning: A message with this key was already sent to this session. It is not sent again.
            - code: invalid_credential
              status: 401
              retryable: false
              meaning: The token is unknown, expired or revoked. Sign in again.
            - code: invalid_client
              status: 400
              retryable: false
              meaning: The sign-in names a malformed, unknown or revoked OAuth client. Start again with a valid client id.
            - code: client_revoked
              status: 401
              retryable: false
              meaning: The OAuth client for this credential is revoked or unknown. Sign in with another client.
            - code: client_scope
              status: 403
              retryable: false
              meaning: The OAuth client does not allow the requested action.
            - code: client_concurrency_limit
              status: 429
              retryable: true
              meaning: You have too many requests in flight through this OAuth client. Wait for `Retry-After`, then retry.
            - code: oauth_client_tiers_off
              status: 404
              retryable: false
              meaning: This Gateway has not enabled OAuth client tiers.
            - code: invalid_grant
              status: 400
              retryable: false
              meaning: >-
                The authorization code is unknown, used, expired or mismatched, or an agent link's grant is empty. Start
                the sign-in again.
            - code: invalid_code
              status: 400
              retryable: false
              meaning: The code is unknown or expired. Start the sign-in again.
            - code: code_used
              status: 409
              retryable: false
              meaning: The one-time code was already used.
            - code: reserved_client
              status: 400
              retryable: false
              meaning: The client id is reserved for another agent's sign-in.
            - code: invalid_scope
              status: 400
              retryable: false
              meaning: A requested scope cannot be granted to an agent.
            - code: grant_not_allowed
              status: 400
              retryable: false
              meaning: A requested permission cannot be granted to an agent.
            - code: person_required
              status: 403
              retryable: false
              meaning: Only a signed-in person can do this, not a service account.
            - code: role_required
              status: 403
              retryable: false
              meaning: Only a signed-in member can do this.
            - code: not_a_person
              status: 403
              retryable: false
              meaning: >-
                Your agent's routes take a person's own token or their agent link, not a service account's, a module's
                or an operator's.
            - code: missing_credential
              status: 401
              retryable: false
              meaning: "Send `Authorization: Bearer <key>`: your agent's routes take your own token."
            - code: owner_only
              status: 403
              retryable: false
              meaning: Only an owner of the organization can do this.
            - code: confirmation_required
              status: 400
              retryable: false
              meaning: Type the confirmation text to confirm a destructive action.
            - code: api_key_limit
              status: 409
              retryable: false
              meaning: The person holds the most API keys allowed. Revoke one first.
            - code: agent_link_limit
              status: 409
              retryable: false
              meaning: The person holds the most agent links allowed. Unlink one first.
            - code: unknown_agent_link
              status: 404
              retryable: false
              meaning: No such agent link.
            - code: key_not_live
              status: 409
              retryable: false
              meaning: The key is already revoked or expired.
            - code: key_signup_off
              status: 403
              retryable: false
              meaning: Key-only sign-up is off. Sign in with the device flow.
            - code: organization_required
              status: 409
              retryable: false
              meaning: The action needs an organization of your own.
            - code: unknown_organization
              status: 404
              retryable: false
              meaning: No such organization.
            - code: personal_org
              status: 409
              retryable: false
              meaning: This is a personal organization. Name a company organization.
            - code: not_a_member
              status: 403
              retryable: false
              meaning: The named person is not a member of this organization.
            - code: owner_not_a_member
              status: 400
              retryable: false
              meaning: The new owner is not a member of this organization.
            - code: owner_role
              status: 409
              retryable: false
              meaning: The owner's role changes only by a transfer of ownership.
            - code: not_an_admin
              status: 409
              retryable: false
              meaning: Only an admin can be allowed to set spend limits.
            - code: limit_grant_required
              status: 403
              retryable: false
              meaning: Only owners, and admins an owner allows, can set person spend limits.
            - code: use_nexus_ui
              status: 409
              retryable: false
              meaning: Do this in the web app, which keeps the identity provider in step.
            - code: clerk_failed
              status: 502
              retryable: true
              meaning: The identity provider failed. Retry later.
            - code: clerk_refused
              status: 409
              retryable: false
              meaning: The identity provider refused the change.
            - code: not_a_clerk_org
              status: 409
              retryable: false
              meaning: The organization does not use single sign-on, so it has no email domains.
            - code: domain_not_yours
              status: 403
              retryable: false
              meaning: Only a person who signs in with single sign-on can add an email domain.
            - code: invalid_domain
              status: 400
              retryable: false
              meaning: The email domain is not valid.
            - code: public_mail_domain
              status: 400
              retryable: false
              meaning: The domain is a public mail provider and cannot admit people.
            - code: count_changed
              status: 409
              retryable: false
              meaning: The invitation list changed since you reviewed it. Review it again.
            - code: plan_changed
              status: 409
              retryable: false
              meaning: The organization changed since the dry run. Run it again.
            - code: slug_taken
              status: 409
              retryable: false
              meaning: Another resource already uses this slug.
            - code: verified_email_required
              status: 400
              retryable: false
              meaning: The action needs a verified email on the sign-in.
            - code: unknown_team
              status: 404
              retryable: false
              meaning: No such team in this organization.
            - code: not_in_team
              status: 403
              retryable: false
              meaning: You are not in this team.
            - code: has_children
              status: 409
              retryable: false
