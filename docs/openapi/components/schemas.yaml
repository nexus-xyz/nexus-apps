        - closed
        - declined
        - authentication_required
        - payment_failed
        - no_payment_method
        - disputed
        - refunded
        - null
      description: >-
        Why Gateway turned it off; null while it is on, or after an owner turned it off. `refunded`: a credit purchase
        was refunded, or a refund took the credits below zero.
    todayCount:
      type: integer
      description: "Top-ups charged this UTC day: at most 3."
    todayUsd:
      type: string
      description: "What they bought: at most $500 a day."
    pending:
      type: boolean
      description: A top-up is being charged, or Stripe is still taking its payment.
Billing:
  type: object
  required:
    - mode
    - customer
    - paymentMethod
    - defaultPaymentMethod
    - pastDue
    - pricing
  properties:
    sharedPaymentTokens:
      type: boolean
      description: >-
        True when this Gateway supports delegated Stripe shared payment tokens on credit purchases. Currently enabled
        only in Stripe test mode; live mode returns false. Check before submitting a token.
    mode:
      type: string
      enum:
        - test
        - live
      description: The mode of Gateway's Stripe key.
    customer:
      type:
        - object
        - "null"
      description: Null until the first card setup starts.
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - creating
            - ready
          description: >-
            `creating`: Gateway started the Stripe customer and the first setup has not finished. `ready`: the customer
            exists.
    paymentMethod:
      oneOf:
        - $ref: "#/CardSummary"
        - type: "null"
      description: >-
        The payment method on file when it is a card. Null when there is none, or when it is not a card: read
        `defaultPaymentMethod` for any type.
    defaultPaymentMethod:
      oneOf:
        - $ref: "#/PaymentMethodSummary"
        - type: "null"
      description: >-
        The payment method on file, of any type: the one credits, auto top-ups and charges for usage after the fact are
        charged to. Null until one is saved.
    credits:
      oneOf:
        - $ref: "#/NexusCredits"
        - type: "null"
      description: The organization's prepaid Nexus credits; null before it buys any.
    autoTopup:
      oneOf:
        - $ref: "#/AutoTopup"
        - type: "null"
      description: The organization's auto top-up of Nexus credits; null before an owner sets it.
    planAllowance:
      type: object
      description: The current plan's monthly allowances. Absent when no allowance is available.
      required:
        - resetAt
        - ai
        - cloud
      properties:
        resetAt:
          type: string
          format: date-time
          description: Start of the next usage month in UTC.
        ai:
          type:
            - object
            - "null"
          description: AI allowance in decimal USD, counting settled usage. Null until the allowance is granted.
          required:
            - includedUsd
            - usedUsd
            - leftUsd
          properties:
            includedUsd:
              type: string
            usedUsd:
              type: string
            leftUsd:
              type: string
        cloud:
          type:
            - object
            - "null"
          description: Cloud allowance in default-size hours. Null when plan cloud metering is unavailable.
          required:
            - includedHours
            - usedHours
            - leftHours
          properties:
            includedHours:
              type: number
            usedHours:
              type: number
            leftHours:
              type: number
    pastDue:
      type:
        - object
        - "null"
      description: Null while no month of this mode is unpaid after Stripe tried to collect it. Otherwise the oldest such month.
      required:
        - since
        - period
        - blockedFrom
        - invoiceUrl
      properties:
        since:
          type: string
          format: date-time
          description: When the month first failed.
        period:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: The unpaid month, YYYY-MM.
        blockedFrom:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            `since` plus the grace. From then on model calls are refused with 402 `payment_past_due`. Null when this
            Gateway has no gate, so nothing is refused.
        invoiceUrl:
          type:
            - string
            - "null"
          format: uri
          description: Stripe's page that pays the unpaid month (its hosted invoice). Null when Stripe gave none.
    pricingChange:
      type:
        - object
        - "null"
      description: >-
        A change to Nexus pricing and the Customer Terms, until 30 days past the day it takes effect. Each organization
        created before that day is told once by `billing.pricing_change`. Null, or absent from an older Gateway, when
        there is none.
      required:
        - effectiveOn
      properties:
        effectiveOn:
          type: string
          format: date
          description: "The day the change takes effect, at 00:00 UTC: YYYY-MM-DD."
    plan:
      oneOf:
        - $ref: "#/BillingPlan"
        - type: "null"
      description: The organization's plan; null on the Free plan
    freeStart:
      type:
        - object
        - "null"
      description: "The organization's free start (pricing v2.0): what Nexus gave it once, and what is left. Null when it got none."
      required:
        - grantedUsd
        - remainingUsd
      properties:
        grantedUsd:
          type: string
          description: What Nexus gave, a decimal dollar string.
        remainingUsd:
          type: string
          description: What is left, never below zero.
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            When the free start expires, or expired: 30 days after its grant. Null when the organization's subsidy holds
            no free start.
        expiredUsd:
          type:
            - string
            - "null"
          description: What was left of the free start when it expired, a decimal dollar string. Null before it expires.
    afterTheFact:
      oneOf:
        - $ref: "#/AfterTheFact"
        - type: "null"
      description: How the organization pays after the fact (pricing v2.0); null before an owner turns it on.
    pricing:
      type: object
      description: The numbers a billing page shows, so no client writes a price of its own. Decimal dollar strings.
      required:
        - markupBps
        - minPurchaseUsd
        - thresholdUsd
        - defaultLimitUsd
        - maxLimitUsd
      properties:
        markupBps:
          type: integer
          description: >-
            Nexus's rate on AI it runs past the free start and a plan's allowance, in basis points: 500 is provider
            price + 5%. App hosting and cloud machines have their own prices.
        minPurchaseUsd:
          type: string
          description: The least one credit purchase buys.
        thresholdUsd:
          type: string
          description: Paying after the fact, the card is charged each time the unpaid usage reaches this.
        defaultLimitUsd:
          type: string
          description: The monthly usage limit a new after-the-fact setting starts at.
        maxLimitUsd:
          type: string
          description: >-
            The most a usage limit may be now for this organization: $100 in its first week, then $100,000. A higher
            `limitUsd` answers 400 `invalid_amount`.
        freeStartMaxOutputUsd:
          type: string
          description: The free start pays only for a model whose cheapest host charges at most this per million output tokens.
        minFinalChargeUsd:
          type: string
          description: Minimum final charge when pay after the fact turns off.
    promotionalCreditUsd:
      type: string
      description: Available referral and promotional credit, excluding the welcome free start.
BillingInvoice:
  type: object
  required:
    - state
    - hostedInvoiceUrl
  description: The Stripe invoice of one stored month.
  properties:
    state:
      type: string
      enum:
        - invoicing
        - invoiced
        - paid
        - failed
        - void
        - uncollectible
      description: >-
        `invoicing`: Gateway is making the invoice and nothing is charged yet. `invoiced`: Stripe has the invoice and
        charges the payment method on file; a bank debit on its way stays `invoiced` for days. `paid`, `failed`, `void`
        and `uncollectible`: where Stripe left it.
    hostedInvoiceUrl:
      type:
        - string
        - "null"
      description: Stripe's page for the invoice. Null until Stripe has finalized it.
BillingOperation:
  type: object
  required:
    - kind
    - status
  properties:
    kind:
      type: string
      enum:
        - card
        - credits
    status:
      type: string
      description: "`superseded`: a newer card setup set its card first, so this one ended without setting the default."
      enum:
        - pending
        - complete
        - expired
        - failed
        - superseded
BillingPlan:
  type: object
  description: A plan's subscription as Stripe keeps it
  properties:
    plan:
      type: string
      description: A plan in a server setting, such as plus, pro, teams_plus or teams_pro
    interval:
      type: string
      enum:
        - month
        - year
    status:
      type: string
      description: "Stripe's status: active and trialing get the included usage; past_due, unpaid, canceled and the others do not"
    seats:
      type: integer
    currentPeriodEnd:
      type: string
      format: date-time
    cancelAtPeriodEnd:
      type: boolean
      description: >-
        The plan ends instead of renewing when this period ends: Stripe's flag, or a cancelAt on or before the period's
        end
    cancelAt:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
      description: >-
        When a cancelled plan ends (ISO 8601): the period's end, a day before it, or a day in a later period, as
        Stripe's cancel_at sets it; null while the plan renews. While it is set, the plan cannot change (409
        plan_ending).
    includedUsd:
      type: string
      description: This month's included usage, as a decimal string with six places; it resets each month and does not roll over
      pattern: ^[0-9]+\.[0-9]{6}$
      examples:
        - "10.000000"
    includedHours:
      type: integer
      minimum: 0
      description: >-
        This month's cloud hours, in hours of the default machine size, pooled across the seats of a per-seat plan; 0
        when a server setting sets none (pricing v3.0)
    hourlyUsd:
      oneOf:
        - type: string
          pattern: ^[0-9]+\.[0-9]{6}$
        - type: "null"
      description: >-
        The price of a default-size hour past the plan's hours, as a decimal string with six places; null when a server
        setting sets none
      examples:
        - "0.080000"
    sizes:
      type: array
      items:
        type: string
        enum:
          - small
          - default
          - large
          - xlarge
      description: The machine sizes the plan allows, smallest first; only default when a server setting sets none
    pendingChange:
      oneOf:
        - type: object
          required:
            - plan
            - interval
            - seats
            - at
          properties:
            plan:
              type: string
            interval:
              type: string
              enum:
                - month
                - year
            seats:
              type: integer
            at:
              type: string
              description: "When it applies: the period's end (ISO 8601)."
        - type: "null"
      description: A change for the period's end; null without one.
  required:
    - plan
    - interval
    - status
    - seats
    - currentPeriodEnd
    - cancelAtPeriodEnd
    - cancelAt
    - includedUsd
    - includedHours
    - hourlyUsd
    - sizes
BillingPortal:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      description: "Stripe's customer portal for the organization. Open it at once: it expires within minutes."
BillingStatement:
  type: object
  required:
    - period
    - lines
    - providerCostUsd
    - carriedInUsd
    - totalUsd
    - amountCents
    - carriedOutUsd
    - invoice
  description: One UTC month's bill. Every amount of money is a decimal string in US dollars with six decimals.
  properties:
    period:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      examples:
        - 2026-10
      description: The month, as YYYY-MM.
    lines:
      type: array
      items:
        $ref: "#/BillingStatementLine"
      description: Every charge. Both lines are always there, with amount 0 until a price is set.
    providerCostUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: What the providers charged for the calls on the organization's own keys. The providers bill it, not Nexus.
      examples:
        - "3.333333"
    carriedInUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: "The rest of the month before: the part of its total that no invoice took."
      examples:
        - "0.000000"
    totalUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: The lines and `carriedInUsd` added.
      examples:
        - "1.083333"
    amountCents:
      type: string
      pattern: ^[0-9]+$
      examples:
        - "108"
      description: >-
        What to charge: `totalUsd` in whole cents, rounded down. A whole number as a string. A month under 50 cents is
        not invoiced.
    carriedOutUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: >-
        What moves to the next month: the part of `totalUsd` below one cent. A month under 50 cents is not invoiced, so
        all of its total moves.
      examples:
        - "0.003333"
    invoice:
      oneOf:
        - $ref: "#/BillingInvoice"
        - type: "null"
      description: >-
        The Stripe invoice of a stored month. Null for a month that is priced now, and for a stored month under 50
        cents, which is not invoiced.
BillingStatementLine:
  type: object
  required:
    - code
    - unit
    - quantity
    - amountUsd
  description: >-
    One charge of a statement. A `call` line charges a price for each call. A `usd` line charges basis points of a
    dollar amount.
  properties:
    code:
      type: string
      enum:
        - gateway.calls
        - gateway.provider_cost
        - gateway.nexus_usage
      description: >-
        `gateway.calls`: the calls on the organization's own keys. `gateway.provider_cost`: Nexus's fee on what the
        providers charged for them. `gateway.nexus_usage`: a contract's calls on Nexus-supplied keys, at provider price
        plus Nexus's rate; only on a month that has some.
    unit:
      type: string
      enum:
        - call
        - usd
    quantity:
      type: string
      description: "Unit `call`: a whole number of calls. Unit `usd`: a decimal dollar amount."
      examples:
        - "250"
    rateUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: "Unit `call` only: the price of one call."
      examples:
        - "0.004000"
    rateBps:
      type: integer
      minimum: 0
      maximum: 10000
      description: "Unit `usd` only: basis points of `quantity` (100 is 1%)."
      examples:
        - 250
    amountUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: "`quantity` times the rate, rounded down to a micro-dollar."
      examples:
        - "1.000000"
BillingStatementList:
  type: object
  required:
    - statements
  properties:
    statements:
      type: array
      items:
        $ref: "#/BillingStatementSummary"
      description: The stored months, newest first, at most 24.
BillingStatementSummary:
  type: object
  required:
    - period
    - totalUsd
    - amountCents
    - state
    - hostedInvoiceUrl
  description: One stored month in the list of statements. Money is a decimal string in US dollars with six decimals.
  properties:
    period:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      examples:
        - 2026-09
      description: The month, as YYYY-MM.
    totalUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      examples:
        - "0.762000"
      description: The lines and the rest carried in, added.
    amountCents:
      type: string
      pattern: ^[0-9]+$
      examples:
        - "76"
      description: >-
        What the statement priced: `totalUsd` in whole cents, rounded down. A whole number as a string. A `closed` month
        invoices none of it.
    state:
      type: string
      enum:
        - closed
        - invoicing
        - invoiced
        - paid
        - failed
        - void
        - uncollectible
      description: >-
        `closed`: under 50 cents, so nothing was invoiced and the total carries into the next month. The other states
        are the ones of the invoice.
    hostedInvoiceUrl:
      type:
        - string
        - "null"
      description: Stripe's page for the invoice. Null for a `closed` month, and until Stripe has finalized the invoice.
BindChatChannelRequest:
  type: object
  required:
    - channelId
    - team
  properties:
    channelId:
      type: string
      description: Slack's channel id (`C…`, or `G…` for an older private channel).
    team:
      type: string
      description: The team the channel's calls are attributed to, by slug or id.
BudgetRefusal:
  type: object
  additionalProperties: true
  description: >-
    The details (`error.nexus`) of a 402 `budget_exceeded` or `subsidy_exhausted`. Each money figure comes as its number
    (deprecated) and its exact decimal twin (`requestedUsd`, `requestedUsdDecimal`). A refusal below the person level
    names only what is left and what was asked, never a limit above the caller. `credit_exhausted` sends `remainingUsd`
    and `requestedUsd` as decimal strings already, without twins.
  properties:
    level:
      type: string
      enum:
        - organization
        - team
        - person
        - product
      description: The level whose limit refused the call (`budget_exceeded`)
    period:
      type: string
      description: "The period the refusal counted in: `2026-10`, `2026-W44` or `2026-10-21`"
    resetsAt:
      type: string
      format: date-time
      description: When the period ends (UTC)
    source:
      type: string
      enum:
        - override
        - default
      description: "Person level only: whether the limit was set for them or is the organization's default per person"
    limitUsd:
      type: number
      description: >-
        Person level only: their monthly limit. Deprecated: read `limitUsdDecimal`, the exact decimal string (root rule
        9).
      deprecated: true
    limitUsdDecimal:
      type: string
      description: >-
        `limitUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
        Prefer it to `limitUsd`.
    spentUsd:
      type: number
      description: >-
        Person level only: what they spent this month. Deprecated: read `spentUsdDecimal`, the exact decimal string
        (root rule 9).
      deprecated: true
    spentUsdDecimal:
      type: string
      description: >-
        `spentUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
        Prefer it to `spentUsd`.
    reservedUsd:
      type: number
      description: >-
        Person level only: what their calls in flight hold. Deprecated: read `reservedUsdDecimal`, the exact decimal
        string (root rule 9).
      deprecated: true
    reservedUsdDecimal:
      type: string
      description: >-
        `reservedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `reservedUsd`.
    remainingUsd:
      type: number
      description: >-
        Every level, and `subsidy_exhausted`: what is left, never below 0. Deprecated: read `remainingUsdDecimal`, the
        exact decimal string (root rule 9).
      deprecated: true
    remainingUsdDecimal:
      type: string
      description: >-
        `remainingUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `remainingUsd`.
    requestedUsd:
      type: number
      description: >-
        What the call may cost at most, the amount it asked to hold. Deprecated: read `requestedUsdDecimal`, the exact
        decimal string (root rule 9).
      deprecated: true
    requestedUsdDecimal:
      type: string
      description: >-
        `requestedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `requestedUsd`.
    notified:
      type: boolean
      description: "`budget_exceeded`: true once Gateway has told the refused person and the organization's owners and admins"
    fundedBy:
      type: string
      description: "`subsidy_exhausted`: who funds the subsidy (`nexus`)"
    next:
      type: array
      items:
        type: string
      description: "`subsidy_exhausted`: what the caller can do next (`billing`, `own_key`)"
BudgetSetting:
  type: object
  description: "A team's cap: what `PUT /v1/teams/{slug}/budget` takes."
  properties:
    amountUsd:
      type:
        - number
        - string
      description: >-
        The cap for the period; 0 refuses every call. The cap for the period in US dollars: a JSON number (deprecated)
        or a decimal string with at most 6 decimals (`"12.245"`), read exactly. Send `amountUsdDecimal` instead to send
        only a string.
      minimum: 0
      maximum: 1000000
      examples:
        - 500
    amountUsdDecimal:
      type: string
      pattern: ^[0-9]+(\.[0-9]{1,6})?$
      examples:
        - "12.245"
      description: >-
        The cap for the period as a decimal string in US dollars, at most 6 decimals, never below 0; read exactly into
        micro-dollars, never through a float. With `amountUsd` too, both must name the same amount (400
        `amount_mismatch`).
    period:
      type: string
      enum:
        - day
        - week
        - month
      description: UTC calendar day, ISO week (from Monday) or month
    mode:
      type: string
      enum:
        - hard_stop
        - warn
        - approval
      default: hard_stop
      description: Only `hard_stop` is available; the others answer 400 `mode_not_available`
    warnAtPercent:
      type: number
      description: For mode `warn`, which is not available yet
    dryRun:
      type: boolean
      description: Check the cap and answer what would change; change nothing
  required:
    - period
  anyOf:
    - required:
        - amountUsd
    - required:
        - amountUsdDecimal
Budgets:
  type: object
  description: Spend limits this month.
  properties:
    period:
      type: string
      examples:
        - 2026-10
      description: The calendar month (UTC)
    periodStart:
      type: string
      format: date-time
    resetsAt:
      type: string
      format: date-time
      description: The 1st of next month, 00:00 UTC
    personDefault:
      type: object
      properties:
        monthlyUsd:
          type:
            - number
            - "null"
          deprecated: true
          description: "Deprecated: read `monthlyUsdDecimal`, the exact decimal string (root rule 9)."
        monthlyUsdDecimal:
          type:
            - string
            - "null"
          description: >-
            `monthlyUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `monthlyUsd`.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
        - monthlyUsd
    scope:
      type: string
      enum:
        - org
        - own
      description: "org: everyone (owners and admins); own: only you"
    people:
      type: array
      items:
        $ref: "#/PersonBudget"
    canManage:
      type: boolean
      description: "You may set a person's limit: an owner, or an admin an owner allowed (both gateways)"
    canGrant:
      type: boolean
      description: "You may set the default per person and allow admins to set person limits: owners"
  required:
    - period
    - periodStart
    - resetsAt
    - personDefault
    - scope
    - people
    - canManage
BuyCredits:
  type: object
  required:
    - status
    - amountUsd
  properties:
    status:
      type: string
      enum:
        - credited
        - processing
        - checkout
      description: >-
        `credited`: charged and credited now; `processing`: Stripe is still taking a bank debit, and its notice credits
        it; `checkout`: open `url` to pay.
    amountUsd:
      type: string
      description: What the purchase buys, in decimal dollars.
    credits:
      $ref: "#/NexusCredits"
    paymentId:
      type: string
      description: Stripe's PaymentIntent, while `processing`.
    url:
      type: string
      description: Stripe Checkout's page, for `checkout`.
    expiresAt:
      type: string
      format: date-time
      description: When Stripe stops accepting `url`.
    checkoutSessionId:
      type: string
      description: Exact Checkout session to confirm; returned by current Gateways.
BuyCreditsRequest:
  type: object
  required:
    - amountUsd
  properties:
    paymentToken:
      type: string
      pattern: ^spt_[A-Za-z0-9_]+$
      maxLength: 255
      description: >-
        Optional Stripe shared payment token from an agent wallet, scoped to Nexus, USD, the purchase amount and an
        expiry. Currently accepted only in Stripe test mode. Confirms without a saved card, the web app's address or
        Checkout. Never accepts card details or merchant API keys. Does not save a card or enable recurring charges.
    amountUsd:
      type: string
      description: "Dollars in whole cents, such as \"50.00\": from 10.00 to 10000.00."
CancelCodeCommand:
  type: object
  description: The body of `cancelCodeCommand`, signed by the device that sent the command.
  properties:
    senderDeviceId:
      type: string
    signature:
      type: string
  required:
    - senderDeviceId
    - signature
  additionalProperties: false
CardSummary:
  type: object
  required:
    - brand
    - last4
    - expMonth
    - expYear
  description: A card as Stripe describes it. Never the card number.
  properties:
    brand:
      type: string
      description: Such as `visa` or `mastercard`.
      examples:
        - visa
    last4:
      type: string
      examples:
        - "4242"
    expMonth:
      type: integer
      examples:
        - 12
    expYear:
      type: integer
      examples:
        - 2030
CataloguePlan:
  type: object
  required:
    - plan
    - name
    - perSeat
    - minSeats
    - includedHours
    - hourlyUsd
    - sizes
    - intervals
    - current
  properties:
    plan:
      type: string
      description: The plan's key in a server setting, such as `plus`, `pro` or `teams_pro`.
    name:
      type: string
      description: The Stripe Product's name; the key when Stripe gave none.
    perSeat:
      type: boolean
    minSeats:
      type: integer
    includedHours:
      type: integer
      minimum: 0
      description: >-
        Cloud hours each month, in hours of the default machine size, per seat for a per-seat plan; 0 when a server
        setting sets none (pricing v3.0).
    hourlyUsd:
      type:
        - string
        - "null"
      pattern: ^[0-9]+\.[0-9]{6}$
      description: >-
        The price of a default-size hour past the plan's hours, as a decimal string with six places; null when a server
        setting sets none.
    sizes:
      type: array
      items:
        type: string
        enum:
          - small
          - default
          - large
          - xlarge
      description: The machine sizes the plan allows, smallest first; only `default` when a server setting sets none.
    intervals:
      type: array
      items:
        type: object
        required:
          - interval
          - amountUsd
          - includedUsd
          - error
        properties:
          interval:
            type: string
            enum:
              - month
              - year
          amountUsd:
            type:
              - string
              - "null"
            description: The price for the interval, per seat for a per-seat plan; null with `error`.
          includedUsd:
            type: string
            description: Included usage each month, per seat for a per-seat plan.
          error:
            type:
              - string
              - "null"
            description: >-
              Why the price is not shown: `stripe_error`, `stripe_timeout`, `inactive`, `not_usd`, `interval_mismatch`
              or `no_fixed_amount`.
    current:
      type: boolean
      description: The organization's subscription holds this plan.
ChatAttachment:
  type: object
  required:
    - id
    - sessionId
    - messageId
    - mediaType
    - bytes
    - data
    - createdAt
  properties:
    id:
      type: string
    sessionId:
      type: string
    messageId:
      type: string
    mediaType:
      type: string
      enum:
        - image/png
        - image/jpeg
        - image/gif
        - image/webp
        - text/csv
        - text/tab-separated-values
        - application/json
        - text/plain
        - text/markdown
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    bytes:
      type: integer
    width:
      type: integer
    height:
      type: integer
    name:
      type: string
    data:
      type: string
      description: Standard base64
    createdAt:
      type: string
      format: date-time
ChatAttachmentRef:
  type: object
  description: >-
    An image or a data file attached to a question, without its bytes (getChatAttachment has them; in a shared artifact,
    getArtifactAttachment and getPublicArtifactAttachment have its images, never its files).
  required:
    - id
    - type
    - mediaType
    - bytes
  properties:
    id:
      type: string
    type:
      type: string
      enum:
        - image
        - file
    mediaType:
      type: string
      enum:
        - image/png
        - image/jpeg
        - image/gif
        - image/webp
        - text/csv
        - text/tab-separated-values
        - application/json
        - text/plain
        - text/markdown
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      description: An image's from the bytes, not as it was named; a data file's from its extension, checked against the bytes
    bytes:
      type: integer
    width:
      type: integer
    height:
      type: integer
    name:
      type: string
ChatChannelBinding:
  type: object
  description: A Slack channel bound to a team. Ids only.
  required:
    - workspaceId
    - channelId
    - teamId
    - createdBy
    - createdAt
    - updatedAt
  properties:
    workspaceId:
      type: string
      description: The workspace binding (`chw_…`).
    channelId:
      type: string
    teamId:
      type: string
    teamSlug:
      type: string
      description: The team's slug; absent when the team was deleted since.
    createdBy:
      type: string
      description: The person who bound it.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ChatChannelList:
  type: object
  required:
    - channels
  properties:
    channels:
      type: array
      items:
        $ref: "#/ChatChannelBinding"
ChatChannelSettings:
  type: object
  description: >-
    A bound channel's effective settings, each with the level that set it. The settings tree is not built: this reads
    the team, the team caps and the model policy levels that exist today.
  required:
    - workspaceId
    - channelId
    - team
    - spendScope
    - spendCaps
    - modelPolicy
  properties:
    workspaceId:
      type: string
    channelId:
      type: string
    team:
      type: object
      required:
        - id
        - slug
        - source
      properties:
        id:
          type: string
        slug:
          type: string
        source:
          $ref: "#/SettingSource"
    spendScope:
      type: string
      enum:
        - caps
        - own
      description: >-
        `caps` for an owner or admin, who sees each cap; `own` for a team lead, who sees only `spendLeft`, as `GET
        /v1/teams/{slug}/budget` shows a member.
    spendCaps:
      type: array
      description: >-
        The open team caps on the bound team's path, top level first: owners and admins only, as only they read a cap's
        limit. Empty for a lead, and when none caps it.
      items:
        type: object
        required:
          - limitUsd
          - period
          - mode
          - source
        properties:
          limitUsd:
            type: string
            description: The cap in USD, a decimal string.
          period:
            type: string
            enum:
              - month
              - week
              - day
          mode:
            type: string
            enum:
              - hard_stop
          source:
            $ref: "#/SettingSource"
    spendLeft:
      type: object
      description: >-
        What the team caps on the bound team's path leave for the channel's calls: the tightest cap's room and period.
        It names no cap and no level. Absent when none caps it.
      required:
        - remainingUsd
        - period
        - resetsAt
      properties:
        remainingUsd:
          type: string
          description: What the tightest cap has left, in USD, a decimal string; never below zero.
        period:
          type: string
          enum:
            - month
            - week
            - day
        resetsAt:
          type: string
          description: When that period starts over.
    modelPolicy:
      type: object
      required:
        - levels
        - defaultChatModelSource
      properties:
        levels:
          type: array
          description: Every level that holds a model rule for the bound team, widest first. Each one narrows the levels above it.
          items:
            $ref: "#/SettingSource"
        defaultChatModel:
          type: string
          description: The default chat model; absent when no level and no catalog entry names one.
        defaultChatModelSource:
          $ref: "#/SettingSource"
ChatChannelUnbound:
  type: object
  required:
    - workspaceId
    - channelId
    - teamId
    - removed
  properties:
    workspaceId:
      type: string
    channelId:
      type: string
    teamId:
      type: string
      description: The team it was bound to.
    removed:
      type: boolean
ChatCitation:
  type: object
  required:
    - "n"
    - repo
    - page
    - slug
    - path
    - runId
  description: A Nexus Wiki section an Ask your code answer cites as [n]
  properties:
    "n":
      type: integer
      description: The number the answer cites it by
    repo:
      type: string
      description: owner/name
    page:
      type: string
    slug:
      type: string
    section:
      type: string
    path:
      type: string
      description: <slug>#<anchor> in the repository's wiki
    files:
      type: array
      items:
        type: string
      description: Repository files the section names
    runId:
      type: string
      description: The Nexus Wiki run that wrote the page
ChatCompletionChunk:
  type: object
  description: "One server-sent event of a streamed chat completion (`data: <chunk>`; the stream ends with `data: [DONE]`)."
  properties:
    id:
      type: string
    object:
      const: chat.completion.chunk
    created:
      type: integer
    model:
      type: string
    choices:
      type: array
      description: One choice; empty in the last chunk, which carries the usage.
      items:
        type: object
        properties:
          index:
            type: integer
          delta:
            type: object
            properties:
              role:
                const: assistant
              content:
                type: string
              tool_calls:
                type: array
                description: >-
                  A call's first piece has its `id`, `type` and `function.name`; the next pieces add to
                  `function.arguments`.
                items:
                  type: object
                  required:
                    - index
                  properties:
                    index:
                      type: integer
                    id:
                      type: string
                    type:
                      const: function
                    function:
                      type: object
                      properties:
                        name:
                          type: string
                        arguments:
                          type: string
          finish_reason:
            type:
              - string
              - "null"
            enum:
              - stop
              - length
              - tool_calls
              - null
    usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    nexus:
      type: object
      description: What the call cost and who it was attributed to.
      properties:
        cost_usd:
          type: number
        product:
          type: string
        capability:
          type: string
        provider:
          type: string
        funded_by:
          type: string
          enum:
            - own_key
            - nexus_key
            - nexus_subsidy
            - nexus_credit
            - nexus_invoiced
          description: >-
            Who paid the provider. own_key: the organization's own key; nexus_key: Nexus's own key, for Nexus's own
            organizations; nexus_subsidy: a Nexus subsidy; nexus_credit: the organization's prepaid Nexus credits,
            charged the cost plus Nexus's rate; nexus_invoiced: an organization under contract, billed the cost plus
            Nexus's rate on its month's invoice. Unset on the mock provider
    error:
      type: object
      description: A failure after the stream started.
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
ChatCompletionRequest:
  type: object
  required:
    - model
    - messages
  properties:
    model:
      type: string
      examples:
        - nexus/auto
    messages:
      type: array
      items:
        $ref: "#/ChatMessage"
    max_tokens:
      type: integer
      minimum: 1
      description: >-
        At most the lower of the deployment's cap and the model's `max_output_tokens`; above it is a 400
        `output_over_limit` before anything is reserved, with `error.nexus.limit`. A call skips a host whose output
        limit is below it; when no host it may use takes it, the same 400 names the largest limit of those hosts. A call
        also skips a host that does not read the call's images (400 `model_no_image_input` when no host does) and a host
        that does not take its `reasoning_effort` (400 `reasoning_effort_not_offered`). A host whose own context window
        may be too small for the prompt and `max_tokens` is tried after the hosts that surely hold them. Absent: the
        model's chat default, within that cap.
    temperature:
      type: number
    stream:
      type: boolean
      description: >-
        Answer as server-sent events (`ChatCompletionChunk`). Absent or null: no stream. A value that is not a boolean
        is a 400 (`stream must be true or false`).
    stream_options:
      type: object
      description: Accepted for compatibility; a stream always ends with its usage chunk.
      properties:
        include_usage:
          type: boolean
    tools:
      type: array
      description: Functions the model may call, in OpenAI's shape; translated for Anthropic models.
      items:
        type: object
        required:
          - type
          - function
        properties:
          type:
            const: function
          function:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
              parameters:
                type: object
                description: "A JSON Schema; `{\"type\": \"object\"}` when left out."
    tool_choice:
      description: >-
        `auto` (the default), `none`, `required`, or one function by name (it must be in `tools`). `required` or a
        function on a model that does not take a forced choice is 400 `tool_choice_not_offered`, before anything is
        reserved.
      oneOf:
        - type: string
          enum:
            - auto
            - none
            - required
        - type: object
          required:
            - type
            - function
          properties:
            type:
              const: function
            function:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
    parallel_tool_calls:
      type: boolean
      description: "`false`: at most one tool call per answer."
    reasoning_effort:
      type: string
      description: >-
        One of the model's `reasoning.efforts` (GET /v1/models). Absent: the provider's default. An effort the model
        does not offer is a 400 `reasoning_effort_not_offered` before anything is reserved; `error.nexus.offered` lists
        the model's efforts.
    response_format:
      type: object
      description: >-
        OpenAI's `response_format`, sent on as written when the model offers its `type` (`text`, `json_object` or
        `json_schema`). A type the model does not offer is a 400 `response_format_not_offered` before anything is
        reserved; `error.nexus.offered` lists the model's types.
      required:
        - type
      properties:
        type:
          type: string
ChatCompletionResponse:
  type: object
  properties:
    id:
      type: string
    object:
      const: chat.completion
    created:
      type: integer
    model:
      type: string
    choices:
      type: array
      items:
        type: object
        properties:
          index:
            type: integer
          message:
            $ref: "#/ChatMessage"
          finish_reason:
            type: string
            description: stop, length, or refusal when the provider declined to answer; its words are in nexus.refusal.
    usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    nexus:
      type: object
      description: What the call cost and who it was attributed to.
      properties:
        cost_usd:
          type: number
        product:
          type: string
        capability:
          type: string
        provider:
          type: string
        funded_by:
          type: string
          enum:
            - own_key
            - nexus_key
            - nexus_subsidy
            - nexus_credit
            - nexus_invoiced
          description: >-
            Who paid the provider. own_key: the organization's own key; nexus_key: Nexus's own key, for Nexus's own
            organizations; nexus_subsidy: a Nexus subsidy; nexus_credit: the organization's prepaid Nexus credits,
            charged the cost plus Nexus's rate; nexus_invoiced: an organization under contract, billed the cost plus
            Nexus's rate on its month's invoice. Unset on the mock provider
        refusal:
          type: string
          description: >-
            The provider's words when it declined to answer (a safety refusal); set exactly when finish_reason is
            "refusal". Billed as the provider billed it.
        router:
          type: object
          description: >-
            The auto router's pick, on an answer it routed or a chat session held. The answer also carries the header
            x-nexus-router with the version. Unset on every other answer. The pick's cost estimates stay on the spend
            record.
          required:
            - version
            - held
          properties:
            version:
              type: string
              description: The router version that acted, e.g. auto-v0.0.1.
            class:
              type: string
              enum:
                - light
                - standard
                - heavy
              description: The request's class. Unset on a held pick.
            reason:
              type: string
              enum:
                - cheapest
                - below_floor
                - catalog_order
              description: Why the version chose its model. Unset on a held pick.
            held:
              type: boolean
              description: The chat session held its model, with no router run.
            default_model:
              type: string
              description: The model nexus/auto resolves to for the caller with no router.
            effort:
              type: string
              description: >-
                The reasoning effort the call ran at: the request's own reasoning_effort, else the one the router
                version picked. Unset when the call ran at the model's default.
ChatConnectorBlock:
  type: object
  description: "A connector read a chat answer ran through read_connector: which connector, which operation, and its request"
  required:
    - connector
    - operation
    - input
  properties:
    connector:
      type: string
    operation:
      type: string
    input:
      type: object
      additionalProperties: true
    account:
      type: object
      description: >-
        The connection the read ran with: whose it is and the account's name. Absent while the read streams, and on
        reads kept before it was recorded
      required:
        - scope
        - name
      properties:
        scope:
          type: string
          enum:
            - org
            - team
            - user
        name:
          type: string
ChatFileInput:
  type: object
  required:
    - data
    - name
  description: >-
    A data file to attach to a question. CSV, TSV, JSON, TXT, Markdown or XLSX by its name's extension, checked against
    the bytes (400 invalid_file); at most 5 MB (413 file_too_large).
  properties:
    data:
      type: string
      description: "Standard base64, or a data: URL"
    name:
      type: string
      maxLength: 200
      description: With its extension. The name a page reads it by
ChatImageInput:
  type: object
  required:
    - data
  properties:
    data:
      type: string
      description: The image as base64, or a `data:image/…;base64,…` URL
    name:
      type: string
      maxLength: 200
      description: Its file name, shown with it
ChatMessage:
  type: object
  required:
    - role
  properties:
    role:
      type: string
      enum:
        - system
        - developer
        - user
        - assistant
        - tool
      description: "`developer` is taken as `system`. Answers are always `assistant`."
    content:
      description: >-
        The text, or OpenAI's content parts: `{type: "text", text}` (joined) and, in a person's message, `{type:
        "image_url", image_url: {url}}` with a `data:` URL (Gateway fetches no URLs). An assistant turn that only calls
        tools may leave it out or send null. Answers carry a string.
      oneOf:
        - type: string
        - type: array
          items:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - text
                  - image_url
              text:
                type: string
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
        - type: "null"
    tool_calls:
      type: array
      description: "The tools an assistant turn called (in an answer: when `finish_reason` is `tool_calls`)."
      items:
        $ref: "#/ToolCall"
    tool_call_id:
      type: string
      description: "A `tool` message: the call it answers."
ChatMode:
  type: string
  enum:
    - chat
    - ask
  description: >-
    `chat` with any model you may use; `ask` (Ask your code) answers from your organization's Nexus Wiki, citing its
    pages
ChatPageBlock:
  type: object
  required:
    - pageId
    - version
    - title
    - format
  properties:
    pageId:
      type: string
    version:
      type: integer
      minimum: 1
    title:
      type: string
    format:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
ChatSession:
  type: object
  required:
    - id
    - title
    - mode
    - model
    - archived
    - messageCount
    - costUsd
    - createdAt
    - updatedAt
  description: A chat session, private to its author unless shared as an artifact.
  properties:
    id:
      type: string
    title:
      type: string
      description: The first question until you rename it
    mode:
      $ref: "#/ChatMode"
    model:
      type: string
      description: "The model asked for: nexus/auto by default"
    lastModel:
      type: string
      description: The model that ran last
    team:
      type: string
      description: The team its spend is attributed to
    archived:
      type: boolean
    webSearch:
      type: boolean
      description: Whether the model may search the web in this session (default false)
    messageCount:
      type: integer
    costUsd:
      type: number
      description: >-
        The sum of its model calls and of the web searches that returned results, settled in the ledger; a search that
        fails after the provider billed it is in the ledger, not in this sum
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    visibility:
      type: string
      enum:
        - private
        - shared
      description: "private (the default) or shared: at least one active artifact"
    sharing:
      $ref: "#/ChatSessionSharing"
    artifacts:
      type: array
      items:
        $ref: "#/ArtifactLink"
      description: Every version shared from this session, newest first (revoked ones included)
    author:
      $ref: "#/ArtifactAuthor"
      description: You (listed and read sessions)
    forkedFrom:
      type: object
      description: The artifact this session continues (POST /v1/artifacts/{id}/continue)
      required:
        - artifactId
        - version
      properties:
        artifactId:
          type: string
        version:
          type: integer
        title:
          type: string
ChatSessionDetail:
  allOf:
    - $ref: "#/ChatSession"
    - type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: "#/ChatSessionMessage"
ChatSessionMessage:
  type: object
  required:
    - id
    - sessionId
    - role
    - content
    - status
    - createdAt
  properties:
    id:
      type: string
    sessionId:
      type: string
    role:
      type: string
      enum:
        - user
        - assistant
    content:
      type: string
      description: Markdown (a question with images may have none)
    status:
      type: string
      enum:
        - complete
        - failed
        - refused
      description: >-
        refused: the policy or budget refused the call (error says why); failed: it broke mid-way (content is what
        arrived)
    mode:
      $ref: "#/ChatMode"
    requestedModel:
      type: string
    model:
      type: string
      description: The model that ran
    costUsd:
      type: number
    usage:
      type: object
      properties:
        promptTokens:
          type: integer
        completionTokens:
          type: integer
    citations:
      type: array
      items:
        $ref: "#/ChatCitation"
    error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        notified:
          type: boolean
          description: A budget refusal told the organization's owners and admins (licensed build). Absent otherwise.
        remainingUsdDecimal:
          type: string
          description: >-
            A budget refusal's `remainingUsdDecimal`: what was left of that level's budget, as an exact decimal. Absent
            when the 402 had none.
        requestedUsd:
          type: string
          description: >-
            A usage-limit refusal's (`usage_limit_reached`) `requestedUsd`: the most the call may cost with Nexus's
            rate, as an exact decimal. Absent for any other refusal, or when the 402 had none.
        remainingUsd:
          type: string
          description: >-
            A usage-limit refusal's (`usage_limit_reached`) `remainingUsd`: what this month's usage limit had left, as
            an exact decimal. Absent for any other refusal, or when the 402 had none.
        details:
          type: object
          description: >-
            A 402's details, as the live error's `error.nexus` had them, cut to an allow-list: short codes, ways
            forward, `notified` and decimal dollar amounts. Absent for any other status, when none was kept, and on an
            answer stored before it.
          properties:
            reason:
              type: string
              description: Why the refusal happened, such as `authentication_required` or `disputed` for `payment_failed`.
            level:
              type: string
              description: A budget refusal's level.
            freeStart:
              type: string
              description: "`cheaper_models_only` when the free start pays for cheaper models only."
            next:
              type: array
              description: The ways forward, such as `billing` and `own_key`; at most 4.
              items:
                type: string
            notified:
              type: boolean
              description: The organization's owners and admins were told.
            owedUsd:
              type: string
            unpaidUsd:
              type: string
            remainingUsd:
              type: string
            remainingUsdDecimal:
              type: string
            requestedUsd:
              type: string
            limitUsd:
              type: string
            chargeUsd:
              type: string
            capUsd:
              type: string
    createdAt:
      type: string
      format: date-time
    attachments:
      type: array
      description: The images attached to a question
      items:
        $ref: "#/ChatAttachmentRef"
    page:
      $ref: "#/ChatPageBlock"
      description: A page this answer created or revised through write_page
    skills:
      type: array
      description: >-
        The skills this answer loaded through load_skill, in the order it loaded them. The file stays in the skills
        store
      items:
        $ref: "#/ChatSkillBlock"
    connectors:
      type: array
      description: >-
        The connector reads this answer ran through read_connector, in order. What they returned is never kept. In a
        shared artifact, a reader sees only the reads of connectors they may use
      items:
        $ref: "#/ChatConnectorBlock"
    sources:
      type: array
      description: >-
        The web pages this answer's searches gave the model, one per URL, in the order they were found. Only the
        session's author reads them; a shared artifact keeps none
      items:
        $ref: "#/ChatWebSource"
    rewound:
      type: boolean
      description: Retained for the author, but excluded from future model context after a conversation rewind.
ChatSessionSharing:
  type: object
  required:
    - artifactId
    - version
    - audience
    - allowContinue
    - url
    - path
  description: "How a shared session is shared: its newest active artifact"
  properties:
    artifactId:
      type: string
    version:
      type: integer
    audience:
      $ref: "#/ArtifactAudience"
    allowContinue:
      type: boolean
    url:
      type: string
      description: >-
        The link to hand out: a public link (kind public), the fast viewer (kind external), else the artifact in Nexus
        UI; absolute when the Gateway knows Nexus UI's URL , else a path
    path:
      type: string
      description: /app/<org>/artifacts/<id>
    viewerUrl:
      type: string
      description: "The fast viewer: <origin>/a/<id>"
    publicUrl:
      type: string
      description: "Kind public: <origin>/a/<token>"
    expiresAt:
      type: string
      format: date-time
      description: "Kind public: when the link stops opening"
ChatSkillBlock:
  type: object
  description: "A skill a chat answer loaded through load_skill: which one, which version, and where it came from"
  required:
    - skillId
    - name
    - version
  properties:
    skillId:
      type: string
      description: skl_… For a library skill, the library skill's id, which getSkill and getSkillVersion also take
    name:
      type: string
      description: The name the version had when it was served
    version:
      type: integer
      minimum: 1
      description: "The version served: a personal skill's latest, or a library skill's latest approved version that nobody withdrew"
    scope:
      type: string
      enum:
        - personal
        - team
        - org
      description: >-
        Where the skill came from: your own skills, a team's library, or the organization's. Left out on an answer
        stored before skills had a scope: read it as personal
    teamId:
      type: string
      description: The team (team_…), for scope team. Map it to the team's name with listTeams
ChatStreamChunk:
  type: object
  description: >-
    One server-sent event (`data: <json>`), OpenAI's chat.completion.chunk. The first carries nexus.session and
    nexus.question (and nexus.citations in Ask your code); the next ones delta.content; the last finish_reason, usage
    and nexus.message (the stored answer). A failure mid-way is `{error}`; `data: [DONE]` ends the stream.
  properties:
    id:
      type: string
    object:
      type: string
      const: chat.completion.chunk
    created:
      type: integer
    model:
      type:
        - string
        - "null"
      description: The model that runs
    choices:
      type: array
      items:
        type: object
        properties:
          index:
            type: integer
          delta:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
          finish_reason:
            type:
              - string
              - "null"
    usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    nexus:
      type: object
      properties:
        session:
          $ref: "#/ChatSession"
        question:
          $ref: "#/ChatSessionMessage"
        message:
          $ref: "#/ChatSessionMessage"
        mode:
          $ref: "#/ChatMode"
        requested:
          type: string
        citations:
          type: array
          items:
            $ref: "#/ChatCitation"
        no_wiki:
          type: boolean
        tool:
          type: object
          description: A chat tool currently executing
          required:
            - name
            - status
          properties:
            name:
              type: string
              enum:
                - write_page
                - load_skill
                - describe_connector
                - read_connector
                - web_search
            status:
              type: string
              enum:
                - running
        skill:
          $ref: "#/ChatSkillBlock"
          description: A skill load_skill has just read
        connector:
          $ref: "#/ChatConnectorBlock"
          description: A connector read read_connector is about to run
        cost_usd:
          type: number
ChatSuggestion:
  type: object
  required:
    - suggestion
    - model
    - costUsd
  properties:
    suggestion:
      type:
        - string
        - "null"
      description: The suggested message, one line of at most 120 characters.
    model:
      type:
        - string
        - "null"
      description: The model that wrote it; null when no model was called.
    costUsd:
      type: number
      description: What the call cost. The session's `costUsd` does not count it; the ledger does.
ChatUsage:
  type: object
  description: "Counts only: never content or titles"
  properties:
    scope:
      type: string
      enum:
        - org
        - own
    days:
      type: integer
    since:
      type: string
      format: date-time
    retentionDays:
      type: integer
    totals:
      allOf:
        - type: object
          properties:
            sessions:
              type: integer
            messages:
              type: integer
            costUsd:
              type: number
              deprecated: true
              description: "Deprecated: read `costUsdDecimal`, the exact decimal string (root rule 9)."
            costUsdDecimal:
              type: string
              description: >-
                `costUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                micro-dollars. Prefer it to `costUsd`.
        - type: object
          properties:
            people:
              type: integer
    byMode:
      type: object
      properties:
        chat:
          type: object
          properties:
            sessions:
              type: integer
            messages:
              type: integer
            costUsd:
              type: number
              deprecated: true
              description: "Deprecated: read `costUsdDecimal`, the exact decimal string (root rule 9)."
            costUsdDecimal:
              type: string
              description: >-
                `costUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                micro-dollars. Prefer it to `costUsd`.
        ask:
          type: object
          properties:
            sessions:
              type: integer
            messages:
              type: integer
            costUsd:
              type: number
              deprecated: true
              description: "Deprecated: read `costUsdDecimal`, the exact decimal string (root rule 9)."
            costUsdDecimal:
              type: string
              description: >-
                `costUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                micro-dollars. Prefer it to `costUsd`.
    byTeam:
      type: array
      items:
        allOf:
          - type: object
            properties:
              sessions:
                type: integer
              messages:
                type: integer
              costUsd:
                type: number
                deprecated: true
                description: "Deprecated: read `costUsdDecimal`, the exact decimal string (root rule 9)."
              costUsdDecimal:
                type: string
                description: >-
                  `costUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                  micro-dollars. Prefer it to `costUsd`.
          - type: object
            properties:
              team:
                type:
                  - string
                  - "null"
    byPerson:
      type: array
      description: Owners and admins
      items:
        allOf:
          - type: object
            properties:
              sessions:
                type: integer
              messages:
                type: integer
              costUsd:
                type: number
                deprecated: true
                description: "Deprecated: read `costUsdDecimal`, the exact decimal string (root rule 9)."
              costUsdDecimal:
                type: string
                description: >-
                  `costUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
                  micro-dollars. Prefer it to `costUsd`.
          - type: object
            properties:
              userId:
                type: string
              email:
                type: string
ChatWebSource:
  type: object
  description: "A web page a chat answer's web_search read: its title, URL and date, and the query that found it. No snippet is kept"
  required:
    - title
    - url
    - query
  properties:
    title:
      type: string
    url:
      type: string
    date:
      type: string
      description: The page's date as the engine gave it, cut as the model read it
    query:
      type: string
      description: The first query in the turn that found this page
ChatWorkspace:
  type: object
  description: A chat workspace bound to the organization. Never a token.
  required:
    - id
    - platform
    - teamId
    - scopes
    - state
    - installedBy
    - createdAt
    - expiresAt
  properties:
    id:
      type: string
      description: "`chw_…`, also the install's id."
    platform:
      type: string
      enum:
        - slack
    teamId:
      type: string
      description: Slack's workspace id (`T0…`).
    teamName:
      type: string
    enterpriseId:
      type: string
    botUserId:
      type: string
    approvedBySlackUser:
      type: string
      description: The Slack user who approved the app (`authed_user.id`).
    scopes:
      type: array
      items:
        type: string
      description: The bot scopes Slack granted.
    state:
      type: string
      enum:
        - pending
        - active
        - revoked
    installedBy:
      type: string
      description: The user id of the person who started the install.
    confirmedBy:
      type: string
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
      description: "When the install's `state` expires: a pending binding confirms only before this, and is undone after it."
    confirmedAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
ChatWorkspaceList:
  type: object
  required:
    - workspaces
  properties:
    workspaces:
      type: array
      items:
        $ref: "#/ChatWorkspace"
ChatWorkspaceRemoved:
  type: object
  required:
    - removed
    - uninstalled
    - credentialRevoked
  properties:
    removed:
      type: boolean
    uninstalled:
      type: boolean
      description: Whether Gateway uninstalled the app from the workspace (`apps.uninstall`).
    credentialRevoked:
      type: boolean
      description: Whether the bot token left the vault. False while another binding here uses it.
ChatWriteOperation:
  type: object
  required:
    - connector
    - operation
  additionalProperties: false
  properties:
    connector:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
    operation:
      type: string
      pattern: ^[a-z][a-z0-9_-]*$
ChatWriteSetting:
  type: object
  required:
    - enabled
    - default
    - operations
  properties:
    enabled:
      type: boolean
    default:
      type: boolean
      description: "The organization never chose: on with every registered write"
    operations:
      type: array
      items:
        $ref: "#/ChatWriteOperation"
      description: The effective allowed connector writes, sorted. Defaults to every registered write; saved lists take precedence
    changedBy:
      type: string
    changedAt:
      type: string
      format: date-time
CheckPageRequest:
  type: object
  additionalProperties: false
  properties:
    version:
      type: integer
      minimum: 1
      description: "The version to check (default: the latest)"
  description: Which version Check reads.
ClaimCodeCommand:
  type: object
  properties:
    runnerDeviceId:
      type: string
    signature:
      type: string
  required:
    - runnerDeviceId
    - signature
  additionalProperties: false
ClientError:
  type: object
  required:
    - app
    - appVersion
    - os
    - kind
    - component
    - code
  properties:
    app:
      type: string
      enum:
        - desktop
        - desktop-gpui
        - web
        - cli
        - mobile
      description: The app that reports
    appVersion:
      type: string
      pattern: ^[0-9A-Za-z.+-]{1,32}$
      description: The app's version, such as 0.31.0+abc1234
    os:
      type: string
      enum:
        - macos
        - windows
        - linux
        - ios
        - android
        - other
      description: The OS family
    osVersion:
      type: string
      pattern: ^[0-9A-Za-z._-]{1,32}$
      description: The OS release, such as 15.1
    kind:
      type: string
      enum:
        - crash
        - render
        - network
        - sign_in
        - update
        - agent
        - storage
        - other
      description: >-
        crash: a panic or native crash; render: a UI error boundary; network: a request from the app failed; sign_in;
        update: the updater; agent: a local agent did not start or ended badly; storage: local files or the keychain;
        other
    component:
      type: string
      pattern: ^[a-z0-9_.-]{1,64}$
      description: "The app's own name for where it failed, such as diff_view: never text from the error"
    code:
      type: string
      pattern: ^[a-z0-9_.-]{1,64}$
      description: "The app's own error code, such as panic or callback_timeout: never text from the error"
    fatal:
      type: boolean
      description: Whether it ended the app or the window; false when absent
    occurredAt:
      type: string
      format: date-time
      description: When it happened (RFC 3339); the Gateway's now when absent or out of bounds
ClientErrors:
  type: object
  required:
    - errors
  properties:
    errors:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: "#/ClientError"
ClientErrorsRecorded:
  type: object
  required:
    - recorded
  properties:
    recorded:
      type: integer
      description: "How many errors were stored: 0 when collection is off"
CloudAccess:
  type: object
  required:
    - host
    - port
    - user
    - hostKey
  properties:
    host:
      type: string
    port:
      type: integer
      minimum: 1
      maximum: 65535
    user:
      type: string
    hostKey:
      type: string
      description: The machine's SSH host key, to pin.
CloudAccessRequest:
  type: object
  required:
    - publicKey
  properties:
    publicKey:
      type: string
      maxLength: 4096
      description: One SSH public key line, such as `ssh-ed25519 AAAA…`.
CloudActivity:
  type: object
  required:
    - busy
  properties:
    busy:
      type: boolean
      description: Whether an agent on the machine works now. A permission prompt counts as idle.
    agentIdleSince:
      type:
        - string
        - "null"
      format: date-time
      description: Since when every agent is idle; null while one works or before the first.
    interactedAt:
      type:
        - string
        - "null"
      format: date-time
      description: The person's last interaction with the machine's sessions; null when there is none.
    oomKills:
      type: integer
      minimum: 0
      description: >-
        How many processes the kernel killed for want of memory since the machine started (its cgroup's `oom_kill`, else
        the system's).
CloudHistoryAppended:
  type: object
  required:
    - machineId
    - threadId
    - enabled
    - lastSeq
    - appended
  properties:
    machineId:
      type: string
    threadId:
      type: string
    enabled:
      type: boolean
      description: The organization's `cloudHistory`; false, and nothing was stored
    lastSeq:
      type:
        - integer
        - "null"
      description: "The last stored event's number: send the next one after it; null when nothing is stored"
    appended:
      type: integer
      minimum: 0
      description: How many events this call stored
CloudHistoryEvent:
  type: object
  required:
    - seq
    - at
    - body
  properties:
    seq:
      type: integer
      minimum: 1
      description: The machine's workbench event number
    at:
      type: integer
      description: The machine's time of the event, in milliseconds since 1970
    body:
      type:
        - string
        - "null"
      description: The workbench event's JSON text, as the machine sent it; null when it was over the per-event cap
    omittedBytes:
      type: integer
      minimum: 0
      description: The size of a body over the per-event cap; absent when `body` is there
CloudHistoryEventPage:
  type: object
  required:
    - machineId
    - threadId
    - enabled
    - firstSeq
    - lastSeq
    - events
  properties:
    machineId:
      type: string
    threadId:
      type: string
    enabled:
      type: boolean
      description: The organization's `cloudHistory`
    firstSeq:
      type:
        - integer
        - "null"
      description: The first stored event's number; null when none is stored
    lastSeq:
      type:
        - integer
        - "null"
      description: The last stored event's number; null when none is stored
    events:
      type: array
      items:
        $ref: "#/CloudHistoryEvent"
CloudHistoryThread:
  type: object
  required:
    - threadId
    - firstSeq
    - lastSeq
    - lastEventAt
    - updatedAt
  properties:
    threadId:
      type: string
    firstSeq:
      type: integer
      description: The first stored event's number
    lastSeq:
      type: integer
      description: "The last stored event's number: every number from firstSeq to it is stored"
    lastEventAt:
      type: integer
      description: The machine's time of the last event, in milliseconds since 1970
    updatedAt:
      type: string
      format: date-time
CloudHistoryThreadDeleted:
  type: object
  required:
    - machineId
    - threadId
    - deleted
  properties:
    machineId:
      type: string
    threadId:
      type: string
    deleted:
      type: boolean
CloudHistoryThreads:
  type: object
  required:
    - machineId
    - enabled
    - threads
  properties:
    machineId:
      type: string
    enabled:
      type: boolean
      description: The organization's `cloudHistory`
    threads:
      type: array
      items:
        $ref: "#/CloudHistoryThread"
  description: A cloud machine's threads with stored history
CloudLink:
  type: object
  required:
    - url
    - expiresAt
  properties:
    url:
      type: string
      format: uri
    expiresAt:
      type:
        - string
        - "null"
      format: date-time
      description: When the link stops working; null when it lasts until the machine sleeps.
CloudLinkRequest:
  type: object
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - port
        - desktop
    port:
      type: integer
      minimum: 1
      maximum: 65535
      description: "Required with `kind: port`."
CloudMachine:
  type: object
  required:
    - id
    - sessionId
    - title
    - name
    - provider
    - size
    - state
    - error
    - createdAt
    - sleepingSince
    - stopReason
    - queuedUntil
    - hostOnline
  properties:
    id:
      type: string
      description: "`cm_` and up to 64 base64url characters"
    sessionId:
      type:
        - string
        - "null"
      description: The desktop session the machine is for; null on a machine made before sessions.
    title:
      type:
        - string
        - "null"
      description: The session's title, on one line; null when the create sent none.
    name:
      type: string
      description: The session's title, cut to 120 characters, or `Cloud`.
    provider:
      type: string
      enum:
        - boat
    size:
      type: string
      enum:
        - small
        - default
        - large
        - xlarge
      description: "Nexus chooses it: a server setting when made."
    state:
      type: string
      enum:
        - queued
        - creating
        - starting
        - ready
        - sleeping
        - stopping
        - failed
        - gone
      description: >-
        The desktop's `CloudState`. `queued` waits for a place, the person's next start or the provider; nothing runs.
        Running time is charged in `creating`, `starting` and `ready`.
    error:
      type:
        - string
        - "null"
      description: Why it failed; null otherwise.
    createdAt:
      type: string
      format: date-time
    sleepingSince:
      type:
        - string
        - "null"
      format: date-time
      description: When it went to sleep; null unless `sleeping`.
    stopReason:
      type:
        - string
        - "null"
      enum:
        - budget
        - max_run
        - not_enabled
        - idle
        - resize
        - null
      description: >-
        Why Gateway put it to sleep: `budget` when its compute was refused, `max_run` after its longest run with no
        interaction (24 hours by default, from the person's last interaction, create, wake or access), `not_enabled`
        when the organization may no longer run machines, `idle` when nobody needs it (its agent idle 5 minutes and its
        person idle 20 minutes, or its host silent 15 minutes, or no report from its host in the 5 minutes after its
        last create, wake, access or connect), `resize` while it restarts one size bigger after it ran out of memory.
        Null otherwise, and cleared by a wake.
    queuedUntil:
      type:
        - string
        - "null"
      format: date-time
      description: >-
        While `queued`: the earliest time Gateway tries to start it (the person's next start, the provider's
        `nextStartAt`, or the meter's next pass). Null otherwise.
    hostOnline:
      type: boolean
      description: >-
        The machine's host has its control connection open on this copy of Gateway: GET /v1/cloud/machines/{id}/connect
        can open a stream.
CloudMachineDeleted:
  type: object
  required:
    - id
    - deleted
  properties:
    id:
      type: string
    deleted:
      type: boolean
CloudMachineList:
  type: object
  required:
    - machines
  properties:
    machines:
      type: array
      items:
        $ref: "#/CloudMachine"
CloudSetupDone:
  type: object
  required:
    - ended
  properties:
    ended:
      type: boolean
      description: "True: the grant ended, and no setup token is given for the machine again."
CloudSetupToken:
  type: object
  required:
    - repo
    - token
  properties:
    repo:
      type: string
      description: The repository the machine sets up (`owner/name`).
    token:
      type: string
      description: A GitHub App token that may only read `repo`, for an hour at most. Keep it in memory only.
CloudSetupTokenRequest:
  type: object
  required:
    - grant
  properties:
    grant:
      type: string
      maxLength: 4096
      description: The sealed grant from the machine's `cloud.json` (`setup.grant`). It holds no credential.
CodeCommand:
  type: object
  properties:
    id:
      type: string
      format: uuid
    senderDeviceId:
      type: string
    runnerDeviceId:
      type: string
    expiresAt:
      type: integer
      format: int64
    lockedKey:
      type: string
      description: 80 bytes of HPKE ciphertext, base64url without padding.
    sealed:
      type: string
      description: Encrypted action payload, base64url without padding. At most 65581 decoded bytes.
    signature:
      type: string
      description: Ed25519 signature over the domain-separated command and its routing fields, base64url without padding.
    waits:
      type: boolean
      description: The command may wait for a sleeping computer. Absent means false.
    threadId:
      type: string
    state:
      type: string
      enum:
        - queued
        - claimed
        - completed
        - rejected
        - expired
        - cancelled
  required:
    - id
    - senderDeviceId
    - runnerDeviceId
    - expiresAt
    - lockedKey
    - sealed
    - signature
    - threadId
    - state
  additionalProperties: false
CodeCommandChanged:
  type: object
  description: >-
    The data of a `command` event, a Code command's new stored state. The thread's stream and `streamComputerEvents`
    send it to the thread's person only. Ids and state, never ciphertext.
  properties:
    threadId:
      type: string
    id:
      type: string
      format: uuid
    runnerDeviceId:
      type: string
    state:
      type: string
      enum:
        - queued
        - claimed
        - completed
        - rejected
        - expired
        - cancelled
  required:
    - threadId
    - id
    - runnerDeviceId
    - state
  additionalProperties: false
CodeCommandClaimed:
  type: object
  properties:
    claimed:
      type: boolean
    command:
      $ref: "#/CodeCommand"
  required:
    - claimed
    - command
  additionalProperties: false
CodeCommandEnvelope:
  type: object
  properties:
    id:
      type: string
      format: uuid
    senderDeviceId:
      type: string
    runnerDeviceId:
      type: string
    expiresAt:
      type: integer
      format: int64
    lockedKey:
      type: string
      description: 80 bytes of HPKE ciphertext, base64url without padding.
    sealed:
      type: string
      description: Encrypted action payload, base64url without padding. At most 65581 decoded bytes.
    signature:
      type: string
      description: Ed25519 signature over the domain-separated command and its routing fields, base64url without padding.
    waits:
      type: boolean
      description: >-
        The person lets the command wait for a computer that is asleep or offline. Gateway then queues it without a live
        lease, and `expiresAt` may be up to 24 hours ahead (30 seconds more for clock skew). The sender signs
        `nexus-code-command-v2`, with `true` after the expiry line, so a runner that verifies only v1 never runs it.
        Absent means false.
  required:
    - id
    - senderDeviceId
    - runnerDeviceId
    - expiresAt
    - lockedKey
    - sealed
    - signature
  additionalProperties: false
CodeCommands:
  type: object
  properties:
    commands:
      type: array
      items:
        $ref: "#/CodeCommand"
      maxItems: 20
  required:
    - commands
  additionalProperties: false
CodeControl:
  type: object
  properties:
    runnerDeviceId:
      type:
        - string
        - "null"
    enabled:
      type: boolean
    expiresAt:
      type:
        - integer
        - "null"
      format: int64
    serverTime:
      type: integer
      format: int64
      description: >-
        Gateway's clock when it answered, in Unix milliseconds. A device seals a command's expiresAt by this clock. An
        older Gateway leaves it out.
  required:
    - runnerDeviceId
    - enabled
    - expiresAt
  additionalProperties: false
CodeControlLease:
  type: object
  properties:
    runnerDeviceId:
      type: string
    enabled:
      type: boolean
    expiresAt:
      type: integer
      format: int64
    signature:
      type: string
  required:
    - runnerDeviceId
    - enabled
    - expiresAt
    - signature
  additionalProperties: false
CollectedNotification:
  allOf:
    - $ref: "#/NotificationPayload"
    - type: object
      required:
        - deliveryId
      properties:
        deliveryId:
          type: string
          description: The delivery's id (`ndl_…`)
CollectedNotifications:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/CollectedNotification"
CompleteSlackInstall:
  type: object
  description: The query of Slack's redirect, as Nexus UI received it.
  required:
    - code
    - state
  additionalProperties: false
  properties:
    code:
      type: string
      description: Slack's one-time code; it expires after ten minutes.
    state:
      type: string
      description: The `state` of the install's authorize URL, as Slack sent it back.
ComputerInbox:
  type: object
  properties:
    requests:
      type: array
      maxItems: 20
      items:
        $ref: "#/ComputerRequest"
    serverTime:
      type: integer
      format: int64
  required:
    - requests
    - serverTime
  additionalProperties: false
ComputerList:
  type: object
  properties:
    computers:
      type: array
      maxItems: 32
      items:
        $ref: "#/ComputerPresence"
    serverTime:
      type: integer
      format: int64
  required:
    - computers
    - serverTime
  additionalProperties: false
ComputerPresence:
  type: object
  properties:
    version:
      type: integer
      enum:
        - 1
    scope:
      $ref: "#/ComputerScope"
    computerId:
      type: string
      format: uuid
    runnerDeviceId:
      type: string
    name:
      type: string
      minLength: 1
      maxLength: 64
      description: At most 64 Unicode scalar values and 160 UTF-8 bytes; no control characters.
    generation:
      type: integer
      format: int64
    issuedAt:
      type: integer
      format: int64
    expiresAt:
      type: integer
      format: int64
    enabled:
      type: boolean
    capabilities:
      type: array
      uniqueItems: true
      maxItems: 4
      items:
        type: string
        enum:
          - changes
          - projects
          - settings
          - start
    signature:
      type: string
  required:
    - version
    - scope
    - computerId
    - runnerDeviceId
    - name
    - generation
    - issuedAt
    - expiresAt
    - enabled
    - capabilities
    - signature
  additionalProperties: false
ComputerReplyEnvelope:
  type: object
  properties:
    version:
      type: integer
      enum:
        - 1
    scope:
      $ref: "#/ComputerScope"
    computerId:
      type: string
      format: uuid
    requestId:
      type: string
      format: uuid
    requestHash:
      type: string
    runnerDeviceId:
      type: string
    recipientDeviceId:
      type: string
    lockedKey:
      type: string
    sealed:
      type: string
      description: 29 to 262173 decoded encrypted bytes; canonical unpadded base64url.
    signature:
      type: string
  required:
    - version
    - scope
    - computerId
    - requestId
    - requestHash
    - runnerDeviceId
    - recipientDeviceId
    - lockedKey
    - sealed
    - signature
  additionalProperties: false
ComputerRequest:
  type: object
  properties:
    envelope:
      $ref: "#/ComputerRequestEnvelope"
    requestHash:
      type: string
    state:
      type: string
      enum:
        - queued
        - claimed
        - replied
        - expired
    reply:
      anyOf:
        - $ref: "#/ComputerReplyEnvelope"
        - type: "null"
    serverTime:
      type: integer
      format: int64
  required:
    - envelope
    - requestHash
    - state
    - reply
    - serverTime
  additionalProperties: false
ComputerRequestChanged:
  type: object
  description: >-
    The data of a `request` event on `streamComputerEvents`, a computer request's new stored state. Ids and state, never
    ciphertext.
  properties:
    computerId:
      type: string
      format: uuid
    id:
      type: string
      format: uuid
    state:
      type: string
      enum:
        - queued
        - claimed
        - replied
        - expired
  required:
    - computerId
    - id
    - state
  additionalProperties: false
ComputerRequestClaim:
  type: object
  properties:
    runnerDeviceId:
      type: string
    signature:
      type: string
  required:
    - runnerDeviceId
    - signature
  additionalProperties: false
ComputerRequestClaimed:
  type: object
  properties:
    claimed:
      type: boolean
    request:
      $ref: "#/ComputerRequest"
  required:
    - claimed
    - request
  additionalProperties: false
ComputerRequestEnvelope:
  type: object
  properties:
    version:
      type: integer
      enum:
        - 1
    scope:
      $ref: "#/ComputerScope"
    computerId:
      type: string
      format: uuid
    id:
      type: string
      format: uuid
    senderDeviceId:
      type: string
    runnerDeviceId:
      type: string
    generation:
      type: integer
      format: int64
    issuedAt:
      type: integer
      format: int64
    expiresAt:
      type: integer
      format: int64
    lockedKey:
      type: string
      description: 80 decoded HPKE bytes; canonical unpadded base64url.
    sealed:
      type: string
      description: 29 to 65565 decoded encrypted bytes; canonical unpadded base64url.
    signature:
      type: string
  required:
    - version
    - scope
    - computerId
    - id
    - senderDeviceId
    - runnerDeviceId
    - generation
    - issuedAt
    - expiresAt
    - lockedKey
    - sealed
    - signature
  additionalProperties: false
ComputerScope:
  type: object
  properties:
    gateway:
      type: string
      description: Normalized Gateway HTTP(S) URL, without trailing slash.
    tenantId:
      type: string
    personId:
      type: string
  required:
    - gateway
    - tenantId
    - personId
  additionalProperties: false
Connection:
  type: object
  required:
    - connector
    - scope
    - scopeId
    - account
    - name
    - status
    - kind
    - createdAt
    - suspended
  properties:
    connector:
      type: string
    scope:
      type: string
      enum:
        - user
        - org
      description: A person's own (user) or the organization's (org)
    scopeId:
      type: string
      description: The person's user id, or the organization's id
    account:
      type: string
      description: The vendor's stable id for the account (an Atlassian cloud id)
    name:
      type: string
      description: The account's name, as a call's `account` may name it
    data:
      type: object
      description: What reaches the account and is not secret (its host)
    identity:
      type: string
      description: Who the vendor says the holder is there
    status:
      type: string
      enum:
        - active
        - needs_reconnect
    suspended:
      type: boolean
      description: >-
        Its connector is in preview and this Gateway does not offer it: no call uses the connection until the connector
        is offered. It can still be disconnected
    kind:
      type: string
      enum:
        - api_key
        - basic
        - oauth2
        - installation
    last4:
      type: string
      description: The last four characters of its secret; never the secret
    scopes:
      type: array
      items:
        type: string
    expiresAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
ConnectorAvailability:
  type: object
  required:
    - name
    - availability
    - teams
    - default
    - offered
  properties:
    name:
      type: string
    availability:
      type: string
      enum:
        - disabled
        - available
        - enabled_for_all
      description: "available: members opt in"
    teams:
      type:
        - array
        - "null"
      items:
        type: string
      description: Team slugs (a deleted team's id); null for the whole organization
    default:
      type: boolean
      description: "The connector's default: the organization never chose"
    offered:
      type: boolean
      description: >-
        Whether this Gateway offers the connector. The organization's choice of one it does not offer is kept; no one
        uses it, and it may only be set to disabled
    changedBy:
      type: string
    changedAt:
      type: string
      format: date-time
ConnectorAvailabilityList:
  type: object
  required:
    - connectors
  properties:
    connectors:
      type: array
      items:
        $ref: "#/ConnectorAvailability"
ContinuedChatSession:
  description: The new session and the organization it was made in, which pays for it.
  allOf:
    - $ref: "#/ChatSession"
    - type: object
      required:
        - org
        - orgCreated
      properties:
        org:
          $ref: "#/OrgSummary"
        orgCreated:
          type: boolean
          description: "Whether that organization was made now: your personal organization, which you did not have yet."
CreateAgentLink:
  type: object
  additionalProperties: false
  required:
    - agent
    - label
  properties:
    agent:
      type: string
      minLength: 1
      maxLength: 40
      pattern: ^[a-z0-9][a-z0-9-]*$
      description: What the agent is, as a slug (`slack`).
    label:
      type: string
      minLength: 1
      maxLength: 80
    grant:
      type: array
      minItems: 1
      items:
        type: string
        enum:
          - models.use
          - spend.read_own
      description: What the agent may do. `models.use` by default.
    expiresAt:
      type: string
      format: date-time
      description: In the future, at most 365 days from now. 90 days from now by default.
    session:
      type: boolean
      default: false
      description: >-
        A link for one agent session: deleted, not kept, when it ends (`DELETE /v1/agent-links/{id}`), so a second end
        answers 404. It also ends after 15 to 30 minutes without use, so the link of a client that stopped without
        ending it does not stay live; the client makes a new one. Making one also deletes up to 20 of your ended session
        links. The audit keeps their history.
    dryRun:
      type: boolean
      default: false
      description: Check everything and write nothing.
CreateAgentProfileRequest:
  description: "An omitted field takes its default: no identity, no labels, no instructions, tools null and proactivity ask_first"
  allOf:
    - $ref: "#/AgentProfileFields"
    - type: object
      required:
        - name
      properties:
        team:
          type: string
          description: "A team's slug or id: a company agent for that team. Absent: your personal agent"
CreateApproval:
  type: object
  required:
    - connector
    - operation
    - arguments
  additionalProperties: false
  properties:
    connector:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
    operation:
      type: string
      pattern: ^[a-z][a-z0-9_-]*$
    arguments:
      type: object
      description: The body the write will send, exactly
CreateCloudMachine:
  type: object
  properties:
    sessionId:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,128}$
      description: >-
        The desktop session the machine is for (`t_<uuid>`). One live machine for each session. An older app sends none,
        and gets a new machine each time.
    title:
      type: string
      description: The session's title. Gateway keeps its first line, cut to 200 characters.
    name:
      type: string
      deprecated: true
      description: "Read and ignored: the machine's name is the session's title."
    size:
      type: string
      deprecated: true
      description: "Read and ignored: Nexus sizes every machine."
    repo:
      type: string
      maxLength: 512
      description: >-
        The repository the session clones: a URL, or a GitHub `owner/name`. With a server setting on, a GitHub one
        starts the machine from the organization's saved copy of it, when there is one and GitHub lets the person read
        it (`x-nexus-github-token`). Anything else is ignored.
CreatePageCommentRequest:
  type: object
  required:
    - body
  properties:
    body:
      type: string
      minLength: 1
      maxLength: 4000
    threadId:
      type: string
      description: Reply in this thread (a reply's id joins its thread). A reply has no quote, prefix, suffix or pin
    quote:
      type: string
      maxLength: 2000
      description: The passage a new thread is about; unset comments on the whole page
    prefix:
      type: string
      maxLength: 200
      description: The text just before the quote
    suffix:
      type: string
      maxLength: 200
      description: The text just after the quote
    pin:
      $ref: "#/PagePin"
      description: A new thread's point on a design's board, instead of a quote. A reply has none
    version:
      type: integer
      minimum: 1
      description: "The version the passage is on; unset: the newest you can open"
CreatePageRequest:
  type: object
  required:
    - title
    - content
  properties:
    routes:
      type: array
      maxItems: 31
      description: >-
        Additional saved HTML or React Site routes. The content field holds the root. On a version write, omission
        carries the previous routes and an empty list removes them.
      items:
        $ref: "#/SiteRouteWrite"
    title:
      type: string
      minLength: 1
      maxLength: 120
      description: 1 to 120 characters
    format:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
      default: html
    content:
      type: string
      description: "The page's source: HTML, or Markdown. At most 16 MiB of UTF-8."
CreateRoutineRequest:
  type: object
  required:
    - trigger
    - action
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: "`Morning brief` when absent; `Watch` for a watch."
    trigger:
      $ref: "#/RoutineTrigger"
    action:
      $ref: "#/RoutineAction"
    proactivity:
      $ref: "#/RoutineProactivity"
    caps:
      $ref: "#/RoutineCaps"
    reportTo:
      type: string
      enum:
        - slack
      description: Your Slack direct messages; the default.
    team:
      type: string
      description: The team its model calls go to, by slug or id; your default team when absent.
CreateServiceAccount:
  type: object
  additionalProperties: false
  required:
    - name
    - team
    - expiresAt
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
    ownerUserId:
      type: string
      description: The member who answers for it. The caller by default.
    team:
      type: string
      description: "The team that owns it: its slug or id."
    expiresAt:
      type: string
      format: date-time
      description: In the future, at most 365 days from now.
    dryRun:
      type: boolean
      default: false
      description: Check everything and write nothing.
CreateSession:
  type: object
  required:
    - prompt
  properties:
    repo:
      type: string
      description: The GitHub repository, `owner/name` (a github.com URL also works). Required for now.
    projectId:
      type: string
      description: "Reserved for projects: refused for now (`project_id_unsupported`)."
    agent:
      type: string
      description: >-
        A coding agent that runs in cloud sessions: `claude` or `codex`, and `opencode` when the Gateway turns it on.
        Absent, empty or `auto`: the model picks it (open-weight models run on `opencode`, Anthropic models on `claude`,
        OpenAI models on `codex`). Another agent is refused with `invalid_agent`.
    model:
      type: string
      description: >-
        A catalog model (`GET /v1/models`) or the agent's own model name; absent for the agent's default. Required when
        `agent` is absent. With `agent`, a catalog model that another agent runs is refused with `agent_model_mismatch`.
    prompt:
      type: string
      description: The session's first message, 1 to 100000 characters.
    title:
      type: string
      description: The session's title, kept on one line, at most 200 characters.
    idempotencyKey:
      type: string
      description: "Names the session: a resend with the same body answers the same session. Else the `Idempotency-Key` header's."
    startedBy:
      $ref: "#/SessionStartedBy"
CreateSkillRequest:
  type: object
  required:
    - content
  properties:
    content:
      type: string
      description: >-
        The SKILL.md: YAML front matter between `---` lines with a `name` and a `description`, then the instructions. At
        most 1 MiB of UTF-8. Stored exactly as written.
CreateTeamKeyRequest:
  type: object
  additionalProperties: false
  required:
    - epoch
    - encryptionKey
    - senderDeviceId
  properties:
    epoch:
      type: integer
      minimum: 1
      description: "One more than the newest epoch: 1 for the first."
    encryptionKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: "The new epoch's X25519 public half: 32 bytes in base64url without padding."
    senderDeviceId:
      type: string
      description: Your trusted device that made the epoch and signs its copies.
    copies:
      type: array
      maxItems: 500
      items:
        $ref: "#/TeamKeyCopyRequest"
      description: The new epoch's first copies, each of `epoch`.
  description: The team key's next epoch.
CreateTenantResponse:
  type: object
