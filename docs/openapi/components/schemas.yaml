            type: string
          email:
            type: string
          role:
            type: string
    rolesChanged:
      type: array
      items:
        type: object
        properties:
          team:
            type: string
          email:
            type: string
          from:
            type: string
          to:
            type: string
    membershipsRemoved:
      type: array
      items:
        type: object
        properties:
          team:
            type: string
          email:
            type: string
          role:
            type: string
    pending:
      type: array
      items:
        type: object
        properties:
          team:
            type: string
          email:
            type: string
          role:
            type: string
    pendingRemoved:
      type: array
      items:
        type: object
        properties:
          team:
            type: string
          email:
            type: string
    defaults:
      type: array
      items:
        type: object
        properties:
          email:
            type: string
          team:
            type: string
