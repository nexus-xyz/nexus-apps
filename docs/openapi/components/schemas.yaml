    epoch:
      type: integer
    holderId:
      type: string
    lockedKey:
      type: string
      description: The epoch's private half, HPKE-sealed to the holder's encryptionKey.
    senderDeviceId:
      type: string
      description: The member's trusted device that signed it.
    signature:
      type: string
    createdAt:
      type: string
      format: date-time
  description: One holder's copy of a team-key epoch, with the signature to check before you use it.
TeamKeyCopyRequest:
  type: object
  additionalProperties: false
  required:
    - epoch
    - holderId
    - lockedKey
    - signature
  properties:
    epoch:
      type: integer
      minimum: 1
    holderId:
      type: string
      description: A trusted holder of a member of this organization.
    lockedKey:
      type: string
      minLength: 1
      maxLength: 512
      pattern: ^[A-Za-z0-9_-]+$
      description: "The epoch's private half, HPKE-sealed to the holder's encryptionKey: base64url without padding."
    signature:
      type: string
      description: "Ed25519 over `nexus-team-key:v1:{orgId}:{epoch}:{holderId}:{lockedKey}`: 64 bytes in base64url without padding."
  description: One team-key epoch's private half, sealed to one member's trusted holder.
TeamKeyHolder:
  type: object
  required:
    - id
    - kind
    - encryptionKey
    - signingKey
    - approvedBy
    - approvalSignature
    - approvedAt
    - hasCurrentTeamKey
    - state
  properties:
    id:
      type: string
    kind:
      type: string
      enum:
        - device
        - passkey
        - recovery_code
    encryptionKey:
      type: string
      description: "X25519 public key, base64url: seal the team key's copy to it."
    signingKey:
      type:
        - string
        - "null"
      description: Ed25519 public key, base64url. Null for a recovery key.
    approvedBy:
      type:
        - string
        - "null"
      description: The holder that approved it; null for the person's root.
    approvalSignature:
      type:
        - string
        - "null"
      description: The approver's signature, as `Device.approvalSignature`.
    approvedAt:
      type:
        - string
        - "null"
      format: date-time
    hasCurrentTeamKey:
      type: boolean
      description: Whether it holds a copy of the current epoch. Hand the key only to a holder without one.
    state:
      type: string
      enum:
        - trusted
        - revoked
      description: Observed revoked holders must never receive a new key, even if later listed as trusted.
  description: "A member's trusted or revoked holder: its public keys, approval, state and current-epoch coverage, never its name."
