              retryable: false
              meaning: The model policy is not valid.
            - code: invalid_agent
              status: 400
              retryable: false
              meaning: The agent name is not valid.
            - code: decisions_not_configured
              status: 503
              retryable: false
              meaning: Typed decisions are not available on this server.
            - code: decisions_upstream_failed
              status: 502
              retryable: true
              meaning: The decision model answered none of the requests.
            - code: chat_session_not_found
              status: 404
              retryable: false
              meaning: No such chat session.
            - code: chat_session_empty
              status: 409
              retryable: false
              meaning: The chat session has no messages to share.
            - code: chat_attachment_not_found
              status: 404
              retryable: false
              meaning: No such attachment in this chat session.
            - code: continue_not_allowed
              status: 403
              retryable: false
              meaning: The author did not allow readers to continue this artifact.
            - code: stays_in_organization
              status: 403
              retryable: false
              meaning: Work never moves between organizations on its own.
            - code: artifact_not_found
              status: 404
              retryable: false
              meaning: No artifact at this link. It was revoked, expired or never existed.
            - code: artifact_revoked
              status: 404
              retryable: false
              meaning: The artifact was revoked.
            - code: artifact_access_required
              status: 403
              retryable: false
              meaning: The artifact is shared with named people only. Ask its author for access.
            - code: artifact_attachment_not_found
              status: 404
              retryable: false
              meaning: No such image in this artifact.
            - code: not_artifact_author
              status: 403
              retryable: false
              meaning: Only the author, an owner or an admin can do this.
            - code: not_external
              status: 400
              retryable: false
              meaning: Only an artifact shared with named outside people has people to grant.
            - code: audience_empty
              status: 400
              retryable: false
              meaning: An artifact shared with named people keeps at least one.
            - code: invalid_email
              status: 400
              retryable: false
              meaning: A value is not an email address.
            - code: invalid_expiry
              status: 400
              retryable: false
              meaning: The expiry is too far in the future.
            - code: expiry_required
              status: 400
              retryable: false
              meaning: The organization requires public links to expire.
            - code: expiry_too_long
              status: 400
              retryable: false
              meaning: The expiry is longer than the organization allows.
            - code: access_request_limited
              status: 429
              retryable: true
              meaning: Too many access requests today. Try again tomorrow.
            - code: public_share_rate_limited
              status: 429
              retryable: true
              meaning: Too many public links in the last hour.
            - code: public_links_off
              status: 403
              retryable: false
              meaning: The organization allows sharing with named people only.
            - code: domain_not_allowed
              status: 403
              retryable: false
              meaning: The organization does not allow sharing with this domain.
            - code: external_sharing_off
              status: 403
              retryable: false
              meaning: The organization turned off sharing outside it.
            - code: external_sharing_admins_only
              status: 403
              retryable: false
              meaning: Only owners and admins can share outside the organization.
            - code: external_continue_off
              status: 403
              retryable: false
              meaning: The sharing organization does not let outside people continue its chats.
            - code: external_code_not_allowed
              status: 403
              retryable: false
              meaning: The organization does not allow code sources outside it.
            - code: invalid_runner_id
              status: 400
              retryable: false
              meaning: The `runnerId` is not 1 to 200 characters.
            - code: invalid_token
              status: 400
              retryable: false
              meaning: The `seenToken` is negative. Send the session's `fencingToken` as you read it.
            - code: takeover_conflict
              status: 409
              retryable: false
              meaning: >-
                Another runner holds the session, or took it after the token you saw. `nexus.currentFencingToken` holds
                the current token. Read the session, then take it over with that token.
            - code: lost_runner
              status: 409
              retryable: false
              meaning: >-
                Another runner took the session, so your fencing token is not current (`nexus.currentFencingToken` holds
                the current one). Stop running the session and stop writing for it.
            - code: session_ended
              status: 409
              retryable: false
              meaning: The session stopped or failed. Start a new one.
            - code: session_not_found
              status: 404
              retryable: false
              meaning: The named session does not exist or is not the caller's.
            - code: auth_required
              status: 403
              retryable: false
              meaning: The connector is not connected for this organization.
            - code: invalid_query
              status: 400
              retryable: false
              meaning: The connector query is not valid.
            - code: invalid_session_fence
              status: 400
              retryable: false
              meaning: >-
                A write inside a session must name both `x-nexus-cloud-session` and `x-nexus-fencing-token`, a positive
                integer.
            - code: fence_required
              status: 409
              retryable: false
              meaning: >-
                The credential's runner holds a live lease on a native session, so a write must name that session's
                fence (`x-nexus-cloud-session` and `x-nexus-fencing-token`). `nexus.session` names the session. Nothing
                was sent.
            - code: write_consent_required
              status: 403
              retryable: false
              meaning: >-
                The connection was consented for reading only. `nexus.scopes` names the write scopes the change needs.
                Ask for them with `nexus.consent` (POST /v1/connections/{connector}/oauth with `access: write`), then
                send the change again. Nothing was sent.
            - code: invalid_cursor
              status: 400
              retryable: false
              meaning: The cursor is invalid or the list changed. Start again without a cursor.
            - code: invalid_search
              status: 400
              retryable: false
              meaning: The search query is not valid.
            - code: invalid_reason
              status: 400
              retryable: false
              meaning: The reason is empty or too long.
            - code: invalid_utf8
              status: 400
              retryable: false
              meaning: The request body is not valid UTF-8.
            - code: nul_in_string
              status: 400
              retryable: false
              meaning: A string contains a NUL character.
            - code: repeated_field
              status: 400
              retryable: false
              meaning: A field appears more than once in the body.
            - code: request_too_large
              status: 413
              retryable: false
              meaning: The request body is too large.
            - code: invalid_signature
              status: 401
              retryable: false
              meaning: A signature is not valid.
            - code: timeout
              status: 504
              retryable: false
              meaning: The server did not answer in time. For a write, check the state before you retry with a new key.
            - code: overloaded
              status: 503
              retryable: true
              meaning: The server is at its limit. Retry shortly.
            - code: database_busy
              status: 503
              retryable: true
              meaning: The database is busy. Retry shortly.
            - code: draining
              status: 503
              retryable: true
              meaning: The server is stopping and takes no new request. Wait for `Retry-After`, then retry.
            - code: cutover_paused
              status: 503
              retryable: true
              meaning: >-
                Sign-in, account deletion and organization changes are paused for the auth cutover. Wait for
                `Retry-After`, then retry.
            - code: gateway_stopping
              status: 503
              retryable: true
              meaning: The server stopped before the model call answered. Send the call again.
            - code: vault_unavailable
              status: 503
              retryable: true
              meaning: The secret store is unavailable. Retry later.
            - code: not_configured
              status: 503
              retryable: false
              meaning: The feature is not configured on this server.
            - code: not_ported
              status: 501
              retryable: false
              meaning: The server does not implement this yet.
            - code: upstream_error
              status: 502
              retryable: true
              meaning: An upstream service failed.
            - code: agents_api_unreachable
              status: 502
              retryable: true
              meaning: The agent service did not answer. It may be off. Retry later.
            - code: upstream_timeout
              status: 504
              retryable: true
              meaning: An upstream service did not answer in time.
            - code: upstream_overloaded
              status: 503
              retryable: true
              meaning: The model provider is overloaded.
            - code: upstream_auth
              status: 502
              retryable: false
              meaning: The provider rejected the organization's key.
            - code: upstream_billing
              status: 502
              retryable: false
              meaning: The provider account has no credit.
            - code: upstream_forbidden
              status: 502
              retryable: false
              meaning: The provider refused this model for the key.
            - code: gone
              status: 410
              retryable: false
              meaning: The operation passed its sunset date. See DEPRECATION.md.
            - code: agent_memory_version_conflict
              status: 409
              retryable: false
              meaning: "Agent memory or state: the `If-Match` value is not the row's current version. Read the row again."
              x-status: legacy
            - code: agent_memory_precondition_required
              status: 428
              retryable: false
              meaning: "Agent memory or state: a write has neither `If-Match` nor `If-None-Match: *`."
              x-status: legacy
        param:
          type: string
          description: "`model` when the error is a model refusal (a `code` starting with `model_`); absent otherwise."
        nexus:
          type: object
          additionalProperties: true
          description: "Details of the error, when it has any: the policy rule of a model refusal, the seconds of a 408."
          properties:
            etag:
              type: string
              description: "On a Gateway 412 `version_mismatch` only: the current `ETag`, as in the `ETag` header."
              examples:
                - "\"42\""
            currentFencingToken:
              type: integer
              description: "On a 409 `takeover_conflict` or `lost_runner` only: the session's current fencing token."
              examples:
                - 3
            session:
              type: string
              description: >-
                On a 409 `fence_required` only: the native session whose live runner lease the caller's credential
                holds.
              examples:
                - cs_abc
        minimum:
          type: string
          description: "On a 426 `cli_too_old` only: the oldest `nexus` CLI version Gateway supports."
  required:
    - error
  description: The one error shape of every Nexus API answer of 400 or more, except the provider-compatible routes.
