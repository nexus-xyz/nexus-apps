      description: >-
        One event the item reports, as ids: a refused call's spend record, an access request or report on an artifact, a
        billing change's audit row, a billing month whose payment failed, a person who joined, a skill promotion, a
        security change's audit action, the provider of a rejected key, the answer to the person's own access request, a
        GitHub App installation that lost repositories, a closed month's usage report, a spend limit change's audit
        action, a referral by a hash of the referred person's id, a state of the organization's money, or a member's
        question to the owners about a billing block, or a Policy approval record that waits on the person, or a cloud
        session whose state moved.
      properties:
        type:
          type: string
          enum:
            - spend
            - artifact_access
            - artifact_access_answer
            - artifact_report
            - billing_change
            - billing_period
            - member
            - skill_promotion
            - security_change
            - provider_key
            - github_installation
            - usage_month
            - limit_change
            - referral
            - billing_state
            - owner_ask
            - approval
            - session
        spendId:
          type: string
        artifactId:
          type: string
        requestId:
          type: string
        reportId:
          type: string
        auditId:
          type: string
          description: The billing change's audit row, for `billing_change`
        periodId:
          type: string
          description: The billing month's id, for `billing_period`
        userId:
          type: string
        promotionId:
          type: string
          description: The skill promotion (`spr_…`), for `type` `skill_promotion`.
        action:
          type: string
          description: >-
            The audit action of a security change, such as key.revoked, or of a limit change, such as
            budget.team_changed
        provider:
          type: string
          description: The provider of a rejected key, for `provider_key`
        outcome:
          type: string
          enum:
            - granted
            - denied
          description: How the author answered the person's access request, for `artifact_access_answer`
        installationId:
          type: string
          description: The Nexus GitHub App installation's GitHub id, for `github_installation`
        month:
          type: string
          description: The closed UTC calendar month, `YYYY-MM`, for `usage_month`
        referral:
          type: string
          description: A hash of the referred person's id, never the id, for `referral`
        state:
          type: string
          enum:
            - usage_limit_reached
            - credits_low
            - credits_out
            - free_start_near
            - free_start_used
            - free_start_expiring
            - free_start_expired
            - auto_topup_off
            - usage_limit_near
            - pricing_change
            - contract_invoice_due
            - card_expiring
            - plan_ai_near
            - plan_ai_used
            - plan_cloud_near
            - plan_cloud_used
          description: The organization's money state, for `billing_state`
        block:
          type: string
          enum:
            - usage_limit
            - credits_out
            - free_start_used
            - payment_failed
            - past_due
            - billing
          description: What stops the member who asked, for `owner_ask` (`userId` is that member)
        approvalId:
          type: string
          description: The Policy approval record (`apr_…`) that waits on the person, for `approval`
        machineId:
          type: string
          description: The cloud machine the session runs on, for `session`
        threadId:
          type: string
          description: The session's workbench thread on the machine, for `session`
        seq:
          type: integer
          format: int64
          description: The session's event that moved its state, for `session`
    - type: object
      required:
        - type
        - appId
        - notice
      properties:
        type:
          type: string
          enum:
            - app_hosting
        appId:
          type: string
        notice:
          type: string
          enum:
            - half
            - near
            - reached
            - payment_due
  discriminator:
