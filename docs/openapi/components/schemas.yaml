            - public
        artifacts.external.code:
          type: boolean
        artifacts.external.domains:
          type: object
          required:
            - allow
            - deny
          properties:
            allow:
              type: array
              items:
                type: string
            deny:
              type: array
              items:
                type: string
        artifacts.external.expiry:
          type: object
          required:
            - maxDays
            - required
          properties:
            maxDays:
              type:
                - integer
                - "null"
              minimum: 1
              maximum: 3650
            required:
              type: boolean
        artifacts.external.continue:
          type: boolean
        artifacts.external.who:
          type: string
          enum:
            - everyone
            - admins
        agentSubscriptions:
          type: boolean
        artifacts.pages:
          type: boolean
        artifacts.pages.public:
          type: boolean
        artifacts.pages.queries:
          type: boolean
        webSearch.engine:
          type: string
          enum:
            - "off"
            - borrowed
        webSearch.model:
          type:
            - string
            - "null"
        webSearch.domains:
          type: object
          required:
            - allow
            - deny
          properties:
            allow:
              type: array
              items:
                type: string
            deny:
              type: array
              items:
                type: string
        webSearch.maxPerTurn:
          type: integer
        webSearch.requireZdr:
          type: boolean
        sessionContent:
          type: string
          enum:
            - never
            - user
            - user_and_org
        multiplayerSessions:
          type: boolean
        cloudHistory:
          type: boolean
        webSessionViewer:
          type: boolean
    updatedAt:
      type: string
      format: date-time
    artifacts.external:
      type: string
      enum:
        - "off"
        - named
        - public
      description: "Sharing artifacts outside the organization: off, named people only, or also public links (default public)"
    artifacts.external.code:
      type: boolean
      description: May external snapshots include Ask your code's sources (default false)
    artifacts.external.domains:
      type: object
      required:
        - allow
        - deny
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
      description: >-
        Email domains named outsiders may (allow, when set) or may not (deny) have; a domain matches itself and its
        subdomains (default both empty)
    artifacts.external.expiry:
      type: object
      required:
        - maxDays
        - required
      properties:
        maxDays:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 3650
        required:
          type: boolean
      description: The longest a public link may stay open, and whether every public link must expire (default none and false)
    artifacts.external.continue:
      type: boolean
      description: May people outside continue the chat in an organization of their own, at its expense (default true)
    artifacts.external.who:
      type: string
      enum:
        - everyone
        - admins
      description: "Who may share outside: everyone, or owners and admins (default everyone)"
    artifacts.pages:
      type: boolean
      description: "Pages: off refuses new pages, versions, shares and every page frame (default true)"
    artifacts.pages.public:
      type: boolean
      description: >-
        Public links to pages: off refuses new ones and stops existing ones from opening (default false in a company
        organization, true in a personal one)
    artifacts.pages.queries:
      type: boolean
      description: >-
        Page queries (Nexus Data): on lets a page's owner approve read-only queries on a connection, whose results the
        page's readers see; off refuses saving and running them (default false)
    webSearch.engine:
      type: string
      enum:
        - "off"
        - borrowed
      description: >-
        Gates hosted web search in chat and in Code (`nexus claude --api`, `nexus codex --api`): off or borrowed
        (default borrowed; off means no web search runs)
    webSearch.model:
      type:
        - string
        - "null"
      description: >-
        The model that runs a chat's search: null for the default (the chat's own model, the cheapest on nexus/auto),
        cheapest, or a model's catalog id. A pinned model the person may not use, or nobody pays for, gives that person
        no search, and so does an id this Gateway cannot call, which is shown as stored. Chat only
    webSearch.domains:
      type: object
      required:
        - allow
        - deny
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
      description: >-
        Domains a search result may (allow, when set) or may not (deny) come from (default both empty). While any is
        set, no web search runs, in chat or in Code, until the engine applies them
    webSearch.maxPerTurn:
      type: integer
      minimum: 1
      maximum: 10
      description: Most searches in one chat turn (default 3). Applies to Gateway-run engines (chat) only
    webSearch.requireZdr:
      type: boolean
      description: >-
        Whether only engines with zero data retention may run (default false). While set, no web search runs, in chat or
        in Code, until the engine applies it
    sessionContent:
      type: string
      enum:
        - never
        - user
        - user_and_org
      description: >-
        The content policy for synced sessions that runners follow, readable by every member. The default is user in
        every organization; only a saved user_and_org applies, and it reads as user while the organization has no
        recovery key (getOrgRecoveryKey)
    multiplayerSessions:
      type: boolean
      description: >-
        Whether members read each other's team-visible synced sessions, still end-to-end encrypted. False by default;
        always false in a personal one
    cloudHistory:
      type: boolean
      description: >-
        Whether Gateway stores the organization's cloud session history, so a sleeping cloud session reads on any
        device. True by default. Off, Gateway stores none. Omitted for an organization that cannot run cloud machines
        and stores no cloud history
    webSessionViewer:
      type: boolean
      description: >-
        Whether Nexus UI in a browser opens the organization's synced sessions. True by default. Off, Nexus UI's
        credential (its session token or its server's secret) gets 403 web_session_viewer_off for sealed events, key
        copies and a new device
  description: >-
    The organization's settings (owners and admins change them; PUT takes any subset, null resets a setting to its
    default; audited as org.settings_changed). Web search is on until an owner or admin sets webSearch.engine to off.
OrgSubscription:
  type: object
  required:
    - plan
    - payerUserId
    - billingContactUserId
    - periodStart
    - periodEnd
    - status
    - statusEffectiveAt
    - effectiveAt
    - updatedAt
    - seats
  properties:
    plan:
      type:
        - string
        - "null"
      description: "Written by Billing: an entry of Billing Capabilities' plan catalogue; null until one is chosen."
    payerUserId:
      type:
        - string
        - "null"
      description: The member who pays; null until named.
    billingContactUserId:
      type:
        - string
        - "null"
      description: The member who receives billing mail; null until named.
    periodStart:
      type:
        - string
        - "null"
      format: date
      description: "Written by Billing: the first day of the paid term."
    periodEnd:
      type:
        - string
        - "null"
      format: date
      description: "Written by Billing: the day the paid term ends; null for an open term."
    status:
      type: string
      enum:
        - active
        - past_due
        - cancelled
        - under_contract
      description: Written by Billing alone. It changes what the organization is entitled to, never who is in it.
    statusEffectiveAt:
      type: string
      format: date-time
      description: When the status took effect.
    effectiveAt:
      type: string
      format: date-time
      description: When the newest change took effect.
    updatedAt:
      type:
        - string
        - "null"
      format: date-time
      description: When the subscription was last written; null until its first change.
    seats:
      type: integer
      minimum: 0
      description: One per member that `GET /v1/orgs/members` lists, counted when read.
OrgSubscriptionChange:
  type: object
  required:
    - subscription
    - changed
    - dryRun
  properties:
    subscription:
      $ref: "#/OrgSubscription"
    changed:
      type: array
      items:
        type: string
      description: The fields that changed, or would change on a dry run; empty when nothing did.
    dryRun:
      type: boolean
      description: True when nothing was written.
OrgSummary:
  type: object
  required:
    - id
    - name
    - kind
  properties:
    id:
      type: string
    name:
      type: string
    slug:
      type: string
    clerkOrgId:
      type: string
      description: "Its sign-in provider organization's id: Nexus UI's URL segment when it has no slug"
    kind:
      $ref: "#/TenantKind"
    role:
      $ref: "#/Role"
    current:
      type: boolean
      description: The organization this request is in
    imageUrl:
      type: string
      description: Its logo, as the tenant's imageUrl (https://img.clerk.com/…); unset when it has none.
OrgThreadKeyStored:
  type: object
  required:
    - threadId
    - keyVersion
    - orgKeyId
    - stored
  properties:
    threadId:
      type: string
    keyVersion:
      type: integer
    orgKeyId:
      type: string
    stored:
      type: boolean
      description: "False when the copy was already stored: the stored one is kept."
  description: "`PUT /v1/threads/{threadId}/org-key`'s answer."
PageBoardAsked:
  type: object
  description: The chat it opened on the page, and the instruction to send there.
  required:
    - session
    - instruction
  properties:
    session:
      $ref: "#/ChatSession"
    instruction:
      type: string
      description: "Send it as the chat's next message: what to do with the board, by its data-id"
PageCheck:
  type: object
  required:
    - pageId
    - version
    - designSystem
    - linked
    - findings
    - counts
    - truncated
    - elements
  properties:
    pageId:
      type: string
    version:
      type: integer
    designSystem:
      $ref: "#/DesignSystem"
    linked:
      type: boolean
      description: Whether the page links it; else it is the organization's default
    findings:
      type: array
      maxItems: 200
      items:
        $ref: "#/PageCheckFinding"
    counts:
      $ref: "#/PageCheckCounts"
    truncated:
      type: boolean
    elements:
      type: integer
      description: How many elements were checked
  description: What Check found in a design. It never changes the page.
PageCheckBox:
  type: object
  required:
    - x
    - "y"
    - w
    - h
  properties:
    x:
      type: number
    "y":
      type: number
    w:
      type: number
    h:
      type: number
  description: CSS pixels from the board's top-left corner (the page's, outside a board).
PageCheckCounts:
  type: object
  required:
    - color
    - fontSize
    - spacing
    - contrast
  properties:
    color:
      type: integer
    fontSize:
      type: integer
    spacing:
      type: integer
    contrast:
      type: integer
    overflow:
      type: integer
    clippedText:
      type: integer
    outsideBoard:
      type: integer
    misalignedRows:
      type: integer
  description: Findings by kind, before the list is cut.
PageCheckFinding:
  type: object
  required:
    - kind
    - selector
    - box
    - property
    - value
    - message
  properties:
    kind:
      type: string
      enum:
        - color
        - font-size
        - spacing
        - contrast
        - overflow
        - clipped-text
        - outside-board
        - misaligned-rows
    board:
      type: string
      description: The board's `data-artboard` name
    boardId:
      type: string
      description: The board's `data-id`
    layer:
      type: string
      description: The nearest `data-layer` name
    selector:
      type: string
      description: A CSS selector for the element, from its board
    box:
      $ref: "#/PageCheckBox"
    property:
      type: string
    value:
      type: string
      description: The computed value
    expected:
      type: string
      description: The nearest token, or the contrast needed
    ratio:
      type: number
      description: A contrast finding's ratio
    message:
      type: string
  description: A value off the design system's tokens, text below WCAG AA contrast, or a layout slip.
PageComment:
  type: object
  description: >-
    A comment on a page. A thread's first comment quotes a passage or pins a point on a design's board; a reply names
    its thread.
  required:
    - id
    - pageId
    - mine
    - body
    - version
    - createdAt
  properties:
    id:
      type: string
      description: "`pcm_…`"
    pageId:
      type: string
    threadId:
      type: string
      description: The thread's first comment; absent on that first comment
    author:
      type: string
      description: The author's name or email. Absent for a reader outside the page's organization, except on their own comments
    mine:
      type: boolean
      description: Whether you wrote it
    body:
      type: string
    quote:
      type: string
      description: The passage the thread is about
    prefix:
      type: string
      description: Up to 200 characters just before the passage, to find it again in a later version
    suffix:
      type: string
      description: Up to 200 characters just after the passage
    pin:
      $ref: "#/PagePin"
      description: The point on a design's board the thread is pinned to
    version:
      type: integer
      description: The version it was made on
    resolvedAt:
      type: string
      format: date-time
      description: When the thread was resolved; absent while it is open
    chatSessionId:
      type: string
      description: The chat Ask Nexus opened, on the reply it posted
    createdAt:
      type: string
      format: date-time
PageCommentAsked:
  type: object
  description: The reply posted in the thread, the chat it opened on the page, and the instruction to send there.
  required:
    - comment
    - session
    - instruction
  properties:
    comment:
      $ref: "#/PageComment"
    session:
      $ref: "#/ChatSession"
    instruction:
      type: string
      description: "Send it as the chat's next message: the comment, with the passage it is about"
PageCommentDeleted:
  type: object
  required:
    - deleted
    - id
  properties:
    deleted:
      type: boolean
    id:
      type: string
PageComments:
  type: object
  required:
    - comments
    - owner
  properties:
    comments:
      type: array
      items:
        $ref: "#/PageComment"
      description: Oldest first
    owner:
      type: boolean
      description: "Whether you own the page: you may delete any comment, resolve any thread, and ask Nexus"
PageCommentsAsked:
  type: object
  description: The reply posted in each thread, the one chat it opened on the page, and the instruction to send there.
  required:
    - comments
    - session
    - instruction
  properties:
    comments:
      type: array
      items:
        $ref: "#/PageComment"
      description: The reply in each thread, in the threads' order
    session:
      $ref: "#/ChatSession"
    instruction:
      type: string
      description: "Send it as the chat's next message: every comment, numbered, with its passage or pin"
PageDeleted:
  type: object
  required:
    - deleted
    - id
    - versions
  properties:
    deleted:
      type: boolean
    id:
      type: string
    versions:
      type: integer
      description: How many versions went with it
PageDetail:
  allOf:
    - $ref: "#/PageSummary"
    - type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: "#/PageVersion"
          description: Newest first
PageDoc:
  type: object
  required:
    - updates
  properties:
    seed:
      type: integer
      description: "The version the draft was started from. Unset: no draft."
    last:
      type: integer
      description: The newest update's id.
    updates:
      type: array
      items:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
      description: The Yjs updates, oldest first, base64url.
  description: "`getPageDoc`: the page's shared draft."
PageDocPosted:
  type: object
  properties:
    id:
      type: integer
      description: The stored update's id; unset for an awareness or presence post.
  description: "`postPageDoc`'s answer."
PageFile:
  type: object
  required:
    - name
    - mediaType
    - bytes
    - version
    - createdAt
  description: One of a page version's data files, a read-only copy of a file attached in the chat that wrote it.
  properties:
    name:
      type: string
    mediaType:
      type: string
      enum:
        - text/csv
        - text/tab-separated-values
        - application/json
        - text/plain
        - text/markdown
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    bytes:
      type: integer
    version:
      type: integer
      description: The page version it belongs to
    createdAt:
      type: string
      format: date-time
    data:
      type: string
      description: Standard base64. Only when one file is read (getPageFile)
PageFiles:
  type: object
  required:
    - files
  properties:
    files:
      type: array
      items:
        $ref: "#/PageFile"
PageFrame:
  type: object
  required:
    - url
    - expiresAt
    - pageId
    - version
    - format
    - title
  properties:
    siteRoutes:
      type: array
      description: The root and signed additional routes of the authorized saved Site version.
      items:
        $ref: "#/SiteFrameRoute"
    url:
      type: string
      format: uri
      description: The signed URL on the sandbox origin; frame it with sandbox="allow-scripts" only
    expiresAt:
      type: string
      format: date-time
      description: When the URL stops opening; mint another to reload
    pageId:
      type: string
    version:
      type: integer
    format:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
    title:
      type: string
  description: A signed frame URL for one version of a page, on the sandbox origin.
PageList:
  type: object
  required:
    - pages
  properties:
    contentMatches:
      type: object
      additionalProperties:
        type: string
      description: Saved Doc excerpts keyed by page ID for matches in this list.
    pages:
      type: array
      items:
        $ref: "#/PageSummary"
    nextCursor:
      type: string
PagePin:
  type: object
  description: >-
    Where a thread on a design is pinned: a point on a board, in its pixels, and the part under it when known. Any other
    field is refused.
  required:
    - board
    - x
    - "y"
  additionalProperties: false
  properties:
    board:
      type: string
      minLength: 1
      maxLength: 200
      description: The board's data-id, else its data-artboard name
    x:
      type: number
      minimum: 0
      maximum: 100000
      description: From the board's left edge, in its pixels
    "y":
      type: number
      minimum: 0
      maximum: 100000
      description: From the board's top edge, in its pixels
    at:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: "The part's data-nx-at: its place in the source of the comment's version"
    tag:
      type: string
      pattern: ^[a-z][a-z0-9:-]{0,40}$
      description: The part's tag, lower case
    layer:
      type: string
      minLength: 1
      maxLength: 200
      description: The part's data-layer name
    path:
      type: string
      pattern: ^\d{1,5}(\.\d{1,5}){0,63}$
      description: "The part's place under the board, as child indices: finds it again in a later version"
    px:
      type: number
      minimum: 0
      maximum: 1
      description: The point inside the part, as a fraction of its width; with py
    py:
      type: number
      minimum: 0
      maximum: 1
      description: The point inside the part, as a fraction of its height; with px
PagePreviewEvent:
  type: object
  required:
    - pageId
    - version
    - contentSha256
  properties:
    pageId:
      type: string
    version:
      type: integer
      description: The version the text is built on.
    contentSha256:
      type: string
      description: SHA-256 of the text, lowercase hex.
  description: >-
    The data of a `preview` event on `streamPageEvents`, and `putPagePreview`'s answer: unsaved text on top of the
    latest version, which readers load in the page's live frame.
PageQuery:
  type: object
  required:
    - name
    - params
    - refreshSeconds
  properties:
    name:
      type: string
    params:
      type: array
      items:
        $ref: "#/PageQueryParam"
    refreshSeconds:
      type: integer
      minimum: 60
      maximum: 86400
      description: How long a result is reused before a run reads it again
    status:
      type: string
      enum:
        - approved
        - pending
      description: "The owner's only. pending: chat proposed it and the owner has not approved it"
    connector:
      type: string
      enum:
        - postgres
        - snowflake
      description: The owner's only
    account:
      type: string
      description: "The owner's only: the connection's account, as GET /v1/connections lists it"
    statement:
      type: string
      description: The owner's only
    statementSha256:
      type: string
      description: The owner's only
    reason:
      type: string
      description: "The owner's only: why it was proposed"
    proposedBy:
      type: string
      description: The owner's only
    approvedBy:
      type: string
      description: The owner's only
    approvedAt:
      type: string
      format: date-time
      description: The owner's only
    createdAt:
      type: string
      format: date-time
      description: The owner's only
    updatedAt:
      type: string
      format: date-time
      description: The owner's only
    lastReadAt:
      type: string
      format: date-time
      description: "When its most recent result was read: every reader sees it"
    lastRowCount:
      type: integer
      description: "The owner's only: that result's rows"
    lastError:
      $ref: "#/PageQueryError"
      description: "The owner's only: why its last refresh failed"
  description: One of a page's queries (Nexus Data). A reader who is not the page's owner gets name, params and refreshSeconds only
PageQueryColumn:
  type: object
  required:
    - name
    - type
  properties:
    name:
      type: string
    type:
      type: string
      description: The database's type name
PageQueryDeleted:
  type: object
  required:
    - name
    - deleted
  properties:
    name:
      type: string
    deleted:
      type: boolean
      const: true
PageQueryError:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
    message:
      type: string
      description: "Fixed per code: never the database's own message"
PageQueryList:
  type: object
  required:
    - queries
    - owner
  properties:
    queries:
      type: array
      items:
        $ref: "#/PageQuery"
    owner:
      type: boolean
      description: Whether the caller owns the page and reads every field
PageQueryParam:
  type: object
  required:
    - name
    - type
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]{0,62}$
    type:
      type: string
      enum:
        - text
        - integer
        - number
        - boolean
        - date
      description: "`date` is `YYYY-MM-DD`"
    default:
      description: What a run that names no value binds, of the parameter's type; with none, a run must name one
  description: One parameter of a page's query, in the order its statement binds them ($1, $2…)
PageQueryResult:
  type: object
  required:
    - name
    - paramsKey
    - columns
    - rows
    - truncated
    - readAt
    - refreshSeconds
  properties:
    name:
      type: string
    paramsKey:
      type: string
      description: "The SHA-256 of the bound values: which parameter set this is"
    columns:
      type: array
      items:
        $ref: "#/PageQueryColumn"
    rows:
      type: array
      items:
        type: array
        items: {}
      description: Each row as an array, in the columns' order. Columns named like secrets come back as "[hidden]"
    truncated:
      type: boolean
    readAt:
      type: string
      format: date-time
    refreshSeconds:
      type: integer
    error:
      $ref: "#/PageQueryError"
      description: "Set when the last refresh failed: these rows are older than the interval"
  description: A page query's shared result
PageQuerySaved:
  type: object
  required:
    - query
    - created
  properties:
    query:
      $ref: "#/PageQuery"
    created:
      type: boolean
PageRemixed:
  type: object
  description: Your copy (version 1) and the new chat that edits it.
  required:
    - page
    - version
    - session
  properties:
    page:
      $ref: "#/PageSummary"
    version:
      $ref: "#/PageVersion"
    session:
      $ref: "#/ChatSession"
PageRemixedFrom:
  type: object
  description: "A remix's source: the share it was read through and the page version it copies."
  required:
    - artifactId
    - pageId
    - version
  properties:
    artifactId:
      type: string
    pageId:
      type: string
    version:
      type: integer
PageStorageDeleted:
  type: object
  required:
    - key
    - scope
    - deleted
  properties:
    key:
      type: string
    scope:
      type: string
      enum:
        - personal
        - shared
    deleted:
      type: boolean
      description: Whether there was a value
PageStorageKeys:
  type: object
  required:
    - scope
    - prefix
    - keys
  properties:
    scope:
      type: string
      enum:
        - personal
        - shared
    prefix:
      type: string
    keys:
      type: array
      items:
        type: string
    nextCursor:
      type: string
      description: Pass as `cursor` for the next keys; absent on the last list
PageStorageValue:
  type: object
  required:
    - key
    - scope
    - value
    - updatedAt
  properties:
    key:
      type: string
    scope:
      type: string
      enum:
        - personal
        - shared
    value:
      type: string
    updatedAt:
      type: string
      format: date-time
PageStorageWritten:
  type: object
  required:
    - key
    - scope
    - bytes
    - updatedAt
  properties:
    key:
      type: string
    scope:
      type: string
      enum:
        - personal
        - shared
    bytes:
      type: integer
      description: The key's and the value's size in UTF-8 bytes, as the page's 20 MiB counts them
    updatedAt:
      type: string
      format: date-time
PageSummary:
  type: object
  required:
    - id
    - title
    - format
    - latestVersion
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      description: "`pag_…`"
    title:
      type: string
      description: The latest version's title
    format:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
    latestVersion:
      type: integer
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
      description: When the latest version was written
PageVersion:
  type: object
  required:
    - pageId
    - version
    - title
    - contentSha256
    - bytes
    - createdVia
    - createdAt
  properties:
    pageId:
      type: string
    version:
      type: integer
    title:
      type: string
    contentSha256:
      type: string
      description: The content's SHA-256, lowercase hex
    bytes:
      type: integer
      description: The content's size in bytes (UTF-8)
    createdVia:
      type: string
      enum:
        - chat_tool
        - api
        - cli
        - restore
        - remix
    restoredFrom:
      type: integer
      description: A restore's source version
    remixedFrom:
      $ref: "#/PageRemixedFrom"
    createdAt:
      type: string
      format: date-time
PageVersionEvent:
  type: object
  required:
    - pageId
    - version
    - title
    - format
  properties:
    pageId:
      type: string
    version:
      type: integer
    title:
      type: string
    format:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
    contentSha256:
      type: string
      description: >-
        SHA-256 of the content, lowercase hex: a shared draft tells its own saves from other writes by it. Gateway sends
        it; a client treats an event without it as a write from elsewhere.
  description: "The data of a `version` event on `streamPageEvents`: the version just written."
PageWritten:
  type: object
  required:
    - page
    - version
  properties:
    page:
      $ref: "#/PageSummary"
    version:
      $ref: "#/PageVersion"
PairCloudServer:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: The server's name for your list. Gateway keeps its first line, cut to 120 characters.
  additionalProperties: false
PaymentConfirmation:
  type: object
  required:
    - status
    - url
  properties:
    status:
      type: string
      enum:
        - redirect
        - succeeded
        - processing
      description: "`redirect`: open `url`. `succeeded`: Stripe took the payment. `processing`: a bank debit is on its way."
    url:
      type:
        - string
        - "null"
      format: uri
      description: The bank's page while it waits for the cardholder; null otherwise
PaymentMethodSetup:
  type: object
  required:
    - url
    - expiresAt
  properties:
    url:
      type: string
      description: Stripe Checkout's page, where the person enters the card.
    expiresAt:
      type: string
      format: date-time
      description: When Stripe stops accepting `url`.
    checkoutSessionId:
      type: string
      description: Exact Checkout session to confirm; returned by current Gateways.
PaymentMethodSetupRequest:
  type: object
  properties:
    embedded:
      type: boolean
      description: >-
        Ask for the card form inside Nexus UI's billing page instead of Stripe's own page. Gateway answers the hosted
        link when it has no publishable key.
PaymentMethodSummary:
  type: object
  required:
    - type
  description: >-
    A payment method of any type as Stripe describes it: its type and what that type shows. Never a full card or account
    number. A field the type does not have is left out.
  properties:
    type:
      type: string
      description: Stripe's payment method type, such as `card`, `us_bank_account` or `link`. Other types can appear.
      examples:
        - us_bank_account
    brand:
      type: string
      description: A card's brand, such as `visa` or `mastercard`.
      examples:
        - visa
    bankName:
      type: string
      description: The bank of a bank account.
      examples:
        - STRIPE TEST BANK
    last4:
      type: string
      description: The last 4 characters of a card's or a bank account's number.
      examples:
        - "6789"
    expMonth:
      type: integer
      description: A card's expiry month.
      examples:
        - 12
    expYear:
      type: integer
      description: A card's expiry year.
      examples:
        - 2030
PendingMember:
  type: object
  description: Someone added to a team by an email not in the organization yet; they join the team when they join the organization.
  properties:
    id:
      type: string
    teamId:
      type: string
    team:
      type: string
      description: The team's slug.
    email:
      type: string
    role:
      $ref: "#/TeamRole"
    home:
      type: boolean
      description: Becomes their default team when they join.
    addedBy:
      type: string
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - teamId
    - team
    - email
    - role
    - home
    - createdAt
PendingPerson:
  type: object
  description: Someone in teams by email who has not joined the organization yet.
  properties:
    email:
      type: string
    teams:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          slug:
            type: string
          name:
            type: string
          level:
            type: string
          role:
            $ref: "#/TeamRole"
          home:
            type: boolean
        required:
          - id
          - slug
          - name
          - role
          - home
    home:
      type: string
      description: The slug of the team that becomes their default when they join.
    since:
      type: string
      format: date-time
  required:
    - email
    - teams
    - since
PersonBudget:
  type: object
  description: One person's spend limit for the calendar month (UTC).
  properties:
    userId:
      type: string
    email:
      type: string
    name:
      type: string
    role:
      $ref: "#/Role"
    limitManager:
      type: boolean
      description: An admin an owner allowed to set person spend limits
    limitUsd:
      type:
        - number
        - "null"
      description: >-
        Their limit this month; null: no limit of their own. Deprecated: read `limitUsdDecimal`, the exact decimal
        string (root rule 9).
      deprecated: true
    limitUsdDecimal:
      type:
        - string
        - "null"
      description: >-
        `limitUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
        Prefer it to `limitUsd`.
    source:
      type: string
      enum:
        - override
        - default
        - none
      description: "override: set for them; default: the organization's default per person; none: no limit"
    overrideUsd:
      type:
        - number
        - "null"
      description: >-
        Their override, when they have one. Deprecated: read `overrideUsdDecimal`, the exact decimal string (root rule
        9).
      deprecated: true
    overrideUsdDecimal:
      type:
        - string
        - "null"
      description: >-
        `overrideUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `overrideUsd`.
    spentUsd:
      type: number
      description: >-
        Settled since the 1st, 00:00 UTC, across every team they spend through. Deprecated: read `spentUsdDecimal`, the
        exact decimal string (root rule 9).
      deprecated: true
    spentUsdDecimal:
      type: string
      description: >-
        `spentUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
        Prefer it to `spentUsd`.
    reservedUsd:
      type: number
      description: "Held by their calls in flight. Deprecated: read `reservedUsdDecimal`, the exact decimal string (root rule 9)."
      deprecated: true
    reservedUsdDecimal:
      type: string
      description: >-
        `reservedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `reservedUsd`.
    remainingUsd:
      type:
        - number
        - "null"
      deprecated: true
      description: "Deprecated: read `remainingUsdDecimal`, the exact decimal string (root rule 9)."
    remainingUsdDecimal:
      type:
        - string
        - "null"
      description: >-
        `remainingUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `remainingUsd`.
    atLimit:
      type: boolean
      description: "Spent and reserved reach the limit: their next call is refused"
    overspendsPrevented:
      type: integer
      description: Calls a spend limit refused this month
  required:
    - userId
    - role
    - limitUsd
    - source
    - overrideUsd
    - spentUsd
    - reservedUsd
    - remainingUsd
    - atLimit
    - overspendsPrevented
PhonePairingDecision:
  description: >-
    Desktop-signed outcome for an invitation. Approval binds the winning request and sender. Cancellation applies to the
    entire invitation. The relay receipt can be retried for five minutes after expiry.
  oneOf:
    - type: object
      properties:
        state:
          type: string
          enum:
            - approved
        scope:
          $ref: "#/ComputerScope"
        computerId:
          type: string
          format: uuid
        inviteId:
          type: string
          format: uuid
        inviterDeviceId:
          type: string
        expiresAt:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        senderDeviceId:
          type: string
        signature:
          type: string
          description: Unpadded base64url Ed25519 signature over the nexus-phone-pairing-decision-v1 frame.
      required:
        - state
        - scope
        - computerId
        - inviteId
        - inviterDeviceId
        - expiresAt
        - requestId
        - senderDeviceId
        - signature
      additionalProperties: false
    - type: object
      properties:
        state:
          type: string
          enum:
            - cancelled
        scope:
          $ref: "#/ComputerScope"
        computerId:
          type: string
          format: uuid
        inviteId:
          type: string
          format: uuid
        inviterDeviceId:
          type: string
        expiresAt:
          type: integer
          format: int64
        signature:
          type: string
          description: Unpadded base64url Ed25519 signature over the nexus-phone-pairing-decision-v1 frame.
      required:
        - state
        - scope
        - computerId
        - inviteId
        - inviterDeviceId
        - expiresAt
        - signature
      additionalProperties: false
PhonePairingEnvelope:
  type: object
  properties:
    version:
      type: integer
      enum:
        - 1
    scope:
      $ref: "#/ComputerScope"
    id:
      type: string
      format: uuid
    inviteId:
      type: string
      format: uuid
    inviterDeviceId:
      type: string
    senderDeviceId:
      type: string
    expiresAt:
      type: integer
      format: int64
    lockedKey:
      type: string
    sealed:
      type: string
      description: 29 to 8221 decoded encrypted bytes. Raw invitation secret occurs only inside this ciphertext.
    signature:
      type: string
  required:
    - version
    - scope
    - id
    - inviteId
    - inviterDeviceId
    - senderDeviceId
    - expiresAt
    - lockedKey
    - sealed
    - signature
  additionalProperties: false
PhonePairingFinished:
  type: object
  properties:
    finished:
      type: boolean
  required:
    - finished
  additionalProperties: false
PhonePairingRequest:
  type: object
  properties:
    envelope:
      $ref: "#/PhonePairingEnvelope"
    state:
      type: string
      enum:
        - pending
        - finished
    decision:
      $ref: "#/PhonePairingDecision"
  required:
    - envelope
    - state
  additionalProperties: false
PhonePairingRequests:
  type: object
  properties:
    requests:
      type: array
      maxItems: 20
      items:
        $ref: "#/PhonePairingRequest"
  required:
    - requests
  additionalProperties: false
PlanCatalogue:
  type: object
  description: The plans an organization of this kind can take.
  required:
    - audience
    - plans
    - current
  properties:
    audience:
      type: string
      enum:
        - personal
        - company
    plans:
      type: array
      items:
        $ref: "#/CataloguePlan"
    current:
      oneOf:
        - type: object
          required:
            - plan
            - interval
            - seats
          properties:
            plan:
              type: string
            interval:
              type: string
              enum:
                - month
                - year
            seats:
              type: integer
        - type: "null"
      description: The plan the organization's subscription holds; null on the Free plan.
PlanChange:
  type: object
  required:
    - when
    - at
    - amountDueUsd
    - dryRun
    - plan
  description: What a plan change does.
  properties:
    when:
      type: string
      enum:
        - now
        - period_end
    at:
      type: string
      description: When it applies (ISO 8601).
    amountDueUsd:
      type:
        - string
        - "null"
      description: >-
        What is invoiced now, a decimal string: a dry run's preview, or 0 for a change at the period's end; null after a
        change applied now (Stripe invoiced it).
    dryRun:
      type: boolean
    plan:
      oneOf:
        - $ref: "#/BillingPlan"
        - type: "null"
      description: The plan after the change, or as it is for a dry run.
PlanChangeRequest:
  type: object
  required:
    - plan
    - interval
  properties:
    plan:
      type: string
    interval:
      type: string
      enum:
        - month
        - year
    seats:
      type: integer
      description: "For a per-seat plan: from its minimum to 1000 (its minimum when absent)."
    dryRun:
      type: boolean
      description: Answer what the change would charge and when, and change nothing.
PlanChoice:
  type: object
  properties:
    plan:
      type: string
      description: A plan in a server setting, such as plus, pro, teams_plus or teams_pro
    interval:
      type: string
      enum:
        - month
        - year
    seats:
      type: integer
      minimum: 1
      maximum: 1000
      description: Per-seat plans only (Teams Plus, Teams Pro); the plan's minimum when absent
  required:
    - plan
    - interval
PolicyRuleRef:
  type: object
  properties:
    level:
      type: string
      enum:
        - deployment
        - organization
        - team
        - agent
        - key
        - catalog
        - none
    subject:
      type: string
    list:
      type: string
      enum:
        - allow
        - deny
        - defaults
        - maxPrice
        - denyCountries
        - providers
    pattern:
      type: string
PostPageDocRequest:
  type: object
  properties:
    seed:
      type: integer
      minimum: 1
      description: "The version the draft was started from: required with `update`."
    update:
      type: string
      pattern: ^[A-Za-z0-9_-]+$
      description: A Yjs update, or with `snapshot` the whole draft (`Y.encodeStateAsUpdate`), base64url.
    snapshot:
      type: boolean
      description: "`update` is a snapshot that replaces the updates up to `upTo`."
    upTo:
      type: integer
      minimum: 1
      description: "A snapshot's last update: the `last` of the read it applied. Unset: the snapshot replaces nothing."
    awareness:
      type: string
      pattern: ^[A-Za-z0-9_-]+$
      description: "An awareness update (y-protocols), base64url: relayed, never stored."
    presence:
      type: object
      additionalProperties: true
      description: >-
        A reader's presence, a JSON object of at most 4 KiB, relayed as posted: Nexus UI sends `client`, `at` (its
        pointer, or null) and `leave`. Never stored.
  description: >-
    `postPageDoc`: `update` and `seed` (with `snapshot` and `upTo` for a snapshot), or `awareness` alone, or `presence`
    alone.
PresenceActivity:
  description: >-
    What an online member is doing, as you may see it. `chatting`: in a chat, never which one. `page`: on a Nexus Page;
    `pageId` and `title` are set only when you may open it, and null otherwise. `agents`: `count` of their own running
    agent sessions, which Gateway reads, not the client. `idle`: nothing to say.
  type: object
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - chatting
        - page
        - agents
        - idle
    pageId:
      type:
        - string
        - "null"
      description: With `page`.
    title:
      type:
        - string
        - "null"
      description: With `page`.
    count:
      type: integer
      minimum: 1
      description: With `agents`.
PresenceHeartbeat:
  type: object
  properties:
    activity:
      $ref: "#/ReportedActivity"
PresenceList:
  type: object
  required:
    - members
    - onlineWindowSeconds
    - showOnline
  properties:
    members:
      type: array
      items:
        $ref: "#/PresenceMember"
    onlineWindowSeconds:
      type: integer
      description: How long after a heartbeat a member still counts as online.
    showOnline:
      type: boolean
      description: Your own setting.
PresenceMember:
  type: object
  required:
    - userId
    - name
    - email
    - role
    - online
    - lastSeenAt
    - activity
  properties:
    userId:
      type: string
    name:
      type:
        - string
        - "null"
    email:
      type:
        - string
        - "null"
    role:
      $ref: "#/Role"
    online:
      type: boolean
      description: Seen within the online window. You are always online to yourself.
    lastSeenAt:
      type:
        - string
        - "null"
      format: date-time
      description: The last heartbeat, only while it is within the online window.
    activity:
      description: What they are doing, while online; null otherwise.
      oneOf:
        - $ref: "#/PresenceActivity"
        - type: "null"
PresenceSettings:
  type: object
  required:
    - showOnline
  additionalProperties: false
  properties:
    showOnline:
      type: boolean
      description: Whether others see when you are online. On by default.
ProductBudget:
  type: object
  description: >-
    A module capability's budget, per UTC day, ISO week or month, and its period so far (`GET
    /v1/budgets/products/{product}/{capability}`). Amounts are decimal strings.
  properties:
    product:
      type: string
    capability:
      type: string
    cap:
      type:
        - object
        - "null"
      properties:
        limitUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{6}$
          description: The budget's amount for its period.
        every:
          type: string
          enum:
            - day
            - week
            - month
          description: "The budget's period, in UTC: a day, an ISO week from Monday, or a calendar month."
        monthlyUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{6}$
          description: The budget's amount whatever its period; read `limitUsd` and `every` instead.
        period:
          type: string
          description: "The period: `YYYY-MM-DD` for a day, `YYYY-Www` for a week, `YYYY-MM` for a month."
        spentUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{6}$
        feesUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{6}$
          description: The product's own fees this month (`POST /v1/budgets/usage`), part of `spentUsd`.
        reservedUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{6}$
        remainingUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{6}$
        resetsAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - limitUsd
        - every
        - monthlyUsd
        - period
        - spentUsd
        - feesUsd
        - reservedUsd
        - remainingUsd
        - resetsAt
        - updatedAt
    canManage:
      type: boolean
  required:
    - product
    - capability
    - cap
    - canManage
ProductBudgetChange:
  type: object
  description: >-
    A module capability's budget before and after a `PUT /v1/budgets/products/{product}/{capability}`; `limitUsd` null
    is no budget.
  properties:
    product:
      type: string
    capability:
      type: string
    before:
      type: object
      properties:
        limitUsd:
          type:
            - string
            - "null"
          pattern: ^[0-9]+\.[0-9]{6}$
        every:
          type:
            - string
            - "null"
          enum:
            - day
            - week
            - month
            - null
        monthlyUsd:
          type:
            - string
            - "null"
          pattern: ^[0-9]+\.[0-9]{6}$
      required:
        - limitUsd
        - every
        - monthlyUsd
    after:
      type: object
      properties:
        limitUsd:
          type:
            - string
            - "null"
          pattern: ^[0-9]+\.[0-9]{6}$
        every:
          type:
            - string
            - "null"
          enum:
            - day
            - week
            - month
            - null
        monthlyUsd:
          type:
            - string
            - "null"
          pattern: ^[0-9]+\.[0-9]{6}$
      required:
        - limitUsd
        - every
        - monthlyUsd
  required:
    - product
    - capability
    - before
    - after
ProductBudgetSetting:
  type: object
  description: >-
    A module capability's budget: `limitUsd` (a decimal string in US dollars, at most 6 decimals, at most 1000000) with
    `every`, or `monthlyUsd` alone for a monthly budget. `null` removes it.
  properties:
    limitUsd:
      type:
        - string
        - "null"
      pattern: ^[0-9]+(\.[0-9]{1,6})?$
    every:
      type: string
      enum:
        - day
        - week
        - month
      description: Required with `limitUsd`.
    monthlyUsd:
      type:
        - string
        - "null"
      pattern: ^[0-9]+(\.[0-9]{1,6})?$
      description: A monthly budget. Not with `limitUsd`.
Provider:
  type: object
  required:
    - id
    - name
    - country
    - byok
    - status
    - models
    - rates
    - apiHost
    - serving
  description: >-
    A provider the Gateway calls, from its catalog entry. A model's maker is not its provider: `baseten` hosts models
    other makers made.
  properties:
    id:
      type: string
      description: Its id in stored keys, spend records and the policy's `providers` lists (`anthropic`).
    name:
      type: string
      description: Its name in messages (`Anthropic`).
    country:
      type: string
      description: The ISO 3166-1 alpha-2 code of the country it is headquartered in.
    byok:
      type: boolean
      description: Whether an organization may bring its own key for it (`addProviderKey`).
    status:
      type: string
      enum:
        - active
        - inactive
      description: Whether the Gateway calls it. A model on an inactive provider is neither listed nor callable.
    models:
      type: integer
      minimum: 0
      description: How many listed models it hosts.
    rates:
      $ref: "#/ProviderRates"
    apiHost:
      type: string
      description: The host of the provider's public API (`api.anthropic.com`).
    serving:
      type: string
      enum:
        - model_api
        - decisions
      description: >-
        What the Gateway calls the provider for. `model_api`: its models, on chat completions and the pass-through APIs.
        `decisions`: typed decisions only (`POST /v1/decisions`).
    key:
      type: string
      enum:
        - none
        - valid
        - rejected
      description: >-
        With a key, on a BYOK provider only: the organization's own key. `none`: none stored, or disabled. `rejected`:
        the provider refused it. `valid`: a call uses it.
    enabled:
      type: boolean
      description: "With a key: whether the organization's provider policy (`ModelRule.providers`) lets calls use it."
ProviderError:
  description: >-
    An agent gateway error, in the provider's shape: Anthropic's on /v1/anthropic/, OpenAI's on /v1/openai/. An error
    the provider answers passes through as the provider wrote it.
  oneOf:
    - $ref: "#/AnthropicError"
    - $ref: "#/OpenAiError"
ProviderKey:
  type: object
  properties:
    provider:
      type: string
    scope:
      type: string
      enum:
        - team
        - user
      description: "Who holds the key: a team or a person. Absent for the organization's own."
    scopeId:
      type: string
      description: The team's or the person's id.
    last4:
      type: string
    createdAt:
      type: string
      format: date-time
    state:
      type: string
      enum:
        - valid
        - rejected
        - unreachable
        - disabled
        - removed
      description: >-
        What the provider answered when the key was checked on add: a model listing, which costs nothing. Absent for a
        key stored before the check. An add the provider rejects answers 400 `provider_key_rejected` and stores nothing.
        `disabled` and `removed` are an admin's: no call opens such a key. The list marks a disabled key `unused` and
        leaves a removed one out. `rejected` on a stored key: its provider refused it on a call with HTTP 401;
        `enableProviderKey` checks it again, and a replacement clears it.
    checkedAt:
      type: string
      format: date-time
    lastUsedOn:
      type: string
      format: date
      description: The UTC day a call last used the key.
    versions:
      type: array
      description: Each key stored for the provider, oldest first, at most 50; only on `getProviderKey`.
      items:
        $ref: "#/ProviderKeyVersion"
ProviderKeyChange:
  type: object
  required:
    - dryRun
    - changed
    - providerKey
  properties:
    dryRun:
      type: boolean
    changed:
      type: boolean
      description: False when the key was already in the state asked for, so nothing was written.
    providerKey:
      $ref: "#/ProviderKey"
      description: The key after the change, or as it would be after a dry run.
ProviderKeyVersion:
  type: object
  required:
    - version
    - last4
    - addedAt
  properties:
    version:
      type: integer
      description: 1 for the first key stored for the provider, then one more for each replacement.
    last4:
      type: string
    addedAt:
      type: string
      format: date-time
    addedBy:
      type: string
      description: The user who added it; absent for Core's own work and for a key stored before Nexus recorded who added keys.
ProviderRates:
  type: object
  required:
    - cacheReadShare
    - cacheWrite
    - webSearchUsd
  description: >-
    What a model on the provider costs beyond its input and output prices, where the model states no price of its own.
    `listModels` gives each model's own prices.
  properties:
    cacheReadShare:
      type:
        - number
        - "null"
      description: >-
        A cache read's price, as a share of the model's input price (`0.1` is 10%). `null`: each model has its own
        cache-read price.
    cacheWrite:
      description: >-
        How a cache write is priced. `multipliers`: a multiple of the model's input price, by how long the cache entry
        lives. `model_rate`: the model's own cache-write price, or its input price when it has none.
      oneOf:
        - type: object
          required:
            - rule
            - fiveMinutes
            - oneHour
          properties:
            rule:
              const: multipliers
            fiveMinutes:
              type: number
              description: The multiple for an entry that lives 5 minutes.
            oneHour:
              type: number
              description: The multiple for an entry that lives 1 hour.
        - type: object
          required:
            - rule
          properties:
            rule:
              const: model_rate
    webSearchUsd:
      type:
        - string
        - "null"
      description: >-
        One hosted web search, in US dollars, as a decimal string (`"0.010000"`). `null`: the Gateway runs no hosted web
        search on this provider.
PutOrgThreadKeyRequest:
  type: object
  additionalProperties: false
  required:
    - keyVersion
    - orgKeyId
    - lockedKey
    - senderDeviceId
    - signature
  properties:
    keyVersion:
      type: integer
      minimum: 1
      description: A version your devices hold a copy of.
    orgKeyId:
      type: string
      description: The organization's current recovery key (`GET /v1/orgs/recovery-key`), whose fingerprint you confirmed.
    lockedKey:
      type: string
      minLength: 1
      maxLength: 512
      pattern: ^[A-Za-z0-9_-]+$
      description: "The content key, HPKE-sealed to the organization key's `encryptionKey`: base64url without padding."
    senderDeviceId:
      type: string
      description: Your trusted device that signs the copy.
    signature:
      type: string
      description: >-
        Ed25519 over `nexus-org-thread-key:v1:{threadId}:{keyVersion}:{orgKeyId}:{lockedKey}`: 64 bytes in base64url
        without padding.
  description: One copy of a thread's content key, locked for the organization's current recovery key.
PutPagePreviewRequest:
  type: object
  required:
    - baseVersion
    - content
  properties:
    baseVersion:
      type: integer
      minimum: 1
      description: "The version the text is built on: the page's latest."
    content:
      type: string
      description: The draft's whole text, at most 16 MiB, checked as a version's content.
  description: "`putPagePreview`'s body."
PutTeamKeyCopiesRequest:
  type: object
  additionalProperties: false
  required:
    - senderDeviceId
    - copies
  properties:
    senderDeviceId:
      type: string
      description: Your trusted device. It holds a copy of every epoch it hands over.
    copies:
      type: array
      minItems: 1
      maxItems: 500
      items:
        $ref: "#/TeamKeyCopyRequest"
  description: Copies of team-key epochs for members' trusted holders.
PutTeamThreadKeyRequest:
  type: object
  additionalProperties: false
  required:
    - keyVersion
    - teamKeyId
    - lockedKey
    - senderDeviceId
    - signature
  properties:
    keyVersion:
      type: integer
      minimum: 1
      description: A version your devices hold a copy of.
    teamKeyId:
      type: string
      description: The team key's current epoch (`GET /v1/orgs/team-key`).
    lockedKey:
      type: string
      minLength: 1
      maxLength: 512
      pattern: ^[A-Za-z0-9_-]+$
      description: "The content key, HPKE-sealed to the epoch's encryptionKey: base64url without padding."
    senderDeviceId:
      type: string
      description: Your trusted device that signs the copy.
    signature:
      type: string
      description: >-
        Ed25519 over `nexus-team-thread-key:v1:{threadId}:{keyVersion}:{teamKeyId}:{lockedKey}`: 64 bytes in base64url
        without padding.
  description: One copy of a thread's content key, locked to the team key's current epoch.
PutThreadKeysRequest:
  type: object
  required:
    - keyVersion
    - senderDeviceId
    - keys
  additionalProperties: false
  properties:
    keyVersion:
      type: integer
      minimum: 1
      description: >-
        A version one of your devices still holds, or one more than the latest to rotate the content key: 1 for a new
        thread.
    senderDeviceId:
      type: string
      description: Your trusted device that signs every copy.
    keys:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/ThreadDeviceKey"
  description: "`putThreadKeys`'s body."
Receipt:
  type: object
  required:
    - id
    - at
    - kind
    - description
    - amountUsd
    - status
    - url
    - receipt
  properties:
    id:
      type: string
      description: The payment (`pi_…`), or `month:<YYYY-MM>` for an invoiced month.
    at:
      type: string
      format: date-time
    kind:
      type: string
      enum:
        - credits
        - auto_topup
        - usage
        - invoice
    description:
      type: string
      description: What it paid for, such as `Credits` or `Usage, threshold charge`.
    amountUsd:
      type: string
    status:
      type: string
      enum:
        - paid
        - open
        - failed
        - void
    url:
      type:
        - string
        - "null"
      description: Stripe's page of an invoiced month; null for a payment.
    receipt:
      type: boolean
      description: "Stripe has a receipt page for it: `GET /v1/billing/receipts/{id}` answers its link."
ReceiptLink:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      description: Stripe's receipt page of the payment.
ReceiptList:
  type: object
  required:
    - receipts
  properties:
    receipts:
      type: array
      items:
        $ref: "#/Receipt"
RecordSkillLoadsRequest:
  type: object
  required:
    - surface
    - sessionId
    - skills
  properties:
    surface:
      type: string
      enum:
        - nexus_claude
        - nexus_codex
      description: "The launcher: web chat's loads are written by Gateway itself"
    sessionId:
      type: string
      minLength: 1
      maxLength: 128
      description: The agent session the launcher opened
    skills:
      type: array
      minItems: 1
      maxItems: 900
      description: >-
        The skills delivered, each once: your own and the library skills you may load. A larger delivery goes in several
        calls, each all or none
      items:
        type: object
        required:
          - skillId
          - version
        properties:
          skillId:
            type: string
            description: "`skl_…`"
          version:
            type: integer
            minimum: 1
RecoverDeviceRequest:
  type: object
  required:
    - name
    - encryptionKey
    - signingKey
    - holderId
    - challenge
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      description: 1 to 64 characters, none a control character.
    encryptionKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: "The new device's X25519 public key: 32 bytes, base64url without padding."
    signingKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: "The new device's Ed25519 public key: 32 bytes, base64url without padding."
    holderId:
      type: string
      description: The recovery key (`dev_…`, a `passkey` or `recovery_code`) whose sealed challenge this device opened.
    challenge:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: "The challenge sealed to `holderId`, opened: 32 bytes, base64url without padding."
  description: "`recoverDevice`'s body: the new device's keys, and the proof of one of your recovery keys."
RecoveryChallenge:
  type: object
  required:
    - challenges
    - expiresAt
  properties:
    challenges:
      type: array
      items:
        type: object
        required:
          - holderId
          - kind
          - sealed
        properties:
          holderId:
            type: string
          kind:
            type: string
            enum:
              - passkey
              - recovery_code
          sealed:
            type: string
            description: >-
              The challenge, HPKE-sealed to the recovery key (DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, AES-256-GCM, base
              mode) with `info` the length-prefixed `nexus-recover-challenge-v1`, your `users.id` and `holderId`:
              base64url without padding.
    expiresAt:
      type: string
      format: date-time
      description: Five minutes after it was issued.
  description: >-
    One challenge per trusted recovery key, each sealed to it. Single use: newer challenges replace them, and a wrong
    proof closes them.
ReferralList:
  type: object
  required:
    - code
    - referred
    - enabled
  properties:
    code:
      type: string
      description: >-
        Your referral code: ten random characters of lowercase base 32, made on the first read. A code made earlier from
        your name gets one on its next read, and the old code still works.
    referred:
      type: array
      items:
        $ref: "#/ReferredPerson"
    nextCursor:
      type: string
      description: The next page's cursor, while more people follow.
    invitesLeft:
      type: integer
      minimum: 0
      description: >-
        While sign-up is invite-only: how many more people your code admits, as an operator approved. Only the people
        who joined through your code after the approval use one. Absent while sign-up is open, and for a staff member's
        code with no approval, which admits anyone.
    invitesAllowed:
      type: integer
      minimum: 0
      description: >-
        While sign-up is invite-only: how many people an operator approved your code to admit in all, used or not. `0`:
        not approved. With `invitesLeft` `0` and this above `0`, you used every invitation. Absent while sign-up is
        open, for a staff member's code with no approval, and on older Gateways.
    enabled:
      type: boolean
      description: False while the personal referral program is stopped. Existing referrals remain readable.
    rewardProgress:
      $ref: "#/ReferralRewardProgress"
    rewardsGranted:
      type: integer
      minimum: 0
      description: >-
        How many referral rewards your personal organization got in all, across all pages, including credit already
        spent or expired, limit or not. Absent on older Gateways.
    rewardUsdDecimal:
      type: string
      description: >-
        What one rewarded referral gives your personal organization, in US dollars with six decimals (`"1.000000"`).
        `"0.000000"` while no reward is set. Absent on older Gateways.
    rewardsActive:
      type: boolean
      description: >-
        Whether your referrals earn rewards now: the program is on, a reward and a program cap are set, the cap has room
        for one more reward, and you are below your lifetime limit (`rewardProgress`) or are staff, who have none.
        False: no referral of yours earns credit now. Absent on older Gateways, which a client reads as false.
ReferralRewardProgress:
  type: object
  description: >-
    Lifetime referral rewards for the person's personal organization, across all pages, including credit already spent
    or expired, against its limit. Absent for a staff member, whose account has no limit, and on older Gateways.
  required:
    - granted
    - limit
  properties:
    granted:
      type: integer
      minimum: 0
      description: How many referral rewards this account has received.
    limit:
      type: integer
      minimum: 1
      description: The maximum number of rewarded referrals per account, currently 10.
ReferredPerson:
  type: object
  required:
    - joinedAt
    - email
  properties:
    joinedAt:
      type: string
      format: date-time
      description: When their sign-up was recorded.
    email:
      type:
        - string
        - "null"
      description: >-
        Their email with all but its first character before the `@` hidden (`a***@example.com`). `null` when they erased
        their account (`erased`), or when their sign-in carried no email Nexus could keep.
    erased:
      type: boolean
      description: >-
        Whether the person erased their account. A person with no email who is not erased is still live: a reward needs
        their email. Absent on older Gateways, which a client reads from a `null` email.
    rewarded:
      type:
        - boolean
        - "null"
      description: Whether this referral earned the caller a reward. Absent or null when unavailable. No payment date is disclosed.
    reward:
      type: string
      enum:
        - pending
        - rewarded
        - not_rewarded
      description: >-
        This referral's reward. `pending`: none yet, and one may come; a payment is never disclosed while a reward can
        still come. `rewarded`: your personal organization got it. `not_rewarded`: final, it never will (its reward was
        voided, you reached the lifetime limit, or you have no personal organization). Absent on older Gateways.
RegisterDeveloperClient:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    allowedScopes:
      type: array
      items:
        type: string
      description: "Each one of `grantableScopes`. Omitted: all of them."
RegisterDeviceRequest:
  type: object
  required:
    - name
    - encryptionKey
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      description: 1 to 64 characters, none a control character.
    kind:
      type: string
      enum:
        - device
        - passkey
        - recovery_code
      description: >-
        `device`, or one of your recovery keys: a `passkey` (WebAuthn PRF) or a printable `recovery_code`. A recovery
        key has an X25519 key and no Ed25519 key: it receives locked copies and never signs.
      default: device
    encryptionKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: "The holder's X25519 public key: 32 bytes, base64url without padding. Copies for it are locked to it."
    signingKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: >-
        The device's Ed25519 public key: 32 bytes, base64url without padding. It signs approvals and revocations.
        Required for a device; absent for a recovery key.
  description: "`registerDevice`'s body."
RegisterNotificationDevice:
  type: object
  required:
    - platform
    - token
  additionalProperties: false
  properties:
    platform:
      type: string
      enum:
        - web
        - desktop
        - ios
        - android
    token:
      type: string
      minLength: 1
      maxLength: 4096
      description: >-
        The push service's token: for `web`, the browser's push subscription JSON (`endpoint` on a known push service,
        `keys.p256dh`, `keys.auth`), checked at registration; an APNs or FCM token otherwise. Sealed, never answered
        back.
RemovedMember:
  type: object
  required:
    - userId
    - role
    - removedAt
    - recoverableUntil
    - recoverable
  properties:
    userId:
      type: string
    email:
      type: string
    name:
      type: string
    role:
      type: string
      enum:
        - owner
        - admin
        - member
    removedAt:
      type: string
      format: date-time
    removedBy:
      type: string
      description: The user id who removed them; absent when the sign-in provider did.
    recoverableUntil:
      type: string
      format: date-time
    recoverable:
      type: boolean
RemovedMemberList:
  type: object
  required:
    - members
  properties:
    members:
      type: array
      items:
        $ref: "#/RemovedMember"
RenewSessionRunner:
  type: object
  required:
    - fencingToken
  properties:
    fencingToken:
      type: integer
      format: int64
      minimum: 1
      description: The token the runner got when it took the session.
ReportedActivity:
  description: >-
    What Nexus UI reports with a heartbeat. Coarse on purpose: no chat title, no path, no repository. Gateway keeps a
    page's id only when you may open the page and reads its title itself. `agents` is taken as `idle`: Gateway counts
    running agents from agent sessions.
  type: object
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - chatting
        - page
        - agents
        - idle
    pageId:
      type: string
      description: Required with `page`.
ReportedAnswer:
  type: object
  required:
    - reason
    - text
  additionalProperties: false
  description: A model's answer that a person reported (App Review 1.2), and why. Slack shows the text as plain text
  properties:
    reason:
      type: string
      enum:
        - offensive
        - wrong
        - other
      description: "Why: `offensive` (offensive, abusive or harmful), `wrong` (wrong or misleading) or `other`"
    text:
      type: string
      minLength: 1
      maxLength: 12000
      description: The answer's text as the app showed it, not only white space. The app cuts a longer answer to 12000 characters
    model:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 200
      description: "The model that wrote it, when the app knows it: one line, no control character"
Repositories:
  type: object
  properties:
    installations:
      type: array
      items:
        type: object
    repositories:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          fullName:
            type: string
          url:
            type: string
          defaultBranch:
            type: string
          private:
            type: boolean
          linkedAt:
            type: string
          lastWikiRun:
            type: object
RequestSkillPromotion:
  type: object
  required:
    - scope
  properties:
    scope:
      type: string
      enum:
        - org
        - team
      description: The organization's library, or a team's (and the teams under it)
    team:
      type: string
      description: The target team, a slug or an id. With `scope` `team` only; you must be in it
    note:
      type: string
      maxLength: 500
      description: Why, for the approvers
  additionalProperties: false
ResolvePageCommentRequest:
  type: object
  required:
    - resolved
  properties:
    resolved:
      type: boolean
RestorePageRequest:
  type: object
  required:
    - version
  properties:
    version:
      type: integer
      minimum: 1
      description: The version to restore
    baseVersion:
      type: integer
      minimum: 1
      description: As for writePageVersion
ReviewEventSetting:
  type: object
  required:
    - level
    - default
  properties:
    level:
      type: string
      enum:
        - comment
        - request_changes
        - full
      description: >-
        `comment`: COMMENT only. `request_changes`: COMMENT and REQUEST_CHANGES. `full`: COMMENT, REQUEST_CHANGES and
        APPROVE.
    default:
      type: boolean
      description: "The organization never chose: full"
    changedBy:
      type: string
    changedAt:
      type: string
      format: date-time
RevokeDeveloperClient:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
      description: "Omitted: `revoked by owner`."
RevokeDeviceRequest:
  type: object
  required:
    - revokerDeviceId
    - signature
  additionalProperties: false
  properties:
    revokerDeviceId:
      type: string
      description: "Your trusted device that signs: the revoked device itself, or another."
    signature:
      type: string
      pattern: ^[A-Za-z0-9_-]{86}$
      description: "Ed25519 over `nexus-device-revoke:v1:{deviceId}`: 64 bytes, base64url without padding."
  description: "`revokeDevice`'s body."
Role:
  type: string
  enum:
    - owner
    - admin
    - member
Routine:
  type: object
  required:
    - id
    - title
    - ownerId
    - executor
    - trigger
    - action
    - proactivity
    - caps
    - reportTo
    - state
    - delivery
    - createdVia
    - version
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      description: "`rtn_` and 32 hex characters"
    title:
      type: string
    ownerId:
      type: string
      description: The person it runs as.
    teamId:
      type: string
      description: The team its model calls go to; absent when its owner is in none.
    executor:
      type: string
      enum:
        - gateway
      description: "`gateway`: each slot is a Runtime job. Desktop routines come with W4 step 2."
    trigger:
      $ref: "#/RoutineTrigger"
    action:
      $ref: "#/RoutineAction"
    proactivity:
      $ref: "#/RoutineProactivity"
    caps:
      $ref: "#/RoutineCaps"
    reportTo:
      type: string
      enum:
        - slack
    state:
      type: string
      enum:
        - active
        - paused
    pausedReason:
      type: string
      enum:
        - owner
        - admin
    scheduleId:
      type: string
      description: Its Runtime schedule (`sch_…`).
    nextRunAt:
      type: string
      format: date-time
      description: Its schedule's next slot; absent while paused.
    lastRunAt:
      type: string
      format: date-time
      description: Its schedule's last slot.
    delivery:
      $ref: "#/RoutineDelivery"
    createdVia:
      type: string
      enum:
        - api
        - cli
        - ui
        - slack
        - desktop
        - agent
    version:
      type: integer
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
RoutineAction:
  type: object
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - brief
        - notify
      description: >-
        `brief`: what changed in your open pull requests, your assigned issues and the channels you follow, read through
        your own connectors. `notify`, a watch's action: you are told its condition is met. Both read only.
RoutineCaps:
  type: object
  properties:
    maxRunsPerDay:
      type: integer
      minimum: 1
      maximum: 144
      description: Runs a day, counted in the trigger's time zone. A slot past it is skipped.
RoutineDeleted:
  type: object
  required:
    - id
    - deleted
  properties:
    id:
      type: string
    deleted:
      type: boolean
RoutineDelivery:
  type: object
  required:
    - available
  properties:
    available:
      type: boolean
      description: Whether this Gateway can deliver the routine's action now.
    code:
      type: string
      description: "Why not: `routine_brief_unavailable` or `routine_watch_unavailable`."
    reason:
      type: string
RoutineProactivity:
  type: object
  properties:
    notify:
      type: string
      enum:
        - always
        - on_change
        - digest
      description: When a run speaks up; `always` by default.
    writes:
      type: string
      enum:
        - never
      description: A routine reads and notifies only. `ask_first` waits for Policy PO1.
RoutineTrigger:
  type: object
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - schedule
        - watch
      description: >-
        `schedule` runs on a time; `watch` checks `watch` every `everySeconds`. `event`, `webhook` and `manual` come
        later.
    everySeconds:
      type: integer
      minimum: 600
      maximum: 604800
      description: >-
        Every N seconds from the routine's creation. Not with `at`. A watch needs it: it checks at most every 10
        minutes.
    watch:
      $ref: "#/RoutineWatch"
    at:
      type: string
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      description: A local time, `HH:MM`, 24-hour. Not with `everySeconds`.
    days:
      type: array
      items:
        type: string
        enum:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
      minItems: 1
      description: The days `at` runs on, in week order; every day when absent.
    timezone:
      type: string
      description: An IANA name; `UTC` when absent.
    catchUp:
      type: string
      enum:
        - latest
        - none
      description: "After downtime: `latest` runs the newest missed slot (the default), `none` runs none."
RoutineWatch:
  type: object
  required:
    - source
  properties:
    source:
      type: string
      enum:
        - github_pull
        - github_issue
        - spend_today
      description: >-
        `github_pull`: the pull request `target` is merged or closed. `github_issue`: the issue `target` changes state.
        `spend_today`: your own AI spend today passes `overUsd`. Today is the UTC day, whatever the routine's
        `timezone`.
    target:
      type: string
      pattern: ^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}#[1-9][0-9]{0,9}$
      description: A repository and a number, `owner/repo#N`. With `github_pull` and `github_issue` only.
    overUsd:
      type: string
      description: >-
        An amount above zero in US dollars, as a decimal string with at most six decimals (root rule 9). With
        `spend_today` only.
  description: What a `watch` trigger checks. The agent reads it as you, and tells you once it is met.
RunPageQueryRequest:
  type: object
  additionalProperties: false
  properties:
    params:
      type: object
      description: The query's parameter values by name; a missing one takes its default
      additionalProperties: true
    refresh:
      type: boolean
      description: "Read it again now, whatever its interval: the page's owner only (403 page_query_owner_only for a reader)"
SaveDesignSystemRequest:
  type: object
  required:
    - name
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: ^(@[a-z0-9][a-z0-9._-]{0,30}/)?[a-z0-9][a-z0-9._-]{0,63}$
      description: Lowercase; `@nexus/` and `ds_` are reserved
    css:
      type: string
      description: CSS custom properties
    files:
      type: array
      maxItems: 40
      items:
        $ref: "#/DesignSourceFile"
      description: At most 4 MiB together
    notes:
      type: string
      maxLength: 65536
      description: Markdown for the model
    components:
      type: array
      maxItems: 500
      items:
        type: string
    source:
      type: string
      maxLength: 500
    makeDefault:
      type: boolean
      description: Make it the organization's default too
  description: A design system to create or replace, by name.
SavePageQueryRequest:
  type: object
  required:
    - connector
    - account
    - statement
  additionalProperties: false
  properties:
    connector:
      type: string
      enum:
        - postgres
        - snowflake
    account:
      type: string
      description: "The connection: its account, name or host, as a connector call's `account` names it"
    statement:
      type: string
      maxLength: 100000
      description: One SELECT or WITH statement, with $1-style parameters
    params:
      type: array
      maxItems: 10
      items:
        $ref: "#/PageQueryParam"
    refreshSeconds:
      type: integer
      minimum: 60
      maximum: 86400
      default: 300
    reason:
      type: string
      maxLength: 500
ScopedKeyRevoked:
  type: object
  required:
    - id
    - already
    - dryRun
  properties:
    id:
      type: string
      description: The mint id (smk_…).
    keyId:
      type: string
      description: The key id, when the request named it.
    already:
      type: boolean
      description: It was revoked before this request.
    dryRun:
      type: boolean
    revokedAt:
      type:
        - string
        - "null"
      format: date-time
SearchGroup:
  type: object
  required:
    - type
    - label
    - results
    - more
  properties:
    type:
      type: string
    label:
      type: string
    results:
      type: array
      items:
        $ref: "#/SearchResult"
    more:
      type: boolean
      description: More matched than `limit`
SearchResponse:
  type: object
  required:
    - query
    - types
    - groups
    - tookMs
  properties:
    query:
      type: string
    types:
      type: array
      description: "The types searched: those asked for that your role may read"
      items:
        type: string
    groups:
      type: array
      description: Groups with results, best first
      items:
        $ref: "#/SearchGroup"
    tookMs:
      type: number
      description: The server's time for the search
SearchResult:
  type: object
  required:
    - type
    - entity
    - id
    - title
    - titleMatches
    - url
    - score
  properties:
    type:
      type: string
      enum:
        - chats
        - artifacts
        - people
        - teams
        - models
    entity:
      type: string
      enum:
        - session
        - artifact
        - member
        - invitation
        - team
        - model
        - policy
    id:
      type: string
    title:
      type: string
    titleMatches:
      type: array
      description: Ranges of `title` that matched (UTF-16)
      items:
        type: array
        items:
          type: integer
        minItems: 2
        maxItems: 2
    subtitle:
      type: string
    snippet:
      $ref: "#/SearchSnippet"
    url:
      type: string
      description: >-
        Nexus UI's page for it, under the organization's slug: /app/<org>/sessions/<id> (a chat message match ends in
        #m-<message id>)
    score:
      type: number
      minimum: 0
      maximum: 1
    messageId:
      type: string
      description: "Chats: the message that matched"
SearchSnippet:
  type: object
  required:
    - text
    - matches
  properties:
    text:
      type: string
      description: An excerpt; `…` where cut
    matches:
      type: array
      description: "[start, end) ranges of `text` that matched, in UTF-16 code units"
      items:
        type: array
        items:
          type: integer
        minItems: 2
        maxItems: 2
ServiceAccount:
  type: object
  description: A caller for CI and scripts. It is no member and holds no seat.
  required:
    - id
    - name
    - ownerUserId
    - teamId
    - createdBy
    - createdAt
    - expiresAt
    - keys
  properties:
    id:
      type: string
      description: "`sva_…`"
    name:
      type: string
    ownerUserId:
      type: string
      description: The member who answers for it. Its keys stop when they leave the organization.
    teamId:
      type: string
      description: The team that owns it. Its keys stop when the team is deleted.
    createdBy:
      type: string
      description: The person who made it.
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
    keys:
      type: array
      description: Every key it held, newest first.
      items:
        $ref: "#/ServiceAccountKey"
ServiceAccountKey:
  type: object
  description: A service account's key. Never the token, except in the answer that issues or rotates it, and its replays.
  required:
    - id
    - serviceAccountId
    - ownerUserId
    - scope
    - prefix
    - createdBy
    - createdAt
    - expiresAt
  properties:
    id:
      type: string
      description: "`sak_…`"
    serviceAccountId:
      type: string
    ownerUserId:
      type: string
      description: >-
        The member who answers for its account, as the account holds it now. The key stops when they leave the
        organization.
    scope:
      $ref: "#/ServiceAccountScope"
    prefix:
      type: string
      description: The first characters of the token, to recognise it in a list.
    label:
      type: string
    createdBy:
      type: string
      description: The person who issued it.
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      description: When the key last authenticated, written at most once an hour.
    rotatedFrom:
      type: string
      description: The key this one replaced in a rotation.
ServiceAccountList:
  type: object
  required:
    - serviceAccounts
  properties:
    serviceAccounts:
      type: array
      items:
        $ref: "#/ServiceAccount"
    nextCursor:
      type: string
      description: The next page's cursor, while more items follow. Only when limit or cursor was sent.
ServiceAccountRevoked:
  type: object
  required:
    - id
    - already
    - dryRun
    - keysRevoked
  properties:
    id:
      type: string
    already:
      type: boolean
      description: It was revoked before this request.
    dryRun:
      type: boolean
    revokedAt:
      type:
        - string
        - "null"
      format: date-time
    keysRevoked:
      type: integer
      description: The live keys it stopped (with `dryRun`, the ones it would stop).
ServiceAccountScope:
  type: object
  description: What a key reaches, which is its account's. Read from the account when the key is shown, never stored on the key.
  required:
    - teamId
  properties:
    teamId:
      type: string
      description: The team that owns the account. Its keys stop when the team is deleted.
Session:
  type: object
  required:
    - id
    - repo
    - agent
    - model
    - title
    - state
    - threadId
    - error
    - startedBy
    - createdAt
    - updatedAt
    - stoppedAt
    - machine
    - fencingToken
    - runner
  properties:
    id:
      type: string
      description: "`cs_` and 40 hex characters"
    repo:
      type: string
      description: GitHub `owner/name`, lowercased
    agent:
      type: string
      description: "`claude` or `codex`: a cloud session launches only these two agents today."
    model:
      type:
        - string
        - "null"
      description: The agent's model name; null for its default.
    title:
      type:
        - string
        - "null"
      description: The session's title; null when the start sent none.
    state:
      type: string
      enum:
        - starting
        - running
        - stopped
        - failed
      description: >-
        `starting`: the machine boots or sets the repository up, or the prompt waits for its host. `running`: the agent
        started. `stopped` and `failed` are final.
    threadId:
      type:
        - string
        - "null"
      description: The session's id on its machine once the agent started (`t_<uuid>`).
    error:
      type:
        - string
        - "null"
      description: Why it failed, or why the last message may not have reached it.
    startedBy:
      $ref: "#/SessionStartedBy"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    stoppedAt:
      type:
        - string
        - "null"
      format: date-time
      description: When it stopped or failed.
    machine:
      oneOf:
        - $ref: "#/CloudMachine"
        - type: "null"
      description: Its cloud machine; null once the machine is deleted.
    fencingToken:
      type: integer
      format: int64
      minimum: 0
      description: "The session's current fencing token: 0 until a runner first takes it, then raised by one on each take."
    runner:
      oneOf:
        - $ref: "#/SessionRunner"
        - type: "null"
      description: The runner that took the session last, and its lease; null until one takes it.
SessionEvent:
  type: object
  required:
    - kind
  description: >-
    One event of a coding-agent session's timeline, as Nexus for desktop's timeline shows it (WbEvent). Gateway keeps
    only the fields named here for each kind, hides common key and token formats, and writes home folders as ~. user:
    text, images. text and thinking: id, text, parent. tool: id, name, input, parent. toolResult: id, output (at most 64
    KiB), isError, truncated, images, parent. approval: requestId, toolUseId, tool, input, description, parent.
    approvalResolved: requestId, decision, message. usage: model, inputTokens, outputTokens, cacheReadTokens,
    cacheWriteTokens, costUsd, parent. turnStart: turnId. turnEnd: turnId, status, costUsd, durationMs, error. task:
    taskId, toolUseId, agentType, status, description. notice: text. error: text, detail.
  properties:
    kind:
      type: string
      enum:
        - user
        - text
        - thinking
        - tool
        - toolResult
        - approval
        - approvalResolved
        - usage
        - turnStart
        - turnEnd
        - task
        - notice
        - error
    at:
      type: integer
      minimum: 0
      description: When it happened, in milliseconds
    id:
      type: string
      maxLength: 200
    text:
      type: string
    parent:
      type:
        - string
        - "null"
      maxLength: 200
      description: "The sub-agent's tool call that made it; absent or null: the session's own agent"
    name:
      type: string
      maxLength: 200
    input:
      description: A tool's input, as the agent sent it
    output:
      type: string
      maxLength: 65536
      description: "A tool's result: at most 64 KiB, the desktop timeline's cap"
    isError:
      type: boolean
    truncated:
      type: boolean
    images:
      type: array
      items:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
      description: Ids of the request's images
    requestId:
      type: string
      maxLength: 200
    toolUseId:
      type: string
      maxLength: 200
    tool:
      type: string
      maxLength: 200
    description:
      type: string
    decision:
      type: string
      enum:
        - allow
        - allowSession
        - deny
        - expired
    message:
      type: string
    model:
      type: string
      maxLength: 200
    inputTokens:
      type: integer
      minimum: 0
    outputTokens:
      type: integer
      minimum: 0
    cacheReadTokens:
      type: integer
      minimum: 0
    cacheWriteTokens:
      type: integer
      minimum: 0
    costUsd:
      type: number
      minimum: 0
    turnId:
      type: string
      maxLength: 200
    status:
      type: string
      description: "turnEnd: completed, interrupted or error; task: running, completed, failed or stopped"
    durationMs:
      type: integer
      minimum: 0
    error:
      type: string
    taskId:
      type: string
      maxLength: 200
    agentType:
      type: string
      maxLength: 200
    detail:
      type: string
SessionList:
  type: object
  required:
    - sessions
  properties:
    sessions:
      type: array
      items:
        $ref: "#/Session"
SessionMessage:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      description: 1 to 100000 characters.
SessionRunner:
  type: object
  required:
    - runnerId
    - fencingToken
    - leaseExpiresAt
  properties:
    runnerId:
      type: string
      description: The runner, as it named itself when it took the session.
    fencingToken:
      type: integer
      format: int64
      minimum: 1
      description: The token the runner holds. Its connector writes inside the session send it in `x-nexus-fencing-token`.
    leaseExpiresAt:
      type: string
      format: date-time
      description: >-
        When the lease ends unless the runner renews it. After it, another runner may take the session without
        `seenToken`.
SessionSnapshot:
  type: object
  required:
    - format
    - source
    - thinking
    - events
    - images
  description: A shared coding-agent session's timeline, as Gateway stored it
  properties:
    format:
      type: integer
      description: "1"
    source:
      type: string
      enum:
        - desktop
        - claude-code
      description: "desktop: a Code session in Nexus for desktop; claude-code: a nexus claude session's Claude Code transcript"
    agent:
      $ref: "#/AgentId"
    model:
      type: string
    costUsd:
      type: number
      description: The agent's own estimate. Hidden from readers outside the organization
    startedAt:
      type: integer
      description: When the session started, in milliseconds
    thinking:
      type: boolean
      description: Whether the sharer included the agent's thinking
    events:
      type: array
      items:
        $ref: "#/SessionEvent"
    images:
      type: array
      items:
        type: object
        required:
          - id
          - mediaType
          - bytes
        properties:
          id:
            type: string
          mediaType:
            type: string
            enum:
              - image/png
              - image/jpeg
              - image/gif
              - image/webp
          bytes:
            type: integer
          width:
            type: integer
          height:
            type: integer
          name:
            type: string
      description: The images the events name; read each with getArtifactAttachment
SessionStartedBy:
  type: object
  required:
    - kind
    - id
  properties:
    kind:
      type: string
      enum:
        - person
        - assistant_conversation
        - room
        - session
    id:
      type: string
      description: A user id (yours, for `person`), an assistant conversation's id, a room's id, or a session of yours (`cs_…`).
  description: "Who started a session. Absent on a start: you (`person`)."
SetAfterTheFact:
  type: object
  required:
    - afterTheFact
  properties:
    afterTheFact:
      oneOf:
        - $ref: "#/AfterTheFact"
        - type: "null"
      description: The setting after; null after turning off what was never on with no `limitUsd`.
SetAfterTheFactRequest:
  type: object
  required:
    - enabled
  properties:
    enabled:
      type: boolean
    limitUsd:
      type: string
      description: >-
        The monthly usage limit, dollars in whole cents, from 1.00 to 100000.00 (at most 100.00 in a new organization's
        first 7 days). A new setting starts at `pricing.defaultLimitUsd`.
SetAgentProfileRequest:
  description: >-
    It replaces every field but the owner. Each field is required but the personality's (length, formality, humour,
    emoji and shortTexts): one of those left out keeps its value. tools, the identity and the personality may be null
  allOf:
    - $ref: "#/AgentProfileFields"
    - type: object
      required:
        - name
        - avatar
        - tone
        - greeting
        - language
        - labels
        - instructions
        - tools
        - proactivity
SetAppCapRequest:
  type: object
  required:
    - monthlyCapUsd
  additionalProperties: false
  properties:
    monthlyCapUsd:
      type: string
      description: USD decimal string in whole cents, $0.01 to $1,000,000.
SetAutoTopup:
  type: object
  required:
    - autoTopup
  properties:
    autoTopup:
      oneOf:
        - $ref: "#/AutoTopup"
        - type: "null"
      description: The setting after; null after turning off what was never set.
SetAutoTopupRequest:
  type: object
  required:
    - enabled
  properties:
    enabled:
      type: boolean
    belowUsd:
      type: string
      description: Dollars in whole cents, above 0.00 and at most 10000.00. Needed to turn on the first time.
    addUsd:
      type: string
      description: Dollars in whole cents, from 10.00 to 500.00. Needed to turn on the first time.
SetChatWrites:
  type: object
  required:
    - enabled
  additionalProperties: false
  properties:
    enabled:
      type: boolean
    operations:
      type: array
      items:
        $ref: "#/ChatWriteOperation"
      description: Replaces the allowlist. Left out, the list is kept
SetConnectorAvailability:
  type: object
  required:
    - availability
  additionalProperties: false
  properties:
    availability:
      type: string
      enum:
        - disabled
        - available
        - enabled_for_all
      description: "available: members opt in"
    teams:
      type: array
      minItems: 1
      items:
        type: string
      description: Team slugs; leave it out for the whole organization
SetNotificationSettings:
  type: object
  required:
    - settings
  additionalProperties: false
  properties:
    settings:
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: object
        required:
          - group
          - channel
          - setting
        additionalProperties: false
        properties:
          group:
            type: string
            enum:
              - my_sessions
              - usage_and_billing
              - requests_and_approvals
              - automations_and_integrations
              - account_and_security
          channel:
            type: string
            enum:
              - email
              - push
          setting:
            type: string
            enum:
              - "on"
              - "off"
SetOperatorControl:
  type: object
  required:
    - kind
    - level
    - reason
    - expiresAt
  properties:
    kind:
      type: string
      enum:
        - pause
        - limit
        - override
    level:
      type: string
      enum:
        - organization
        - team
        - person
        - key
    subject:
      type: string
      description: A team's slug, a user id or a key id. Ignored for `organization`.
    models:
      type: array
      items:
        type: string
      description: Required for a `limit` or an `override`; not allowed for a `pause`.
    reason:
      type: string
    expiresAt:
      type: string
      description: An ISO 8601 time in the future.
SetPageStorageValueRequest:
  type: object
  required:
    - value
  properties:
    value:
      type: string
      maxLength: 5242880
      description: UTF-8 text of at most 5 MiB, without NUL; store JSON as text
SetReviewEvents:
  type: object
  required:
    - level
  additionalProperties: false
  properties:
    level:
      type: string
      enum:
        - comment
        - request_changes
        - full
      description: >-
        `comment`: COMMENT only. `request_changes`: COMMENT and REQUEST_CHANGES. `full`: COMMENT, REQUEST_CHANGES and
        APPROVE.
SetWriteGrants:
  type: object
  required:
    - connector
    - actions
  additionalProperties: false
  properties:
    connector:
      type: string
      examples:
        - github
    actions:
      type: array
      items:
        type: string
      examples:
        - - pull_review
          - check_run
SettingSource:
  type: object
  description: >-
    The level that set a value: `channel` (the channel's binding), `team` (a team on the bound team's path, named by
    `subject`), `organization`, `deployment` (the Gateway's own rule) or `catalog` (the catalog's default).
  required:
    - level
  properties:
    level:
      type: string
      enum:
        - channel
        - team
        - organization
        - deployment
        - agent
        - catalog
        - none
    subject:
      type: string
      description: The team's slug at the `team` level.
ShareAgentSessionRequest:
  type: object
  required:
    - audience
    - session
  properties:
    audience:
      type: string
      enum:
        - org
        - teams
        - people
        - external
        - public
    teams:
      type: array
      items:
        type: string
      description: Team slugs or ids (audience teams)
    people:
      type: array
      items:
        type: string
      description: >-
        Kind people: members' emails or ids; kind external: the emails of people outside the organization (checked
        against artifacts.external.domains)
    expiresIn:
      oneOf:
        - type: string
          pattern: ^[0-9]+\s*(d|h|m|w|days?|hours?|minutes?|weeks?)?$
        - type: number
          exclusiveMinimum: 0
      description: "Kind public: 30d, 12h or a number of days (within artifacts.external.expiry)"
    expiresAt:
      type: string
      format: date-time
      description: "Kind public: when the link stops opening"
    replace:
      type: boolean
      description: Revoke the session's earlier active versions in the same step, so it has exactly this audience
    follow:
      type: boolean
      description: "Keep updated: later snapshots sent with update replace this share's content in place, so its link stays the same"
    update:
      type: boolean
      description: >-
        Write this snapshot over the session's Keep updated share in place: same link, readers and expiry, no new
        version, no email. The audience fields are ignored; includeThinking must match the share (else 400). 200; no
        such share is 404 artifact_not_found. Audited as artifact.updated
    includeThinking:
      type: boolean
      description: Keep the agent's thinking; left out by default
    session:
      type: object
      required:
        - source
        - id
        - events
      description: The snapshot your app built from its own log. The checked timeline is at most 4 MB
      properties:
        source:
          type: string
          enum:
            - desktop
            - claude-code
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: "Your app's id for the session: the same id shares its next version"
        title:
          type: string
          description: "Cut to 200 characters. Absent: the first prompt's first line"
        agent:
          $ref: "#/AgentId"
        model:
          type: string
          maxLength: 200
        costUsd:
          type: number
          minimum: 0
        startedAt:
          type: integer
          minimum: 0
        events:
          type: array
          maxItems: 20000
          items:
            $ref: "#/SessionEvent"
    images:
      type: array
      maxItems: 32
      description: The images the events name, at most 20 MB in all; PNG, JPEG, GIF or WebP, at most 5 MB each
      items:
        type: object
        required:
          - id
          - data
        properties:
          id:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          data:
            type: string
            description: "Base64, or a data: URL"
          name:
            type: string
ShareChatSessionRequest:
  type: object
  required:
    - audience
  properties:
    audience:
      type: string
      enum:
        - org
        - teams
        - people
        - external
        - public
    teams:
      type: array
      items:
        type: string
      description: Team slugs or ids (audience teams)
    people:
      type: array
      items:
        type: string
      description: >-
        Kind people: members' emails or ids; kind external: the emails of people outside the organization (checked
        against artifacts.external.domains)
    allowContinue:
      type: boolean
      default: false
    includeCode:
      type: boolean
      description: >-
        Kinds external and public: keep Ask your code's sources (refused, 403 external_code_not_allowed, unless
        artifacts.external.code is on)
    expiresIn:
      oneOf:
        - type: string
          pattern: ^[0-9]+\s*(d|h|m|w|days?|hours?|minutes?|weeks?)?$
        - type: number
          exclusiveMinimum: 0
      description: "Kind public: 30d, 12h or a number of days (within artifacts.external.expiry)"
    expiresAt:
      type: string
      format: date-time
      description: "Kind public: when the link stops opening"
  description: >-
    Refusals: 403 external_sharing_off, public_links_off, external_sharing_admins_only, external_code_not_allowed; 400
    domain_not_allowed, invalid_email, expiry_required, expiry_too_long, not_a_member; 429 public_share_rate_limited (20
    public links per organization per hour).
SharePageRequest:
  type: object
  required:
    - audience
  properties:
    audience:
      type: string
      enum:
        - org
        - teams
        - people
        - external
        - public
    teams:
      type: array
      items:
        type: string
      description: Team slugs or ids (audience teams)
    people:
      type: array
      items:
        type: string
      description: >-
        Kind people: members' emails or ids; kind external: the emails of people outside the organization (checked
        against artifacts.external.domains)
    expiresIn:
      oneOf:
        - type: string
          pattern: ^[0-9]+\s*(d|h|m|w|days?|hours?|minutes?|weeks?)?$
        - type: number
          exclusiveMinimum: 0
      description: "Kind public: 30d, 12h or a number of days (within artifacts.external.expiry)"
    expiresAt:
      type: string
      format: date-time
      description: "Kind public: when the link stops opening"
    version:
      oneOf:
        - type: string
          enum:
            - latest
        - type: integer
          minimum: 1
      default: latest
      description: "The version readers see: latest (follows new versions) or a number (pinned)"
    role:
      type: string
      enum:
        - view
        - edit
      default: view
      description: >-
        Edit lets the readers join the page's shared draft and write its versions. Only for audiences org, teams and
        people, on the latest version. Deleting, sharing and restoring stay the owner's.
  description: >-
    Refusals: 403 pages_off, page_public_links_off (artifacts.pages.public is off: by default in a company
    organization), external_sharing_off, public_links_off, external_sharing_admins_only; 400 domain_not_allowed,
    invalid_email, expiry_required, expiry_too_long, not_a_member; 404 page_not_found, page_version_not_found,
    unknown_team; 429 public_share_rate_limited.
