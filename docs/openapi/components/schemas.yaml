# Schemas, keyed by name.
AccountDeleted:
  type: object
  required:
    - userId
    - dryRun
    - deleted
    - left
    - planEnded
    - signInNeeded
  properties:
    userId:
      type: string
    dryRun:
      type: boolean
    deleted:
      type: boolean
      description: False on a dry run; true once the account is deleted.
    personalOrg:
      type: string
      description: Your personal organization's id, closed with the account; absent when you have none.
    left:
      type: array
      description: The company organizations you leave.
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: string
          name:
            type: string
    planEnded:
      type: boolean
      description: Whether your personal organization's plan and cards at the payment provider end with it.
    signInNeeded:
      type: boolean
      description: "Whether you must sign in again first: only a sign-in from the last ten minutes deletes your account."
    unpaidUsageUsd:
      type: string
      description: >-
        Your personal organization's usage that its card has not paid, as a decimal dollar string. On a dry run, what
        the deletion charges to the card on file first. Once deleted, what that charge did not collect, which Nexus
        writes off. Absent when nothing is unpaid.
    creditsLostUsd:
      type: string
      description: >-
        Your personal organization's Nexus credits that the deletion loses, as a decimal dollar string. Nothing refunds
        them. Absent when none are left.
AfterTheFact:
  type: object
  description: >-
    Paying after the fact (pricing v2.0): the card on file pays for what Nexus runs after it ran, at provider price plus
    Nexus's rate, up to a monthly usage limit. Gateway's Stripe sweep charges the card each time the unpaid usage
    reaches `thresholdUsd`; less carries over, and what is left is charged once it is turned off. A charge that fails
    stops the calls the card pays (402 `payment_failed`) until one goes through. While a charge runs (`pending`, such as
    a bank debit Stripe is still taking), the card holds a new call only while the unpaid usage, the charge's own amount
    included, and the calls it holds stay within twice `thresholdUsd`; past that the call answers 402
    `charge_processing` until the charge is paid, and `nexusPays.reason` says `charge_processing`. Decimal dollar
    strings.
  required:
    - enabled
    - limitUsd
    - monthSpentUsd
    - reservedUsd
    - leftUsd
    - owedUsd
    - thresholdUsd
    - pending
    - failed
    - refusedUsd
    - phase
    - chargeUsd
    - unpaidUsd
  properties:
    phase:
      type: string
      enum:
        - "off"
        - off_owing
        - "on"
        - charging
        - failed
        - retrying
        - needs_confirmation
        - disputed
        - closed
      description: >-
        Where the card's charge lifecycle is. Read it instead of deriving a state from the other fields. The first that
        holds wins: `closed` (the organization closed; the row never charges again), `disputed` (a payment on the card
        was disputed; it ends with another card or a won dispute), `needs_confirmation` (the bank wants the cardholder
        to confirm the charge, 3-D Secure), `retrying` (a charge failed and a new try runs now) or `failed` (the next
        try waits), `charging` (a charge runs: Stripe's answer, or a bank debit Stripe is still taking), `on`, then
        `off_owing` (off, with usage still unpaid) or `off`. Calls on the card stop in `failed`, `retrying`,
        `needs_confirmation` and `disputed` (402 `payment_failed`).
    chargeUsd:
      type:
        - string
        - "null"
      description: The amount of the charge that runs now. Null when none runs.
    unpaidUsd:
      type: string
      description: >-
        The usage the card has not paid: spent less paid, a running charge included. Name this amount when a charge
        failed or runs: `owedUsd` leaves a running charge out, so it is about zero during a retry.
    enabled:
      type: boolean
      description: >-
        On: calls the free start and the credits cannot pay go on the card. Off charges what is left once its calls
        settle, from 50 cents.
    limitUsd:
      type: string
      description: The most the card pays for in one UTC month.
    monthSpentUsd:
      type: string
      description: What the card paid for this month so far, at provider price plus the rate.
    reservedUsd:
      type: string
      description: Held on the card by calls in progress.
    leftUsd:
      type: string
      description: "What new calls may still spend on the card this month: 0 while it is off or a charge failed."
    owedUsd:
      type: string
      description: >-
        Usage not charged yet: spent less paid, less a running charge. Kept for older clients; `unpaidUsd` is the amount
        to show.
    refusedUsd:
      type:
        - string
        - "null"
      description: >-
        The latest call the card refused for the usage limit (402 `usage_limit_reached`), at provider price plus the
        rate, while it was refused this UTC month. A call may be refused while `leftUsd` is above zero: its most
        possible cost is more than what is left. Null when no call was refused this month.
    thresholdUsd:
      type: string
      description: "The unpaid usage that starts a charge. Less carries over: a month's end charges nothing."
    pending:
      type: boolean
      description: A charge is being taken now.
    failed:
      type:
        - object
        - "null"
      description: "The last charge failed: since when and why. Null while charges go through."
      required:
        - at
        - reason
      properties:
        at:
          type: string
          format: date-time
        reason:
          type: string
          enum:
            - declined
            - authentication_required
            - payment_failed
            - no_payment_method
            - disputed
AgentAccess:
  type: object
  required:
    - agentSubscriptions
    - agents
  properties:
    agentSubscriptions:
      type: boolean
      description: Whether the organization allows subscription routes (GET/PUT /v1/orgs/settings)
    agents:
      type: array
      items:
        $ref: "#/AgentAccessEntry"
AgentAccessEntry:
  type: object
  required:
    - agent
    - name
    - install
    - route
    - from
    - routes
  properties:
    agent:
      $ref: "#/AgentId"
    name:
      type: string
      examples:
        - Claude Code
    install:
      type: string
      description: How to install the agent (the vendor's own package; Nexus never installs it)
      examples:
        - npm i -g @anthropic-ai/claude-code
    route:
      type: string
      enum:
        - gateway
        - subscription
      description: The route it takes when the person names none
    from:
      type: string
      enum:
        - preference
        - default
        - organization
      description: >-
        Why: the person's preference, the default (gateway), or the organization (subscriptions turned off while the
        person prefers one)
    preference:
      type: string
      enum:
        - gateway
        - subscription
      description: The person's saved route; absent when none
    routes:
      type: array
      items:
        $ref: "#/AgentRoute"
AgentAdoption:
  type: object
  properties:
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    scope:
      type: string
      enum:
        - org
        - member
    days:
      type: array
      description: >-
        Every day from `from` to `to`, oldest first; a day without agent calls has no people. Each day also counts its
        active engineers by product: the people with at least one non-refused call that day, and for `agents` the people
        with only subscription sessions too. A day with no such person has `engineers` 0 and no products.
      items:
        type: object
        properties:
          day:
            type: string
            format: date
          people:
            type: array
            items:
              type: object
              properties:
                userId:
                  type: string
                email:
                  type:
                    - string
                    - "null"
                calls:
                  type: integer
                  minimum: 1
              required:
                - userId
                - email
                - calls
          subscription:
            type: array
            description: >-
              People with `subscription` sessions that day (their own Claude or ChatGPT plan) and no agent call through
              Gateway. A session counts when it reports its first model call. A person on both routes that day is in
              `people` only. Gateway keeps these counts for 367 days; days before Gateway counted them have none.
            items:
              type: object
              properties:
                userId:
                  type: string
                email:
                  type:
                    - string
                    - "null"
                sessions:
                  type: integer
                  minimum: 1
              required:
                - userId
                - email
                - sessions
          engineers:
            type: integer
            minimum: 0
            description: >-
              Distinct active engineers that day over every product: a person with at least one non-refused call, or
              with a subscription session for agents.
          products:
            type: array
            description: >-
              Active engineers by product slug (`core`, `agents`, `chat`), sorted by product, only products with
              someone. A person counts once per product, so these can add up to more than `engineers`. For `agents` the
              subscription-only people count too.
            items:
              type: object
              properties:
                product:
                  type: string
                engineers:
                  type: integer
                  minimum: 1
              required:
                - product
                - engineers
        required:
          - day
          - people
          - subscription
          - engineers
          - products
  required:
    - from
    - to
    - scope
    - days
AgentApiBody:
  type: object
  additionalProperties: true
  description: "A body of the agent API, which owns its shape: Gateway passes it through unchanged"
AgentApiError:
  type: object
  required:
    - error
  properties:
    error:
      type: string
      description: The agent API's machine-readable code, such as `credential_refused` or `errands_off`
    detail:
      type: string
AgentAskRequest:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      maxLength: 8000
      description: The question
    conversation:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,64}$
      description: The conversation to continue; a new one without it
    model:
      type: string
      description: The model to answer with; the saved one without it
    stream:
      type: boolean
      description: Stream the answer as server-sent events
    context:
      type: array
      maxItems: 8
      items:
        type: object
        required:
          - kind
          - id
        properties:
          kind:
            type: string
          id:
            type: string
      description: What the ask names from the `@` menu (`GET /v1/agent/context`)
    skill:
      type: string
      description: A skill of yours to answer with
AgentCheck:
  type: object
  properties:
    allowed:
      type: boolean
    agent:
      $ref: "#/AgentId"
    model:
      type:
        - string
        - "null"
    reason:
      type: string
    allowedModels:
      type: array
      items:
        type: string
    defaultModel:
      type: string
AgentId:
  type: string
  description: >-
    A coding agent's id. It names the agent in sessions, policies and routes. Its command may differ: `antigravity` runs
    as `nexus agy`.
  enum:
    - claude
    - codex
    - antigravity
    - cursor
    - opencode
AgentLaunchRoute:
  type: object
  required:
    - result
    - agent
    - version
    - reason
  properties:
    result:
      type: string
      enum:
        - use_plan
        - ask_for_paid_fallback
        - stop
    agent:
      description: The agent to start; auto on a stop of an agent auto request
      anyOf:
        - $ref: "#/AgentId"
        - type: string
          enum:
            - auto
    version:
      type: string
      description: The auto router version that chose
    reason:
      type: string
      description: >-
        plan_at_floor, plan_below_floor, paid_at_floor, paid_below_floor or pinned; for stop: no_classifier, no_offer or
        pinned_unavailable
    class:
      type: string
      enum:
        - light
        - standard
        - heavy
    model:
      type: string
      description: Canonical model id
    providerModel:
      type:
        - string
        - "null"
      description: The id to start the agent with
    effort:
      type:
        - string
        - "null"
    payer:
      type: string
      enum:
        - plan
        - local_key
        - gateway
    account:
      type:
        - integer
        - "null"
      description: The plan account handle the request named
    access:
      type:
        - string
        - "null"
      enum:
        - byok
        - nexus
        - null
      description: Who pays on Gateway
AgentLink:
  type: object
  description: An agent link as its person sees it. Never the token, and never what it hashes to.
  required:
    - id
    - userId
    - agent
    - label
    - grant
    - prefix
    - createdAt
    - expiresAt
  properties:
    id:
      type: string
      description: "`agl_…`"
    userId:
      type: string
      description: The person the agent acts for.
    agent:
      type: string
      description: What the agent is, as a slug (`slack`).
    label:
      type: string
    grant:
      type: array
      items:
        type: string
      description: >-
        The grant the agent holds: what the person granted, cut to what a link may hold now (`models.use`). The person's
        role limits it again at each call.
    prefix:
      type: string
      description: The first characters of the token, to recognise it in a list.
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      description: When the link last authenticated, written at most once an hour.
AgentLinkList:
  type: object
  required:
    - agentLinks
  properties:
    agentLinks:
      type: array
      items:
        $ref: "#/AgentLink"
    nextCursor:
      type: string
      description: The next page's cursor, while more items follow. Only when limit or cursor was sent.
AgentPolicy:
  type: object
  properties:
    agents:
      type: object
      properties:
        claude:
          type: object
          properties:
            allowedModels:
              type: array
              items:
                type: string
            defaultModel:
              type: string
        codex:
          type: object
          properties:
            allowedModels:
              type: array
              items:
                type: string
            defaultModel:
              type: string
        antigravity:
          type: object
          properties:
            allowedModels:
              type: array
              items:
                type: string
            defaultModel:
              type: string
        cursor:
          type: object
          properties:
            allowedModels:
              type: array
              items:
                type: string
            defaultModel:
              type: string
        opencode:
          type: object
          properties:
            allowedModels:
              type: array
              items:
                type: string
            defaultModel:
              type: string
AgentProfile:
  allOf:
    - $ref: "#/AgentProfileFields"
    - type: object
      required:
        - id
        - owner
        - ownerId
        - name
        - avatar
        - tone
        - greeting
        - language
        - labels
        - instructions
        - tools
        - proactivity
        - length
        - formality
        - humour
        - emoji
        - shortTexts
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        owner:
          type: string
          enum:
            - person
            - team
          description: "person: a personal agent. team: a company agent, on that team's budget and policy"
        ownerId:
          type: string
          description: The person's user id, or the team's id
        teamSlug:
          type: string
          description: A company agent's team slug, while the team exists
        createdBy:
          type: string
          description: The user id of the person who created it
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
AgentProfileFields:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
      description: >-
        The display name: plain text without <, > or @. Not Nexus nor an admin's name (400 agent_profile_name_reserved),
        except that a personal agent may keep its own name, Nexus
    avatar:
      type:
        - string
        - "null"
      maxLength: 512
      description: "An emoji, a :shortcode: or an https image URL with no credentials (400 agent_profile_avatar_invalid)"
    tone:
      type:
        - string
        - "null"
      enum:
        - calm
        - warm
        - direct
        - lively
        - custom
        - null
      description: "A tone preset; custom leaves the tone to the instructions. null: the agent's own"
    greeting:
      type:
        - string
        - "null"
      maxLength: 200
      description: >-
        One short line the agent says first in a conversation; control characters stripped (400
        agent_profile_greeting_invalid)
    language:
      type:
        - string
        - "null"
      maxLength: 35
      pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
      description: A BCP-47 tag the agent answers in by default, such as es or pt-BR (400 agent_profile_language_invalid)
    labels:
      type: array
      maxItems: 8
      items:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{0,31}$
      description: Short labels that sort, route and filter agents; repeats are dropped
    instructions:
      type: string
      maxLength: 4000
      description: The owner's guidance, added to the agent's system prompt below its own rules
    tools:
      type:
        - array
        - "null"
      maxItems: 64
      items:
        type: string
        pattern: ^[a-z0-9][a-z0-9_-]{0,63}(\.[a-z0-9][a-z0-9_-]{0,63})?$
      description: >-
        null: every tool the agent's link holds. A list: only these connectors or connector.operation ids; an empty list
        offers none
    proactivity:
      type: string
      enum:
        - always
        - ask_first
        - never
      description: "W4.3's levels: whether the agent may start something the person did not ask for"
    length:
      type:
        - integer
        - "null"
      minimum: 0
      maximum: 100
      description: "How much the agent says: 0 brief to 100 detailed. null: its tone's own (400 agent_profile_personality_invalid)"
    formality:
      type:
        - integer
        - "null"
      minimum: 0
      maximum: 100
      description: "How formal the agent is: 0 casual to 100 formal. null: its tone's own (400 agent_profile_personality_invalid)"
    humour:
      type:
        - integer
        - "null"
      minimum: 0
      maximum: 100
      description: "How much humour the agent uses: 0 none to 100 some. null: its tone's own (400 agent_profile_personality_invalid)"
    emoji:
      type:
        - boolean
        - "null"
      description: "Emoji in the agent's answers. null: off"
    shortTexts:
      type:
        - boolean
        - "null"
      description: "Shorter answers by text and push than in the app. null: on"
AgentProfileList:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: "#/AgentProfile"
AgentRoute:
  type: object
  required:
    - route
    - access
    - available
  properties:
    route:
      type: string
      enum:
        - gateway
        - subscription
    access:
      type:
        - string
        - "null"
      enum:
        - byok
        - nexus
        - subscription
        - null
      description: >-
        Who pays on this route: byok (the organization's own key), nexus (a key Nexus pays for) or subscription (the
        person's plan); null on gateway when no key would pay
    available:
      type: boolean
      description: Whether the route can run now; reason says why not
    reason:
      type: string
      description: Why it cannot, and the command that fixes it
    provider:
      type: string
      description: "gateway: the provider Gateway calls"
      examples:
        - anthropic
    plan:
      type: string
      description: "subscription: the plan it runs on"
      examples:
        - Claude
    vendor:
      type: string
      examples:
        - Anthropic
    login:
      type: string
      description: "subscription: how to sign the agent in to the plan, once, on the person's machine"
      examples:
        - claude auth login
    loginStatus:
      type: string
      description: "subscription: how to check that sign-in"
      examples:
        - claude auth status --text
AgentSession:
  type: object
  properties:
    id:
      type: string
      examples:
        - sess_abc123
    agent:
      $ref: "#/AgentId"
    model:
      type: string
    via:
      type: string
      enum:
        - nexus
        - subscription
        - ori
      description: >-
        nexus: every model call through Gateway's agent gateway; subscription: the person's own plan (Claude Code on
        their Claude login, Codex on their ChatGPT login), calls straight to the vendor, usage as the agent reported it;
        ori: sessions from before the agent gateway
    access:
      type: string
      enum:
        - subscription
        - byok
        - nexus
      description: >-
        Who pays its model calls, as Gateway classified the session when it opened: subscription (the person's own
        plan), byok (the organization's own provider key, through Gateway) or nexus (Nexus's own key, for Nexus's own
        organizations; Nexus credit no longer pays an agent). Absent for ori, for sessions from before, and when no key
        would pay (Gateway refuses those calls).
    person:
      type: string
    cwd:
      type: string
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    durationMs:
      type: number
    exitCode:
      type: integer
    signal:
      type: string
    agentSessionId:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: "The agent's own conversation id: `nexus claude --resume <id>` or `nexus codex resume <id>` picks it up again."
    status:
      type: string
      enum:
        - running
        - succeeded
        - failed
        - interrupted
        - lost
    usage:
      type: object
      description: >-
        subscription sessions, once the agent has reported: its calls summed. estimatedCostUsd is the list-price
        estimate of the priced calls (Claude Code's own, the catalog's for Codex), never charged; unpricedCalls counts
        the calls with no estimate
      properties:
        calls:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        cacheReadTokens:
          type: integer
        cacheCreationTokens:
          type: integer
        estimatedCostUsd:
          type: number
        unpricedCalls:
          type: integer
          description: Calls with no estimate, because the agent stated no cost or the call names no model the catalog lists
        models:
          type: array
          items:
            type: string
AgentSessionWithSpend:
  allOf:
    - $ref: "#/AgentSession"
    - type: object
      properties:
        spend:
          type: object
          description: What the calls metered to this session cost (refused calls left out); zero without calls.
          properties:
            usd:
              type: number
              minimum: 0
            calls:
              type: integer
              minimum: 0
          required:
            - usd
            - calls
      required:
        - spend
AgentWriteSetting:
  type: object
  required:
    - enabled
  additionalProperties: false
  properties:
    enabled:
      type: boolean
      description: Whether your agent links make the organization's allowed writes with no record per call
AnthropicError:
  type: object
  description: An error on /v1/anthropic/, in the shape of Anthropic's API.
  required:
    - type
    - error
  properties:
    type:
      const: error
    error:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          description: >-
            Follows the status, as in Anthropic's API: invalid_request_error (400), authentication_error (401),
            billing_error (402), permission_error (403), not_found_error (404), request_too_large (413),
            rate_limit_error (429); else Gateway's type, such as timeout_error (504) or api_error.
        message:
          type: string
        nexus:
          type: object
          additionalProperties: true
          description: "Gateway's stable `code`, plus any details. A details-only error has `code: null`."
App:
  type: object
  required:
    - id
    - name
    - userId
    - url
    - state
    - framework
    - projectName
    - deployedAt
    - claimRequestedAt
    - createdAt
    - updatedAt
    - costToDate
    - cost30d
    - costUpdatedAt
    - billingError
    - monthlyCapUsd
    - monthSpendUsd
    - pauseAt
    - pausedReason
  properties:
    id:
      type: string
      description: "`app_…`"
    name:
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 48
    userId:
      type: string
      description: The member who deployed it first.
    url:
      type:
        - string
        - "null"
      description: >-
        The app's address: its production URL once Vercel assigned it, else its last deployment's own. Null before the
        first deployment.
    state:
      type:
        - string
        - "null"
      enum:
        - QUEUED
        - INITIALIZING
        - BUILDING
        - READY
        - ERROR
        - CANCELED
        - BLOCKED
        - null
      description: Vercel's state of the last deployment; null before the first.
    framework:
      type:
        - string
        - "null"
      description: The Vercel framework preset it was deployed with; null for Vercel's own detection.
    projectName:
      type: string
      description: The Vercel project's name on Nexus's team (`nx-<8 hex>-<name>`).
    deployedAt:
      type:
        - string
        - "null"
      format: date-time
      description: When the last deployment started.
    claimRequestedAt:
      type:
        - string
        - "null"
      format: date-time
      description: "When a member last asked for a claim link: the project may since be on their own Vercel account."
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    costToDate:
      type:
        - string
        - "null"
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: >-
        What Vercel billed Nexus for this app in all, in USD, as a decimal string (root rule 9); null until a cost pull
        saw a charge for it.
    cost30d:
      type:
        - string
        - "null"
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: >-
        What Vercel billed for it over the last 30 days, in USD, as a decimal string; null until a cost pull saw a
        charge for it.
    costUpdatedAt:
      type:
        - string
        - "null"
      format: date-time
      description: When the costs were last read from Vercel's charges, which come a day late; null with no cost.
    billingError:
      type:
        - string
        - "null"
      description: >-
        An outstanding payment, paused state, or provider correction awaiting credit. Transient errors never pause
        hosting.
    monthlyCapUsd:
      type: string
      description: Monthly hosting cap in USD. Defaults to $10.
    monthSpendUsd:
      type: string
      description: Current UTC month ListCost plus Nexus rate, in USD.
    pauseAt:
      type:
        - string
        - "null"
      description: The earliest cap or payment grace deadline. Null while healthy.
    pausedReason:
      type:
        - string
        - "null"
      description: cap, card or debt while hosting is paused.
AppClaim:
  type: object
  required:
    - id
    - claimUrl
    - expiresAt
  properties:
    id:
      type: string
    claimUrl:
      type: string
      format: uri
      description: Vercel's claim page for the app's project. Anyone with it can claim the app.
    expiresAt:
      type: string
      format: date-time
      description: "When the link stops working: 24 hours after it was made."
AppDeleted:
  type: object
  required:
    - id
    - deleted
  properties:
    id:
      type: string
    deleted:
      type: boolean
AppList:
  type: object
  required:
    - apps
  properties:
    apps:
      type: array
      items:
        $ref: "#/App"
AppendCloudHistoryEvents:
  type: object
  required:
    - events
  properties:
    events:
      type: array
      minItems: 1
      maxItems: 64
      items:
        type: object
        required:
          - seq
          - at
        properties:
          seq:
            type: integer
            minimum: 1
          at:
            type: integer
            minimum: 0
            description: Milliseconds since 1970
          body:
            type: string
            description: The workbench event's JSON text
          omittedBytes:
            type: integer
            minimum: 0
            description: "Instead of `body`: the host dropped a body over the per-event cap, of this size"
AppendSyncedEventsRequest:
  type: object
  required:
    - events
  additionalProperties: false
  properties:
    events:
      type: array
      minItems: 1
      maxItems: 64
      items:
        $ref: "#/SyncedEvent"
      description: Consecutive events, the first at most one past the last stored.
  description: "`appendSyncedEvents`'s body."
Approval:
  type: object
  required:
    - id
    - connector
    - operation
    - arguments
    - argumentsHash
    - status
    - expired
    - createdAt
    - expiresAt
  properties:
    id:
      type: string
      pattern: ^apr_[0-9a-f]{32}$
    connector:
      type: string
    operation:
      type: string
    arguments:
      type: object
      description: "The call's body, as stored: what the person confirms, and what the write must send"
    argumentsHash:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: SHA-256 of the arguments' canonical JSON
    status:
      type: string
      enum:
        - pending
        - confirmed
        - denied
        - used
        - expired
    expired:
      type: boolean
      description: "Its expiry passed: it can no longer be confirmed or used"
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    decidedAt:
      type: string
      format: date-time
    decidedBy:
      type: string
      enum:
        - person
        - agent
      description: "Who decided it: the person (confirm or deny in Nexus), or the agent link that cancelled it"
    usedAt:
      type: string
      format: date-time
    confirmUrl:
      type: string
      format: uri
      description: "Nexus UI's page where the person confirms or denies it, when Gateway knows Nexus UI's URL "
ApproveDeviceRequest:
  type: object
  required:
    - approverDeviceId
    - signature
  additionalProperties: false
  properties:
    approverDeviceId:
      type: string
      description: Your trusted device that signs.
    signature:
      type: string
      pattern: ^[A-Za-z0-9_-]{86}$
      description: >-
        Ed25519 over `nexus-device-approval:v1:{deviceId}:{encryptionKey}:{signingKey}`: 64 bytes, base64url without
        padding.
    keys:
      type: array
      maxItems: 1000
      items:
        $ref: "#/DeviceThreadKey"
      description: The new device's copies of key versions you already hold, each signed by the approver.
    handover:
      type: string
      minLength: 1
      maxLength: 65536
      pattern: ^[A-Za-z0-9_-]+$
      description: >-
        For a device only: the approver's trusted holders and remembered revoked ids, signed by the approver over
        `nexus-device-handover:v1:{deviceId}:{approverDeviceId}:{payload}` and HPKE-sealed to the new device's
        `encryptionKey`, base64url without padding. Gateway stores it unread and lists it on the new device, which alone
        opens it.
  description: "`approveDevice`'s body."
Artifact:
  type: object
  required:
    - id
    - version
    - sessionId
    - title
    - mode
    - model
    - models
    - author
    - audience
    - allowContinue
    - status
    - mine
    - messageCount
    - url
    - path
    - markdownUrl
    - createdAt
  description: "A shared chat: an immutable snapshot of a session at the moment it was shared"
  properties:
    id:
      type: string
      description: art_…; one per version
    version:
      type: integer
      minimum: 1
      description: 1 for a session's first share, then 2, 3…
    sessionId:
      type: string
      description: The session it was shared from (which may have changed or been deleted since)
    title:
      type: string
    mode:
      $ref: "#/ChatMode"
    model:
      type: string
      description: "The session's model when shared: nexus/auto or a pinned model"
    models:
      type: array
      items:
        type: string
      description: The models that answered, in order of first use
    author:
      $ref: "#/ArtifactAuthor"
      description: Readers outside the organization get the name only
    audience:
      $ref: "#/ArtifactAudience"
    allowContinue:
      type: boolean
      description: Readers may continue it in a new private chat of their own
    status:
      type: string
      enum:
        - active
        - revoked
      description: Only its author sees a revoked artifact
    mine:
      type: boolean
      description: You shared it
    latest:
      type: boolean
      description: No newer active version you can read
    messageCount:
      type: integer
    costUsd:
      type: number
      description: What the shared answers cost; absent for readers outside the organization
    url:
      type: string
      description: >-
        The link to hand out: a public link (kind public), the fast viewer (kind external, and for every reader
        outside), else the artifact in Nexus UI; absolute when the Gateway knows Nexus UI's URL, else a path
    path:
      type: string
      description: /app/<org>/artifacts/<id>
    markdownUrl:
      type: string
      description: GET /v1/artifacts/{id}.md
    createdAt:
      type: string
      format: date-time
      description: When it was shared
    sessionCreatedAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
    viewerUrl:
      type: string
      description: "The fast viewer outside the app shell: <origin>/a/<id> (read through a public link: that link)"
    publicUrl:
      type: string
      description: "Kind public, for its author and the organization's owners and admins (and whoever holds it): <origin>/a/<token>"
    expiresAt:
      type: string
      format: date-time
      description: "Kind public: when the link stops opening"
    external:
      type: boolean
      description: Shared outside the organization (kind external or public)
    includeCode:
      type: boolean
      description: "Outside the organization: whether Ask your code's sources are in the snapshot"
    organization:
      type: string
      description: The organization's name, shown to every reader
    kind:
      type: string
      enum:
        - page
        - session
      description: >-
        page for a shared page (no messages; open it with GET /v1/artifacts/{id}/frame); session for a shared
        coding-agent session (its messages derived from its timeline, `session` on ArtifactDetail); absent for a chat
    pageId:
      type: string
      description: "A shared page: the page"
    pageFormat:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
    pageVersion:
      type: integer
      description: "A shared page: the version it pins; absent: the latest"
    pageRole:
      type: string
      enum:
        - view
        - edit
      description: "A shared page: edit when its readers in the organization may edit the page; absent for a chat"
ArtifactAccess:
  type: object
  required:
    - id
    - audience
    - status
    - people
    - opens
    - reports
  description: "Who has an artifact shared outside, who asked, and how often it was opened (named: per person; public: a count)"
  properties:
    id:
      type: string
    audience:
      type: string
      enum:
        - org
        - teams
        - people
        - external
        - public
    status:
      type: string
      enum:
        - active
        - revoked
    people:
      type: array
      items:
        $ref: "#/ArtifactAccessPerson"
    opens:
      type: integer
    lastOpenedAt:
      type: string
      format: date-time
    reports:
      type: integer
    expiresAt:
      type: string
      format: date-time
    publicUrl:
      type: string
ArtifactAccessPerson:
  type: object
  required:
    - email
    - status
    - opens
  properties:
    email:
      type: string
    status:
      type: string
      enum:
        - granted
        - requested
        - denied
        - removed
    opens:
      type: integer
    lastOpenedAt:
      type: string
      format: date-time
    requestedAt:
      type: string
      format: date-time
    grantedAt:
      type: string
      format: date-time
    message:
      type: string
      description: What the person asking wrote
ArtifactAttachment:
  type: object
  description: >-
    An image of a shared artifact's question, with its bytes (getArtifactAttachment, getPublicArtifactAttachment). A
    copy made when the session was shared, kept and deleted with the artifact.
  required:
    - id
    - artifactId
    - messageId
    - mediaType
    - bytes
    - data
    - createdAt
  properties:
    id:
      type: string
      description: The image's id as the artifact's messages list it
    artifactId:
      type: string
    messageId:
      type: string
    mediaType:
      type: string
      enum:
        - image/png
        - image/jpeg
        - image/gif
        - image/webp
    bytes:
      type: integer
    width:
      type: integer
    height:
      type: integer
    name:
      type: string
    data:
      type: string
      description: Standard base64
    createdAt:
      type: string
      format: date-time
ArtifactAudience:
  type: object
  required:
    - kind
    - teams
    - people
  description: >-
    Who may read an artifact, besides its author: inside the organization, the whole organization, chosen teams (their
    members and the members of the teams under them) or chosen people; outside it, named people by email (`external`) or
    anyone with the link (`public`). Readers outside the organization see the kind only.
  properties:
    kind:
      type: string
      enum:
        - org
        - teams
        - people
        - external
        - public
    teams:
      type: array
      items:
        type: string
      description: Team slugs (kind teams)
    people:
      type: array
      items:
        type: string
      description: >-
        Members' emails (kind people); the outsiders with access (kind external). Empty for readers outside the
        organization.
ArtifactAuthor:
  type: object
  properties:
    email:
      type: string
    name:
      type: string
ArtifactDetail:
  allOf:
    - $ref: "#/Artifact"
    - type: object
      required:
        - messages
        - hiddenSources
      properties:
        messages:
          type: array
          items:
            $ref: "#/ChatSessionMessage"
          description: The snapshot, oldest first; citations from repositories you cannot see are left out
        hiddenSources:
          type: integer
          description: >-
            Citations left out: from repositories the reader cannot see, or (outside the organization) Ask your code's
            sources not included
        versions:
          type: array
          items:
            $ref: "#/ArtifactLink"
          description: Every version of the session's artifact you can read, newest first
        variant:
          type: string
          enum:
            - member
            - external
          description: >-
            member: as the organization's members see it; external: no cost, author email or team names, and no code
            sources unless included
        session:
          $ref: "#/SessionSnapshot"
          description: >-
            A shared coding-agent session (kind session): its timeline as the sharer's app showed it. Outside the
            organization: no cost and no usage events
ArtifactLink:
  type: object
  required:
    - id
    - version
    - status
    - audience
    - createdAt
  description: One version of a session's artifact, as the session lists it
  properties:
    id:
      type: string
    version:
      type: integer
      minimum: 1
    status:
      type: string
      enum:
        - active
        - revoked
    audience:
      type: string
      enum:
        - org
        - teams
        - people
        - external
        - public
    createdAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
ArtifactPage:
