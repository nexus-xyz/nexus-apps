Model:
  type: object
  properties:
    id:
      type: string
      description: "Canonical: maker/model"
    object:
      const: model
    created:
      type: integer
    owned_by:
      type: string
      description: "The maker: who made the model, the first part of its id"
    provider:
      type: string
      description: "Supported models: the host that serves it, whose rules price it and whose key pays for it"
    name:
      type: string
    family:
      type: string
    status:
      type: string
      enum:
        - supported
        - coming_soon
    allowed:
      type: boolean
    surfaces:
      type: array
      items:
        type: string
    input:
      type: array
      items:
        type: string
        enum:
          - text
          - image
      description: "Supported models: what it reads; `image` when chat questions with images may use it"
    provider_model:
      type: string
    context_window:
      type: integer
      description: "Supported models: input and output tokens together, at most"
    web_search_usd:
      type: number
      description: >-
        One hosted web search's list price in US dollars, set when the model can run a chat's web search; absent
        otherwise
    max_output_tokens:
      type: integer
      description: >-
        Supported models: the longest output, which Core reserves when a call names no limit. It holds on the agents'
        pass-through (`/v1/anthropic`, `/v1/openai`); the chat paths cap output at the deployment's limit (a server
        setting, 4,096 by default): `/v1/chat/completions` refuses a larger `max_tokens` with a 400, and Nexus chat
        answers within it, except rounds that offer the `write_page` tool, which ask for up to 16,384 tokens within the
        model's own limit
    reasoning:
      type: object
      description: "Supported models: how it reasons"
      properties:
        mode:
          type: string
          enum:
            - effort
            - budget
            - none
          description: >-
            How a call steers it: an effort level (`efforts`), a token budget (Anthropic extended thinking,
            `budget_tokens`), or not at all (the model does not reason)
        efforts:
          type: array
          items:
            type: string
            enum:
              - low
              - medium
              - high
              - xhigh
              - max
          description: >-
            The values the provider's effort setting takes (Anthropic `output_config.effort`, OpenAI
            `reasoning.effort`), lowest first; empty unless `mode` is `effort`
        default_effort:
          type:
            - string
            - "null"
          description: The provider's default effort; null where the provider states none
        can_disable:
          type: boolean
          description: >-
            Whether a call may turn reasoning off with the provider's own switch (Anthropic `thinking: {"type":
            "disabled"}`, OpenAI `reasoning.effort: "none"`), at some effort at least: see `disable_max_effort`
        disable_max_effort:
          type:
            - string
            - "null"
          enum:
            - low
            - medium
            - high
            - xhigh
            - max
            - null
          description: >-
            The highest effort at which `can_disable` holds (Claude Opus 5 and Claude Haiku 5.5: `high`); null when it
            holds at every effort, or `can_disable` is false
    pricing:
      type: object
      description: >-
        List prices Core meters with, per million tokens (supported models). An OpenAI model's `cache_write` sizes a
        call's reservation, but settlement does not charge it yet
      properties:
        input:
          type: number
        output:
          type: number
        cache_read:
          type: number
          description: Cache reads
        cache_write:
          type: number
          description: "Cache writes (Anthropic: 5-minute writes; 0 where the provider does not price them)"
        cache_write_1h:
          type: number
          description: "Anthropic: 1-hour cache writes"
        long_context:
          type: object
          description: The rates above `above` input tokens, where the model has a long-context tier
          properties:
            above:
              type: integer
            input:
              type: number
            output:
              type: number
            cache_read:
              type: number
              description: Cache reads
            cache_write:
              type: number
              description: "Cache writes (Anthropic: 5-minute writes; 0 where the provider does not price them)"
            cache_write_1h:
              type: number
              description: "Anthropic: 1-hour cache writes"
        unit:
          type: string
    default_for:
      type: array
      items:
        type: string
    note:
      type: string
    openWeights:
      type:
        - boolean
        - "null"
      description: Catalog classification. True means open weights. Null means unclassified.
