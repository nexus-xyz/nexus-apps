Spend:
  type: object
  properties:
    budgetUsd:
      type: number
      description: >-
        The organization's budget, a cap per budgetPeriod. Owners and admins only: a member gets none of budgetUsd,
        spentUsd, reservedUsd, budgetPeriod and periodSpentUsd. Deprecated: read `budgetUsdDecimal`, the exact decimal
        string (root rule 9).
      deprecated: true
    budgetUsdDecimal:
      type: string
      description: >-
        `budgetUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
        Prefer it to `budgetUsd`.
    spentUsd:
      type: number
      description: >-
        The organization's spend since it began. Owners and admins only. Deprecated: read `spentUsdDecimal`, the exact
        decimal string (root rule 9).
      deprecated: true
    spentUsdDecimal:
      type: string
      description: >-
        `spentUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
        Prefer it to `spentUsd`.
    reservedUsd:
      type: number
      description: >-
        Held by the organization's calls in flight. Owners and admins only. Deprecated: read `reservedUsdDecimal`, the
        exact decimal string (root rule 9).
      deprecated: true
    reservedUsdDecimal:
      type: string
      description: >-
        `reservedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `reservedUsd`.
    budgetPeriod:
      type: string
      enum:
        - day
        - week
        - month
      description: "Owners and admins only: the budget's period"
    periodSpentUsd:
      type: number
      description: >-
        Owners and admins only: the spend of calls reserved in the budget's current period, what the budget counts.
        Deprecated: read `periodSpentUsdDecimal`, the exact decimal string (root rule 9).
      deprecated: true
    periodSpentUsdDecimal:
      type: string
      description: >-
        `periodSpentUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `periodSpentUsd`.
    remainingUsd:
      type: number
      description: >-
        Owners and admins: what the organization's budget has left this period. Everyone else: what is left for them,
        the least room of the organization, their team's caps and their monthly limit, as the next 402 says it.
        Deprecated: read `remainingUsdDecimal`, the exact decimal string (root rule 9).
      deprecated: true
    remainingUsdDecimal:
      type: string
      description: >-
        `remainingUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `remainingUsd`.
    period:
      type: string
      description: >-
        Not owners and admins: the period of the cap that binds remainingUsd (`2026-10-17`, `2026-W43` or `2026-10`).
        For the organization's budget, its current period
    resetsAt:
      type: string
      description: >-
        When the binding cap's period ends and remainingUsd comes back; for owners and admins, when the budget's period
        ends
    scope:
      type: string
      enum:
        - org
        - own
      description: "`org`: the whole organization's calls (owners and admins); `own`: only the caller's"
    byProduct:
      type: array
      items:
        type: object
        properties:
          product:
            type: string
          capability:
            type: string
          costUsd:
            type: number
            deprecated: true
            description: "Deprecated: read `costUsdDecimal`, the exact decimal string (root rule 9)."
          costUsdDecimal:
            type: string
            description: >-
              `costUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
              micro-dollars. Prefer it to `costUsd`.
          calls:
            type: integer
    recent:
      type: array
      items:
        type: object
      description: >-
        Recent calls. fundedBy says who paid the provider (own_key, nexus_key for Nexus's own organizations,
        nexus_subsidy, nexus_credit for the organization's prepaid credits, or nexus_invoiced for a contract's invoice);
        unset on refusals, typed decisions and calls from before it was recorded. A call a Nexus subsidy paid also has
        fundingOrg, the organization whose stored key paid it. A call Nexus paid the provider for (nexus_key or
        nexus_subsidy) also has markupBps, Nexus's rate on it in basis points (500 is 5%), as it was when the call
        settled; costUsd stays the provider's cost. A call a Nexus subsidy paid also has subsidyMarkupBps, the rate the
        subsidy was charged at: the subsidy spent costUsd plus that rate. It is unset on older calls, which spent
        costUsd alone. An Anthropic call also has inferenceGeo (us or global), where the provider said it ran; unset on
        other providers and on calls from before it was recorded. Each call also names the caller's key, never its
        secret: keyId (a token id `key_…`; a module's scoped key id `scoped:<product>/<capability>/smk_…`, which POST
        /v1/auth/scoped-keys/revoke takes; an agent's link id `agl_…`, so a call of the agent differs from the person's
        own; `ui`; or a system caller's name) and keyKind (the audit log's actor kind: `api_key`, `cli`, `ui`, `module`,
        `service`, `sandbox`, `operator`, `agent` or `system`). Both are unset on calls from before they were recorded:
        an unknown key Each call's `costUsd`, and its `overspendPrevented.limitUsd` and `overUsd`, also come as exact
        decimal strings: `costUsdDecimal`, `limitUsdDecimal` and `overUsdDecimal`. The numbers are deprecated.
    subsidizedUsd:
      type: number
      description: >-
        Organizations with a Nexus subsidy: what calls the subsidy paid cost the subsidy, each at its provider cost plus
        Nexus's rate (in your scope: a member gets what it paid for their own calls). Deprecated: read
        `subsidizedUsdDecimal`, the exact decimal string (root rule 9).
      deprecated: true
    subsidizedUsdDecimal:
      type: string
      description: >-
        `subsidizedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
        micro-dollars. Prefer it to `subsidizedUsd`.
    subsidy:
      type: object
      description: >-
        Owners and admins only: the organization's Nexus subsidy (a personal organization's starting credit), funded by
        Nexus, never the organization's own money. A member's answer has none of it
      properties:
        grantedUsd:
          type: number
          deprecated: true
          description: "Deprecated: read `grantedUsdDecimal`, the exact decimal string (root rule 9)."
        grantedUsdDecimal:
          type: string
          description: >-
            `grantedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `grantedUsd`.
        spentUsd:
          type: number
          description: >-
            What settled calls cost the subsidy: each call's provider cost plus Nexus's rate, as for credits.
            Deprecated: read `spentUsdDecimal`, the exact decimal string (root rule 9).
          deprecated: true
        spentUsdDecimal:
          type: string
          description: >-
            `spentUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `spentUsd`.
        reservedUsd:
          type: number
          deprecated: true
          description: "Deprecated: read `reservedUsdDecimal`, the exact decimal string (root rule 9)."
        reservedUsdDecimal:
          type: string
          description: >-
            `reservedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `reservedUsd`.
        remainingUsd:
          type: number
          deprecated: true
          description: "Deprecated: read `remainingUsdDecimal`, the exact decimal string (root rule 9)."
        remainingUsdDecimal:
          type: string
          description: >-
            `remainingUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `remainingUsd`.
        expiredUsd:
          type: number
          deprecated: true
          description: >-
            What was left of the free start when it expired, 30 days after its grant (pricing v2.0). Absent before.
            Deprecated: read `expiredUsdDecimal`, the exact decimal string (root rule 9).
        expiredUsdDecimal:
          type: string
          description: >-
            `expiredUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `expiredUsd`.
        fundedBy:
          const: nexus
        usableForModelCalls:
          type: boolean
          description: >-
            Whether this Gateway pays a Nexus feature's model calls (chat sessions, module runs; never raw model access)
            of an organization with no key of its own from the subsidy (a server setting, and a server setting's stored
            keys or a subsidy environment key)
    subsidiesPaid:
      type: object
      description: >-
        The funding organization, owners and admins: what its stored provider keys paid for other organizations'
        subsidized calls. Never part of its own spend, budget or limits
      properties:
        usd:
          type: number
          deprecated: true
          description: "Deprecated: read `usdDecimal`, the exact decimal string (root rule 9)."
        usdDecimal:
          type: string
          description: >-
            `usd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the micro-dollars.
            Prefer it to `usd`.
        calls:
          type: integer
        organizations:
          type: integer
    credits:
      type: object
      description: >-
        Owners and admins: the organization's prepaid Nexus credits, its own money, never expiring, once it bought some.
        A Nexus feature's call spends them after the subsidy, at its provider cost plus `markupBps`. Decimal dollar
        strings.
      required:
        - purchasedUsd
        - spentUsd
        - reservedUsd
        - remainingUsd
        - markupBps
      properties:
        purchasedUsd:
          type: string
          description: Bought, over all time.
        spentUsd:
          type: string
          description: "What settled calls cost the credits: each call's provider cost plus `markupBps`."
        reservedUsd:
          type: string
          description: Held by calls in progress.
        remainingUsd:
          type: string
          description: >-
            Bought, less spent, held and reversed. Below zero after a refund or a lost dispute took back credit that was
            already spent: then Nexus pays for no call (the free start, credits or the card after the fact) until a
            purchase pays it back.
        reversedUsd:
          type: string
          description: >-
            What refunds, lost disputes and operators took back, and what an open dispute holds of its purchase until it
            closes. A refund that fails gives its credit back. Only while something is taken back.
        markupBps:
          type: integer
          description: Nexus's rate in basis points (500 is 5%).
    payAfterTheFact:
      type: boolean
      description: >-
        Owners and admins (pricing v2.0): the organization pays after the fact, so calls the free start and the credits
        cannot pay still run on its card.
    nexusPays:
      type: object
      description: >-
        Every member: whether Nexus can pay for the organization's next model call, and why not. It reads the payers in
        the ledger's order: a contract, the free start, other Nexus grants, the credits, then the card when it pays
        after the fact; an unpaid invoice past its grace stops all of them. It answers for a small call to a model the
        free start pays for, so a pricier model or a larger call can still be refused. Absent where Nexus pays for no
        model calls on this Gateway.
      required:
        - pays
        - payer
        - reason
        - changesAt
      properties:
        pays:
          type: boolean
        payer:
          type:
            - string
            - "null"
          enum:
            - contract
            - free_start
            - subsidy
            - credits
            - card
            - null
          description: Who pays the next call; null when `pays` is false
        reason:
          type:
            - string
            - "null"
          enum:
            - free_start_used_up
            - free_start_expired
            - credits_out
            - usage_limit_reached
            - charge_failed
            - card_needs_confirming
            - card_disputed
            - past_due
            - billing_off
            - charge_processing
            - null
          description: >-
            Why Nexus cannot pay; null when `pays` is true. `billing_off`: nothing was set up to pay (no free start, no
            credits, and the card does not pay after the fact). `card_disputed`: a payment on the card was disputed, and
            only another card pays. `past_due` comes first, also under a contract. A balance under a cent does not count
            as paying.
        changesAt:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            The next time this changes by itself: the free start's deadline while it pays, or the next month while the
            usage limit is reached; else null
        limitUsedPercent:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
          description: >-
            While the card pays: how much of this UTC month's usage limit it paid, in whole percent, rounded down. Null
            while another payer pays, or nobody, and always null for a caller who sees only their own spend: only
            billing managers see it. Absent from an older Gateway.
SpendCall:
  type: object
  description: >-
    One model call, as the ledger recorded it. Every field is always present, and an unknown value is null. People and
    teams are named by id only; their names are in the directory file (`exportDirectoryCsv`). Money is a decimal string
    in US dollars with six decimals. A CSV file has one column per field, in this order.
  required:
    - id
    - at
    - status
    - model
    - provider
    - product
    - capability
    - userId
    - teamId
    - agentSessionId
    - chatSessionId
    - inputTokens
    - outputTokens
    - costUsd
    - reservedUsd
    - reason
    - overspendLevel
    - overspendLimitUsd
    - overspendAmountUsd
    - overspendOverUsd
    - overspendPeriod
    - fundedBy
  properties:
    id:
      type: string
      description: The call's record id.
      examples:
        - spd_abc123
    at:
      type: string
      description: When the ledger recorded the call.
      format: date-time
    status:
      type: string
      description: >-
        `settled`, `failed`, `refused` (Nexus Gateway refused it, and no money moved) or `released` (its reservation
        closed without a settle, by a job's cleanup or the ledger's age sweep).
      enum:
        - settled
        - failed
        - refused
        - released
    model:
      type:
        - string
        - "null"
      description: The model the call asked for; null for a released call, whose model the ledger did not record.
    provider:
      type:
        - string
        - "null"
      description: The provider that served it; null for a refused or released call, which no provider served.
    product:
      type: string
      description: "The product it is metered to: `core` for direct API calls, `agents`, `chat` or a module."
    capability:
      type:
        - string
        - "null"
      description: The module's capability, such as `wiki`.
    userId:
      type:
        - string
        - "null"
      description: The person who made the call.
    teamId:
      type:
        - string
        - "null"
      description: The team the call was attributed to; null for none (`unassigned`).
    agentSessionId:
      type:
        - string
        - "null"
      description: The coding-agent session the call belongs to.
    chatSessionId:
      type:
        - string
        - "null"
      description: The chat session the call belongs to (metadata only, never its content).
    inputTokens:
      type:
        - integer
        - "null"
      description: Prompt tokens, as the ledger charged them; null for a released call, whose tokens nobody reported.
    outputTokens:
      type:
        - integer
        - "null"
      description: Completion tokens, as the ledger charged them; null for a released call.
    costUsd:
      type: string
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: What the call was charged.
    reservedUsd:
      type:
        - string
        - "null"
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: What Nexus Gateway held for the call before it ran.
    reason:
      type:
        - string
        - "null"
      description: >-
        The ledger's note on the call, with any secret redacted: why it was refused, failed or released, or what it
        charged past its hold.
    overspendLevel:
      type:
        - string
        - "null"
      description: The spend limit that refused the call.
      enum:
        - organization
        - team
        - person
        - product
        - null
    overspendLimitUsd:
      type:
        - string
        - "null"
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: >-
        The person's limit, when a person's limit refused the call. Null for a team's cap and the organization's budget:
        the ledger does not keep their limit on the call.
    overspendAmountUsd:
      type:
        - string
        - "null"
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: What the refused call asked to hold.
    overspendOverUsd:
      type:
        - string
        - "null"
      pattern: ^-?[0-9]+\.[0-9]{6}$
      description: How far over the limit it would have gone.
    overspendPeriod:
      type:
        - string
        - "null"
      description: The limit's period (`2026-10`, `2026-W43` or `2026-10-23`).
    fundedBy:
      type:
        - string
        - "null"
      description: >-
        `nexus_subsidy` for a call a Nexus subsidy paid, `nexus_credit` for one the organization's prepaid credits paid;
        null for the organization's own.
SpendCallPage:
  type: object
  description: One page of spend calls, newest first.
  required:
    - from
    - to
    - calls
    - nextCursor
  properties:
    from:
      type: string
      description: The first UTC day the page covers.
      format: date
    to:
      type: string
      description: The last UTC day the page covers, included.
      format: date
    calls:
      type: array
      items:
        $ref: "#/SpendCall"
    nextCursor:
      type:
        - string
        - "null"
      description: Pass as `cursor` for the next, older page; null on the last page.
SubmitJobRequest:
  type: object
  required:
    - module
    - verb
  additionalProperties: false
  properties:
    module:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$
      description: "The module whose verb runs, as `<product>/<capability>` (`intelligence/wiki`): the path of the verb's own route."
    verb:
      type: string
      minLength: 1
      maxLength: 100
    input:
      type: object
      description: >-
        The verb's input; `{}` when left out. The organization's owners and admins can read it, so do not put secrets in
        it.
    team:
      type: string
      description: The team the job's model calls go to, by slug or id; the caller's default team when left out.
  examples:
    - module: intelligence/wiki
      verb: run
      input:
        repo: https://github.com/nexus-demo/hello-factory
SwitchedOrg:
  allOf:
    - $ref: "#/CurrentTenantResponse"
    - type: object
      required:
        - token
        - tokenKind
      properties:
        token:
          type: string
          description: "nx_…: shown once"
        tokenKind:
          type: string
          enum:
            - cli
            - ui
        expiresAt:
          type: string
          format: date-time
SyncedEvent:
  type: object
  required:
    - seq
    - at
    - agent
  additionalProperties: false
  properties:
    seq:
      type: integer
      minimum: 0
      description: "The event's number: 0 first, one more each time."
    at:
      type: integer
      minimum: 0
      description: The runner's time of the event, in milliseconds since 1970.
    agent:
      type: string
      description: "The coding agent that wrote the event, as the runner's workbench names it: `claude`, `codex` or `nexus`."
    usage:
      oneOf:
        - $ref: "#/SyncedUsage"
        - type: "null"
    status:
      type:
        - string
        - "null"
      enum:
        - running
        - completed
        - interrupted
        - error
        - null
      description: The thread's state, when the event reports it.
    keyVersion:
      type:
        - integer
        - "null"
      minimum: 1
      description: The content key version the body is sealed with; set with `sealed`.
    sealed:
      type:
        - string
        - "null"
      description: >-
        The sealed body, base64url without padding, at most 263168 bytes. Null when the organization's content never
        leaves the machine.
  description: One event of a synced thread. Gateway cannot open `sealed`.
SyncedEventPage:
  type: object
  required:
    - threadId
    - lastSeq
    - events
    - more
  properties:
    threadId:
      type: string
    lastSeq:
      type:
        - integer
        - "null"
      description: The highest event number stored when the page was read.
    events:
      type: array
      items:
        $ref: "#/SyncedEvent"
    more:
      type: boolean
      description: Whether more events follow in the direction read.
  description: "`listSyncedEvents`'s answer, in number order."
SyncedEventsAppended:
  type: object
  required:
    - threadId
    - lastSeq
    - appended
  properties:
    threadId:
      type: string
    lastSeq:
      type: integer
      description: The highest event number stored. Every number from 0 to it is stored.
    appended:
      type: integer
      description: How many of the request's events were new.
  description: "`appendSyncedEvents`'s answer."
SyncedThread:
  type: object
  required:
    - threadId
    - personId
    - agent
    - model
    - status
    - totals
    - lastSeq
    - keyVersion
    - private
    - followers
    - lastEventAt
    - createdAt
    - updatedAt
  properties:
    threadId:
      type: string
    personId:
      type: string
      description: "The thread's person (`users.id`): you, unless an auditor or a teammate reads it."
    agent:
      type:
        - string
        - "null"
      description: "The latest event's agent: `claude`, `codex` or `nexus`; null before the first event."
    model:
      type:
        - string
        - "null"
    status:
      type:
        - string
        - "null"
      enum:
        - running
        - completed
        - interrupted
        - error
        - null
    totals:
      $ref: "#/SyncedTotals"
    lastSeq:
      type:
        - integer
        - "null"
      description: The highest event number stored; null before the first event.
    keyVersion:
      type:
        - integer
        - "null"
      description: The newest content key version of a sealed event.
    private:
      type: boolean
      description: >-
        Whether its owner keeps it from their teammates (setSyncedThreadPrivate). Otherwise it is team-visible: any
        member reads it while the organization's `multiplayerSessions` is on.
    followers:
      type: array
      items:
        type: string
      description: "Who follows it: members' ids (`users.id`), in the order they followed it (followSyncedThread)."
    lastEventAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  description: A synced thread's readable summary. Its title and repository are inside the sealed events.
SyncedThreadActivityList:
  type: object
  properties:
    order:
      type: string
      enum:
        - activity
    threads:
      type: array
      items:
        $ref: "#/SyncedThread"
    nextCursor:
      type:
        - string
        - "null"
    nextBefore:
      type: "null"
  required:
    - order
    - threads
    - nextCursor
    - nextBefore
  additionalProperties: false
SyncedThreadAdvanced:
  type: object
  required:
    - threadId
    - lastSeq
  properties:
    threadId:
      type: string
    lastSeq:
      type: integer
      description: The highest event number stored. Every number from 0 to it is stored.
  description: "The data of a `thread` event on `streamSyncedThread`: the thread holds every event up to `lastSeq`."
SyncedThreadDeleted:
  type: object
  required:
    - threadId
    - deleted
    - eventsDeleted
    - keysDeleted
  properties:
    threadId:
      type: string
    deleted:
      type: boolean
    eventsDeleted:
      type: integer
      description: The events this deletion removed.
    keysDeleted:
      type: integer
      description: The locked key copies this deletion removed, those for the organization's recovery key included.
  description: "`deleteSyncedThread`'s answer."
SyncedThreadList:
  type: object
  required:
    - threads
    - nextBefore
  properties:
    threads:
      type: array
      items:
        $ref: "#/SyncedThread"
    nextBefore:
      type:
        - string
        - "null"
      description: The `before` of the next page; null on the last.
  description: "`listSyncedThreads`'s answer, newest first."
SyncedTotals:
  type: object
  required:
    - inputTokens
    - outputTokens
    - cacheReadTokens
    - cacheWriteTokens
    - costUsd
  properties:
    inputTokens:
      type: integer
    outputTokens:
      type: integer
    cacheReadTokens:
      type: integer
    cacheWriteTokens:
      type: integer
    costUsd:
      type: string
      description: A decimal string.
  description: A thread's usage totals.
SyncedUsage:
  type: object
  required:
    - model
    - inputTokens
    - outputTokens
    - cacheReadTokens
    - cacheWriteTokens
    - costUsd
  additionalProperties: false
  properties:
    model:
      type: string
      minLength: 1
      maxLength: 128
    inputTokens:
      type: integer
      minimum: 0
    outputTokens:
      type: integer
      minimum: 0
    cacheReadTokens:
      type: integer
      minimum: 0
    cacheWriteTokens:
      type: integer
      minimum: 0
    costUsd:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,18})?$
      description: Dollars, as a decimal string with no sign and no leading zero, such as `0.0123`
  description: One model call's usage, in plain text. Stored, not billed.
TakeSessionRunner:
  type: object
  required:
    - runnerId
  properties:
    runnerId:
      type: string
      minLength: 1
      maxLength: 200
      description: "Who takes the session: a name of the runner's own, such as its device id."
    seenToken:
      type:
        - integer
        - "null"
      format: int64
      minimum: 0
      description: >-
        The session's `fencingToken` as you read it: take the session over from its holder (a handoff) while that is
        still its token.
Team:
  allOf:
    - $ref: "#/TeamBase"
    - type: object
      properties:
        childCount:
          type: integer
      required:
        - childCount
TeamBase:
  type: object
  properties:
    id:
      type: string
      examples:
        - team_x1
    slug:
      type: string
      examples:
        - web
    name:
      type: string
      examples:
        - Web
    description:
      type: string
    createdAt:
      type: string
      format: date-time
    members:
      type: integer
    myRole:
      $ref: "#/TeamRole"
    isDefault:
      type: boolean
    parentId:
      type: string
      description: The parent team's id; absent for a top-level team.
    parent:
      type: string
      description: The parent team's slug.
    level:
      type: string
      description: The organization's own label for the team's level (e.g. department).
      examples:
        - department
    depth:
      type: integer
      description: 1 for a top-level team.
    pending:
      type: integer
      description: People added by email who have not joined the organization yet.
  required:
    - id
    - slug
    - name
    - createdAt
    - members
    - pending
    - depth
TeamBudget:
  type: object
  description: >-
    A team's cap as the caller may see it. The Ledger shows a caller only what remains for them: nothing from a team
    above theirs.
  properties:
    team:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
        - slug
        - name
    scope:
      type: string
      enum:
        - cap
        - own
      description: "`cap`: an owner or admin reads the cap on this team. `own`: a member reads what is left for them."
    budget:
      type:
        - object
        - "null"
      description: The cap on this team (`cap`), or the cap that binds along the team's path (`own`); null when none applies
      properties:
        remainingUsd:
          type: number
          description: >-
            What is left for the period, never below 0. Deprecated: read `remainingUsdDecimal`, the exact decimal string
            (root rule 9).
          deprecated: true
        remainingUsdDecimal:
          type: string
          description: >-
            `remainingUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `remainingUsd`.
        period:
          type: string
          enum:
            - day
            - week
            - month
          description: How often the cap resets
        resetsAt:
          type: string
          format: date-time
        limitUsd:
          type: number
          description: >-
            Owners and admins only (`scope: cap`). Deprecated: read `limitUsdDecimal`, the exact decimal string (root
            rule 9).
          deprecated: true
        limitUsdDecimal:
          type: string
          description: >-
            `limitUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `limitUsd`.
        mode:
          type: string
          enum:
            - hard_stop
          description: Owners and admins only
        spentUsd:
          type: number
          description: >-
            Owners and admins only: settled this period, in the team and the teams under it. Deprecated: read
            `spentUsdDecimal`, the exact decimal string (root rule 9).
          deprecated: true
        spentUsdDecimal:
          type: string
          description: >-
            `spentUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `spentUsd`.
        reservedUsd:
          type: number
          description: >-
            Owners and admins only: held by calls in progress. Deprecated: read `reservedUsdDecimal`, the exact decimal
            string (root rule 9).
          deprecated: true
        reservedUsdDecimal:
          type: string
          description: >-
            `reservedUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `reservedUsd`.
        updatedAt:
          type: string
          format: date-time
          description: Owners and admins only
      required:
        - remainingUsd
        - period
        - resetsAt
    canManage:
      type: boolean
      description: Whether the caller may set the cap (owners and admins)
  required:
    - team
    - scope
    - budget
    - canManage
TeamBudgetChange:
  type: object
  description: A team's cap before and after a `PUT /v1/teams/{slug}/budget` (what a `dryRun` would change).
  properties:
    dryRun:
      type: boolean
    team:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
        - slug
        - name
    before:
      type:
        - object
        - "null"
      properties:
        limitUsd:
          type: number
          deprecated: true
          description: "Deprecated: read `limitUsdDecimal`, the exact decimal string (root rule 9)."
        limitUsdDecimal:
          type: string
          description: >-
            `limitUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `limitUsd`.
        period:
          type: string
          enum:
            - day
            - week
            - month
        mode:
          type: string
          enum:
            - hard_stop
      required:
        - limitUsd
        - period
        - mode
    after:
      type: object
      properties:
        limitUsd:
          type: number
          deprecated: true
          description: "Deprecated: read `limitUsdDecimal`, the exact decimal string (root rule 9)."
        limitUsdDecimal:
          type: string
          description: >-
            `limitUsd` as an exact decimal string in US dollars with six decimals (`"12.245000"`), from the
            micro-dollars. Prefer it to `limitUsd`.
        period:
          type: string
          enum:
            - day
            - week
            - month
        mode:
          type: string
          enum:
            - hard_stop
      required:
        - limitUsd
        - period
        - mode
  required:
    - dryRun
    - team
    - before
    - after
TeamDetail:
  allOf:
    - $ref: "#/Team"
    - type: object
      properties:
        memberList:
          type: array
          items:
            $ref: "#/TeamMember"
        pendingList:
          type: array
          items:
            $ref: "#/PendingMember"
        path:
          type: array
          items:
            $ref: "#/TeamLink"
          description: The team's ancestors, top level first; the last is its parent.
        children:
          type: array
          items:
            allOf:
              - $ref: "#/TeamLink"
              - type: object
                properties:
                  members:
                    type: integer
                  pending:
                    type: integer
                  childCount:
                    type: integer
TeamImport:
  type: object
  description: The organization's teams as a file. Teams are matched by slug.
  properties:
    units:
      type: array
      items:
        type: object
        properties:
          slug:
            type: string
            examples:
              - platform
          name:
            type: string
            examples:
              - Platform
          level:
            type:
              - string
              - "null"
            examples:
              - division
          parent:
            type:
              - string
              - "null"
            description: The parent team's slug; absent or null for a top-level team.
            examples:
              - engineering
          description:
            type:
              - string
              - "null"
          leads:
            type: array
            items:
              oneOf:
                - type: string
                  format: email
                - type: object
                  properties:
                    email:
                      type:
                        - string
                        - "null"
                      description: null keeps a seat for someone whose email is not known yet (skipped, with a warning).
                    name:
                      type: string
                    home:
                      type: boolean
                      description: Make this team their default (home) team.
          members:
            type: array
            items:
              oneOf:
                - type: string
                  format: email
                - type: object
                  properties:
                    email:
                      type:
                        - string
                        - "null"
                      description: null keeps a seat for someone whose email is not known yet (skipped, with a warning).
                    name:
                      type: string
                    home:
                      type: boolean
                      description: Make this team their default (home) team.
        required:
          - slug
    dryRun:
      type: boolean
      description: Report the diff and change nothing.
    prune:
      type: boolean
      description: >-
        Also remove memberships and pending entries the file does not list from its teams, and delete teams it does not
        list (their spend stays).
    plan:
      type: string
      pattern: ^[0-9a-f]{16}$
      description: "A dry run's plan: apply only if the result is still exactly that (else 409 plan_changed)."
  required:
    - units
TeamImportDiff:
