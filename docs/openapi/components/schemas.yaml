    - revoked
  properties:
    module:
      type: string
    connector:
      type: string
    actions:
      type: array
      items:
        type: string
      description: What the module now holds for this connector
    granted:
      type: array
      items:
        type: string
    revoked:
      type: array
      items:
        type: string
WritePageVersionRequest:
  type: object
  required:
    - content
  properties:
    routes:
      type: array
      maxItems: 31
      description: >-
        Additional saved HTML or React Site routes. The content field holds the root. On a version write, omission
        carries the previous routes and an empty list removes them.
      items:
        $ref: "#/SiteRouteWrite"
    content:
      type: string
      description: "The page's source: HTML, or Markdown. At most 16 MiB of UTF-8."
    title:
      type: string
      minLength: 1
      maxLength: 120
      description: A new title; unset keeps the latest one
    format:
      type: string
      enum:
        - html
        - md
        - jsx
        - sheet
        - board
      description: Must be the page's format when set
    baseVersion:
      type: integer
      minimum: 1
      description: "The version this was built on: refused with 409 `page_version_conflict` when it is no longer the latest"
    agent:
      type: string
      minLength: 1
      maxLength: 40
      description: >-
        An agent writing for you: its name, such as Claude. People with the page open see it on the canvas, next to your
        name, on the boards this write changes. Unset from an MCP server: Agent
WriteSkillVersionRequest:
  type: object
  required:
    - content
  properties:
    content:
      type: string
      description: >-
        The SKILL.md: YAML front matter between `---` lines with a `name` and a `description`, then the instructions. At
        most 1 MiB of UTF-8. Stored exactly as written.
    baseVersion:
      type: integer
      minimum: 1
      description: "The version this was built on: refused with 409 `skill_version_conflict` when it is no longer the latest"
