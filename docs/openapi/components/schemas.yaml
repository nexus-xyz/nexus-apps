      properties:
        id:
          type: string
        email:
          type: string
    apiKey:
      type: string
    personal:
      $ref: "#/OrgSummary"
      description: Your personal organization, made with the company organization
CreatedAgentLink:
  allOf:
    - $ref: "#/AgentLink"
    - type: object
      required:
        - dryRun
      properties:
        token:
          type: string
          description: >-
            `nxo_…`. In this answer, and again in a repeat with the same `Idempotency-Key` within 24 hours. None with
            `dryRun`.
        dryRun:
          type: boolean
          description: The link was not written. Its id is never used.
CreatedServiceAccount:
  allOf:
    - $ref: "#/ServiceAccount"
    - type: object
      required:
        - dryRun
      properties:
        dryRun:
          type: boolean
          description: A dry run's id is never used.
CurrentTenantResponse:
  type: object
  required:
    - tenant
  properties:
    tenant:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        slug:
          type: string
        kind:
          $ref: "#/TenantKind"
        imageUrl:
          type: string
          description: >-
            The organization's logo, as the identity provider serves it (https://img.clerk.com/…); unset when it has
            none.
        mark:
          type: string
          enum:
            - staff
            - test
            - demo
          description: Set only when it is Nexus's own; unset for a customer's.
    user:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        mark:
          type: string
          enum:
            - staff
            - test
            - demo
          description: Set only when it is Nexus's own; unset for a customer's.
      description: The person calling, when the key is a person's
    teams:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          slug:
            type: string
          name:
            type: string
          role:
            $ref: "#/TeamRole"
      description: Your teams in this organization
    team:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
      description: Your default team
    features:
      $ref: "#/GatewayFeatures"
      description: The products this Gateway has on. Unset reads as all off.
DecideSkillPromotion:
