# The .deb and the .rpm of Nexus Desktop. packages.sh stages the files and fills each NEXUS_ placeholder.
# Dependencies: the shared libraries that nexus-desktop-gpui and libcef.so link (readelf -d on 0.11.1), by package
# name for Debian and Ubuntu, and by soname for RPM, which every RPM distribution resolves to its own package.
# Ubuntu 24.04's "t64" name comes first: there `libasound2` is a virtual package that apt can satisfy with
# liboss4-salsa-asound2, which lacks symbols libcef.so needs (seen on 0.11.1: `undefined symbol: snd_device_name_get_hint`).
name: nexus-desktop
arch: amd64
platform: linux
version: ${NEXUS_VERSION}
prerelease: ${NEXUS_PRERELEASE}
release: "1"
section: devel
priority: optional
maintainer: "Nexus Laboratories, Inc. <support@nexus.inc>"
vendor: "Nexus Laboratories, Inc."
homepage: "https://nexus.inc/"
license: ${NEXUS_LICENSE}
description: |-
  Nexus, the open-source AI IDE.
  Run Claude Code, Codex and other coding agents side by side, with your company's controls.

contents:
  - src: ${NEXUS_ROOT}/opt/nexus-desktop
    dst: /opt/nexus-desktop
    type: tree
  - src: /opt/nexus-desktop/nexus-desktop-gpui
    dst: /usr/bin/nexus-desktop-gpui
    type: symlink
  - src: ${NEXUS_ROOT}/share/nexus-desktop-gpui.desktop
    dst: /usr/share/applications/nexus-desktop-gpui.desktop
    file_info:
      mode: 0644
  - src: ${NEXUS_ROOT}/share/nexus-desktop-gpui.png
    dst: /usr/share/icons/hicolor/256x256/apps/nexus-desktop-gpui.png
    file_info:
      mode: 0644

scripts:
  postinstall: ${NEXUS_LINUX}/postinstall.sh
  postremove: ${NEXUS_LINUX}/postinstall.sh

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libglib2.0-0t64 | libglib2.0-0
      - libgdk-pixbuf-2.0-0
      - libasound2t64 | libasound2
      - libnss3
      - libnspr4
      - libatk1.0-0t64 | libatk1.0-0
      - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
      - libatspi2.0-0t64 | libatspi2.0-0
      - libcups2t64 | libcups2
      - libdbus-1-3
      - libgbm1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxrandr2
      - libexpat1
      - libcairo2
      - libpango-1.0-0
      - libudev1
    recommends:
      - xdg-utils
  rpm:
    depends:
      - libgtk-3.so.0()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgdk_pixbuf-2.0.so.0()(64bit)
      - libasound.so.2()(64bit)
      - libnss3.so()(64bit)
      - libnspr4.so()(64bit)
      - libatk-1.0.so.0()(64bit)
      - libatk-bridge-2.0.so.0()(64bit)
      - libatspi.so.0()(64bit)
      - libcups.so.2()(64bit)
      - libdbus-1.so.3()(64bit)
      - libgbm.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcomposite.so.1()(64bit)
      - libXdamage.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXrandr.so.2()(64bit)
      - libexpat.so.1()(64bit)
      - libcairo.so.2()(64bit)
      - libpango-1.0.so.0()(64bit)
      - libudev.so.1()(64bit)

rpm:
  group: Development/Tools
  summary: Nexus, the open-source AI IDE
  compression: zstd
deb:
  compression: zstd
