<!doctype html><html><head><meta charset="utf-8"><title>Tailwind</title><!--HARNESS-->
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-slate-50">
<h1>Tailwind CDN</h1><div id="score"></div>
<div class="max-w-sm mx-auto space-y-3">
  <div id="card" class="rounded-2xl bg-white shadow-xl ring-1 ring-black/5 p-5">
    <div class="flex items-center gap-3"><div class="size-10 rounded-full bg-gradient-to-br from-fuchsia-500 to-cyan-400"></div>
      <div><p class="font-semibold text-slate-900">Ada Lovelace</p><p class="text-sm text-slate-500">Analyst · London</p></div>
      <span class="ml-auto inline-flex items-center rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-700">Active</span></div>
    <div class="mt-4 grid grid-cols-3 gap-2 text-center"><div class="rounded-lg bg-slate-100 p-2"><p class="text-lg font-bold">42</p><p class="text-xs text-slate-500">Docs</p></div><div class="rounded-lg bg-slate-100 p-2"><p class="text-lg font-bold">7</p><p class="text-xs text-slate-500">Runs</p></div><div class="rounded-lg bg-slate-100 p-2"><p class="text-lg font-bold">99%</p><p class="text-xs text-slate-500">Uptime</p></div></div>
    <button class="mt-4 w-full rounded-lg bg-indigo-600 px-4 py-2 text-white font-medium hover:bg-indigo-500 active:scale-95 transition">Hover me</button>
  </div>
  <div class="rounded-xl bg-slate-900 p-4 text-white backdrop-blur"><p class="text-sm opacity-70">Dark card</p><div class="mt-2 h-2 rounded bg-white/10"><div class="h-2 w-2/3 rounded bg-gradient-to-r from-indigo-400 to-pink-400 animate-pulse"></div></div></div>
  <div class="flex flex-wrap gap-2">
    <span class="px-2 py-1 rounded bg-red-500 text-white text-xs">red</span><span class="px-2 py-1 rounded bg-amber-400 text-xs">amber</span><span class="px-2 py-1 rounded bg-lime-400 text-xs">lime</span><span class="px-2 py-1 rounded bg-sky-500 text-white text-xs">sky</span>
    <span class="px-2 py-1 rounded border-2 border-dashed border-violet-500 text-xs">dashed</span><span class="px-2 py-1 text-xs underline decoration-wavy decoration-pink-500">wavy</span>
  </div>
</div>
<script>
check("Tailwind loaded", () => typeof tailwind === "object");
check("utilities applied", () => new Promise((r) => setTimeout(() => r(getComputedStyle(document.getElementById("card")).borderRadius === "16px"), 600)));
</script></body></html>
