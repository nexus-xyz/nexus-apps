<!doctype html><html><head><meta charset="utf-8"><title>Stress</title><!--HARNESS-->
<style>.row { display: flex; gap: 6px; padding: 2px 4px; border-bottom: 1px solid #eee; font-size: 12px; } .row:nth-child(odd) { background: #fafafa; }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; } .wide { width: 2000px; background: linear-gradient(90deg, #f00, #00f); height: 20px; }
.blurs > div { filter: blur(3px); box-shadow: 0 0 30px #39f; width: 30px; height: 30px; display: inline-block; margin: 4px; background: #fff; border-radius: 8px; }</style></head><body>
<h1>Stress</h1><div id="score"></div>
<div class="cell"><b>horizontal overflow (2000px wide, scroll sideways)</b><div style="overflow-x:auto"><div class="wide"></div></div></div>
<div class="cell" style="margin-top:8px"><b>60 blurred, shadowed boxes</b><div class="blurs" id="blurs"></div></div>
<div class="cell" style="margin-top:8px"><b>10,000 rows (scroll performance)</b><div id="rows" style="height:300px;overflow:auto"></div></div>
<div class="cell" style="margin-top:8px"><b>main-thread jank: 200ms busy loop every 2s</b><div id="jank">…</div></div>
<script>
document.getElementById("blurs").innerHTML = "<div></div>".repeat(60);
check("10k rows render", () => { const t = performance.now(); const f = document.createDocumentFragment(); for (let i = 0; i < 10000; i++) { const r = document.createElement("div"); r.className = "row"; r.innerHTML = `<span class="dot" style="background:hsl(${i * 7 % 360},70%,50%)"></span><span>#${i}</span><span style="margin-left:auto">${(Math.sin(i) * 1000).toFixed(2)}</span>`; f.append(r); } document.getElementById("rows").append(f); const ms = performance.now() - t; document.title += ""; window.rowsMs = ms; return ms < 3000; });
check("big allocation 200MB", () => { const a = new Uint8Array(200 * 1024 * 1024); a[a.length - 1] = 1; return a[a.length - 1] === 1; });
check("deep DOM (5000 nested)", () => { let n = document.createElement("div"); const root = n; for (let i = 0; i < 5000; i++) { const c = document.createElement("span"); n.append(c); n = c; } document.body.append(root); return root.querySelectorAll("span").length === 5000; });
let k = 0; setInterval(() => { const s = performance.now(); while (performance.now() - s < 200); document.getElementById("jank").textContent = "busy loops: " + ++k; }, 2000);
</script></body></html>
