<!doctype html><html><head><meta charset="utf-8"><title>React</title><!--HARNESS-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head><body>
<h1>React + Babel (JSX in the page)</h1><div id="score"></div>
<div id="root" class="cell"></div>
<script type="text/babel" data-presets="react">
function Todo() {
  const [items, setItems] = React.useState(["Write tests", "Break engines"]);
  const [text, setText] = React.useState("");
  const [n, setN] = React.useState(0);
  React.useEffect(() => { const t = setInterval(() => setN((v) => v + 1), 100); return () => clearInterval(t); }, []);
  return (<div>
    <p style={{ margin: "0 0 6px" }}>ticks: <b id="ticks">{n}</b></p>
    <form onSubmit={(e) => { e.preventDefault(); if (text) { setItems([...items, text]); setText(""); } }} style={{ display: "flex", gap: 4 }}>
      <input value={text} onChange={(e) => setText(e.target.value)} placeholder="type then Enter" style={{ flex: 1 }} />
      <button>Add</button>
    </form>
    <ul>{items.map((i, k) => <li key={k}>{i}</li>)}</ul>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Todo />);
window.reactMounted = true;
</script>
<script>
check("React UMD", () => typeof React === "object" && typeof ReactDOM === "object");
check("Babel JSX runs", () => new Promise((r) => setTimeout(() => r(window.reactMounted === true), 1500)));
check("state updates", () => new Promise((r) => setTimeout(() => r(+document.getElementById("ticks")?.textContent > 3), 2000)));
</script></body></html>
