<!doctype html><html><head><meta charset="utf-8"><title>Forms</title><!--HARNESS-->
<style>input, select, textarea, button { font: inherit; } label { display: block; margin: 3px 0; } dialog::backdrop { background: rgb(0 0 0 / .3); }
input[type=range] { accent-color: #e33; width: 100%; } input[type=checkbox] { accent-color: #3a3; }</style></head><body>
<h1>Forms and HTML</h1><div id="score"></div>
<div class="grid">
<div class="cell"><b>native inputs</b>
<label>text <input placeholder="placeholder"></label>
<label>date <input type="date" value="2026-11-05"></label>
<label>time <input type="time" value="13:37"></label>
<label>color <input type="color" value="#ff3366"></label>
<label>number <input type="number" value="42"></label>
<label>range <input type="range" value="70"></label>
<label><input type="checkbox" checked> check <input type="radio" name="r" checked> radio</label>
<label>file <input type="file"></label>
</div>
<div class="cell"><b>select / datalist / textarea</b>
<select id="sel"><option>One</option><option selected>Two</option><option>Three</option></select>
<select multiple size="3"><option>a</option><option selected>b</option><option>c</option></select>
<input list="dl" placeholder="datalist"><datalist id="dl"><option value="Apple"><option value="Banana"></datalist>
<textarea rows="2">resizable textarea</textarea>
<progress value="60" max="100"></progress> <meter value=".7"></meter>
</div>
<div class="cell"><b>dialog, popover, details</b>
<button onclick="document.getElementById('dlg').showModal()">open dialog</button>
<button popovertarget="pop">popover</button>
<div id="pop" popover style="padding:10px">I'm a popover</div>
<dialog id="dlg"><p>Modal dialog</p><form method="dialog"><button>close</button></form></dialog>
<details open><summary>details open</summary>hidden content</details>
</div>
<div class="cell"><b>validation + focus ring</b>
<form id="f" onsubmit="event.preventDefault()"><input required type="email" value="bad" id="em"> <button>submit</button></form>
<button id="fv" style="outline-offset:2px">focus-visible</button>
<p contenteditable style="border:1px dashed #aaa;padding:4px">contenteditable</p>
</div>
<div class="cell"><b>alert / confirm / prompt</b>
<button onclick="alert('alert!')">alert()</button> <button onclick="this.textContent=confirm('ok?')">confirm()</button>
<button onclick="this.textContent=prompt('name?','x')">prompt()</button>
</div>
<div class="cell"><b>links</b>
<a href="https://example.com" target="_blank">target=_blank</a><br>
<a href="#bottom">#anchor jump</a><br>
<a href="https://example.com">same-frame nav</a><br>
<a href="mailto:a@b.c">mailto:</a> · <a download="x.txt" href="data:text/plain,hi">download</a>
</div>
</div>
<p id="bottom" style="margin-top:600px">bottom anchor</p>
<script>
check("<dialog>", () => typeof HTMLDialogElement === "function" && typeof document.getElementById("dlg").showModal === "function");
check("popover", () => HTMLElement.prototype.hasOwnProperty("popover"));
check("date input", () => { const i = document.createElement("input"); i.type = "date"; return i.type === "date"; });
check("color input", () => { const i = document.createElement("input"); i.type = "color"; return i.type === "color"; });
check("constraint validation", () => document.getElementById("em").checkValidity() === false);
check(":focus-visible", () => CSS.supports("selector(:focus-visible)"));
check("accent-color", () => CSS.supports("accent-color: red"));
</script></body></html>
