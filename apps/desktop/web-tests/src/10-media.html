<!doctype html><html><head><meta charset="utf-8"><title>Media</title><!--HARNESS-->
<style>img { height: 48px; image-rendering: auto; } .pix { image-rendering: pixelated; height: 48px; }</style></head><body>
<h1>Images and media</h1><div id="score"></div>
<div class="grid" id="imgs"></div>
<div class="cell" style="margin-top:8px"><b>&lt;video&gt; (generated WebM via MediaRecorder)</b><video id="vid" controls muted style="width:100%;height:80px;background:#000"></video></div>
<div class="cell" style="margin-top:8px"><b>&lt;audio&gt; + WebAudio</b><audio controls style="width:100%"></audio></div>
<div class="cell" style="margin-top:8px"><b>remote image (https)</b><img id="remote" src="https://picsum.photos/seed/nexus/200/100" style="height:60px"></div>
<script>
// Tiny images generated per format with canvas, so no network is needed: the test is whether the engine decodes it.
const SAMPLES = {
  png: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACAgMAAAAP2OW3AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAJUExURf8AAP8A/wD/AGPJtcQAAAAHdElNRQfqCwUQMDTZ0TJRAAAAJXRFWHRkYXRlOmNyZWF0ZQAyMDI2LTExLTA1VDE2OjQ4OjUyKzAwOjAw9ypI6gAAACV0RVh0ZGF0ZTptb2RpZnkAMjAyNi0xMS0wNVQxNjo0ODo1MiswMDowMIZ38FYAAAAodEVYdGRhdGU6dGltZXN0YW1wADIwMjYtMTEtMDVUMTY6NDg6NTIrMDA6MDDRYtGJAAAADElEQVQI12MQYFAAAABUADE1kV+RAAAAAElFTkSuQmCC",
  gif: "data:image/gif;base64,R0lGODlhAQABAIAAAP8AAP///yH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==",
  jpeg: "", webp: "", avif: "data:image/avif;base64,AAAAHGZ0eXBhdmlmAAAAAG1pZjFhdmlmbWlhZgAAANZtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABwaWN0AAAAAAAAAAAAAAAAAAAAACJpbG9jAAAAAERAAAEAAQAAAAAA+gABAAAAAAAAACwAAAAjaWluZgAAAAAAAQAAABVpbmZlAgAAAAABAABhdjAxAAAAAA5waXRtAAAAAAABAAAAVmlwcnAAAAA4aXBjbwAAAAxhdjFDgQAMAAAAABRpc3BlAAAAAAAAAAIAAAACAAAAEHBpeGkAAAAAAwgICAAAABZpcG1hAAAAAAAAAAEAAQOBAgMAAAA0bWRhdBIACggYADaICGg0IDIeGUeHhiGHnnnmhUAA/1w32TL/nU0GEj0OVMPL0Nz6",
  svg: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'%3E%3Crect width='1' height='1' fill='red'/%3E%3Crect x='1' y='1' width='1' height='1' fill='blue'/%3E%3C/svg%3E",
  ico: "data:image/x-icon;base64,AAABAAEAAgICAAEAAQBAAAAAFgAAACgAAAACAAAABAAAAAEAAQAAAAAACAAAAAAAAAAAAAAAAgAAAAIAAAAAiP8A/4gAAAAAAABAAAAAAAAAAAAAAAA=",
};
const c = document.createElement("canvas"); c.width = c.height = 2; const x = c.getContext("2d");
x.fillStyle = "#f80"; x.fillRect(0, 0, 2, 2); x.fillStyle = "#08f"; x.fillRect(1, 0, 1, 1);
SAMPLES.jpeg = c.toDataURL("image/jpeg"); SAMPLES.webp = c.toDataURL("image/webp");
const box = document.getElementById("imgs");
for (const [fmt, src] of Object.entries(SAMPLES)) {
  if (!src) continue;
  const cell = document.createElement("div"); cell.className = "cell"; cell.innerHTML = `<b>${fmt}</b>`;
  const img = new Image(); img.className = "pix"; img.src = src; cell.append(img); box.append(cell);
  check(fmt, () => img.decode().then(() => img.naturalWidth > 0 && (fmt !== "webp" || src.startsWith("data:image/webp"))));
}
check("remote https image", () => document.getElementById("remote").decode().then(() => true));
check("MediaRecorder → video", () => new Promise((res, rej) => {
  if (typeof MediaRecorder !== "function") return res(false);
  const cv = document.createElement("canvas"); cv.width = 160; cv.height = 80; const cx = cv.getContext("2d");
  const rec = new MediaRecorder(cv.captureStream(30)), chunks = []; rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = () => { const v = document.getElementById("vid"); v.src = URL.createObjectURL(new Blob(chunks, { type: "video/webm" })); v.loop = true; v.play().then(() => res(true), rej); };
  let f = 0; const t = setInterval(() => { cx.fillStyle = `hsl(${f * 12},80%,50%)`; cx.fillRect(0, 0, 160, 80); cx.fillStyle = "#fff"; cx.font = "30px sans-serif"; cx.fillText("f" + f++, 50, 50); }, 33);
  rec.start(); setTimeout(() => { clearInterval(t); rec.stop(); }, 1200);
}));
check("WebAudio", () => { const a = new (window.AudioContext || window.webkitAudioContext)(); return a.sampleRate > 0; });
check("canPlayType webm/mp4", () => { const v = document.createElement("video"); return !!v.canPlayType("video/webm") && !!v.canPlayType("video/mp4"); });
</script></body></html>
