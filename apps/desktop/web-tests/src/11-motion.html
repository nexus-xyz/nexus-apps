<!doctype html><html><head><meta charset="utf-8"><title>Motion</title><!--HARNESS-->
<style>
.ball { width: 24px; height: 24px; border-radius: 50%; background: #e33; }
#kf { animation: slide 1.5s ease-in-out infinite alternate; } @keyframes slide { to { transform: translateX(120px); background: #39f; } }
.spin { width: 30px; height: 30px; border: 4px solid #ddd; border-top-color: #39f; border-radius: 50%; animation: s 0.8s linear infinite; } @keyframes s { to { transform: rotate(1turn); } }
.prog { height: 6px; background: #39f; transform-origin: left; animation: grow linear both; animation-timeline: scroll(root); } @keyframes grow { from { transform: scaleX(0); } }
.reveal { animation: fade linear both; animation-timeline: view(); animation-range: entry 0% cover 40%; } @keyframes fade { from { opacity: 0; transform: translateY(30px); } }
#prop { --a: 0deg; background: conic-gradient(from var(--a), #f0f, #0ff, #f0f); animation: rot 2s linear infinite; width: 50px; height: 50px; border-radius: 50%; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; } @keyframes rot { to { --a: 360deg; } }
.trans { transition: all .4s cubic-bezier(.2,.8,.2,1.4); width: 40px; height: 20px; background: #3a3; } .trans:hover { width: 140px; }
.fixed { position: fixed; bottom: 8px; right: 8px; background: #111; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; }
</style></head><body>
<div class="prog" style="position:sticky;top:0;z-index:2"></div>
<h1>Motion (scroll me)</h1><div id="score"></div>
<div class="grid">
<div class="cell"><b>keyframes</b><div class="ball" id="kf"></div></div>
<div class="cell"><b>Web Animations API</b><div class="ball" id="waapi"></div></div>
<div class="cell"><b>spinner</b><div class="spin"></div></div>
<div class="cell"><b>@property animated</b><div id="prop"></div></div>
<div class="cell"><b>transition (hover)</b><div class="trans"></div></div>
<div class="cell"><b>view transition</b><button id="vtb">swap</button><div id="vt" style="view-transition-name:box;width:40px;height:40px;background:#f80;margin-top:4px"></div></div>
<div class="cell"><b>rAF fps</b><div id="fps" style="font:20px ui-monospace,monospace">…</div></div>
<div class="cell"><b>smooth scroll</b><button onclick="scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">to bottom</button></div>
</div>
<div style="height:400px"></div>
<div class="cell reveal" style="background:#ffd">scroll-driven reveal (fades in on view)</div>
<div style="height:400px"></div>
<div class="fixed" id="fx">position: fixed</div>
<script>
check("CSS animation", () => new Promise((r) => setTimeout(() => r(getComputedStyle(document.getElementById("kf")).transform !== "none"), 300)));
check("WAAPI", () => { const a = document.getElementById("waapi").animate([{ transform: "none" }, { transform: "translateX(120px) scale(.5)" }], { duration: 1200, iterations: Infinity, direction: "alternate" }); return !!a && typeof a.finished?.then === "function"; });
check("@property", () => typeof CSS.registerProperty === "function");
supports("scroll-driven animations", "animation-timeline: scroll()");
check("view transitions", () => typeof document.startViewTransition === "function");
document.getElementById("vtb").onclick = () => { const f = () => { const b = document.getElementById("vt"); b.style.width = b.style.width === "120px" ? "40px" : "120px"; b.style.background = b.style.width === "120px" ? "#36f" : "#f80"; }; document.startViewTransition ? document.startViewTransition(f) : f(); };
let frames = 0, t0 = performance.now(); (function tick(t) { frames++; if (t - t0 > 1000) { const fps = Math.round(frames * 1000 / (t - t0)); document.getElementById("fps").textContent = fps + " fps"; frames = 0; t0 = t; } requestAnimationFrame(tick); })(t0);
check("fps ≥ 50", () => new Promise((r) => { let n = 0; const s = performance.now(); (function f(t) { n++; if (t - s < 1000) requestAnimationFrame(f); else r(n >= 50); })(s); }));
</script></body></html>
