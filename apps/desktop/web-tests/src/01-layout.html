<!doctype html><html><head><meta charset="utf-8"><title>Layout</title><!--HARNESS-->
<style>
.flex { display: flex; gap: 4px; } .flex i { flex: 1; height: 20px; background: #7aa7ff; }
.g { display: grid; grid-template-columns: 1fr 2fr; gap: 4px; } .g i { height: 20px; background: #f6a; }
.sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.sub > div { display: grid; grid-row: span 2; grid-template-rows: subgrid; background: #eee; }
.wrap { container-type: inline-size; } .cq { background: #fcc; } @container (min-width: 100px) { .cq { background: #9e9; } }
.ar { aspect-ratio: 16/9; width: 100%; background: linear-gradient(90deg,#333,#999); }
.scroll { height: 70px; overflow: auto; } .sticky { position: sticky; top: 0; background: #ffd; }
.gap { display: flex; flex-direction: column; row-gap: 6px; } .gap i { height: 6px; background: #a7f; }
.ml { margin-inline: auto; width: 50%; height: 10px; background: #0aa; }
</style></head><body>
<h1>Layout</h1><div id="score"></div>
<div class="grid">
<div class="cell"><b>flex 1:1:1</b><div class="flex" id="flex"><i></i><i></i><i></i></div></div>
<div class="cell"><b>grid 1fr 2fr</b><div class="g" id="g"><i></i><i></i></div></div>
<div class="cell"><b>subgrid</b><div class="sub"><div><span>a</span><span>b</span></div><div><span>c</span><span>d</span></div></div></div>
<div class="cell wrap"><b>container query (green)</b><div class="cq" id="cq">box</div></div>
<div class="cell"><b>aspect-ratio 16/9</b><div class="ar" id="ar"></div></div>
<div class="cell"><b>sticky header</b><div class="scroll" id="sc"><div class="sticky" id="st">sticky</div><p>1</p><p>2</p><p>3</p><p>4</p></div></div>
<div class="cell"><b>flex gap</b><div class="gap" id="gap"><i></i><i></i></div></div>
<div class="cell"><b>logical props</b><div class="ml" id="ml"></div></div>
</div>
<script>
const w = (s) => document.querySelector(s).getBoundingClientRect();
check("flex", () => { const [a, b] = [...document.querySelectorAll("#flex i")].map((e) => e.getBoundingClientRect().width); return Math.abs(a - b) < 1 && a > 10; });
check("grid fr", () => { const [a, b] = [...document.querySelectorAll("#g i")].map((e) => e.getBoundingClientRect().width); return Math.abs(b / a - 2) < 0.1; });
supports("subgrid", "grid-template-rows: subgrid");
check("container query", () => getComputedStyle(document.querySelector("#cq")).backgroundColor === "rgb(153, 238, 153)");
check("aspect-ratio", () => { const r = w("#ar"); return Math.abs(r.width / r.height - 16 / 9) < 0.05; });
check("sticky", () => { const s = document.querySelector("#sc"); s.scrollTop = 40; const ok = Math.abs(w("#st").top - w("#sc").top) < 2; return ok; });
check("flex gap", () => { const [a, b] = [...document.querySelectorAll("#gap i")].map((e) => e.getBoundingClientRect()); return Math.abs(b.top - a.bottom - 6) < 1; });
check("margin-inline", () => { const r = w("#ml"), p = document.querySelector("#ml").parentElement.getBoundingClientRect(); return Math.abs((r.left - p.left) - (p.right - r.right)) < 2; });
</script></body></html>
